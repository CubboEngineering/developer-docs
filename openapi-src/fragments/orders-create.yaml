                    country: "BR"
                    city: "Campinas"
                    province: "SP"
                    zip_code: "13010000"
                  billing:
                    first_name: "Carlos"
                    last_name: "Souza"
                    phone: "5511888888888"
                    email: "buyer@example.com"
                    address1: "Rua das Flores"
                    number: "10"
                    neighborhood: "Centro"
                    country: "BR"
                    city: "Campinas"
                    province: "SP"
                    zip_code: "13010000"
                    tax_id: "00.000.000/0000-00"
                    tax_regime: "LEGAL"
                    company: "Example Comércio LTDA"
                    state_registration: "000000000"
                  products:
                    - sku: "SKU-RED-M"
                      quantity: 10
                      price_per_item: 49.90
              removal:
                summary: Stock removal with your own NF-e
                value:
                  store_id: 1234
                  order_number: "REM-0001"
                  order_type: "REMOVE_STOCK"
                  products:
                    - sku: "SKU-RED-M"
                      quantity: 10
                    - sku: "SKU-BLUE-L"
                      quantity: 4
                      price_per_item: 12.50
                  client_invoice:
                    key: "00000000000000000000000000000000000000000000"
                    serie: "1"
                    number: "987"
      responses:
        '200':
          description: >-
            Order created. Same payload as `POST /orders`. A `REMOVE_LOST_STOCK` order is returned
            already in status `shipped`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 987656
                store_id: 1234
                order_number: "ORD-BR-0001"
                status: "initial"
                channel_created_at: "2026-10-12T15:04:05.000Z"
                order_date: "2026-10-12T15:04:05.000Z"
                shipping_date: null
                pending_at: null
                shipping_email: "buyer@example.com"
                shipping_status: null
                is_paid: true
                is_cod: false
                cod_amount: null
                requires_document_return: false
                requires_pickup_on_delivery: false
                has_carrier_insurance: false
                has_missing_info: false
                missing_info: null
                shipping_address_1: "Av. Paulista"
                currency: "BRL"
                total_price: "125.7"
                discount_price: "10.0"
                buyer_shipping_price: "15.9"
                extra_fees_price: null
                is_pick_and_ship: false
                is_b2b: false
                pick_n_ship_status: null
