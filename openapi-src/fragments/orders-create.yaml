paths:
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order
      description: |
        Creates a sales order for a store whose warehouse is in Mexico, Colombia, Chile or the
        United States, and queues it for processing. Use it for every non-Brazil store; a store
        served from a Brazil warehouse is refused and must use `POST /brazil/orders`. The request
        needs a store, a unique `order_number` per store, a recipient address, at least one product
        line and a way to pick the carrier:

        - `shipping_line_code`: the exact name of a shipping method you created in the Cubbo app
          (**Integrations** > Open API > **Shipping Methods**). Cubbo picks the carrier with the
          configuration assigned to it.
        - `shipping_method_id`: a specific Cubbo shipping method, taken from the `shipping_method_id` of
          an option returned by `GET /shipping-methods/quote`.

        - The order is returned immediately in its initial status. Address, coverage, stock and
          carrier validations run asynchronously; poll `GET /orders` and read `status`,
          `has_missing_info` and `missing_info` to learn whether it was accepted.
        - Every product is identified by SKU and must already exist in the store; unknown SKUs
          reject the whole request.
        - `zip_code` is mandatory when the warehouse is in Mexico (and Brazil); it is optional for
          Chile and Colombia.
        - Duplicate protection: an `order_number` that already exists in the store answers 422 with
          code `ORDER_ALREADY_EXISTS` and the existing `order_id` in `context`. While another request
          for the same `store_id` + `order_number` is still being processed you get 409
          `DUPLICATE_REQUEST_IN_FLIGHT` with a `Retry-After` header; retry after that delay and you
          will converge on the real outcome (200, 422 or `ORDER_ALREADY_EXISTS`).
        - Complementary carrier services (`has_carrier_insurance`, `cod_amount`,
          `requires_document_return`, `requires_pickup_on_delivery`) are currently honoured only for
          stores with a warehouse in Chile; sending `true` (or a non-zero amount) from any other
          country is refused with a typed error code rather than silently ignored.
        - Click and collect: send `is_click_and_collect: true` and the `click_and_collect_service_code`
          you obtained from `GET /carrier-services/pickup-locations`. Cubbo replaces the shipping
          method you sent with the pickup carrier's method. A full shipping address is still required.
        - `is_b2b` only matters for stores enabled for both B2B and D2C ("mixed"); omit it to create a
          consumer (D2C) order. Stores enabled for a single model always get that model.
        - Error bodies on this endpoint carry an `error` message plus a machine-readable `code`
          (empty string or null when the error has no code) and an optional `context` object.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            examples:
              basic:
                summary: Minimal sale with a Cubbo shipping method
                value:
                  store_id: 1234
                  order_number: "ORD-0001"
                  shipping_method_id: 12
                  shipping:
                    first_name: "Jaime"
                    last_name: "Carrera"
                    phone: "5555555555"
                    email: "buyer@example.com"
                    address1: "Av. Reforma 123"
                    address2: "Piso 4"
                    references: "Blue door"
                    country: "MX"
                    city: "Ciudad de México"
                    province: "CDMX"
                    zip_code: "06600"
                  products:
                    - sku: "SKU-RED-M"
                      quantity: 2
              shippingLineCode:
                summary: Carrier picked from your integration's shipping configuration
                value:
                  store_id: 1234
                  order_number: "ORD-0002"
                  shipping_line_code: "Express"
                  is_paid: true
                  channel_name: "my-webstore"
                  channel_order_id: "WEB-98765"
                  shipping:
                    first_name: "Ana"
                    last_name: "Pérez"
                    phone: "5512345678"
                    email: "buyer@example.com"
                    address1: "Calle Falsa 123"
                    country: "MX"
                    city: "Guadalajara"
                    province: "Jalisco"
                    zip_code: "44100"
                  billing:
                    first_name: "Ana"
                    last_name: "Pérez"
                    phone: "5512345678"
                    email: "buyer@example.com"
                    address1: "Calle Falsa 123"
                    country: "MX"
                    city: "Guadalajara"
                    province: "Jalisco"
                    zip_code: "44100"
                  products:
                    - sku: "SKU-RED-M"
                      quantity: 1
                    - sku: "SKU-BLUE-L"
                      quantity: 3
              chileCashOnDelivery:
                summary: Chile order with partial cash-on-delivery and carrier insurance
                value:
                  store_id: 1234
                  order_number: "ORD-0003"
                  shipping_method_id: 45
                  is_cod: true
                  cod_amount: 30000
                  has_carrier_insurance: true
                  shipping:
                    first_name: "Jaime"
                    last_name: "Carrera"
                    phone: "56900000000"
                    email: "buyer@example.com"
                    address1: "Av Test 123"
                    country: "CL"
                    city: "Santiago"
                    province: "Región Metropolitana"
                    zip_code: "8320000"
                  products:
                    - sku: "SKU-RED-M"
                      quantity: 1
              clickAndCollect:
                summary: Click and collect at a carrier pickup point
                value:
                  store_id: 1234
                  order_number: "ORD-0004"
                  shipping_method_id: 12
                  is_click_and_collect: true
                  click_and_collect_service_code: "CUBBOCNCEST001"
                  shipping:
                    first_name: "Jaime"
                    last_name: "Carrera"
                    phone: "5555555555"
                    email: "buyer@example.com"
                    address1: "Av. Reforma 123"
                    country: "MX"
                    city: "Ciudad de México"
                    province: "CDMX"
                    zip_code: "06600"
                  products:
                    - sku: "SKU-RED-M"
                      quantity: 1
      responses:
        '200':
          description: >-
            Order created. The body is the full order as Cubbo stores it, including its lines and the
            resolved shipping method. The order is still in its initial status; processing happens
            asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 987654
                store_id: 1234
                order_number: "ORD-0001"
                status: "initial"
                channel_created_at: "2026-10-12T15:04:05.000Z"
                order_date: "2026-10-12T15:04:05.000Z"
                shipping_date: null
                pending_at: null
                shipping_email: "buyer@example.com"
                shipping_status: null
                is_paid: true
                is_cod: false
                cod_amount: null
                requires_document_return: false
                requires_pickup_on_delivery: false
                has_carrier_insurance: false
                has_missing_info: false
                missing_info: null
                shipping_address_1: "Av. Reforma 123"
                currency: "MXN"
                total_price: "598.0"
                discount_price: "0.0"
                buyer_shipping_price: null
                extra_fees_price: null
                is_pick_and_ship: false
                is_b2b: false
                pick_n_ship_status: null
                return_shipping_labels: []
                shipping:
                  first_name: "Jaime"
                  last_name: "Carrera"
                  company: null
                  phone: "5555555555"
                  address_1: "Av. Reforma 123"
                  address_2: "Piso 4"
                  email: "buyer@example.com"
                  zip_code: "06600"
                  country: "MX"
                  state: "CDMX"
                  city: "Ciudad de México"
                  number: null
                  interior_number: null
                  neighborhood: null
                  references: "Blue door"
                billing:
                  first_name: null
                  last_name: null
                  company: null
                  phone: null
                  tax_id: null
                  tax_regime: null
                  state_registration: null
                  address_1: null
                  address_2: null
                  number: null
                  interior_number: null
                  neighborhood: null
                  email: null
                  zip_code: null
                  country: null
                  state: null
                  city: null
                delivery_tracking:
                  - shipping_number: null
                    tracking_url: null
                    cubbo_tracking_url: "https://tracking.cubbo.com/t/abc123"
                    service_id: null
                    shipping_status: null
                    package_index: 1
                    total_packages: 1
                proof_of_delivery: null
                estimated_time_arrival: null
                delivered_at: null
                updated_at: "2026-10-12T15:04:05.000Z"
                is_click_and_collect: false
                click_and_collect_metadata: null
                latest_estimated_time_arrival_range: null
                channel_order_id: null
                channel_name: "openapi"
                channel_shipping_line_code: null
                warehouse_timezone: "America/Mexico_City"
                is_multi_package: false
                is_first_time_buyer: true
                is_subscription_renewal: false
                shipping_method:
                  id: 12
                  shipping_name: "Estafeta Terrestre"
                  is_active: true
                  carrier_name: "ESTAFETA"
                  shipping_type: "national"
                  delivery_type: "Ground"
                  country: "MX"
                order_lines:
                  - id: 55501
                    name: "Red T-shirt M"
                    sku: "SKU-RED-M"
                    quantity: 2
                    generated: false
                    price_per_item: "299.0"
                    discount_per_item: "0.0"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateRequestInFlight'
        '422':
          description: >-
            Validation or business error. `code` identifies the failure when one is defined; `context`
            carries extra data for some codes (for example the existing `order_id` on
            `ORDER_ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreateError'
              examples:
                missingParam:
                  summary: A required parameter is missing (any `param!` failure)
                  value: {error: "Parameter store_id is required", code: null, context: null}
                invalidParamType:
                  summary: A parameter has the wrong type
                  value: {error: "'abc' is not a valid Integer", code: null, context: null}
                codAmountNegative:
                  summary: cod_amount below its minimum
                  value: {error: "Parameter cod_amount cannot be less than 0", code: null, context: null}
                brazilStore:
                  summary: The store ships from Brazil
                  value: {error: "store is from Brazil, use /brazil/orders endpoint", code: "", context: null}
                missingZipCode:
                  value: {error: "zip_code is required for this warehouse's country", code: "MISSING_ZIP_CODE", context: null}
                carrierInsuranceNotAvailable:
                  value: {error: "has_carrier_insurance is only available for stores in CL", code: "CARRIER_INSURANCE_NOT_AVAILABLE", context: null}
                codAmountNotAvailable:
                  value: {error: "cod_amount is only available for stores in CL. Cash on delivery elsewhere collects the order total.", code: "COD_AMOUNT_NOT_AVAILABLE", context: null}
                documentReturnNotAvailable:
                  value: {error: "requires_document_return is only available for stores in CL.", code: "DOCUMENT_RETURN_NOT_AVAILABLE", context: null}
                pickupOnDeliveryNotAvailable:
                  value: {error: "requires_pickup_on_delivery is only available for stores in CL.", code: "PICKUP_ON_DELIVERY_NOT_AVAILABLE", context: null}
                pickupOnDeliveryB2b:
                  summary: The order resolves to B2B (explicit is_b2b or a B2B-only store)
                  value: {error: "requires_pickup_on_delivery is a D2C-only service.", code: "PICKUP_ON_DELIVERY_B2B_UNSUPPORTED", context: null}
                pickupOnDeliveryReturnMethodNotConfigured:
                  value: {error: "The dedicated Blue Express return method is not configured.", code: "PICKUP_ON_DELIVERY_RETURN_METHOD_NOT_CONFIGURED", context: null}
                documentReturnAndPickupExclusive:
                  value: {error: "requires_document_return and requires_pickup_on_delivery cannot be combined on the same order.", code: "DOCUMENT_RETURN_PICKUP_ON_DELIVERY_EXCLUSIVE", context: null}
                channelIntegrationNotFound:
                  summary: Your API credentials are not linked to an API integration on this store
                  value: {error: "Channel integration for openapi not found, contact support.", code: "", context: null}
                orderAlreadyExists:
                  value: {error: "order with order_number ORD-0001 already exists with id 987654", code: "ORDER_ALREADY_EXISTS", context: {order_id: 987654}}
                shippingMethodMissing:
                  summary: Neither shipping_method_id nor shipping_line_code was sent
                  value: {error: "Information is missing, shipping_method_id or shipping_line_code", code: "400", context: null}
                skusMissing:
                  value: {error: "Provide skus for all products", code: "", context: null}
                noSkus:
                  value: {error: "No skus provided", code: "", context: null}
                skuNotFound:
                  value: {error: "skus SKU-UNKNOWN not found in Cubbo", code: "", context: null}
                unitCodeRequired:
                  summary: The product tracks personalized units, so each line needs a unit_code
                  value: {error: "unit_code is required for sku SKU-RED-M: each unit belongs to one recipient", code: "UNIT_CODE_REQUIRED", context: null}
                personalizedUnitInKit:
                  value: {error: "sku KIT-01 is a kit holding a personalized unit, which cannot be ordered as a kit", code: "PERSONALIZED_UNIT_IN_KIT", context: null}
                invalidUnitCodeLine:
                  value: {error: "unit_code needs a sale line of quantity 1 of a product that requires unit codes (sku SKU-RED-M)", code: "INVALID_UNIT_CODE_LINE", context: null}
                duplicateUnitCode:
                  value: {error: "unit_code UC-0001 is requested twice", code: "DUPLICATE_UNIT_CODE", context: null}
                cncServiceCodeInvalid:
                  value: {error: "click_and_collect_service_code is invalid", code: "404", context: null}
                cncLocationNotConfirmed:
                  value: {error: "Couldn't confirm cnc location for CUBBOCNCEST001, try requesting a new cnc service code", code: "404", context: null}
                cncNoShippingMethod:
                  value: {error: "No shipping method found for click and collect with service code CUBBOCNCEST001, contact support", code: "404", context: null}
                shippingLineCodeNotFound:
                  value: {error: "No shipping configuration found with name 'Express' for this integration", code: "404", context: null}
                shippingMethodNoCoverage:
                  value: {error: "The shipping method ESTAFETA does not have coverage in this zip code, 06600", code: "404", context: null}
                internationalMethodOnDomesticOrder:
                  value: {error: "The shipping method DHL is international and this order ships within MX. Assign a national shipping method.", code: "NATIONAL_SHIPPING_METHOD_EXPECTED", context: null}
                storeBusinessModelUnset:
                  summary: The store is enabled for neither B2B nor D2C; contact support
                  value: {error: "Store 1234 has neither b2b nor d2c enabled", code: "store_business_model_unset", context: {store_id: 1234, b2b: false, d2c: false}}
                shippingDocumentUrlUnreachable:
                  value: {error: "Information is missing, unable to obtain pdf document from url: https://example.com/label.pdf. response: 404 Not Found", code: "400", context: null}
                shippingDocumentTypeInvalid:
                  value: {error: "Information is missing, The document type file is not valid.", code: "400", context: null}
        '500':
          description: Unexpected error. Nothing was created; retry later or contact support.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: "unexpected error"}

  /orders/create-and-ship:
    post:
      tags: [Orders]
      operationId: createAndShipOrder
      summary: Create a pick-and-ship order and buy its labels
      description: |
        Creates a pick-and-ship order and generates its carrier shipping labels in the same call,
        returning the labels instead of the order. Use it when your own warehouse packs the parcel
        and only needs Cubbo's carrier contract: you declare the physical packages (weight and
        dimensions) and Cubbo buys one label per package. Unlike `POST /orders`, the order is
        validated synchronously, the shipping method must be resolvable now, and the order is left
        packed with its labels ready to download.

        - Choose the carrier with exactly one of `shipping_method_id` (a Cubbo shipping method) or
          `integration_shipping_method` (the name of a shipping configuration of your integration).
          Sending both, or neither, is refused.
        - `products` is optional; lines are not picked from Cubbo stock, they only describe the
          content. Each SKU must exist in the store.
        - Every package is matched to the closest Cubbo package size by the larger of its real
          weight and its volumetric weight; if none fits, the request fails with
          `NO_COMPATIBLE_PACKAGE`.
        - Not available for stores where Cubbo issues fiscal invoices (for example Brazil): those
          answer `INVOICING_NOT_IMPLEMENTED`.
        - The order is always a consumer (D2C), paid, non cash-on-delivery order with zero prices.
        - Duplicate protection works like `POST /orders`: 422 `ORDER_ALREADY_EXISTS` for an existing
          `order_number`, 409 `DUPLICATE_REQUEST_IN_FLIGHT` while another request for the same
          `order_number` is in progress.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateAndShipRequest'
            example:
              store_id: 1234
              order_number: "PS-0001"
              shipping_method_id: 12
              shipping:
                first_name: "Jaime"
                last_name: "Carrera"
                phone: "5555555555"
                email: "buyer@example.com"
                address1: "Av. Reforma 123"
                country: "MX"
                city: "Ciudad de México"
                province: "CDMX"
                zip_code: "06600"
              products:
                - sku: "SKU-RED-M"
                  quantity: 1
              packages:
                - weight_kg: 1.2
                  length_cm: 30
                  width_cm: 20
                  height_cm: 10
      responses:
        '200':
          description: Order created and packed; one shipping label per requested package.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreateAndShipLabel'
              example:
                - id: 778899
                  order_id: 987655
                  billing_file: null
                  shipping_number: "1234567890"
                  label_file:
                    path: "/rails/active_storage/blobs/redirect/abc123/label.pdf"
                    url: "https://api.cubbo.com/rails/active_storage/blobs/redirect/abc123/label.pdf"
                    filename: "label.pdf"
                    byte_size: 48213
                    content_type: "application/pdf"
                  label_type: "shipping"
                  tracking_url: "https://carrier.example.com/track/1234567890"
                  cubbo_tracking_url: "https://tracking.cubbo.com/t/abc123"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/DuplicateRequestInFlight'
        '422':
          description: >-
            Validation or business error. Most failures use the `error`/`code`/`context` shape. When
            the assembled order fails Cubbo's order validation the body is instead a list of
            field-level errors (`errors`), each with the offending `field` and a `code`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OrderCreateError'
                  - $ref: '#/components/schemas/OrderFieldValidationError'
              examples:
                missingParam:
                  value: {error: "Parameter packages is required", code: null, context: null}
                nameTooShort:
                  value: {error: "Parameter first_name cannot have length less than 3", code: null, context: null}
                packageWeightTooSmall:
                  value: {error: "Parameter weight_kg cannot be less than 0.01", code: null, context: null}
                missingShippingMethod:
                  value: {error: "provide either shipping_method_id or integration_shipping_method", code: "MISSING_SHIPPING_METHOD", context: null}
                bothShippingMethods:
                  value: {error: "provide either shipping_method_id or integration_shipping_method, not both", code: "INVALID_SHIPPING_METHOD", context: null}
                missingZipCode:
                  value: {error: "zip_code is required for this warehouse's country", code: "MISSING_ZIP_CODE", context: null}
                channelIntegrationNotFound:
                  value: {error: "Channel integration for openapi not found, contact support.", code: "", context: null}
                orderAlreadyExists:
                  value: {error: "order with order_number PS-0001 already exists with id 987655", code: "ORDER_ALREADY_EXISTS", context: {order_id: 987655}}
                productNotFound:
                  value: {error: "Product SKU-UNKNOWN was not found in this store", code: "PRODUCT_NOT_FOUND", context: null}
                invoicingNotImplemented:
                  summary: The store's country requires Cubbo-issued invoices
                  value: {error: "Order  requires an invoice to ship", code: "INVOICING_NOT_IMPLEMENTED", context: null}
                storeOrShippingMethodNotFound:
                  summary: The store_id or shipping_method_id does not exist
                  value: {error: "Couldn't find ShippingMethod with 'id'=999999", code: null, context: null}
                integrationShippingMethodNotFound:
                  value: {error: "No shipping configuration found with name 'Express' for this integration", code: "MISSING_INTEGRATION_SHIPPING_METHOD", context: null}
                undeterminableShippingMethod:
                  value: {error: "Unable to determine shipping method for order", code: "UNDETERMINABLE_SHIPPING_METHOD", context: null}
                noCompatiblePackage:
                  value: {error: "No compatible package found for order id 987655. Contact support.", code: "NO_COMPATIBLE_PACKAGE", context: null}
                shippingCostUnavailable:
                  summary: The shipping method has no tariff for the package weight
                  value: {error: "Shipping cost not configured for the order's weight in the assigned shipping method", code: "SHIPPING_COST_UNAVAILABLE", context: null}
                storeBusinessModelUnset:
                  value: {error: "Store 1234 has neither b2b nor d2c enabled", code: "store_business_model_unset", context: {store_id: 1234, b2b: false, d2c: false}}
                orderValidationFailed:
                  summary: Field-level validation errors (for example an international method on a domestic address)
                  value:
                    errors:
                      - field: "shipping_method"
                        code: "NATIONAL_SHIPPING_METHOD_EXPECTED"
                        additional_info: {}
                      - field: "shipping_phone"
                        code: "MISSING_SHIPPING_FIELD"
                        additional_info: {}
        '500':
          description: Unexpected error (including carrier failures while buying the label).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: {error: "unexpected error"}

  /brazil/orders:
    post:
      tags: [Orders]
      operationId: createBrazilOrder
      summary: Create an order for a Brazil store
      description: |
        Creates an order for a store served from a Brazil warehouse. Brazil orders carry the fiscal
        data Cubbo needs to issue the NF-e (Nota Fiscal Eletrônica, the Brazilian electronic
        invoice): per-line prices, the buyer's shipping cost and a billing block with the buyer's
        tax id (CPF for a natural person, CNPJ for a company). `order_type` selects what kind of
        order you get; it defaults to `SALE`.

        - `SALE` and `DONATION` share the full contract: recipient, billing, shipping method,
          `buyer_shipping_price` and a `price_per_item` on every line. A donation is only
          different fiscally (the NF-e is issued with a donation purpose).
        - The four removal types (`REMOVE_STOCK`, `REMOVE_DAMAGED_STOCK`, `REMOVE_EXPIRED_STOCK`,
          `REMOVE_LOST_STOCK`) return stock to you. Cubbo synthesizes the recipient from the
          warehouse, the billing data from your store's fiscal registration and the shipping method
          from the warehouse's pickup method, so `shipping`, `billing`, `shipping_method_id` and
          `shipping_line_code` are optional and ignored. `price_per_item` becomes optional (falls back
          to the product's registered price), `quantity` must be at least 1, and you may hand in your
          own NF-e with `invoice_xml` or `client_invoice`.
        - `REMOVE_LOST_STOCK` is applied synchronously and all-or-nothing: units already recorded
          as lost are written off and the order comes back already `shipped`. It is available only
          to stores that have opted out of Cubbo issuing their removal NF-es (ask Cubbo support).
        - `STOCK_TRANSFER_OUT` is accepted by the parameter check but is reserved for Cubbo's
          stock-transfer feature; do not send it. `C2C` is refused.
        - Sale orders are validated asynchronously (CEP, CPF/CNPJ length, NCM, totals); check
          `status`, `has_missing_info` and `missing_info` on `GET /orders`.
        - Duplicate protection: an existing `order_number` in the store answers 422; a request still
          in progress for the same `order_number` answers 409 `DUPLICATE_REQUEST_IN_FLIGHT`.
        - Error bodies on this endpoint are `{"error": "<message>"}` with no code, except removal
          orders that fail field validation, which return `{"errors": [...]}`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrazilOrderCreateRequest'
            examples:
              sale:
                summary: Sale to a natural person (CPF)
                value:
                  store_id: 1234
                  order_number: "ORD-BR-0001"
                  shipping_method_id: 12
                  buyer_shipping_price: 15.90
                  shipping:
                    first_name: "Ana"
                    last_name: "Silva"
                    phone: "5511999999999"
                    email: "buyer@example.com"
                    address1: "Av. Paulista"
                    number: "1234"
                    interior_number: "Apto 45"
                    neighborhood: "Bela Vista"
                    country: "BR"
                    city: "São Paulo"
                    province: "SP"
                    zip_code: "01310100"
                  billing:
                    first_name: "Ana"
                    last_name: "Silva"
                    phone: "5511999999999"
                    email: "buyer@example.com"
                    address1: "Av. Paulista"
                    number: "1234"
                    neighborhood: "Bela Vista"
                    country: "BR"
                    city: "São Paulo"
                    province: "SP"
                    zip_code: "01310100"
                    tax_id: "000.000.000-00"
                    tax_regime: "PHYSICAL"
                  products:
                    - sku: "SKU-RED-M"
                      quantity: 2
                      price_per_item: 59.90
                      discount_per_item: 5.00
              legalPerson:
                summary: Sale to a company (CNPJ)
                value:
                  store_id: 1234
                  order_number: "ORD-BR-0002"
                  shipping_line_code: "Express"
                  buyer_shipping_price: 0.0
                  is_b2b: true
                  shipping:
                    first_name: "Carlos"
                    last_name: "Souza"
                    phone: "5511888888888"
