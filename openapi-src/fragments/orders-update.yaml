paths:
  /orders/{id}:
    put:
      tags: [Orders]
      operationId: updateOrder
      summary: Update an order
      description: |
        Replaces the editable parts of an order that has not entered fulfillment yet: shipping and
        billing addresses, payment flag, shipping method, product lines and client-uploaded shipping
        documents. After a successful update the order goes back to `initial` and is re-validated and
        re-processed by Cubbo, so the response shows the order as it was saved, not its final status.
        - Allowed only while the order is in `unpaid`, `empty`, `error`, `cancelation_window`,
          `awaiting_fulfillment_request`, `entirely_dropshipping`, `backorder`, `hold` or `pending`.
          An order still in `initial` has not been processed yet and is refused (retry later). Orders in
          `processing` or any later status cannot be updated with this endpoint.
        - On a pick-and-ship store an order that already generated its label cannot be modified.
        - Only the keys you send are changed. `shipping` and `billing`, when present, replace the whole
          address block (fields you omit become empty). `products`, when present and non-empty,
          replaces every order line with the list you send; each line keeps the price it was created
          with (a price sent here is ignored) and a product new to the order gets no price.
        - `products` cannot be sent for an order that has a line pinned to a unit code, and it cannot
          pin one (`unit_code` on a product is refused).
        - The D2C/B2B classification (`is_b2b`) is immutable: on a store that handles both models a
          value different from the order's is refused; on a single-model store it is ignored.
        - When you change `shipping` without sending `shipping_method_id`, an order created through a
          sales-channel integration with a shipping-method mapping gets its shipping method re-evaluated
          during re-processing, unless the order ships on the marketplace's own label.
        - Chile: when you send `shipping_method_id` and `shipping.city` (the comuna) cannot be
          identified, the update is still saved with the rest of your changes. The order goes back to
          `error` until `shipping.city` is corrected.
        - A marketplace order that ships on the marketplace's own label can only move to another
          marketplace-label shipping method; the refusal carries the code
          `MARKETPLACE_WITH_EXTERNAL_GUIDE` so you can tell it apart from a fixable validation error.
        - `shipping_documents`, when present, deletes every document previously uploaded by you
          (`document_type` other than `file`) and stores the new ones. Documents generated by Cubbo
          are kept.
        - Requires an API user with the "orders update" permission and access to the store. Note that
          a permission failure inside this action is currently answered with `500 unexpected error`
          rather than `401`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo order id.
          schema: {type: integer}
          example: 123456
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderUpdateRequest'}
            example:
              store_id: 1234
              is_paid: true
              shipping_method_id: 77
              shipping:
                first_name: "Jane"
                last_name: "Buyer"
                phone: "5551234567"
                address1: "Calle Falsa 123"
                address2: "Depto 4"
                interior_number: "4"
                country: "MX"
                city: "Ciudad de Mexico"
                province: "CDMX"
                zip_code: "06600"
              products:
                - {sku: "SKU-RED-M", quantity: 2}
                - {sku: "SKU-BLUE-L", quantity: 1}
      responses:
        '200':
          description: The updated order (with its order lines) as saved, before re-processing.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
              example:
                id: 123456
                store_id: 1234
                order_number: "ORD-0001"
                status: "initial"
                is_paid: true
                shipping_email: "buyer@example.com"
                shipping:
                  first_name: "Jane"
                  last_name: "Buyer"
                  address_1: "Calle Falsa 123"
                  city: "Ciudad de Mexico"
                  state: "CDMX"
                  zip_code: "06600"
                  country: "MX"
                order_lines:
                  - {sku: "SKU-RED-M", quantity: 2}
                  - {sku: "SKU-BLUE-L", quantity: 1}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: Another request is modifying this order right now. Retry shortly.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "Order is being processed by another request. Please try again in a moment."}
        '422':
          description: Validation or business error. The external-label refusal also carries a `code`.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/Error'}
                  - {$ref: '#/components/schemas/OrderUpdateLockedError'}
              examples:
                missingParam: {value: {error: "Parameter store_id is required"}}
                wrongStore: {value: {error: "Order id 123456 does not belong to store id 1234"}}
                notProcessedYet: {value: {error: "Order id 123456 is in status initial and has not been processed yet, try again later."}}
                notEditable: {value: {error: "You can't edit an order if an order it is in processing or further statuses"}}
                labelAlreadyGenerated: {value: {error: "order id 123456 has already generated a label, cannot be modified"}}
                businessModelImmutable: {value: {error: "An order cannot change between D2C and B2B once it exists"}}
                pinnedLines: {value: {error: "order id 123456 has lines pinned to a unit code, or the request pins one; its products cannot be replaced"}}
                productNotFound: {value: {error: "Product SKU-RED-M was not found in this store"}}
                personalizedProductNeedsUnitCode: {value: {error: "unit_code is required for sku SKU-CARD: each unit belongs to one recipient"}}
                personalizedUnitInKit: {value: {error: "sku SKU-KIT is a kit holding a personalized unit, which cannot be ordered as a kit"}}
                shippingMethodNotFound: {value: {error: "Shipping method 77 was not found"}}
                shippingMethodInactive: {value: {error: "Shipping method 77 (Express) is not active"}}
                internationalOnDomestic: {value: {error: "Shipping method 77 (DHL International) is international and this order ships within MX. Assign a national shipping method."}}
                noCoverage: {value: {error: "Shipping method 77 (Express) does not have coverage for this order"}}
                externalLabelLocked:
                  value:
                    error: "Order 123456 ships on the marketplace's own label (Mercado Envios), so its shipping method cannot be changed to Express: the marketplace would cancel the order and refund the buyer. It can only move to another marketplace-label shipping method."
                    code: "MARKETPLACE_WITH_EXTERNAL_GUIDE"
        '500':
          description: Unexpected error. Also returned when the order id does not exist or when the API user lacks permission on this order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "unexpected error"}
    patch:
      tags: [Orders]
      operationId: patchOrderShippingFields
      summary: Update shipping contact and address fields
      description: |
        Partially updates the recipient and shipping address of an order. Send only the fields you want
        to change; a field that is absent or `null` is left untouched, an empty string clears it. The
        response echoes exactly the fields you changed with their saved values.
        - Allowed in every status except `shipped`, `returning`, `returned`, `return_arrived` and
          `reentered`. Unlike `PUT /orders/{id}`, this works during `processing`, `picking` and
          `packing` (for example to fix an address before the label is generated).
        - An order in `pending` goes back to `initial` and is re-processed; an order in another
          editable status is re-processed without a status change. Orders in `canceled`, `interrupted`
          or in fulfillment (`processing`, `picking`, `packing`) are saved but not re-processed.
        - At least one field must be provided.
        - Requires an API user with the "orders update" permission and access to the store. The order
          must also be editable for your store: a Brazilian order whose NF-e was approved more than
          24 hours ago, or a store with order editing restricted by Cubbo, is answered with `401`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo order id.
          schema: {type: integer}
          example: 123456
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderPatchRequest'}
            example:
              shipping_address_1: "Calle Falsa 123"
              shipping_number: "123"
              shipping_number_int: "4"
              shipping_neighborhood: "Centro"
              shipping_zip_code: "06600"
              shipping_references: "Blue door, ring twice"
      responses:
        '200':
          description: The fields that were updated, with the values now stored on the order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderPatchResponse'}
              example:
                shipping_address_1: "Calle Falsa 123"
                shipping_number: "123"
                shipping_number_int: "4"
                shipping_neighborhood: "Centro"
                shipping_zip_code: "06600"
                shipping_references: "Blue door, ring twice"
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: Another request is modifying this order right now. Retry shortly.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "Order is being processed by another request. Please try again in a moment."}
        '422':
          description: Validation or business error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                noFields: {value: {error: "No fields to update were provided."}}
                statusNotEditable: {value: {error: "Order id 123456 has status shipped, cannot update fields."}}
                orderNotFound: {value: {error: "Couldn't find Order with 'id'=123456"}}
                invalidParam: {value: {error: "'123' is not a valid String"}}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /orders/{id}/hold:
    patch:
      tags: [Orders]
      operationId: holdOrder
      summary: Put an order on hold
      description: |
        Pauses an order so Cubbo does not process or fulfill it until you release it with
        `PATCH /orders/{id}/unhold`. The order's status becomes `hold`.
        - Allowed only while the order is in `initial`, `unpaid`, `empty`, `error`,
          `cancelation_window`, `awaiting_fulfillment_request`, `entirely_dropshipping`, `backorder`
          or `pending`, and (on pick-and-ship stores) before the package is picked up.
        - If your sales-channel integration has status webhooks enabled, a status update is sent.
        - Requires an API user with the "orders update" permission and access to the store.
        - No request body.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo order id.
          schema: {type: integer}
          example: 123456
      responses:
        '200':
          description: The order is now on hold.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderHoldResult'}
              example: {id: 123456, status: "hold", order_number: "ORD-0001", store_id: 1234}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: Another request is modifying this order right now. Retry shortly.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "Order is being processed by another request. Please try again in a moment."}
        '422':
          description: The order cannot be put on hold in its current status, or it was not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                cannotHold:
                  description: Returned (in Spanish) when the order's status does not allow holding it.
                  value: {error: "Error al pausar la orden: 123456"}
                orderNotFound: {value: {error: "Couldn't find Order with 'id'=123456"}}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /orders/{id}/unhold:
    patch:
      tags: [Orders]
      operationId: unholdOrder
      summary: Release an order from hold
      description: |
        Releases an order that is on `hold`. The order goes back to `initial` and Cubbo re-validates and
        processes it again; any "hold order" business rule configured for your store is skipped on this
        re-processing, and a potential-fraud flag on the order is cleared.
        - The order must be in `hold`; any other status is refused.
        - Requires an API user with the "orders update" permission and access to the store.
        - No request body.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo order id.
          schema: {type: integer}
          example: 123456
      responses:
        '200':
          description: The order was released and queued for processing.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderHoldResult'}
              example: {id: 123456, status: "initial", order_number: "ORD-0001", store_id: 1234}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: Another request is modifying this order right now. Retry shortly.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "Order is being processed by another request. Please try again in a moment."}
        '422':
          description: The order is not on hold, or it was not found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                notOnHold: {value: {error: "An order in pending status cannot be changed on unhold"}}
                orderNotFound: {value: {error: "Couldn't find Order with 'id'=123456"}}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /orders/{id}/upload-shipping-documents:
    patch:
      tags: [Orders]
      operationId: uploadOrderShippingDocuments
      summary: Upload shipping documents to an order
      description: |
        Attaches one or more files (shipping labels, invoices, other printable documents) to an order.
        Files are sent as base64 strings inside a JSON body, not as multipart form data. Use it to
        provide the shipping label of an order that ships with your own carrier, or to add documents
        the warehouse must print and include in the package.
        - Documents are appended; existing documents are not removed. Use `PUT /orders/{id}` with
          `shipping_documents` if you need to replace the ones you uploaded before.
        - The order can be in any status. If the order is in `error` (for example because its label
          was missing), it is automatically re-processed after the upload.
        - Accepted file types: PDF, PNG and JPEG, each under 5 MB. `metadata` is free-form JSON of at
          most 10 KB.
        - At least one document is required.
        - Requires an API user with the "orders update" permission and access to the store. Note that
          a permission failure inside this action is currently answered with `500 unexpected error`
          rather than `401`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo order id.
          schema: {type: integer}
          example: 123456
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ShippingDocumentsUploadRequest'}
            example:
              shipping_documents:
                - filename: "label.pdf"
                  base64_data: "JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3RoIDMgMCBSL0ZpbHRlci9GbGF0ZURlY29kZT4+CnN0cmVhbQ=="
                  content_type: "application/pdf"
                  printing_type: "label"
                  document_type: "base64"
                  metadata: {tracking_number: "TRACK0000001", carrier: "DHL"}
      responses:
        '200':
          description: The documents were stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShippingDocumentsUploadResponse'}
              example: {message: "Shipping documents uploaded: label.pdf"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422':
          description: Validation error.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                emptyList: {value: {error: "shipping_documents is expected to be an array of at least one element."}}
                missingField: {value: {error: "Parameter base64_data is required"}}
                orderNotFound: {value: {error: "Couldn't find Order with 'id'=123456"}}
        '500':
          description: Unexpected error. Also returned when a file is rejected (unsupported type, over 5 MB, metadata over 10 KB) or when the API user lacks permission on this order.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: "unexpected error"}

  /orders/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: |
        Cancels one order, identified by its `order_number` within your store, and releases the stock
        reserved for it. The cancellation is recorded in the order history with the reason
        "Canceled from API"; it is not propagated to the sales channel the order came from.
        - An order can be canceled while it is in `initial`, `unpaid`, `empty`, `error`,
          `cancelation_window`, `awaiting_fulfillment_request`, `entirely_dropshipping`, `backorder`,
          `hold`, `pending`, `processing`, `picking` or `packing` (on pick-and-ship stores, only before
          the package is picked up). A `shipped` order can still be canceled while the carrier has not
          collected it (no dispatch yet and shipping status still `created`, `awaiting_collection` or
          undefined), unless it ships on an external label.
        - Canceling an order that is already `canceled` or `interrupted` is a no-op and returns `200`.
        - Orders already on their way or returned (`returning`, `returned`, `return_arrived`,
          `reentered`, or `shipped` and dispatched) are refused with `422`. Those messages are
          returned in Spanish, exactly as shown in the examples.
        - Soft cancel: if Cubbo support has enabled "soft cancel on shipped orders" for your store, a
          cancellation request for an order past the point of cancellation is answered with `200`
          and `{"status": "accepted", "order_id": ...}` instead of `422`. The order is NOT canceled
          and keeps its status; the attempt is recorded in the order history so your team can act on
          it (for example, intercept the shipment or process a return).
        - Requires an API user with the "orders update" permission and access to the store;
          otherwise `401`.
        - Caution: some failures are answered with HTTP `200` and an `error` body (see the `200`
          examples). Always check for an `error` key in the response, not only the status code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCancelRequest'}
            example: {store_id: 1234, order_number: "ORD-0001"}
      responses:
        '200':
          description: |
            The order was canceled (empty object), the cancellation was accepted as a soft cancel, or
            the request failed in a way that is reported with an `error` body.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/OrderCancelResult'}
                  - {$ref: '#/components/schemas/OrderCancelAccepted'}
                  - {$ref: '#/components/schemas/Error'}
              examples:
                canceled:
                  summary: Order canceled (or already canceled)
                  value: {}
                softCancelAccepted:
                  summary: Store has soft cancel enabled and the order is past cancellation
                  value: {status: "accepted", order_id: 123456}
                notCancellable:
                  summary: Status does not allow cancellation (reported with HTTP 200)
                  value: {error: "Error, order_id '123456' cannot be cancelled"}
                missingParam:
                  summary: Missing parameter (reported with HTTP 200)
                  value: {error: "Error, Parameter order_number is required"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422':
          description: The order was not found in the store or its business rules forbid the cancellation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                orderNotFound: {value: {error: "Order with order_number ORD-0001 not found for store id 1234"}}
                alreadyShipped:
                  description: The order was already shipped, dispatched or returned (message in Spanish).
                  value: {error: "Error al cancelar la orden: 123456, La orden ya fue enviada"}
                externalLabel:
                  description: A shipment on an external carrier label cannot be canceled (message in Spanish).
                  value: {error: "Error al cancelar la orden: 123456, No se puede cancelar un envío con guía externa"}
        '500': {$ref: '#/components/responses/InternalServerError'}

  /orders/delete:
    post:
      tags: [Orders]
      operationId: deleteOrder
      summary: Delete an order
      description: |
        Permanently deletes one order, identified by its `order_number` within your store. The order is
        first canceled (releasing its reserved stock) and then removed, so it no longer appears in
        listings or lookups. Prefer `POST /orders/cancel` unless you really need the order gone, for
        example to re-create it under the same `order_number`.
        - Refused when the order is in `processing`, `picking`, `packing`, `shipped`, `returning`,
          `returned`, `return_arrived`, `reentered` or `interrupted`. Note that this refusal is
          reported with HTTP `200` and an `error` body.
        - Requires an API user with the "orders update" permission, access to the store and an order
          that is editable for your store. A permission failure or an unknown `order_number` is also
          reported with HTTP `200` and an `error` body.
        - Always check for an `error` key in the response, not only the status code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderDeleteRequest'}
            example: {store_id: 1234, order_number: "ORD-0001"}
      responses:
        '200':
          description: The order was deleted (empty object), or the request failed in a way that is reported with an `error` body.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/OrderCancelResult'}
                  - {$ref: '#/components/schemas/Error'}
              examples:
                deleted:
                  summary: Order deleted
                  value: {}
                statusNotDeletable:
                  summary: Status does not allow deletion (reported with HTTP 200)
                  value: {error: "Error, This order was already shipped or it's been processed, it can't be deleted."}
                missingParam:
                  summary: Missing parameter (reported with HTTP 200)
                  value: {error: "Error, Parameter order_number is required"}
                notAuthorized:
                  summary: API user cannot edit this order (reported with HTTP 200)
                  value: {error: "Error, not allowed to delete? this Order"}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422':
          description: The cancellation step refused the order (message in Spanish).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                alreadyShipped: {value: {error: "Error al cancelar la orden: 123456, La orden ya fue enviada"}}
                externalLabel: {value: {error: "Error al cancelar la orden: 123456, No se puede cancelar un envío con guía externa"}}
        '500': {$ref: '#/components/responses/InternalServerError'}

components:
  schemas:
    OrderUpdateRequest:
      type: object
      description: Full update of an order. Only the keys present are applied; see the endpoint description for replacement semantics.
      required: [store_id]
      properties:
        store_id:
          type: integer
          description: Id of the store the order belongs to. Must match the order's store.
          example: 1234
        is_paid:
          type: [boolean, 'null']
          description: Marks the order as paid or unpaid. Omit or send `null` to leave it unchanged.
          example: true
        shipping_method_id:
          type: [integer, 'null']
          description: Id of the shipping method to assign. Get it from `GET /shipping-methods/quote` (`shipping_method_id` of each option). It must be active and cover the (updated) shipping address; an international method is refused for a destination inside the warehouse's country. In Chile a `shipping.city` that cannot be identified is not refused; the update is saved and the order waits in `error` until it is corrected.
          example: 77
        is_b2b:
          type: [boolean, 'null']
          description: Order classification. Immutable once the order exists; a value different from the order's is refused on a store handling both D2C and B2B, and ignored on a single-model store.
          example: false
        shipping:
          $ref: '#/components/schemas/OrderUpdateAddress'
        billing:
          $ref: '#/components/schemas/OrderUpdateBillingAddress'
        products:
          type: array
          description: New list of order lines. When non-empty it replaces every line of the order. Do not send it for orders with lines pinned to a unit code.
          items: {$ref: '#/components/schemas/OrderUpdateProduct'}
        shipping_documents:
          type: array
          description: Documents to attach. Replaces every document you uploaded before (Cubbo-generated documents are kept).
          items: {$ref: '#/components/schemas/OrderUpdateShippingDocument'}
    OrderUpdateAddress:
      type: object
      description: Shipping recipient and address. Sending this object replaces the whole shipping address; omitted fields are cleared.
      properties:
        first_name: {type: [string, 'null'], description: Recipient first name., example: "Jane"}
        last_name: {type: [string, 'null'], description: Recipient last name., example: "Buyer"}
        phone: {type: [string, 'null'], description: Recipient phone number., example: "5551234567"}
        email: {type: [string, 'null'], description: Recipient email., example: "buyer@example.com"}
        address1: {type: [string, 'null'], description: Street and number (first address line)., example: "Calle Falsa 123"}
        address2: {type: [string, 'null'], description: Second address line (apartment, floor, complement)., example: "Depto 4"}
        address3: {type: [string, 'null'], description: Accepted for compatibility; not stored., example: null}
        number: {type: [string, 'null'], description: Street number, when your addresses keep it apart from the street name (Brazil)., example: "123"}
        interior_number: {type: [string, 'null'], description: Interior or apartment number., example: "4"}
        neighborhood: {type: [string, 'null'], description: Neighborhood (colonia / bairro)., example: "Centro"}
        references: {type: [string, 'null'], description: Delivery references for the carrier., example: "Blue door, ring twice"}
        country: {type: [string, 'null'], description: Country name or ISO code; normalized to ISO 3166-1 alpha-2., example: "MX"}
        city: {type: [string, 'null'], description: City., example: "Ciudad de Mexico"}
        province: {type: [string, 'null'], description: State or province., example: "CDMX"}
        zip_code: {type: [string, 'null'], description: Postal code., example: "06600"}
    OrderUpdateBillingAddress:
      type: object
      description: Billing contact and address. Sending this object replaces the whole billing block; omitted fields are cleared.
      properties:
        first_name: {type: [string, 'null'], description: Billing first name., example: "Jane"}
        last_name: {type: [string, 'null'], description: Billing last name., example: "Buyer"}
        phone: {type: [string, 'null'], description: Billing phone number., example: "5551234567"}
        email: {type: [string, 'null'], description: Billing email., example: "buyer@example.com"}
        company: {type: [string, 'null'], description: Company name., example: "Example S.A. de C.V."}
        address1: {type: [string, 'null'], description: Street and number (first address line)., example: "Calle Falsa 123"}
        address2: {type: [string, 'null'], description: Second address line., example: "Depto 4"}
        address3: {type: [string, 'null'], description: Accepted for compatibility; not stored., example: null}
        number: {type: [string, 'null'], description: Street number kept apart from the street name (Brazil)., example: "123"}
        interior_number: {type: [string, 'null'], description: Interior or apartment number., example: "4"}
        neighborhood: {type: [string, 'null'], description: Neighborhood (colonia / bairro)., example: "Centro"}
        country: {type: [string, 'null'], description: Country name or ISO code; normalized to ISO 3166-1 alpha-2., example: "MX"}
        city: {type: [string, 'null'], description: City., example: "Ciudad de Mexico"}
        province: {type: [string, 'null'], description: State or province., example: "CDMX"}
        zip_code: {type: [string, 'null'], description: Postal code., example: "06600"}
        tax_id: {type: [string, 'null'], description: Tax id of the buyer (RFC in Mexico; CPF or CNPJ in Brazil)., example: "000.000.000-00"}
        tax_regime: {type: [string, 'null'], description: Tax regime of the buyer, as used when the order was created., example: "FISICA"}
        state_registration: {type: [string, 'null'], description: State registration (Inscricao Estadual) for Brazilian companies., example: "ISENTO"}
    OrderUpdateProduct:
      type: object
      description: One order line of the replacement list.
      required: [sku, quantity]
      properties:
        sku:
          type: string
          description: SKU of a product in your store.
          example: "SKU-RED-M"
        quantity:
          type: integer
          description: Units to ship.
          example: 2
    OrderUpdateShippingDocument:
      type: object
      description: A document sent as base64 inside the update body.
      required: [filename, data, content_type, printing_type, document_type]
      properties:
        filename:
          type: string
          description: File name, including extension.
          example: "label.pdf"
        data:
          type: string
          description: File contents encoded in base64. A `data:...;base64,` prefix is tolerated.
          example: "JVBERi0xLjQKJcOkw7zDtsOfCg=="
        content_type:
          type: string
          description: MIME type of the file. PDF, PNG and JPEG are accepted.
          enum: [application/pdf, image/png, image/jpeg]
          example: "application/pdf"
        printing_type:
          type: string
          description: How the warehouse must print and use the document. `label` is a shipping label; `document` is any other printable to include in the package.
          enum: [label, document, difal_bill, difal_payment_receipt, identifier_label, oxxo_digital_card]
          example: "label"
        document_type:
          type: string
          description: Origin of the document. Use `base64` for documents you upload; `file` marks Cubbo-generated documents and is never replaced by later updates.
          enum: [base64, url, file]
          example: "base64"
        metadata:
          type: object
          description: Free-form JSON stored with the document (at most 10 KB), for example the tracking number of a label.
          additionalProperties: true
          example: {tracking_number: "TRACK0000001", carrier: "DHL"}
    OrderUpdateLockedError:
      type: object
      description: Refusal of a shipping-method change on a marketplace order that ships on the marketplace's own label.
      required: [error, code]
      properties:
        error:
          type: string
          description: Human-readable reason.
          example: "Order 123456 ships on the marketplace's own label (Mercado Envios), so its shipping method cannot be changed to Express: the marketplace would cancel the order and refund the buyer. It can only move to another marketplace-label shipping method."
        code:
          type: string
          description: Stable error code.
          enum: [MARKETPLACE_WITH_EXTERNAL_GUIDE]
          example: "MARKETPLACE_WITH_EXTERNAL_GUIDE"
    OrderPatchRequest:
      type: object
      description: Partial update of the shipping contact and address. Send only the fields to change; at least one is required.
      minProperties: 1
      properties:
        shipping_first_name: {type: string, description: Recipient first name., example: "Jane"}
        shipping_last_name: {type: string, description: Recipient last name., example: "Buyer"}
        shipping_phone: {type: string, description: Recipient phone number., example: "5551234567"}
        shipping_email: {type: string, description: Recipient email., example: "buyer@example.com"}
        shipping_address_1: {type: string, description: Street and number (first address line)., example: "Calle Falsa 123"}
        shipping_address_2: {type: string, description: Second address line (apartment, floor, complement)., example: "Depto 4"}
        shipping_neighborhood: {type: string, description: Neighborhood (colonia / bairro)., example: "Centro"}
        shipping_references: {type: string, description: Delivery references for the carrier., example: "Blue door, ring twice"}
        shipping_number: {type: string, description: Street number kept apart from the street name (Brazil)., example: "123"}
        shipping_number_int: {type: string, description: Interior or apartment number., example: "4"}
        shipping_city: {type: string, description: City., example: "Ciudad de Mexico"}
        shipping_state: {type: string, description: State or province., example: "CDMX"}
        shipping_zip_code: {type: string, description: Postal code., example: "06600"}
    OrderPatchResponse:
      type: object
      description: Only the fields that were sent in the request, with the values now stored on the order.
      properties:
        shipping_first_name: {type: [string, 'null'], description: Recipient first name., example: "Jane"}
        shipping_last_name: {type: [string, 'null'], description: Recipient last name., example: "Buyer"}
        shipping_phone: {type: [string, 'null'], description: Recipient phone number., example: "5551234567"}
        shipping_email: {type: [string, 'null'], description: Recipient email., example: "buyer@example.com"}
        shipping_address_1: {type: [string, 'null'], description: First address line., example: "Calle Falsa 123"}
        shipping_address_2: {type: [string, 'null'], description: Second address line., example: "Depto 4"}
        shipping_neighborhood: {type: [string, 'null'], description: Neighborhood., example: "Centro"}
        shipping_references: {type: [string, 'null'], description: Delivery references., example: "Blue door, ring twice"}
        shipping_number: {type: [string, 'null'], description: Street number., example: "123"}
        shipping_number_int: {type: [string, 'null'], description: Interior number., example: "4"}
        shipping_city: {type: [string, 'null'], description: City., example: "Ciudad de Mexico"}
        shipping_state: {type: [string, 'null'], description: State or province., example: "CDMX"}
        shipping_zip_code: {type: [string, 'null'], description: Postal code., example: "06600"}
    OrderHoldResult:
      type: object
      description: Minimal order representation returned by the hold and unhold endpoints.
      required: [id, status, order_number, store_id]
      properties:
        id: {type: integer, description: Cubbo order id., example: 123456}
        status:
          type: string
          description: Order status after the action (`hold` after holding, `initial` after releasing).
          example: "hold"
        order_number: {type: string, description: Your order number., example: "ORD-0001"}
        store_id: {type: integer, description: Id of the store the order belongs to., example: 1234}
    ShippingDocumentsUploadRequest:
      type: object
      description: One or more documents, each sent as base64 inside the JSON body.
      required: [shipping_documents]
      properties:
        shipping_documents:
          type: array
          minItems: 1
          description: Documents to attach to the order.
          items: {$ref: '#/components/schemas/ShippingDocumentUpload'}
    ShippingDocumentUpload:
      type: object
      description: A document sent as base64. Same fields as the documents accepted by `PUT /orders/{id}`, except that the content key is `base64_data`.
      required: [filename, base64_data, content_type, printing_type, document_type]
      properties:
        filename:
          type: string
          description: File name, including extension.
          example: "label.pdf"
        base64_data:
          type: string
          description: File contents encoded in base64. A `data:...;base64,` prefix is tolerated.
          example: "JVBERi0xLjQKJcOkw7zDtsOfCg=="
        content_type:
          type: string
          description: MIME type of the file. PDF, PNG and JPEG are accepted.
          enum: [application/pdf, image/png, image/jpeg]
          example: "application/pdf"
        printing_type:
          type: string
          description: How the warehouse must print and use the document. `label` is a shipping label; `document` is any other printable to include in the package.
          enum: [label, document, difal_bill, difal_payment_receipt, identifier_label, oxxo_digital_card]
          example: "label"
        document_type:
          type: string
          description: Origin of the document. Use `base64` for documents you upload; `file` marks Cubbo-generated documents and is never replaced by `PUT /orders/{id}`.
          enum: [base64, url, file]
          example: "base64"
        metadata:
          type: object
          description: Free-form JSON stored with the document (at most 10 KB), for example the tracking number of a label.
          additionalProperties: true
          example: {tracking_number: "TRACK0000001", carrier: "DHL"}
    ShippingDocumentsUploadResponse:
      type: object
      description: Confirmation listing the stored file names.
      required: [message]
      properties:
        message:
          type: string
          description: Confirmation message with the uploaded file names, comma separated.
          example: "Shipping documents uploaded: label.pdf"
    OrderCancelRequest:
      type: object
      description: Identifies the single order to cancel.
      required: [order_number, store_id]
      properties:
        order_number:
          type: string
          description: Your order number, unique within the store.
          example: "ORD-0001"
        store_id:
          type: integer
          description: Id of the store the order belongs to.
          example: 1234
    OrderDeleteRequest:
      type: object
      description: Identifies the single order to delete.
      required: [order_number, store_id]
      properties:
        order_number:
          type: string
          description: Your order number, unique within the store.
          example: "ORD-0001"
        store_id:
          type: integer
          description: Id of the store the order belongs to.
          example: 1234
    OrderCancelResult:
      type: object
      description: Empty object returned when the cancellation or deletion succeeded.
      additionalProperties: false
      example: {}
    OrderCancelAccepted:
      type: object
      description: Returned instead of `422` when the store has soft cancel enabled and the order is past the point of cancellation. The order keeps its status; the attempt is recorded in its history.
      required: [status, order_id]
      properties:
        status:
          type: string
          description: Always `accepted`.
          enum: [accepted]
          example: "accepted"
        order_id:
          type: integer
          description: Cubbo id of the order whose cancellation was recorded.
          example: 123456
