          example: false
        has_carrier_insurance:
          type: boolean
          description: Whether the shipment is insured with the carrier.
          example: false
        has_missing_info:
          type: boolean
          description: Whether the order is blocked because data is missing.
          example: false
        missing_info:
          type:
            - string
            - "null"
          description: Description of the missing data, if any.
          example: null
        currency:
          type:
            - string
            - "null"
          description: Currency code of the prices.
          example: MXN
        total_price:
          type:
            - string
            - "null"
          description: Order total as a decimal string.
          example: "899.00"
        discount_price:
          type:
            - string
            - "null"
          description: Total discount as a decimal string.
          example: "0.00"
        buyer_shipping_price:
          type:
            - string
            - "null"
          description: Shipping price paid by the buyer, as a decimal string.
          example: "0.00"
        extra_fees_price:
          type:
            - string
            - "null"
          description: Extra fees as a decimal string.
          example: "0.0"
        is_pick_and_ship:
          type: boolean
          description: Whether the order is a pick-and-ship order (you pick it up at the warehouse).
          example: false
        pick_n_ship_status:
          type:
            - string
            - "null"
          description: Pick-and-ship status.
          enum:
            - awaiting_pick_up
            - picked_up
            - in_warehouse
            - null
          example: null
        is_b2b:
          type: boolean
          description: >-
            Whether the order is a B2B order. In `GET /orders` only present for stores that handle both B2B
            and D2C.
          example: false
        is_first_time_buyer:
          type: boolean
          description: Whether this is the buyer's first order in the store.
          example: true
        is_subscription_renewal:
          type: boolean
          description: Whether the order is a subscription renewal.
          example: false
        is_click_and_collect:
          type: boolean
          description: Whether the buyer picks the order up at a pickup point.
          example: false
        click_and_collect_metadata:
          oneOf:
            - $ref: "#/components/schemas/OrderClickAndCollectMetadata"
            - type: "null"
          description: Pickup-point details for click-and-collect orders; null otherwise.
        is_multi_package:
          type: boolean
          description: Whether the shipment has more than one package.
          example: false
        shipping:
          $ref: "#/components/schemas/OrderAddress"
        billing:
          $ref: "#/components/schemas/OrderBillingAddressDetails"
        delivery_tracking:
          type: array
          description: Tracking per package. Return labels are excluded.
          items:
            $ref: "#/components/schemas/OrderDeliveryTrackingPackage"
        return_shipping_labels:
          type:
            - array
            - "null"
          description: Valid return labels of the order.
          items:
            $ref: "#/components/schemas/OrderReturnShippingLabel"
        proof_of_delivery:
          oneOf:
            - $ref: "#/components/schemas/OrderProofOfDelivery"
            - type: "null"
          description: Proof of delivery, when the carrier provided one for a shipped or returned order.
        estimated_time_arrival:
          type:
            - string
            - "null"
          format: date-time
          description: Estimated delivery date.
          example: "2026-01-13T00:00:00.000Z"
        latest_estimated_time_arrival_range:
          oneOf:
            - $ref: "#/components/schemas/OrderEtaRange"
            - type: "null"
          description: Latest estimated delivery window, or null when no estimate exists.
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the carrier delivered the order.
          example: null
        updated_at:
          type: string
          format: date-time
          description: Last update of the order.
          example: "2026-01-11T18:31:00.000Z"
        channel_order_id:
          type:
            - string
            - "null"
          description: ID of the order in the sales channel.
          example: "5566778899"
        channel_name:
          type:
            - string
            - "null"
          description: Name of the sales channel the order came from.
          example: shopify
        channel_shipping_line_code:
          type:
            - string
            - "null"
          description: Code of the shipping option chosen at checkout in the sales channel (first shipping line).
          example: standard
        warehouse_timezone:
          type:
            - string
            - "null"
          description: IANA time zone of the warehouse fulfilling the order.
          example: America/Mexico_City
        shipping_method:
          oneOf:
            - $ref: "#/components/schemas/OrderShippingMethod"
            - type: "null"
          description: Shipping method assigned to the order.
        order_lines:
          type: array
          description: Lines of the order.
          items:
            $ref: "#/components/schemas/OrderLine"
        invoices:
          type: array
          description: NF-e documents attached to the order (Brazil).
          items:
            $ref: "#/components/schemas/OrderInvoice"
        store:
          oneOf:
            - $ref: "#/components/schemas/OrderStore"
            - type: "null"
          description: Store the order belongs to.
        channel_integration:
          oneOf:
            - $ref: "#/components/schemas/OrderChannelIntegration"
            - type: "null"
          description: Sales-channel integration the order came from.
        return:
          oneOf:
            - $ref: "#/components/schemas/OrderReturnSummary"
            - type: "null"
          description: The return opened for this order, if any. Use `GET /returns/{return_id}` for the full return.
        created_by_return:
          oneOf:
            - $ref: "#/components/schemas/OrderReturnSummary"
            - type: "null"
          description: The return that created this order (for exchanges), if any.
        order_histories:
          type: array
          description: Order timeline. Only returned by `GET /orders` with `include_event_history=true`.
          items:
            $ref: "#/components/schemas/OrderHistoryEvent"
    OrderReturnSummary:
      type: object
      description: |
        Summary of a return embedded in an order (`return` / `created_by_return`). Only the fields below are
        guaranteed; `GET /orders` may additionally embed the return's `returned_stock_units` (received units,
        each with its `unit_code`) and, on `return`, the exchange order it created (`created_order`). Fetch
        the full return with the Returns endpoints.
      additionalProperties: true
      properties:
        id:
          type: integer
          description: Return ID.
          example: 501
        status:
          type: string
          description: Return status.
          example: pending
        return_type:
          type: string
          description: Kind of return (for example a simple return or an exchange).
          example: SIMPLE_RETURN
        notes:
          type:
            - string
            - "null"
          description: Notes attached to the return.
          example: null
        created_at:
          type: string
          format: date-time
          description: When the return was created.
          example: "2026-01-20T10:00:00.000Z"
        expected_products:
          type:
            - array
            - "null"
          description: Products expected back, as product ID and quantity.
          items:
            type: object
            properties:
              product_id:
                type: integer
                description: Product ID.
                example: 777
              quantity:
                type: integer
                description: Units expected.
                example: 1
