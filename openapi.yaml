          type: string
          description: Cubbo tracking page for the order.
          example: https://tracking.example.com/orders/abc123
        label_file:
          description: The label PDF, or an empty object when no file is attached.
          oneOf:
            - $ref: "#/components/schemas/ShippingLabelFile"
