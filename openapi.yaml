    patch:
      tags:
        - Inventory
      operationId: updateProduct
      summary: Update a product
      description: >
        Updates the editable fields of one product: name, description, price, image, barcode, SKUs,

        weight and dimensions. Only the fields you send are changed; everything else is kept.

        - **SKU and barcode changes are blocked once the product has stock** in the warehouse (any unit, in
        any status). The whole request is rejected with 422 in that case, even if it also carries other
        fields.

        - `skus` **replaces** the product's full SKU list: existing SKUs are removed and the ones you send are
        added. An empty array is treated as "no change". The new SKUs must not be in use by another product of
        the store.

        - `bar_code` must be unique in the store and must not match a SKU of another product.

        - `weight` is stored in kilograms; send `weight_unit: "g"` (or `"gr"`) to send grams and have the
        value converted. `weight` must be greater than 0.

        - `length`, `width` and `height` must be between 0.01 and 999999.99.

        - Concurrent updates of the same product are serialized; a second simultaneous update receives `202
        Accepted`.

        - The response is the full product in the same format the Cubbo app uses (see `ProductDetailed`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo product id, as returned by `GET /inventory` or `POST /products`.
          schema:
            type: integer
          example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
            examples:
              rename:
