  /carrier-services/pickup-locations:
    get:
      tags:
        - Click and collect
      operationId: listPickupLocations
      summary: List pickup locations near a postal code (public)
      description: |
        Public, unauthenticated listing of pickup locations (carrier branches and Cubbo points)
        near a postal code, used by the buyer tracking page to offer pickup. Each location comes
        as a "rate" with a Spanish display name ready to show to the buyer and a `service_code`
        that identifies the point.

        - Without `order_id` the response contains only `rates`, for Mexico.
        - With `order_id` (the encoded order identifier found in the order's Cubbo tracking
          link) the list is filtered to the points the order could actually be converted to,
          and `cnc_eligible` reports the outcome. When the order is not eligible, the unfiltered
          list is still returned together with `cnc_eligible: false` and a `code`; when
          `order_id` cannot be resolved the code is `CNC_INVALID_ORDER_ID`. The order's
          destination country drives the carrier search.
        - `address` enables the carriers that need a street address; without it those carriers
          are skipped.
        - A postal code that cannot be used answers 200 with an empty `rates` array. If any
          carrier lookup fails, the other carriers' locations are still returned.
        - Omitting `postal_code` is not handled gracefully and results in HTTP 500.
      parameters:
        - name: postal_code
          in: query
          required: true
          description: >-
            Postal code to search around. When `order_id` is given and the order's zip code is known, that zip
            code is used instead.
          schema:
            type: string
            example: "06600"
        - name: address
          in: query
          required: false
          description: Street address, used by carriers that search by address
          schema:
            type: string
            example: Av. Insurgentes 100
        - name: order_id
          in: query
          required: false
          description: >-
            Encoded order identifier from the order's Cubbo tracking link. Enables eligibility filtering for
            that order.
          schema:
            type: string
            example: <encoded-order-id>
      responses:
        "200":
          description: Pickup locations, optionally with the order's click-and-collect eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupLocationsResponse"
              examples:
                withoutOrder:
                  value:
                    rates:
                      - service_name: >-
                          Recolecta en punto físico a 1.5km - Estafeta Insurgentes - Lun a Vie: 10:00-18:00,
                          Sáb: 10:00-14:00, Dom: cerrado
                        service_code: CUBBOCNCESTEST001
                        source: Av. Insurgentes 100, CDMX
                        description: Av. Insurgentes 100, CDMX
                      - service_name: Recolecta en punto físico a 0.8km - Punto Cubbo Centro
                        service_code: CUBBOCNCCUBBOCUBBO001
                        source: Calle Centro 300, CDMX, 06000
                        description: Calle Centro 300, CDMX, 06000
                eligibleOrder:
                  value:
                    rates:
                      - service_name: Recolecta en punto físico a 0.8km - Punto Cubbo Centro
                        service_code: CUBBOCNCCUBBOCUBBO001
                        source: Calle Centro 300, CDMX, 06000
                        description: Calle Centro 300, CDMX, 06000
                    cnc_eligible: true
                ineligibleOrder:
                  value:
                    rates: []
                    cnc_eligible: false
                    code: CNC_INVALID_ORDER_STATUS
                invalidOrderId:
                  value:
                    rates: []
                    cnc_eligible: false
                    code: CNC_INVALID_ORDER_ID
        "500":
          description: Unexpected error, including a missing `postal_code`
      security: []
  /inventory:
    get:
      tags:
        - Inventory
      operationId: listInventory
      summary: List products with stock
      description: >
        Returns the catalog of one store with the current stock of every product. Each product

        carries an aggregate `stock` breakdown (available, reserved, damaged, lost, expired, on hold,

        sell-ahead buckets, and per-source splits of damaged and lost units), an optional per-unit

        `units` detail and an optional per-lot `lots` detail. Use it to sync your catalog and stock

        levels; use `GET /lots` when you need one product's lots filtered or paginated.

        - Results are paginated and ordered by product creation date, newest first. Default page size is 10,
        maximum 200.

        - Pass `skus[]` to restrict the page to products that carry any of the given SKUs (exact match on the
        SKU).

        - `units` is present only when the product has something to report: unit-code (IMEI/serial) products
        list every active, reserved, damaged and lost unit with its unit code; other products list only their
        damaged and lost units, without a unit code.

        - `lots` is present only on products that have at least one lot. Lots are listed in creation order,
        not by expiration date.

        - `kit_childs` lists the components of a kit (bundle) with their quantity and the component product's
        id, name and SKUs. It is an empty array for non-kit products.

        - The response is read from a replica, so very recent movements can lag a few seconds.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          description: Store whose inventory you want. Your token must have access to this store.
          schema:
            type: integer
          example: 1234
        - name: skus[]
          in: query
          required: false
          description: >-
            Only return products that carry one of these SKUs (exact match). Repeat the parameter for several
            SKUs. Omit to return the whole catalog.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example:
            - SKU-RED-M
            - SKU-RED-L
        - name: page
          in: query
          required: false
          description: Page number, starting at 1.
          schema:
            type: integer
            default: 1
          example: 1
        - name: per_page
          in: query
