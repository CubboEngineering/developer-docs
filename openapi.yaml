        order_number:
          type: string
          description: Your order number, unique within the store.
          example: ORD-0001
        store_id:
          type: integer
          description: Id of the store the order belongs to.
          example: 1234
    OrderCancelResult:
      type: object
      description: Empty object returned when the cancellation or deletion succeeded.
      additionalProperties: false
      example: {}
    OrderCancelAccepted:
      type: object
      description: >-
        Returned instead of `422` when the store has soft cancel enabled and the order is past the point of
        cancellation. The order keeps its status; the attempt is recorded in its history.
      required:
        - status
        - order_id
      properties:
        status:
          type: string
          description: Always `accepted`.
          enum:
            - accepted
          example: accepted
        order_id:
          type: integer
          description: Cubbo id of the order whose cancellation was recorded.
          example: 123456
    ReplenishmentStatus:
      type: string
      description: >
        Lifecycle status of a replenishment.

        - `WITHOUT_SCHEDULING`: created at a warehouse that books receiving appointments natively, but no
        appointment has been scheduled yet.

        - `PENDING`: registered but not yet requested to the warehouse (pre-arrival).

        - `REQUESTED`: announced to the warehouse and awaiting arrival; the initial status at warehouses
        without native appointment scheduling, and the status after an appointment is booked.

        - `IN_TRANSIT`: the shipment is on its way to the warehouse.

        - `RECEIVED`: the shipment was recorded at the dock; counting has not started.

        - `PROCESSING`: the warehouse is receiving and counting the units (stock has arrived).

        - `IN_PUTAWAY`: received units are being placed in storage locations.

        - `COMPLETED`: receiving and putaway finished; `completed_at` is set.

        - `CANCELED`: the replenishment was canceled; it no longer counts for external-reference uniqueness.
      enum:
        - WITHOUT_SCHEDULING
        - PENDING
        - REQUESTED
        - IN_TRANSIT
        - RECEIVED
        - PROCESSING
        - IN_PUTAWAY
        - COMPLETED
        - CANCELED
      example: REQUESTED
    ReplenishmentLineProduct:
      type: object
      description: Catalog product referenced by a replenishment line.
      properties:
        id:
          type: integer
          description: Cubbo product id.
          example: 9001
        name:
          type: string
          description: Product name.
          example: Red T-shirt M
        bar_code:
          type:
            - string
            - "null"
          description: Barcode (UPC/EAN) of the product.
          example: "7501234567890"
        is_scannable:
          type: boolean
          description: Whether units of this product are identified by scanning at the warehouse.
          example: true
        product_codes:
          type: array
          description: SKUs registered for the product.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Id of the SKU record.
                example: 31001
              sku:
                type: string
                description: SKU.
                example: SKU-RED-M
    ReplenishmentProduct:
      type: object
      description: One announced line of a replenishment.
      properties:
        product_id:
          type: integer
          description: Cubbo product id of the line.
          example: 9001
        expected_quantity:
          type: integer
          description: Number of units announced for this product.
          example: 100
        unit_value:
          type:
            - string
            - "null"
          description: Declared unit cost in the store currency, as a decimal string; `null` when not declared.
          example: "12.5"
        product:
          $ref: "#/components/schemas/ReplenishmentLineProduct"
    ReplenishmentReceivedByInvoice:
      type: object
      description: Units of a line received under one supplier invoice.
      properties:
        invoice_number:
          type:
            - string
            - "null"
          description: >-
            Supplier invoice (factura) number captured at reception; `null` for units received without a
            captured invoice.
          example: F-111
        quantity:
          type: integer
          description: Units of the product received under this invoice.
          example: 50
    ReplenishmentProductReceived:
      allOf:
        - $ref: "#/components/schemas/ReplenishmentProduct"
        - type: object
          properties:
            received_quantity:
              type: integer
              description: Units of the product physically received so far (counted, stored or reserved).
              example: 80
            received_by_invoice:
              type: array
              description: >-
                Breakdown of `received_quantity` by captured supplier invoice; the `null` bucket is listed
                last. Empty when nothing has been received.
              items:
                $ref: "#/components/schemas/ReplenishmentReceivedByInvoice"
    ReplenishmentSupplierInvoice:
      type: object
      description: A supplier invoice number captured during receiving.
      properties:
        invoice_number:
          type: string
          description: Normalized supplier invoice (factura) number.
          example: F-111
    ReplenishmentSupplierInvoiceFile:
      type: object
      description: A document uploaded during receiving, served as a short-lived download link.
      properties:
        url:
          type: string
          description: Download URL, valid until `expires_at` (15 minutes after the response was built).
          example: https://files.example.com/replenishments/55001/factura.pdf?signature=fake
        filename:
          type: string
          description: Original file name.
          example: factura.pdf
        content_type:
          type: string
          description: MIME type of the file.
          example: application/pdf
        byte_size:
          type: integer
          description: File size in bytes.
          example: 48213
        expires_at:
          type: string
          format: date-time
          description: Moment after which `url` stops working.
          example: "2026-10-12T14:18:11Z"
    ReplenishmentReturn:
      type: object
