    ReplenishmentCreateLot:
      type: object
      description: A lot (batch) expected for a line.
      required:
        - lot_code
        - quantity
        - external_reference
      properties:
        lot_code:
          type: string
          description: Lot code as printed on the goods.
          example: LOT-2026-01
        quantity:
          type: integer
          description: Units of the line expected in this lot.
          example: 24
        external_reference:
          type: string
          description: Your reference for this lot line.
          example: LOT-REF-1
    ReplenishmentCreateProduct:
      type: object
      description: A line to announce.
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: SKU registered in the store's catalog. Each SKU may appear once.
          example: SKU-RED-M
        quantity:
          type: integer
          description: Units announced. When `lots` is sent, it must equal the sum of the lot quantities.
          example: 100
        unit_value:
          type:
            - number
            - string
          description: >-
            Optional declared unit cost in the store currency. Plain decimal (digits, optional dot and up to 2
            decimals, e.g. `12.50` or `"12.50"`), greater than 0 and below the supported ceiling. Omit to
            leave the line without a declared cost.
          example: "12.50"
        lots:
          type: array
          description: >-
            Expected lots for this SKU. Requires a master-box configuration for the SKU in Cubbo; the
            quantities must add up to `quantity`.
          items:
            $ref: "#/components/schemas/ReplenishmentCreateLot"
    ReplenishmentCreateInvoice:
      type: object
      description: >-
        Already-issued NF-e of entry, required for Brazilian stores whose NF-e is issued by their own provider
        instead of Cubbo.
      required:
        - key
        - xml_base64
        - pdf_base64
      properties:
        key:
          type: string
          description: 44-digit NF-e access key.
          example: "00000000000000000000000000000000000000000000"
        operation_type:
          type: string
          description: >-
            Whether the document is incoming or outgoing from the issuer's point of view. Defaults to
            `OUTGOING` when omitted; send `INCOMING` for an NF-e of entry.
          enum:
            - INCOMING
            - OUTGOING
          default: OUTGOING
          example: INCOMING
        identifier:
          type: string
          description: Your identifier for the document.
          example: NFE-123456
        serie:
          type: string
          description: NF-e series.
          example: "1"
        number:
          type: string
          description: NF-e number.
          example: "123456"
        total_value:
          type:
            - number
            - string
          description: Total value of the NF-e.
          example: "1250.00"
        operation_nature:
          type: string
          description: Nature of the operation (natureza da operação) printed on the NF-e.
          example: Remessa para armazenagem
        xml_base64:
          type: string
          description: Authorized NF-e XML, base64-encoded.
          example: PD94bWwgdmVyc2lvbj0iMS4wIj8+...
        pdf_base64:
          type: string
          description: DANFE PDF, base64-encoded.
          example: JVBERi0xLjQK...
    ReplenishmentCreateRequest:
      type: object
      required:
        - store_id
        - products
      properties:
        store_id:
          type: integer
          description: Store that owns the stock.
          example: 1234
        warehouse_id:
          type: integer
          description: Destination warehouse. Must be assigned to the store. Defaults to the store's first warehouse.
          example: 7
        expected_arrived_at:
          type: string
          format: date-time
          description: Expected arrival date (ISO 8601).
          example: "2026-11-02T15:00:00Z"
        notes:
          type: string
          description: Free-text notes for the warehouse.
          example: Pallet 2 contains fragile items
        external_reference:
          type: string
          description: Your reference for the shipment (purchase order, transfer number...).
          example: PO-0001
        unique_external_reference:
          type: boolean
          description: >-
            When `true`, `external_reference` is required and the create is idempotent per store on that
            reference (see endpoint description).
          default: false
          example: true
        sell_ahead:
          type: boolean
          description: >-
            When `true`, the announced units become sellable immediately. Such replenishments cannot be
            updated later.
          default: false
          example: false
        is_b2b:
          type: boolean
          description: >-
            Legacy way to choose the inventory scope: `true` is equivalent to `inventory_scope: b2b`, `false`
            to `d2c`. Ignored when `inventory_scope` is sent.
          example: false
        inventory_scope:
          type: string
          description: >-
            Which sales channel the received stock serves. `shared` is only valid for stores that operate both
            B2B and D2C. Omit to use the store's default.
          enum:
            - d2c
            - b2b
            - shared
          example: d2c
        products:
          type: array
          description: Lines to announce (at least one).
          minItems: 1
          items:
            $ref: "#/components/schemas/ReplenishmentCreateProduct"
        invoice:
          $ref: "#/components/schemas/ReplenishmentCreateInvoice"
    ReplenishmentUpdateProduct:
      type: object
      description: A line to set on the replenishment.
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: SKU of an existing line to change, or of a new line to add.
          example: SKU-RED-M
        quantity:
          type: integer
          description: New announced quantity for the line.
          example: 120
        unit_value:
          type:
            - number
            - string
          description: Optional declared unit cost (same rules as on create). Omit to keep the stored value.
          example: "12.50"
    ReplenishmentUpdateRequest:
      type: object
      properties:
        notes:
          type: string
          description: New notes. Omitted or empty keeps the current notes.
          example: Arrives on two pallets
        products:
          type: array
          description: Lines to change or add. Lines not listed are left untouched.
          items:
            $ref: "#/components/schemas/ReplenishmentUpdateProduct"
    ReplenishmentUpdateError:
      type: object
      description: Business error envelope of the update endpoint.
      properties:
        error:
          type: string
          description: Human-readable message.
          example: replenishment 55001 is sell_ahead and cannot be updated
        code:
          type: string
          description: >-
            Machine-readable code, or an empty string when the error has none. Known codes include
            `br_warehouse_not_supported`, `reschedule_required`, `UNIT_VALUE_INVALID_FORMAT`,
            `UNIT_VALUE_OUT_OF_RANGE`, `UNIT_VALUE_NOT_POSITIVE`.
          example: ""
        context:
          type:
            - object
            - "null"
          description: >-
            Extra data for the code (for `reschedule_required`, `replenishment_id` and
            `inbound_appointment_id`).
          example: null
    ReplenishmentAlreadyExistsError:
      type: object
      description: >-
        Returned by create when `unique_external_reference` is `true` and the reference is already in use in
        the store.
      properties:
        error:
          type: string
          description: Human-readable message.
          example: replenishment with external_reference PO-0001 already exists with id 55001
        code:
          type: string
          description: Always `REPLENISHMENT_ALREADY_EXISTS`.
          example: REPLENISHMENT_ALREADY_EXISTS
        context:
          type: object
          properties:
            replenishment_id:
              type: integer
              description: Id of the existing replenishment holding the reference.
              example: 55001
    ReplenishmentCodedError:
      type: object
      description: Error envelope with an optional machine-readable code.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable message.
          example: replenishment 55001 is not eligible for an external invoice
        code:
          type: string
          description: Machine-readable code, present only for coded business errors.
          example: REPLENISHMENT_NOT_ELIGIBLE_FOR_INVOICE
    ReplenishmentInvoice:
      type: object
      description: An NF-e authorized through the invoicing provider Cubbo integrates for your store.
      required:
        - key
        - identifier
        - purpose
        - operation_type
        - operation_nature
      properties:
        key:
          type: string
          description: 44-digit NF-e access key (digits only).
          pattern: ^[0-9]{44}$
          example: "00000000000000000000000000000000000000000000"
        identifier:
          type: string
          description: >-
            Your identifier for the document (typically the NF-e number). Must not be in use by another active
            invoice.
          example: "123456"
        purpose:
          type: string
          description: What the document covers.
          enum:
            - REPLENISHMENT_INVOICE
            - REPLENISHMENT_ADJUSTMENT_INVOICE
          example: REPLENISHMENT_INVOICE
        operation_type:
          type: string
          description: Direction of the operation as printed on the NF-e (`ENTRADA` = incoming, `SAIDA` = outgoing).
          enum:
            - SAIDA
            - ENTRADA
          example: ENTRADA
        operation_nature:
          type: string
          description: Nature of the operation (natureza da operação) printed on the NF-e.
          example: Remessa para armazenagem
    ReplenishmentAttachInvoiceRequest:
      type: object
      required:
        - invoices
      properties:
        invoice_type:
          type: string
          description: Invoicing provider that authorized the document. Only `WEBMANIA` is accepted today.
          enum:
            - WEBMANIA
          default: WEBMANIA
          example: WEBMANIA
        invoices:
          type: array
          description: Exactly one invoice.
          minItems: 1
          maxItems: 1
          items:
            $ref: "#/components/schemas/ReplenishmentInvoice"
    ReplenishmentAttachInvoiceResponse:
      type: object
      properties:
        new_invoice_ids:
          type: array
          description: Ids of the invoices created; empty when the key was already registered.
          items:
            type: integer
          example:
            - 8801
        update_invoice_ids:
          type: string
          description: >-
            Present only when the key was already registered; comma-separated list of the existing keys that
            were re-synchronized.
          example: "00000000000000000000000000000000000000000000"
    ReplenishmentExternalInvoiceRequest:
      type: object
      required:
        - replenishment_id
        - invoice_xml
        - access_key
        - invoice_number
      properties:
        replenishment_id:
          type: integer
          description: Replenishment to attach the NF-e to.
          example: 55001
        invoice_xml:
          type: string
          description: Complete authorized NF-e XML (`nfeProc`), raw or base64-encoded. Must not be blank.
          example: <?xml version="1.0" encoding="UTF-8"?><nfeProc ...>...</nfeProc>
        access_key:
          type: string
          description: 44-digit NF-e access key; must match the key inside the XML.
          pattern: ^[0-9]{44}$
          example: "00000000000000000000000000000000000000000000"
        invoice_number:
          type: string
          description: NF-e number. Must not be blank.
          example: "123"
        message:
          type: string
          description: Optional note stored with the invoice.
          example: NF-e issued by our ERP
        invoice_type:
          type: string
          description: Source of the document. Only `IOTA` is accepted today.
          enum:
            - IOTA
          default: IOTA
          example: IOTA
    ReplenishmentExternalInvoiceResponse:
      type: object
      properties:
        invoice_id:
          type: integer
          description: Id of the invoice in Cubbo.
          example: 8802
        key:
          type: string
          description: NF-e access key.
          example: "00000000000000000000000000000000000000000000"
        status:
          type: string
          description: Invoice status; `APPROVED` for an imported NF-e.
          example: APPROVED
    ReplenishmentExternalInvoiceAccepted:
      type: object
      properties:
        message:
          type: string
          description: Explanation of the deferred processing.
          example: Accepted, another invoice attach for this replenishment is still processing.
        transaction_id:
          type: string
          description: Identifier of the attach still in progress.
          example: a1b2c3d4
    ReplenishmentInvoiceIssuingErrorRequest:
      type: object
      properties:
        invoice_issuing_error:
          type:
            - string
            - "null"
          description: Reason the NF-e could not be issued. Omit or send `null` to clear the recorded error.
          example: "SEFAZ rejected the NF-e: recipient CNPJ not registered"
    ReplenishmentVarianceReportRow:
      type: object
      description: Expected versus received quantity for one declared lot.
      properties:
        product_id:
          type: integer
          description: Cubbo product id.
          example: 9002
        expected_quantity:
          type: integer
          description: Units announced for this lot.
          example: 24
        box_sku:
          type: string
          description: SKU the lot was declared under.
          example: SKU-BOX-BLUE
        received_quantity:
          type: integer
          description: Units received for the lot; `0` when the lot was never matched.
          example: 20
        lot_id:
          type:
            - integer
            - "null"
          description: Id of the received lot in Cubbo; `null` when no received lot matched the declaration.
          example: 4102
        variance:
          type: integer
          description: "`received_quantity - expected_quantity`."
          example: -4
    ReplenishmentVarianceReport:
      type: array
      description: One row per declared lot.
      items:
        $ref: "#/components/schemas/ReplenishmentVarianceReportRow"
    ReturnStatus:
      type: string
      description: >
        Lifecycle status of a return.

        - `PENDING`: created and waiting for a decision (review of a customer request, or decision on an order
        returned by the carrier).

        - `REQUESTED`: resolved; the customer has the return instructions and the goods are expected back.

        - `ORDERED`: resolved by creating a new (replacement or resend) order.

        - `CANCELLED`: cancelled before the goods came back; reserved stock was released.

        - `ARRIVED_AT_WAREHOUSE`: the package arrived at the warehouse and is waiting to be processed.

        - `AWAITING_INSPECTION`: the package was opened and is waiting for inspection of its contents.

        - `RECEIVED`: the goods were checked in and are being re-entered into inventory.

        - `REENTERED`: the goods were fully re-entered into inventory; the return is complete.

        - `UNSUCCESSFUL`: closed without receiving anything; every expected product was missing on reception.
      enum:
        - PENDING
        - REQUESTED
        - ORDERED
        - CANCELLED
        - ARRIVED_AT_WAREHOUSE
        - AWAITING_INSPECTION
        - RECEIVED
        - REENTERED
        - UNSUCCESSFUL
      example: PENDING
    ReturnType:
      type: string
      description: >
        What kind of return this is.

        - `TO_BE_DETERMINED`: requested by the customer or by you, not yet reviewed; the outcome (simple
        return, exchange, rejection) is decided later.

        - `SIMPLE_RETURN`: the customer sends the goods back; no replacement is shipped.

        - `EXCHANGE`: the customer sends the goods back and replacement items (`exchange_products`) are
        reserved to ship once the return arrives.

        - `IMMEDIATE_EXCHANGE`: replacement items ship right away, before the return arrives (created from the
        Cubbo app, not through this API).

        - `RETURNED_BY_CARRIER`: the carrier could not deliver the order and brought it back; decide it with
        `POST /returns/{return_id}/decision`.

        - `UNIDENTIFIED`: a package arrived at the warehouse that could not be matched to an order (created by
        warehouse staff).
      enum:
        - TO_BE_DETERMINED
        - SIMPLE_RETURN
        - EXCHANGE
        - IMMEDIATE_EXCHANGE
        - RETURNED_BY_CARRIER
        - UNIDENTIFIED
      example: TO_BE_DETERMINED
    ReturnProduct:
      type: object
      description: A product and quantity declared on a return (expected back, or to be shipped as a replacement).
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          description: Cubbo id of the product.
          example: 5551
        quantity:
          type: integer
          description: Number of units.
          example: 1
        skus:
          type: array
          description: >-
            SKUs of the product in your store. Present on the returns endpoints; absent when the return is
            embedded in an order.
          items:
            type: string
          example:
            - SKU-RED-M
    ReturnLine:
      type: object
      description: >-
        A product of the original order that can be received as part of the return (kits are expanded into
        their components; non-scannable and dropshipping products are omitted).
      required:
        - product_id
        - name
        - barcode
        - quantity
        - skus
        - image_url
      properties:
        product_id:
          type: integer
          description: Cubbo id of the product.
          example: 5551
        name:
          type: string
          description: Product name.
          example: Red T-shirt M
        barcode:
          type:
            - string
            - "null"
          description: Product barcode (UPC/EAN).
          example: "7501234567890"
        quantity:
          type: integer
          description: Quantity of this product on the original order.
          example: 1
        skus:
          type: array
          description: SKUs of the product in your store.
          items:
            type: string
          example:
            - SKU-RED-M
        image_url:
          type:
            - string
            - "null"
          description: Relative path of the product image, or null when the product has none.
          example: /rails/active_storage/blobs/redirect/abc123/red-tshirt.png
        unit_codes:
          type: array
          description: >-
            Unit codes (IMEI / serial numbers) that shipped on the original order. Only present for products
            tracked by unit code.
          items:
            type: string
          example:
            - IMEI-000000000000001
    Return:
      type: object
      description: |
        A return of an order. This is the full client-facing shape; each endpoint returns a subset of
        these fields (see each response). When embedded in an order (`return` on an `Order`), only
        `id`, `status`, `notes`, `return_type`, `created_at` and `expected_products` (without `skus`)
        are present.
      properties:
        id:
          type: integer
          description: Unique id of the return.
          example: 98765
        status:
          $ref: "#/components/schemas/ReturnStatus"
        return_type:
          $ref: "#/components/schemas/ReturnType"
        notes:
          type:
            - string
            - "null"
          description: Reason or comments given when the return was requested.
          example: Customer changed their mind
        resolved_at:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            When the return was resolved (resolved into a type, cancelled, or turned into an order); null
            while pending.
          example: "2026-10-12T16:00:00.000Z"
        created_at:
          type: string
          format: date-time
          description: When the return was created.
          example: "2026-10-12T15:04:05.123Z"
        updated_at:
          type: string
          format: date-time
          description: When the return was last updated.
          example: "2026-10-12T16:00:00.000Z"
        expected_products:
          type:
            - array
            - "null"
          description: Products and quantities declared as coming back.
          items:
            $ref: "#/components/schemas/ReturnProduct"
        exchange_products:
          type:
            - array
            - "null"
          description: Replacement products to ship once the return arrives. Only present for `EXCHANGE` returns.
          items:
            $ref: "#/components/schemas/ReturnProduct"
        externally_requested:
          type: boolean
          description: >-
            True when the return was requested through the API or the customer-facing returns page rather than
            created by Cubbo staff.
          example: true
        returned_order_id:
          type:
            - integer
            - "null"
          description: Id of the order being returned.
          example: 445566
        created_order_id:
          type:
            - integer
            - "null"
          description: Id of the order created from this return (replacement or resend), if any.
          example: null
        replenishment_id:
          type:
            - integer
            - "null"
          description: Id of the stock re-entry created when the goods were received, if any.
          example: null
        reserved_stock_units_count:
          type: integer
          description: >-
            Number of inventory units reserved for this return (replacement items or units of an order
            returned by the carrier).
          example: 0
        return_products:
          type: array
          description: Products of the original order that can be received as part of this return.
          items:
            $ref: "#/components/schemas/ReturnLine"
        rma_file:
          type:
            - object
            - "null"
          description: The return instructions document (RMA) generated when the return was resolved, if any.
          properties:
            path:
              type: string
              description: Relative download path of the PDF.
              example: /rails/active_storage/blobs/redirect/def456/rma_ORD-0001.pdf
            filename:
              type: string
              description: File name.
              example: rma_ORD-0001.pdf
            byte_size:
              type: integer
              description: Size in bytes.
              example: 48213
            content_type:
              type: string
              description: MIME type; always `application/pdf`.
              example: application/pdf
        can_attach_invoice:
          type: boolean
          description: >-
            Brazil only. True when the store issues its own NF-e, the order ships from a Brazil warehouse and
            the return has no invoice yet.
          example: false
    ReturnCreated:
      type: object
      description: Response of `POST /returns`.
      required:
        - id
        - status
        - return_type
        - notes
        - externally_requested
        - expected_products
        - created_at
        - order_number
      properties:
        id:
          type: integer
          description: Unique id of the return. Use it with the other returns endpoints.
          example: 98765
        status:
          $ref: "#/components/schemas/ReturnStatus"
        return_type:
          $ref: "#/components/schemas/ReturnType"
        notes:
          type: string
          description: The notes you sent.
          example: Customer changed their mind
        externally_requested:
          type: boolean
          description: Always true for returns created through the API.
          example: true
        expected_products:
          type: array
          description: Resolved products and quantities coming back, with their SKUs.
          items:
            $ref: "#/components/schemas/ReturnProduct"
        exchange_products:
          type: array
          description: Replacement products with their SKUs. Only present for `EXCHANGE` returns.
          items:
            $ref: "#/components/schemas/ReturnProduct"
        created_at:
          type: string
          format: date-time
          description: When the return was created.
          example: "2026-10-12T15:04:05.123Z"
        order_number:
          type: string
          description: The order number you sent.
          example: ORD-0001
    ReturnDetail:
      type: object
      description: Response of `GET /returns/{return_id}`.
      required:
        - id
        - status
        - return_type
        - resolved_at
        - notes
        - expected_products
        - return_products
        - returned_order_id
        - returned_order_number
        - created_at
      properties:
        id:
          type: integer
          description: Unique id of the return.
          example: 98765
        status:
          $ref: "#/components/schemas/ReturnStatus"
        return_type:
          $ref: "#/components/schemas/ReturnType"
        resolved_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the return was resolved; null while pending.
          example: null
        notes:
          type:
            - string
            - "null"
          description: Reason or comments given when the return was requested.
          example: Customer changed their mind
        expected_products:
          type:
            - array
            - "null"
          description: Products and quantities declared as coming back, with their SKUs.
          items:
            $ref: "#/components/schemas/ReturnProduct"
        return_products:
          type: array
          description: Products of the original order that can be received as part of this return.
          items:
            $ref: "#/components/schemas/ReturnLine"
        returned_order_id:
          type:
            - integer
            - "null"
          description: Id of the order being returned.
          example: 445566
        returned_order_number:
          type:
            - string
            - "null"
          description: Order number of the order being returned.
          example: ORD-0001
        created_at:
          type: string
          format: date-time
          description: When the return was created.
          example: "2026-10-12T15:04:05.123Z"
    ReturnCancelled:
      type: object
      description: Response of `PATCH /returns/{return_id}/cancel`.
      required:
        - id
        - status
        - return_type
        - resolved_at
        - created_at
      properties:
        id:
          type: integer
          description: Unique id of the return.
          example: 98765
        status:
          $ref: "#/components/schemas/ReturnStatus"
        return_type:
          $ref: "#/components/schemas/ReturnType"
        resolved_at:
          type: string
          format: date-time
          description: When the return was cancelled.
          example: "2026-10-12T16:00:00.000Z"
        created_at:
          type: string
          format: date-time
          description: When the return was created.
          example: "2026-10-12T15:04:05.123Z"
    ReturnCreateRequest:
      type: object
      required:
        - store_id
        - order_number
        - notes
      properties:
        store_id:
          type: integer
          description: Id of the store that owns the order.
          example: 1234
        order_number:
          type: string
          description: Order number of the shipped order to return.
          example: ORD-0001
        notes:
          type: string
          description: >-
            Reason for the return or any comment to keep with it. Shown on the return instructions sent to the
            customer when the return is resolved.
          example: Customer changed their mind
        products:
          type: array
          description: >-
            Items coming back, by SKU. Omit or send an empty array for a full return of every ordered item at
            its full quantity. Repeated SKUs are summed. Each SKU must be on the order, map to a single
            product and not be a kit; the quantity cannot exceed the ordered quantity.
          items:
            $ref: "#/components/schemas/ReturnRequestItem"
        return_type:
          type: string
          description: >-
            Outcome of the return. `TO_BE_DETERMINED` (default) creates a pending request to be reviewed
            later. `SIMPLE_RETURN` and `EXCHANGE` resolve the return immediately (order moves to `returning`,
            return instructions are emailed to the customer).
          enum:
            - TO_BE_DETERMINED
            - SIMPLE_RETURN
            - EXCHANGE
          default: TO_BE_DETERMINED
          example: TO_BE_DETERMINED
        generate_guide:
          type: boolean
          description: >-
            Required when `return_type` is `SIMPLE_RETURN` or `EXCHANGE`; ignored otherwise. `true` books a
            prepaid return shipping label with the carrier and attaches it to the return instructions; `false`
            resolves the return without a label.
          example: true
        exchange_products:
          type: array
          description: >-
            Required when `return_type` is `EXCHANGE`; ignored otherwise. Replacement items to ship once the
            return arrives, by SKU of your store catalog (kits not allowed). Their stock is reserved
            immediately.
          items:
            $ref: "#/components/schemas/ReturnRequestItem"
    ReturnRequestItem:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: SKU of the product.
          example: SKU-RED-M
        quantity:
          type: integer
          minimum: 1
          description: Number of units.
          example: 1
    ReturnDecisionRequest:
      type: object
      required:
        - decision
      properties:
        decision:
          type: string
          description: >-
            `resend` creates a new order from the returned one and ships it again; `cancel_forward` cancels
            the return and releases its reserved stock.
          enum:
            - resend
            - cancel_forward
          example: resend
    ReturnDecisionResendResult:
      type: object
      required:
        - decision
        - return_id
        - return_status
        - created_order
      properties:
        decision:
          type: string
          description: The applied decision.
          enum:
            - resend
          example: resend
        return_id:
          type: integer
          description: Id of the decided return.
          example: 98765
        return_status:
          $ref: "#/components/schemas/ReturnStatus"
        created_order:
          type: object
          description: The new order created from the returned one. Fetch it with the orders endpoints for full details.
          required:
            - id
            - order_number
            - status
          properties:
            id:
              type: integer
              description: Id of the new order.
              example: 445577
            order_number:
              type: string
              description: >-
                Order number of the new order; derived from the original order number with a return-by-carrier
                suffix.
              example: ORD-0001_RC
            status:
              type: string
              description: Initial status of the new order.
              example: pending
    ReturnDecisionCancelForwardResult:
      type: object
      required:
        - decision
        - return_id
        - return_status
      properties:
        decision:
          type: string
          description: The applied decision.
          enum:
            - cancel_forward
          example: cancel_forward
        return_id:
          type: integer
          description: Id of the decided return.
          example: 98765
        return_status:
          $ref: "#/components/schemas/ReturnStatus"
    ReturnAwaitingInvoice:
      type: object
      description: A return that is waiting for its inbound NF-e.
      required:
        - id
        - return_type
        - replenishment_id
        - related_sale_invoice
        - returned_order
      properties:
        id:
          type: integer
          description: Id of the return; use it with `POST /returns/{return_id}/attach-invoice`.
          example: 98765
        return_type:
          $ref: "#/components/schemas/ReturnType"
        replenishment_id:
          type: integer
          description: >-
            Id of the stock re-entry (replenishment) created on reception; the `REPLENISHMENT_INVOICE` you
            attach is linked to it.
          example: 77001
        related_sale_invoice:
          type:
            - object
            - "null"
          description: The approved sale (or donation) NF-e of the original order, to reference on the inbound invoice.
          properties:
            invoice_key:
              type: string
              description: 44-digit NF-e access key of the sale invoice.
              example: "00000000000000000000000000000000000000000000"
        returned_order:
          type:
            - object
            - "null"
          description: Summary of the order being returned.
          properties:
            id:
              type: integer
              description: Id of the order.
              example: 445566
            channel_order_id:
              type:
                - string
                - "null"
              description: Id of the order in the sales channel it came from.
              example: "1000123"
            order_number:
              type: string
              description: Order number.
              example: ORD-0001
            integration_details:
              type: object
              description: Sales-channel details.
              properties:
                marketplace:
                  type:
                    - string
                    - "null"
                  description: Marketplace the order was placed on, when the channel reports it.
                  example: MERCADOLIBRE
    ReturnAttachInvoiceRequest:
      type: object
      required:
        - invoices
      properties:
        invoice_type:
          type: string
          description: Fiscal provider the invoice was issued through. Only `WEBMANIA` is accepted today.
          enum:
            - WEBMANIA
          default: WEBMANIA
          example: WEBMANIA
        invoices:
          type: array
          description: Invoices to link to the return. Keys and identifiers must be unique within the request.
          minItems: 1
          items:
            type: object
            required:
              - key
              - identifier
              - purpose
              - operation_type
              - operation_nature
              - total_value
            properties:
              key:
                type: string
                description: 44-digit NF-e access key (digits only).
                pattern: ^[0-9]{44}$
                example: "00000000000000000000000000000000000000000000"
              identifier:
                type: string
                description: >-
                  Your unique identifier for this invoice. Must not be in use by another non-cancelled
                  invoice.
                example: RET-98765-M
              purpose:
                type: string
                description: >-
                  `RETURN_INVOICE` links the invoice to the return; `REPLENISHMENT_INVOICE` links it to the
                  return's stock re-entry.
                enum:
                  - RETURN_INVOICE
                  - REPLENISHMENT_INVOICE
                example: RETURN_INVOICE
              operation_type:
                type: string
                description: NF-e operation type; inbound only.
                enum:
                  - ENTRADA
                example: ENTRADA
              operation_nature:
                type: string
                description: Nature of the operation (*natureza da operação*) as printed on the NF-e.
                example: Retorno de mercadoria nao entregue
              total_value:
                type: string
                description: Total value of the invoice, as a decimal string.
                example: "116.56"
    ReturnAttachInvoiceResult:
      type: object
      required:
        - new_invoice_ids
      properties:
        new_invoice_ids:
          type: array
          description: Ids of the invoices created by this call; empty when every key was already registered.
          items:
            type: integer
          example:
            - 880001
        update_invoice_ids:
          type: string
          description: >-
            Only present when nothing was created. Comma-separated access keys of the already-registered
            invoices that were re-synced.
          example: "00000000000000000000000000000000000000000000"
    ReturnAttachExternalInvoiceRequest:
      type: object
      required:
        - return_id
        - invoice_xml
        - access_key
        - invoice_number
      properties:
        return_id:
          type: integer
          description: Id of the return the NF-e belongs to.
          example: 98765
        invoice_xml:
          type: string
          description: Authorized NF-e XML (`nfeProc`), raw or base64-encoded (a `data:` URI prefix is accepted).
          example: PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPG5mZVByb2MgLi4uPg==
        access_key:
          type: string
          description: 44-digit NF-e access key; must match the key embedded in `invoice_xml`.
          pattern: ^[0-9]{44}$
          example: "00000000000000000000000000000000000000000000"
        invoice_number:
          type: string
          description: Invoice number (*número da NF-e*).
          example: "123"
        message:
          type: string
          description: Optional free-text note stored with the invoice.
          example: Return NF-e for order ORD-0001
        invoice_type:
          type: string
          description: Provider that relayed the NF-e. Only `IOTA` is accepted.
          enum:
            - IOTA
          default: IOTA
          example: IOTA
    ReturnExternalInvoiceResult:
      type: object
      required:
        - invoice_id
        - key
        - status
      properties:
        invoice_id:
          type: integer
          description: Id of the stored invoice.
          example: 880002
        key:
          type: string
          description: NF-e access key.
          example: "00000000000000000000000000000000000000000000"
        status:
          type: string
          description: Invoice status; `APPROVED` for an authorized NF-e.
          example: APPROVED
    ReturnError:
      type: object
      description: Error body of the create, cancel and decision endpoints, with a machine-readable `code`.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable message.
          example: order already has an active return
        code:
          type:
            - string
            - "null"
          description: Stable error code; null for parameter validation errors.
          example: RETURN_ALREADY_EXISTS
        context:
          type:
            - object
            - "null"
          description: Extra details, when available (for example the offending `sku`). Only sent by `POST /returns`.
          example:
            sku: SKU-RED-M
    SandboxError:
      type: object
      description: Error body of the sandbox endpoints.
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - code
          properties:
            message:
              type: string
              description: Human-readable description of the failure.
            code:
              type: string
              description: Stable error code to branch on.
              enum:
                - SANDBOX_DISABLED
                - NOT_A_TEST_STORE
                - NOT_FOUND
                - SANDBOX_NOT_CONFIGURED
                - INVALID_PARAMETER
                - CONCURRENT_REQUEST
                - UNEXPECTED_ERROR
                - INVALID_REPLENISHMENT_STATUS
                - RECEIVING_ALREADY_STARTED
                - RECEPTION_UNAVAILABLE
                - RETURN_REPLENISHMENT_NOT_SUPPORTED
                - SELL_AHEAD_NOT_SUPPORTED
                - EMPTY_REPLENISHMENT
                - PRODUCT_WITHOUT_SKU
                - REPLENISHMENT_NOT_COMPLETABLE
                - ORDER_NOT_FROM_API
                - ORDER_TYPE_NOT_SUPPORTED
                - ORDER_WITHOUT_SHIPPING_METHOD
                - ORDER_WITHOUT_STOCK
                - INVALID_ORDER_STATUS
                - INVALID_TRACKING_STATUS
                - INVALID_INCIDENT_DESCRIPTION
                - ORDER_NOT_SHIPPED_BY_SANDBOX
                - ORDER_ALREADY_DELIVERED
                - SAME_TRACKING_STATUS
    SandboxReplenishment:
      type: object
      properties:
        id:
          type: integer
          description: Replenishment ID.
        store_id:
          type: integer
        status:
          type: string
          description: Always `COMPLETED` on success.
          example: COMPLETED
        completed_at:
          type: string
          format: date-time
          description: When the replenishment was completed (UTC).
    SandboxOrderShipment:
      type: object
      properties:
        id:
          type: integer
          description: Cubbo order ID.
        order_number:
          type: string
        store_id:
          type: integer
        status:
          type: string
          description: Order status. `shipped` after a sandbox shipment.
          example: shipped
        shipping_status:
          type:
            - string
            - "null"
          description: Tracking status of the shipment. `null` until the first tracking event.
          enum:
            - null
            - shipment_collected
            - shipment_in_transit
            - shipment_out_for_delivery
            - shipment_with_incident
            - shipment_delivered
        tracking_number:
          type: string
          description: Test tracking number. Always starts with `SANDBOX-`.
        carrier_name:
          type: string
          description: Carrier of the order's shipping method.
    SandboxTrackingRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: The tracking status to simulate.
          enum:
            - shipment_collected
            - shipment_in_transit
            - shipment_out_for_delivery
            - shipment_with_incident
            - shipment_delivered
        incident_description:
          type: string
          description: Reason for the incident. Only with `status` `shipment_with_incident`; optional there.
          enum:
            - not_at_home
            - missing_references
            - refused_payment
            - refused_package
            - client_requested
            - delivery_failed
            - damaged
            - lost
            - stolen
    UnauthorizedError:
      type: object
      description: Body of every 401 response
      properties:
        error:
          type: string
          description: Always `Unauthorized`
          example: Unauthorized
        message:
          type: string
          description: Why the request was refused
          example: invalid token
      required:
        - error
        - message
    AuthTokenRequest:
      type: object
      required:
        - client_id
        - client_secret
      properties:
        client_id:
          type: string
          description: Identifier of your API credential
          example: 0f1e2d3c-0000-4000-8000-000000001234
        client_secret:
          type: string
          description: Secret of your API credential
          example: <your-client-secret>
        expires_in:
          type: integer
          description: Token lifetime in seconds
          minimum: 10
          maximum: 86400
          default: 86400
          example: 86400
        grant_type:
          type: string
          description: OAuth grant type; only `client_credentials` is supported
          enum:
            - client_credentials
          default: client_credentials
          example: client_credentials
    AuthTokenResponse:
      type: object
      required:
        - token
        - expires_in
        - type
      properties:
        token:
          type: string
          description: Bearer token to send in the `Authorization` header
          example: <jwt-access-token>
        expires_in:
          type: integer
          description: Lifetime of the token in seconds, as requested
          example: 86400
        type:
          type: string
          description: Token type; always `Bearer`
          example: Bearer
    Store:
      type: object
      description: A store's identity and fiscal fields, as returned by the store-scoped endpoints
      properties:
        id:
          type: integer
          description: Store id
          example: 4821
        name:
          type: string
          description: Store name
          example: Partner Store SP
        description:
          type:
            - string
            - "null"
          description: Free-text description
          example: Store provisioned via API
        created_at:
          type: string
          format: date-time
          description: Creation time
          example: "2026-09-03T14:02:11.000Z"
        updated_at:
          type: string
          format: date-time
          description: Last update time
          example: "2026-09-03T14:05:47.000Z"
        tax_id:
          type:
            - string
            - "null"
          description: Store tax id (CNPJ in Brazil, digits only; RFC in Mexico)
          example: "00000000000191"
        invoice_customization:
          type:
            - object
            - "null"
          description: Advanced NF-e customization keyed by invoice purpose (Brazil)
          additionalProperties:
            type: object
          example: {}
        state:
          type:
            - string
            - "null"
          description: State of the store's fiscal address (two-letter UF code in Brazil)
          example: SP
        tax_regime:
          type:
            - string
            - "null"
          description: Brazilian tax regime
          enum:
            - SIMPLES_NACIONAL
            - LUCRO_REAL
            - LUCRO_PRESUMIDO
            - null
          example: SIMPLES_NACIONAL
        tax_company_name:
          type:
            - string
            - "null"
          description: Legal company name
          example: Partner Store SP LTDA
        tax_address:
          type:
            - string
            - "null"
          description: Fiscal address street
          example: Av. Paulista
        tax_address_number:
          type:
            - string
            - "null"
          description: Fiscal address number
          example: "1000"
        tax_address_neighborhood:
          type:
            - string
            - "null"
          description: Fiscal address neighborhood
          example: Bela Vista
        tax_city:
          type:
            - string
            - "null"
          description: Fiscal address city
          example: Sao Paulo
        tax_zipcode:
          type:
            - string
            - "null"
          description: Fiscal address postal code
          example: 01310-100
        tax_state_phone:
          type:
            - string
            - "null"
          description: Phone registered with the state registration
          example: +55 11 0000-0000
        tax_state_registration:
          type:
            - string
            - "null"
          description: State registration number (Inscricao Estadual)
          example: "123456789"
        store_type:
          type: string
          description: Service model of the store
          enum:
            - ALL_SERVICES
            - PICK_AND_SHIP
            - DEMO_ALL_SERVICES
          example: ALL_SERVICES
    StoreCreated:
      description: |
        Response of `POST /stores`: the full store record (the fields of `Store` plus the
        store's configuration flags, its `account` and its `warehouses`) and, only when an Open
        API integration was created, the `open_api_integration` credentials.
      allOf:
        - $ref: "#/components/schemas/Store"
        - type: object
          properties:
            b2b:
              type: boolean
              description: Whether the store operates business-to-business
              example: false
            d2c:
              type: boolean
              description: Whether the store operates direct-to-consumer
              example: true
            skip_product_lot_in_returns:
              type:
                - boolean
                - "null"
              description: Store configuration flag
              example: null
            receive_only_complete_returns:
              type:
                - boolean
                - "null"
              description: Store configuration flag
              example: null
            return_inspection_enabled:
              type:
                - boolean
                - "null"
              description: Store configuration flag
              example: null
            requires_stock_only_from_confirmed_replenishments:
              type: boolean
              description: Store configuration flag
              example: false
            has_store_branches:
              type: boolean
              description: Store configuration flag
              example: false
            is_oxxo_store:
              type: boolean
              description: Store configuration flag
              example: false
            enable_replenishment_invoices:
              type:
                - boolean
                - "null"
              description: Store configuration flag
              example: null
            enable_removal_order_invoices:
              type:
                - boolean
                - "null"
              description: Store configuration flag
              example: null
            enable_manual_client_invoice:
              type: boolean
              description: Store configuration flag
              example: false
            enable_b2b_cnpj_client_invoice:
              type: boolean
              description: Store configuration flag
              example: false
            account:
              type: object
              description: The account the store belongs to (id, name, account type, and the account's stores)
              additionalProperties: true
              example:
                id: 900
                name: Partner Ltd
                account_type: COMPANY
            warehouses:
              type: array
              description: Warehouses assigned to the new store
              items:
                type: object
                additionalProperties: true
              example:
                - id: 232
                  name: CD Sao Paulo
                  unique_code: SP1
            open_api_integration:
              $ref: "#/components/schemas/OpenApiIntegrationCredentials"
    OpenApiIntegrationCredentials:
      type: object
      description: >-
        Credentials of the new store's Open API integration. Present only when `source_shipping_group_ids` was
        sent. Secrets are shown once.
      required:
        - client_id
        - client_secret
        - webhook_consumer_url
        - webhook_feeds
        - webhook_consumer_secret
        - webhook_consumer_secret_reason
      properties:
        client_id:
          type: string
          description: Credential id to use with `POST /auth/token` to act as the new store
          example: b6e3a1f0-1234-4c9a-9a11-000000000001
        client_secret:
          type: string
          description: Credential secret, returned only in this response. Grants access to every store of the account.
          example: <client-secret-shown-once>
        webhook_consumer_url:
          type:
            - string
            - "null"
          description: URL that will receive the store's webhooks, or null when none was sent
          example: https://example.com/cubbo/webhooks
        webhook_feeds:
          type: array
          description: Feeds that will be delivered to `webhook_consumer_url`; empty when no URL was sent
          items:
            type: string
            enum:
              - order_status
              - inventory_movement
              - replenishment_status
          example:
            - order_status
            - inventory_movement
            - replenishment_status
        webhook_consumer_secret:
          type:
            - string
            - "null"
          description: >-
            Secret used to sign the webhooks, returned only in this response. Null whenever
            `webhook_consumer_secret_reason` is set.
          example: <webhook-secret-shown-once>
        webhook_consumer_secret_reason:
          type:
            - string
            - "null"
          description: |
            Why no secret was returned. `no_webhook_url`: no `webhook_consumer_url` was sent.
            `reused_from_source_store`: the new store signs with the same secret the source store
            already uses for this URL. `managed_by_warehouse`: webhook signing for this store is
            managed by Cubbo; contact your Cubbo representative. Null when a secret is returned.
          enum:
            - no_webhook_url
            - reused_from_source_store
            - managed_by_warehouse
            - null
          example: null
    StoreCreateRequest:
      type: object
      required:
        - name
        - source_store_id
        - created_by_email
      properties:
        name:
          type: string
          description: Name of the new store
          example: Partner Store SP
        source_store_id:
          type: integer
          description: >-
            Id of an existing store used as template. The new store is created in the same account. Your
            credential must have access to it.
          example: 1234
        created_by_email:
          type: string
          format: email
          description: >-
            Email of an existing user of the source store's account, recorded as the creator. The user is not
            created by this call.
          example: integrations@example.com
        store_type:
          type: string
          description: Service model of the new store. Defaults to the source store's type.
          enum:
            - ALL_SERVICES
            - PICK_AND_SHIP
            - DEMO_ALL_SERVICES
          example: ALL_SERVICES
        warehouse_id:
          type: integer
          description: >-
            Warehouse for the new store. Must already be assigned to the source store. Defaults to the source
            store's first warehouse.
          example: 232
        description:
          type:
            - string
            - "null"
          description: Free-text description
          default: null
          example: Store provisioned via API
        source_shipping_group_ids:
          type: array
          description: >-
            Ids of the source store's shipping groups to copy. Replaces the country defaults and creates the
            new store's Open API integration.
          items:
            type: integer
          example:
            - 101
            - 102
        default_shipping_group_id:
          type: integer
          description: >-
            Which of `source_shipping_group_ids` becomes the default group. Required with
            `source_shipping_group_ids`; must not be an international-only group.
          example: 101
        webhook_consumer_url:
          type: string
          format: uri
          description: >-
            HTTPS URL that will receive the new store's webhooks. Only with `source_shipping_group_ids`. Must
            use https and a domain name (no raw IP).
          example: https://example.com/cubbo/webhooks
        webhook_feeds:
          type: array
          description: >-
            Feeds to deliver to `webhook_consumer_url`. Requires `webhook_consumer_url`. Omitted means all
            three.
          items:
            type: string
            enum:
              - order_status
              - inventory_movement
              - replenishment_status
          example:
            - order_status
    StoreUpdateRequest:
      type: object
      description: Send only the fields to change. At least one must be present.
      properties:
        name:
          type: string
          description: Store name
          example: Partner Store SP
        description:
          type: string
          description: Free-text description
          example: Store provisioned via API
        tax_id:
          type: string
          description: Store tax id (CNPJ in Brazil)
          example: "00000000000191"
        state:
          type: string
          description: >-
            State of the fiscal address. For stores in Brazil it must be a two-letter UF code;
            case-insensitive.
          example: SP
        tax_regime:
          type: string
          description: Brazilian tax regime; case-insensitive
          enum:
            - SIMPLES_NACIONAL
            - LUCRO_REAL
            - LUCRO_PRESUMIDO
          example: SIMPLES_NACIONAL
        tax_company_name:
          type: string
          description: Legal company name
          example: Partner Store SP LTDA
        tax_address:
          type: string
          description: Fiscal address street
          example: Av. Paulista
        tax_address_number:
          type: string
          description: Fiscal address number
          example: "1000"
        tax_address_neighborhood:
          type: string
          description: Fiscal address neighborhood
          example: Bela Vista
        tax_city:
          type: string
          description: Fiscal address city
          example: Sao Paulo
        tax_zipcode:
          type: string
          description: Fiscal address postal code
          example: 01310-100
        tax_state_registration:
          type: string
          description: State registration number (Inscricao Estadual)
          example: "123456789"
        tax_state_phone:
          type: string
          description: Phone registered with the state registration
          example: +55 11 0000-0000
        invoice_customization:
          type: object
          description: >-
            Advanced NF-e customization keyed by invoice purpose. Replaces the current value. Ask your Cubbo
            representative before using it.
          propertyNames:
            enum:
              - REPLENISHMENT_INVOICE
              - REPLENISHMENT_ADJUSTMENT_INVOICE
              - SYMBOLIC_RETURN_INVOICE
              - SALE_INVOICE
              - DONATION_INVOICE
              - REMOVE_STOCK_INVOICE
              - RETURN_INVOICE
              - DONATION_RETURN_INVOICE
              - SHIPPING
              - SHIPPING_RETURN
          additionalProperties:
            type: object
          example:
            SALE_INVOICE:
              operation_nature: Venda
    FiscalAddress:
      type: object
      description: Fiscal address of the company
      properties:
        zip_code:
          type: string
          description: Postal code (CEP)
          example: 01310-100
        street:
          type: string
          description: Street
          example: Av. Paulista
        number:
          type: string
          description: Number
          example: "1000"
        complement:
          type: string
          description: Address complement
          example: Sala 1
        neighborhood:
          type: string
          description: Neighborhood
          example: Bela Vista
        city:
          type: string
          description: City
          example: Sao Paulo
        state:
          type: string
          description: Two-letter Brazilian UF code; case-insensitive
          example: SP
    FiscalAccountRequest:
      type: object
      required:
        - cnpj
        - legal_name
        - tax_regime
        - address
      properties:
        cnpj:
          type: string
          description: Company CNPJ, with or without punctuation. Stored on the store as digits only.
          example: 00.000.000/0001-91
        legal_name:
          type: string
          description: Legal company name (razao social)
          example: Partner Store SP LTDA
        trade_name:
          type: string
          description: Trade name (nome fantasia)
          example: Partner Store
        state_registration:
          type: string
          description: State registration number (Inscricao Estadual)
          example: "123456789"
        tax_regime:
          type: string
          description: Brazilian tax regime; case-insensitive
          enum:
            - SIMPLES_NACIONAL
            - LUCRO_REAL
            - LUCRO_PRESUMIDO
          example: SIMPLES_NACIONAL
        unit_type:
          type: string
          description: Whether this CNPJ is the head office (`matriz`) or a branch (`filial`)
          enum:
            - matriz
            - filial
          default: matriz
          example: matriz
        email:
          type: string
          format: email
          description: Contact email for the fiscal account
          example: fiscal@example.com
        address:
          $ref: "#/components/schemas/FiscalAddress"
    FiscalAccountResponse:
      type: object
      required:
        - store_id
        - fiscal_account
      properties:
        store_id:
          type: integer
          description: Id of the store the account belongs to
          example: 4821
        fiscal_account:
          type: object
          required:
            - status
            - cnpj
            - legal_name
            - tax_regime
            - mirrored_fields
            - skipped_fields
            - mirror_error
          properties:
            status:
              type: string
              description: "`created` on the first call, `updated` when the account already existed"
              enum:
                - created
                - updated
              example: created
            cnpj:
              type: string
              description: CNPJ as submitted
              example: 00.000.000/0001-91
            legal_name:
              type: string
              description: Legal company name as submitted
              example: Partner Store SP LTDA
            tax_regime:
              type: string
              description: Tax regime, normalized to upper case
              enum:
                - SIMPLES_NACIONAL
                - LUCRO_REAL
                - LUCRO_PRESUMIDO
              example: SIMPLES_NACIONAL
            mirrored_fields:
              type: array
              description: Store fields filled from this request (they were blank before)
              items:
                type: string
              example:
                - tax_id
                - tax_company_name
                - tax_regime
                - tax_address
                - state
            skipped_fields:
              type: array
              description: Store fields that already had a value and were left unchanged
              items:
                type: string
              example: []
            mirror_error:
              type:
                - string
                - "null"
              description: >-
                Null normally. Set when the account was provisioned but the data could not be copied onto the
                store; contact Cubbo support.
              example: null
    DigitalCertificateRequest:
      type: object
      required:
        - certificate_base64
        - certificate_password
        - invoice_series
        - next_invoice_number
      properties:
        certificate_base64:
          type: string
          format: byte
          description: The A1 certificate file (`.pfx`/`.p12`) encoded in Base64
          example: <base64-encoded-pfx-file>
        certificate_password:
          type: string
          description: Export password of the certificate
          example: <certificate-password>
        invoice_series:
          type:
            - integer
            - string
          description: NF-e series, 1 to 999. Digits only; parsed in base 10.
          example: 1
        next_invoice_number:
          type:
            - integer
            - string
          description: Number of the next NF-e the store will issue, 1 to 999999999. Digits only; parsed in base 10.
          example: 4567
    DigitalCertificateResponse:
      type: object
      required:
        - store_id
        - certificate
        - invoice_numbering
      properties:
        store_id:
          type: integer
          description: Id of the store
          example: 4821
        certificate:
          type: object
          required:
            - status
            - days_until_expiration
            - expires_at
            - uploaded_at
          properties:
            status:
              type: string
              description: "`active`, or `expired` when the uploaded certificate is already past its validity"
              enum:
                - active
                - expired
              example: active
            days_until_expiration:
              type:
                - integer
                - "null"
              description: Days until the certificate expires; null if the validity could not be read back
              example: 365
            expires_at:
              type:
                - string
                - "null"
              format: date
              description: Expiration date; null if the validity could not be read back
              example: "2027-09-03"
            uploaded_at:
              type: string
              format: date-time
              description: When the certificate was uploaded
              example: "2026-09-03T14:10:03Z"
        invoice_numbering:
          type: object
          required:
            - series
            - next_number
          properties:
            series:
              type: integer
              description: NF-e series configured
              example: 1
            next_number:
              type: integer
              description: Next NF-e number configured
              example: 4567
    ShippingMethod:
      type: object
      description: A shipping method as exposed to API clients
      required:
        - id
        - carrier_name
        - shipping_type
        - delivery_type
        - country
        - is_cod
      properties:
        id:
          type: integer
          description: Shipping method id
          example: 12
        carrier_name:
          type: string
          description: Customer-facing carrier name
          example: ESTAFETA
        shipping_type:
          type: string
          description: Scope of the method
          enum:
            - national
            - international
            - pickup
          example: national
        delivery_type:
          type: string
          description: Delivery service level
          enum:
            - SameDay
            - NextDay
            - Ground
            - Pickup
            - International
          example: Ground
        country:
          type: string
          description: ISO 3166-1 alpha-2 country of the method
          example: MX
        is_cod:
          type: boolean
          description: Whether this is a dedicated cash-on-delivery method
          example: false
    ShippingCoverage:
      description: >-
        Result of a coverage check. Either the selected shipping method, or `id: null` with a message when
        nothing covers the destination.
      oneOf:
        - $ref: "#/components/schemas/ShippingMethod"
        - type: object
          required:
            - id
            - message
          properties:
            id:
              type: "null"
              description: Always null when no method covers the destination
              example: null
            message:
              type: string
              description: Explanation
              example: no compatible shipping method found.
    EtaRange:
      type: object
      description: Estimated delivery window, in UTC
      required:
        - range_begin
        - range_end
      properties:
        range_begin:
          type: string
          format: date-time
          description: Start of the estimated delivery window
          example: "2026-10-14T06:00:00.000Z"
        range_end:
          type: string
          format: date-time
          description: End of the estimated delivery window
          example: "2026-10-16T05:59:59.999Z"
    ShippingQuote:
      type: object
      description: >-
        One shipping option. Regular carrier options carry the first seven fields; click-and-collect options
        (`is_click_and_collect: true`) add the pickup-point fields.
      required:
        - shipping_method_id
        - carrier_name
        - carrier_delivery
        - quoted_weight_kg
        - delivery_sla_in_hours
        - price
      properties:
        shipping_method_id:
          type: integer
          description: Id of the shipping method to use when creating the order
          example: 12
        carrier_name:
          type: string
          description: Carrier name
          example: ESTAFETA
        carrier_delivery:
          type: string
          description: Delivery service level
          enum:
            - SameDay
            - NextDay
            - Ground
            - Pickup
            - International
          example: Ground
        quoted_weight_kg:
          type: number
          description: Weight the price was computed for (greater of declared and volumetric weight)
          example: 2
        delivery_sla_in_hours:
          type:
            - integer
            - "null"
          description: Total delivery SLA in hours; null for click-and-collect options
          example: 72
        delivery_eta_range:
          description: Estimated delivery window. Omitted when unavailable; null for click-and-collect options.
          oneOf:
            - $ref: "#/components/schemas/EtaRange"
            - type: "null"
        price:
          type:
            - number
            - "null"
          description: Shipping price in the store's currency
          example: 149
        is_click_and_collect:
          type: boolean
          description: Present and true for pickup-point options
          example: true
        service_code:
          type: string
          description: Pickup point identifier to send as `click_and_collect_service_code` when creating the order
          example: CUBBOCNCCUBBOCUBBO001
        location_name:
          type: string
          description: Pickup point name
          example: Punto Cubbo Centro
        distance_km:
          type:
            - number
            - "null"
          description: Distance from the destination zip code in kilometers
          example: 0.8
        pickup_address:
          type: string
          description: Pickup point address
          example: Calle Centro 300, CDMX, 06000
        cnc_pricing_basis:
          type: string
          description: Which input priced the pickup option
          enum:
            - cart_value
            - item_count
          example: cart_value
    PickupPoint:
      type: object
      description: A pickup point eligible for click and collect
      required:
        - carrier
        - service_code
        - name
        - address
        - distance_km
        - schedule
      properties:
        carrier:
          type: string
          description: Pickup carrier
          enum:
            - ESTAFETA
            - DHL
            - CUBBO
            - Punto Post
          example: ESTAFETA
        service_code:
          type: string
          description: Identifier of the point, to send as `service_code` when converting the order
          example: CUBBOCNCESTEST001
        name:
          type: string
          description: Point name
          example: Sucursal Centro
        address:
          type: string
          description: Point address
          example: Av. Reforma 123, CDMX
        distance_km:
          type:
            - number
            - "null"
          description: Distance from the searched postal code in kilometers; null when the carrier does not report it
          example: 1.2
        schedule:
          type:
            - string
            - "null"
          description: Opening hours as reported by the carrier; null when unknown
          example: "Lun a Vie: 10:00-18:00, Sab: 10:00-14:00, Dom: cerrado"
    PickupPointsResponse:
      type: object
      required:
        - cnc_eligible
        - pickup_points
      properties:
        cnc_eligible:
          type: boolean
          description: Whether the order can be converted to click and collect
          example: true
        code:
          type: string
          description: Present only when `cnc_eligible` is false; why the order is not eligible
          enum:
            - CNC_INVALID_ORDER_STATUS
            - CNC_NOT_ENABLED_FOR_STORE
            - CNC_NO_CARRIERS_ENABLED_FOR_STORE
            - CNC_MISSING_POSTAL_CODE
            - CNC_ORIGINAL_NOT_CUBBO_BILLED
            - CNC_ORIGINAL_NOT_NATIONAL_SHIPPING
            - CNC_RATE_CARD_UNAVAILABLE
          example: CNC_NOT_ENABLED_FOR_STORE
        pickup_points:
          type: array
          description: Eligible points; empty when the order is not eligible
          items:
            $ref: "#/components/schemas/PickupPoint"
    ConvertToClickAndCollectRequest:
      type: object
      required:
        - store_id
        - service_code
      properties:
        store_id:
          type: integer
          description: Id of the store that owns the order; must belong to your account
          example: 1234
        service_code:
          type: string
          description: Pickup point identifier from `GET /orders/{order_id}/pickup-points`
          example: CUBBOCNCESTEST001
    ConvertedWithoutOrder:
      type: object
      description: Returned when the conversion succeeded but the order could not be rendered
      required:
        - converted
      properties:
        converted:
          type: boolean
          description: Always true
          example: true
    ClickAndCollectError:
      type: object
      description: 404 body of the click-and-collect endpoints
      required:
        - error
      properties:
        error:
          type: string
          description: "`Order not found` or `store_not_found`"
          example: Order not found
        code:
          type: string
          description: Present for order lookups
          enum:
            - ORDER_NOT_FOUND
          example: ORDER_NOT_FOUND
    ClickAndCollectConversionError:
      type: object
      description: >-
        422 body of the conversion endpoint. Parameter errors carry only `error`; business rejections add a
        stable `code`.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable reason
          example: Order is already click and collect
        code:
          type: string
          description: Stable rejection code
          enum:
            - INVALID_ORDER_STATUS
            - ALREADY_CLICK_AND_COLLECT
            - STORE_EDIT_RESTRICTED
            - INVALID_CNC_SERVICE_CODE
            - CNC_CARRIER_TEMPORARILY_UNAVAILABLE
            - CNC_NOT_ENABLED_FOR_STORE
            - CNC_CARRIER_NOT_ENABLED_FOR_STORE
            - CNC_SHIPPING_METHOD_NOT_FOUND
            - CNC_ORIGINAL_NOT_CUBBO_BILLED
            - CNC_ORIGINAL_NOT_NATIONAL_SHIPPING
            - CNC_PRICE_EXCEEDS_ORIGINAL
            - CNC_RATE_CARD_UNAVAILABLE
            - CNC_LOCATION_CONFIRMATION_FAILED
          example: ALREADY_CLICK_AND_COLLECT
        click_and_collect_metadata:
          type:
            - object
            - "null"
          description: >-
            Only with `ALREADY_CLICK_AND_COLLECT`; the order's current pickup selection (public fields only),
            or null if it carries none
          additionalProperties: true
          example:
            carrier_name: Estafeta
            service_code: CUBBOCNCESTEST001
    ClickAndCollectUnexpectedError:
      type: object
      description: 500 body of the click-and-collect endpoints
      required:
        - error
        - timestamp
      properties:
        error:
          type: string
          description: Always `unexpected_error`
          example: unexpected_error
        timestamp:
          type: integer
          description: Unix timestamp to quote when contacting support
          example: 1700000000
    PickupLocation:
      type: object
      description: A pickup location as shown on the buyer tracking page
      required:
        - service_name
        - service_code
        - source
        - description
      properties:
        service_name:
          type: string
          description: Spanish display label with distance, point name and (for some carriers) opening hours
          example: >-
            Recolecta en punto físico a 1.5km - Estafeta Insurgentes - Lun a Vie: 10:00-18:00, Sáb:
            10:00-14:00, Dom: cerrado
        service_code:
          type: string
          description: Identifier of the point (`CUBBOCNC` + carrier code + location id)
          example: CUBBOCNCESTEST001
        source:
          type: string
          description: Point address
          example: Av. Insurgentes 100, CDMX
        description:
          type: string
          description: Point address (same as `source`)
          example: Av. Insurgentes 100, CDMX
    PickupLocationsResponse:
      type: object
      required:
        - rates
      properties:
        rates:
          type: array
          description: Pickup locations found
          items:
            $ref: "#/components/schemas/PickupLocation"
        cnc_eligible:
          type: boolean
          description: Present only when `order_id` was sent; whether that order can be converted to click and collect
          example: true
        code:
          type: string
          description: >-
            Present only when `cnc_eligible` is false; why the order is not eligible, or
            `CNC_INVALID_ORDER_ID` when `order_id` could not be resolved
          enum:
            - CNC_INVALID_ORDER_ID
            - CNC_INVALID_ORDER_STATUS
            - CNC_MISSING_POSTAL_CODE
            - CNC_ORIGINAL_NOT_CUBBO_BILLED
            - CNC_ORIGINAL_NOT_NATIONAL_SHIPPING
            - CNC_RATE_CARD_UNAVAILABLE
          example: CNC_INVALID_ORDER_STATUS
    OrderUpdatedEvent:
      type: object
      description: Payload of the `orderUpdated` event.
      required:
        - id
        - status
        - order_number
        - updated_at
        - store_id
      properties:
        id:
          type: integer
          description: Cubbo order id.
          example: 987654
        status:
          type: string
          description: New fulfillment status of the order.
          enum:
            - initial
            - unpaid
            - empty
            - pending
            - error
            - cancelation_window
            - entirely_dropshipping
            - backorder
            - processing
            - picking
            - packing
            - shipped
            - canceled
            - holded
            - interrupted
            - returned
            - return_arrived
            - returning
            - reentered
            - awaiting_fulfillment_request
            - awaiting_dropoff
            - arrived_at_warehouse
          example: picking
        order_number:
          type: string
          description: Your order number, as sent when the order was created.
          example: ORD-0001
        updated_at:
          type: string
          format: date-time
          description: UTC time at which the status change was recorded.
          example: "2026-10-12T15:04:05Z"
        store_id:
          type: integer
          description: Cubbo store id the order belongs to.
          example: 1234
        products:
          type: array
          description: Order lines with the picked unit codes. Present only while `status` is `picking` or `packing`.
          items:
            $ref: "#/components/schemas/WebhookOrderUpdatedProduct"
        picking_status:
          type: string
          description: Present only when the picking of the order was sent to review.
          enum:
            - in_review
          example: in_review
        created_by_return:
          $ref: "#/components/schemas/WebhookCreatedByReturn"
        c2c:
          $ref: "#/components/schemas/WebhookC2cDetails"
        parent_order_id:
          type: integer
          description: Present when this order is the child of a presale split; id of the original order.
          example: 987000
        channel_name:
          type: string
          description: >-
            Sales channel name given when the order was created, or the integration type (`openapi`) when none
            was given.
          example: openapi
        channel_order_id:
          type: string
          description: Your channel order id, when it was provided at creation.
          example: SHOP-77421
        channel_integration_id:
          type: integer
          description: Cubbo integration id. Present only when channel details are enabled for your store.
          example: 4321
        subchannel_name:
          type:
            - string
            - "null"
          description: Sub-channel or marketplace name. Present only when channel details are enabled for your store.
          example: Marketplace A
        latest_estimated_time_arrival_range:
          $ref: "#/components/schemas/WebhookEtaRange"
      additionalProperties: true
    WebhookOrderUpdatedProduct:
      type: object
      description: An order line as reported during picking and packing.
      required:
        - id
        - sku
        - quantity
      properties:
        id:
          type: integer
          description: Cubbo product id.
          example: 5551
        sku:
          type: string
          description: SKU of the product.
          example: SKU-RED-M
        quantity:
          type: integer
          description: Quantity ordered.
          example: 2
        unit_codes:
          type: array
          description: >-
            Serial numbers / IMEIs of the picked units. Present only when the line has picked units with
            codes.
          items:
            type: string
          example:
            - "356789012345678"
    WebhookCreatedByReturn:
      type: object
      description: Present when the order was created by a return or exchange flow.
      properties:
        id:
          type: integer
          description: Cubbo return id.
          example: 4410
        status:
          type: string
          description: Status of the return.
          enum:
            - REQUESTED
            - PENDING
            - ORDERED
            - CANCELLED
            - RECEIVED
            - ARRIVED_AT_WAREHOUSE
            - AWAITING_INSPECTION
            - REENTERED
            - UNSUCCESSFUL
          example: RECEIVED
        notes:
          type:
            - string
            - "null"
          description: Free-text notes on the return.
          example: Wrong size
        return_type:
          type: string
          description: Type of return.
          enum:
            - SIMPLE_RETURN
            - EXCHANGE
            - IMMEDIATE_EXCHANGE
            - RETURNED_BY_CARRIER
            - TO_BE_DETERMINED
            - UNIDENTIFIED
          example: EXCHANGE
        created_at:
          type: string
          format: date-time
          description: When the return was created.
          example: "2026-10-10T12:00:00Z"
        returned_order:
          type: object
          description: >-
            The order being returned. Contains at least `id`, `order_number` and `status`; other order fields
            may also be present.
          properties:
            id:
              type: integer
              example: 987654
            order_number:
              type: string
              example: ORD-0001
            status:
              type: string
              example: returned
          additionalProperties: true
      additionalProperties: true
    WebhookC2cDetails:
      type: object
      description: Consumer-to-consumer (C2C) shipment details. Present only for C2C orders.
      properties:
        roll_code:
          type:
            - string
            - "null"
          description: Code of the roll (label) bound to the package.
          example: ROLL-000123
        origin_location_id:
          type:
            - string
            - "null"
          description: Pickup point where the package was dropped off.
          example: "77"
        dropped_off_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the sender dropped the package off.
          example: "2026-10-12T10:00:00Z"
        recollected_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the package was collected from the pickup point.
          example: "2026-10-12T18:00:00Z"
        arrived_at_warehouse_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the package arrived at the Cubbo warehouse.
          example: null
        event:
          type: string
          description: C2C lifecycle step that triggered this webhook. Absent when the order changed for another reason.
          enum:
            - c2c_dropped_off
            - c2c_recollected
            - c2c_arrived_at_warehouse
            - c2c_shipped
          example: c2c_dropped_off
    WebhookEtaRange:
      type: object
      description: >-
        Latest estimated delivery window, in UTC. Sent only when enabled for your integration; `null` when no
        estimate exists.
      properties:
        range_begin:
          type: string
          format: date-time
          description: Start of the estimated delivery window.
          example: "2026-10-14T06:00:00Z"
        range_end:
          type: string
          format: date-time
          description: End of the estimated delivery window.
          example: "2026-10-15T05:59:59Z"
    OrderFulfilledEvent:
      type: object
      description: Payload of the `orderFulfilled` event.
      required:
        - id
        - order_number
        - carrier_name
        - status
        - store_id
        - tracking_urls
        - tracking_number
        - updated_at
      properties:
        id:
          type: integer
          description: Cubbo order id.
          example: 987654
        order_number:
          type: string
          description: Your order number.
          example: ORD-0001
        carrier_name:
          type:
            - string
            - "null"
          description: Carrier that will deliver the order.
          example: Estafeta
        first_name:
          type:
            - string
            - "null"
          description: Recipient first name.
          example: Ana
        last_name:
          type:
            - string
            - "null"
          description: Recipient last name.
          example: Example
        city:
          type:
            - string
            - "null"
          description: Destination city. `null` for orders collected at the warehouse.
          example: Ciudad de México
        country:
          type:
            - string
            - "null"
          description: Destination country code.
          example: MX
        status:
          type: string
          description: Fulfillment status at the moment of shipping; normally `shipped`.
          example: shipped
        store_id:
          type: integer
          description: Cubbo store id.
          example: 1234
        tracking_urls:
          type: array
          description: Cubbo tracking page URL for the order (one element).
          items:
            type: string
            format: uri
          example:
            - https://tracking.example.com/orders/abc123
        tracking_number:
          type:
            - string
            - "null"
          description: Carrier tracking number of the first package.
          example: "1234567890123456789012"
        updated_at:
          type: string
          format: date-time
          description: When the order was last updated (time of shipping).
          example: "2026-10-12T16:20:00Z"
        zip_code:
          type:
            - string
            - "null"
          description: >-
            Destination postal code. `"-"` for Chile shipments without a postal code; `null` for warehouse
            pickups.
          example: "06600"
        estimated_time_arrival:
          type:
            - string
            - "null"
          format: date-time
          description: Estimated delivery date and time, when known.
          example: "2026-10-14T23:59:59Z"
        extended_zone:
          type: boolean
          description: >-
            Whether the destination postal code is an extended delivery zone for the carrier. Present only
            when enabled for your store.
          example: false
        channel_name:
          type: string
          description: Sales channel name given at creation, or the integration type when none was given.
          example: openapi
        channel_order_id:
          type: string
          description: Your channel order id, when it was provided at creation.
          example: SHOP-77421
        channel_integration_id:
          type: integer
          description: Cubbo integration id. Present only when channel details are enabled for your store.
          example: 4321
        subchannel_name:
          type:
            - string
            - "null"
          description: Sub-channel or marketplace name. Present only when channel details are enabled for your store.
          example: Marketplace A
        order_lines:
          type: array
          description: Shipped order lines with product and unit detail. Present only when enabled for your store.
          items:
            $ref: "#/components/schemas/WebhookOrderFulfilledOrderLine"
        created_by_return:
          $ref: "#/components/schemas/WebhookCreatedByReturn"
        shipping_type:
          type:
            - string
            - "null"
          description: Shipping method type. Present only when enabled for your integration.
          example: standard
        delivery_type:
          type:
            - string
            - "null"
          description: Delivery type of the shipping method. Present only when enabled for your integration.
          example: home_delivery
        billing_category:
          type:
            - string
            - "null"
          description: Billing service category of the shipping label. Present only when enabled for your integration.
          example: STANDARD
        latest_estimated_time_arrival_range:
          $ref: "#/components/schemas/WebhookEtaRange"
      additionalProperties: true
    WebhookOrderFulfilledOrderLine:
      type: object
      description: A shipped order line.
      properties:
        id:
          type: integer
          description: Order line id.
          example: 771
        sku:
          type: string
          description: SKU ordered.
          example: SKU-RED-M
        quantity:
          type: integer
          description: Quantity shipped for this line.
          example: 2
        product:
          type: object
          description: Product of the line.
          properties:
            id:
              type: integer
              example: 5551
            name:
              type: string
              example: Red T-Shirt M
            is_kit:
              type: boolean
              description: Whether the product is a kit (bundle).
              example: false
            bar_code:
              type:
                - string
                - "null"
              example: "7501234567890"
            product_codes:
              type: array
              description: All SKUs of the product.
              items:
                type: object
                properties:
                  id:
                    type: integer
                    example: 9001
                  sku:
                    type: string
                    example: SKU-RED-M
        stock_units:
          type: array
          description: Physical units shipped for the line.
          items:
            type: object
            properties:
              id:
                type: integer
                example: 120001
              product_id:
                type: integer
                example: 5551
              imei:
                type:
                  - string
                  - "null"
                description: IMEI / serial of the unit, when tracked.
                example: null
    ShippingUpdatedEvent:
      type: object
      description: Payload of the `shippingUpdated` event.
      required:
        - status
        - store_id
        - order_number
        - updated_at
        - tracking_urls
        - is_multi_package
        - packages
      properties:
        status:
          type: string
          description: Shipment status that triggered the event.
          enum:
            - shipment_in_transit
            - shipment_out_for_delivery
            - shipment_delivered
            - shipment_partially_delivered
            - shipment_with_incident
            - shipment_returned
            - shipment_canceled
            - shipment_to_be_self_collected
            - shipment_not_defined
          example: shipment_delivered
        store_id:
          type: integer
          description: Cubbo store id.
          example: 1234
        carrier_name:
          type:
            - string
            - "null"
          description: Carrier of the package that triggered the event.
          example: Estafeta
        tracking_urls:
          type: array
          description: Cubbo tracking page URL for the order (one element).
          items:
            type: string
            format: uri
          example:
            - https://tracking.example.com/orders/abc123
        tracking_number:
          type:
            - string
            - "null"
          description: Carrier tracking number of the package that triggered the event.
          example: "1234567890123456789012"
        zip_code:
          type:
            - string
            - "null"
          description: Destination postal code (`"-"` for Chile shipments without one).
          example: "06600"
        order_number:
          type: string
          description: Your order number.
          example: ORD-0001
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the carrier tracking event.
          example: "2026-10-14T18:32:10Z"
        estimated_time_arrival:
          type:
            - string
            - "null"
          format: date-time
          description: >-
            Estimated delivery date and time. `null` when the shipment was returned or reported stolen or
            lost.
          example: "2026-10-14T23:59:59Z"
        incident_description:
          type:
            - string
            - "null"
          description: Reason of the incident. Set only when `status` is `shipment_with_incident`.
          enum:
            - second_try
            - third_try
            - client_requested
            - missing_references
            - not_at_home
            - refused_payment
            - refused_package
            - cubbo_requested
            - carrier_requested
            - stolen
            - lost
            - damaged
            - loading_error
            - pickup_expired
            - delivery_failed
            - null
          example: null
        label_tracking_event_id:
          type:
            - integer
            - "null"
          description: Id of the tracking event that produced this webhook. Stable across retries.
          example: 8812001
        is_multi_package:
          type: boolean
          description: Whether the order ships in more than one package.
          example: false
        packages:
          type: array
          description: All packages of the order, oldest first.
          items:
            $ref: "#/components/schemas/WebhookShippingPackage"
        triggered_by_package:
          $ref: "#/components/schemas/WebhookTriggeringPackage"
        parent_order_id:
          type: integer
          description: Present when this order is the child of a presale split; id of the original order.
          example: 987000
        channel_name:
          type: string
          description: Sales channel name given at creation, or the integration type when none was given.
          example: openapi
        channel_order_id:
          type: string
          description: Your channel order id, when it was provided at creation.
          example: SHOP-77421
        channel_integration_id:
          type: integer
          description: Cubbo integration id. Present only when channel details are enabled for your store.
          example: 4321
        latest_estimated_time_arrival_range:
          $ref: "#/components/schemas/WebhookEtaRange"
      additionalProperties: true
    WebhookShippingPackage:
      type: object
      description: One package (shipping label) of the order.
      properties:
        shipping_number:
          type: string
          description: Carrier tracking number of the package.
          example: "1234567890123456789012"
        tracking_url:
          type:
            - string
            - "null"
          description: Carrier tracking URL of the package.
          example: https://carrier.example.com/track/1234567890123456789012
        shipping_status:
          type: string
          description: >-
            Current shipment status of this package (falls back to the order status when the package has none
            yet).
          example: shipment_delivered
        carrier_name:
          type:
            - string
            - "null"
          description: Carrier of the package.
          example: Estafeta
        package_index:
          type: integer
          description: 1-based position of the package.
          example: 1
        total_packages:
          type: integer
          description: Number of packages in the order.
          example: 1
    WebhookTriggeringPackage:
      type: object
      description: >-
        The package whose tracking event produced this webhook. Present when the event came from a specific
        package.
      properties:
        shipping_number:
          type: string
          example: "1234567890123456789012"
        shipping_status:
          type: string
          description: New status of the package.
          example: shipment_delivered
        carrier_name:
          type:
            - string
            - "null"
          example: Estafeta
        tracking_url:
          type:
            - string
            - "null"
          example: https://carrier.example.com/track/1234567890123456789012
        previous_status:
          type:
            - string
            - "null"
          description: Status of the package before this event.
          example: shipment_out_for_delivery
        package_index:
          type:
            - integer
            - "null"
          description: 1-based position of the package within `packages`.
          example: 1
        total_packages:
          type: integer
          example: 1
    InventoryMovementEvent:
      type: object
      description: Payload of the `inventoryMovement` event.
      required:
        - event
        - occurred_at
        - sequence
        - store_id
        - products
      properties:
        event:
          type: string
          enum:
            - inventoryMovement
          description: Event name.
          example: inventoryMovement
        occurred_at:
          type: string
          format: date-time
          description: When the stock snapshot was taken.
          example: "2026-10-12T16:25:00-06:00"
        sequence:
          type: integer
          description: Monotonic counter per integration. Higher means newer; gaps are possible.
          example: 42
        store_id:
          type: integer
          description: Cubbo store id.
          example: 1234
        products:
          type: array
          description: Current stock of each affected product.
          items:
            $ref: "#/components/schemas/WebhookInventoryProduct"
      additionalProperties: true
    WebhookInventoryProduct:
      type: object
      description: Stock snapshot of one product.
      required:
        - product_name
        - skus
        - quantity
      properties:
        product_name:
          type: string
          description: Product name.
          example: Red T-Shirt M
        product_code:
          type:
            - string
            - "null"
          description: Product bar code.
          example: "7501234567890"
        skus:
          type: array
          description: All SKUs of the product.
          items:
            type: string
          example:
            - SKU-RED-M
        quantity:
          type: integer
          description: Available (sellable) units; excludes reserved, damaged and lost units.
          example: 148
        units:
          type: array
          description: >-
            Per-unit detail. Present for products tracked by unit code (every unit) and for other products
            that have damaged or lost units.
          items:
            $ref: "#/components/schemas/WebhookInventoryUnit"
        lots:
          type: array
          description: >-
            Lots with available stock, earliest expiration first. Present only for expiration-tracked
            products.
          items:
            $ref: "#/components/schemas/WebhookInventoryLot"
    WebhookInventoryUnit:
      type: object
      description: One physical unit, or one damaged/lost unit without code.
      required:
        - status
      properties:
        unit_code:
          type: string
          description: Serial number / IMEI. Present only for products tracked by unit code.
          example: "356789012345678"
        status:
          type: string
          description: Status of the unit.
          enum:
            - ACTIVE
            - RESERVED
            - DAMAGED
            - LOST
          example: ACTIVE
        damaged_source:
          type:
            - string
            - "null"
          description: Where the damage was found. Present only when `status` is `DAMAGED`.
          enum:
            - REPLENISHMENT
            - RETURN
            - STORAGE
            - null
          example: RETURN
        lost_source:
          type: string
          description: Where the unit was lost. Present only when `status` is `LOST`.
          enum:
            - REPLENISHMENT
            - RETURN
            - STORAGE
            - DELIVERY
          example: REPLENISHMENT
    WebhookInventoryLot:
      type: object
      description: Available stock in one lot.
      properties:
        lot_code:
          type: string
          description: Lot code.
          example: LOT-2026A
        expiration_date:
          type:
            - string
            - "null"
          format: date
          description: Lot expiration date.
          example: "2026-12-31"
        quantity:
          type: integer
          description: Available units in the lot.
          example: 3
    ReplenishmentEvent:
      type: object
      description: Common payload of the replenishment events.
      required:
        - event
        - occurred_at
        - store_id
        - replenishment_id
        - status
        - sell_ahead
        - sequence
      properties:
        event:
          type: string
          description: Event name.
          enum:
            - replenishmentStatus
            - replenishmentCreated
            - replenishmentScheduled
          example: replenishmentStatus
        occurred_at:
          type: string
          format: date-time
          description: When the payload was built.
          example: "2026-10-21T17:45:00-06:00"
        store_id:
          type: integer
          description: Cubbo store id.
          example: 1234
        replenishment_id:
          type: integer
          description: Cubbo replenishment id.
          example: 55010
        status:
          type: string
          description: Status of the replenishment at the moment of the event.
          enum:
            - WITHOUT_SCHEDULING
            - PENDING
            - REQUESTED
            - PROCESSING
            - IN_TRANSIT
            - RECEIVED
            - IN_PUTAWAY
            - CANCELED
            - COMPLETED
          example: COMPLETED
        sell_ahead:
          type: boolean
          description: Whether this is a presale replenishment whose stock can be sold before arrival.
          example: false
        appointment_date:
          type:
            - string
            - "null"
          format: date
          description: Date of the booked delivery appointment, or `null` when none is booked.
          example: "2026-10-20"
        products:
          type: array
          description: Expected vs received quantity per product. Omitted when `status` is `CANCELED`.
          items:
            $ref: "#/components/schemas/WebhookReplenishmentProduct"
        supplier_invoices:
          type: array
          description: Supplier invoice numbers captured for the receipt. Omitted when `status` is `CANCELED`.
          items:
            $ref: "#/components/schemas/WebhookSupplierInvoice"
        sequence:
          type: integer
          format: int64
          description: Ordering hint; epoch milliseconds of the transition that produced the event.
          example: 1792000000000
      additionalProperties: true
    ReplenishmentStatusEvent:
      description: Payload of the `replenishmentStatus` event.
      allOf:
        - $ref: "#/components/schemas/ReplenishmentEvent"
        - type: object
          properties:
            event:
              type: string
              enum:
                - replenishmentStatus
            status:
              type: string
              enum:
                - PROCESSING
                - IN_PUTAWAY
                - COMPLETED
                - CANCELED
    ReplenishmentCreatedEvent:
      description: Payload of the `replenishmentCreated` event.
      allOf:
        - $ref: "#/components/schemas/ReplenishmentEvent"
        - type: object
          properties:
            event:
              type: string
              enum:
                - replenishmentCreated
            status:
              type: string
              enum:
                - WITHOUT_SCHEDULING
                - PENDING
                - REQUESTED
                - IN_TRANSIT
    ReplenishmentScheduledEvent:
      description: Payload of the `replenishmentScheduled` event.
      allOf:
        - $ref: "#/components/schemas/ReplenishmentEvent"
        - type: object
          properties:
            event:
              type: string
              enum:
                - replenishmentScheduled
    WebhookReplenishmentProduct:
      type: object
      description: Expected and received quantity of one product in the replenishment.
      required:
        - skus
        - expected_quantity
        - received_quantity
      properties:
        product_code:
          type:
            - string
            - "null"
          description: Product bar code.
          example: "7501234567890"
        skus:
          type: array
          description: All SKUs of the product.
          items:
            type: string
          example:
            - SKU-RED-M
        expected_quantity:
          type: integer
          description: Units announced for this product.
          example: 200
        received_quantity:
          type: integer
          description: Units received so far (excludes presale units not yet arrived).
          example: 198
    WebhookSupplierInvoice:
      type: object
      description: A supplier invoice captured at reception.
      properties:
        invoice_number:
          type: string
          description: Supplier invoice number.
          example: F-0001
  responses:
    Unauthorized:
      description: Missing or invalid token, wrong credentials, or no access to the requested store.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalidToken:
              value:
                error: Unauthorized
                message: invalid token
            noHeader:
              value:
                error: Unauthorized
                message: no authorization header found
            storeNotAllowed:
              value:
                error: Unauthorized
                message: not allowed to show? this Store
    TooManyRequests:
      description: Rate limit exceeded. Wait for the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Too many requests. Please slow down and try again later.
    InternalServerError:
      description: Unexpected error. Retry with backoff; if it persists, send the timestamp to Cubbo support.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "unexpected error, timestamp: 1760000000"
    DuplicateRequestInFlight:
      description: >-
        Another request for the same order number is still being processed (or a previous one was interrupted;
        the lock expires on its own within a few minutes). Nothing was created by this request. Wait for the
        number of seconds in the `Retry-After` header and retry with the same payload; the retry converges on
        the real outcome.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            example: 5
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DuplicateRequestInFlightError"
          example:
            error: another request for order ORD-0001 is already being processed, retry in 5 seconds
            code: DUPLICATE_REQUEST_IN_FLIGHT
            transaction_id: c0ffee00-0000-4000-8000-000000000001
            transaction_key: api_create_orders:1234:ORD-0001
    SandboxForbidden:
      description: The sandbox is turned off, or the store is not a test store.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SandboxError"
          examples:
            notATestStore:
              summary: Not a test store
              value:
                error:
                  message: >-
                    Sandbox endpoints only work on test stores. Ask your Cubbo account manager for a test
                    store.
                  code: NOT_A_TEST_STORE
            disabled:
              summary: Sandbox turned off
              value:
                error:
                  message: The sandbox is not available right now.
                  code: SANDBOX_DISABLED
    SandboxNotFound:
      description: The record does not exist or belongs to a store your credentials cannot access.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SandboxError"
          example:
            error:
              message: Order not found.
              code: NOT_FOUND
    SandboxUnexpectedError:
      description: Unexpected error. Retry later and contact Cubbo support if it persists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SandboxError"
          example:
            error:
              message: unexpected error
              code: UNEXPECTED_ERROR
  parameters:
    SandboxOrderId:
      name: order_id
      in: path
      required: true
      description: Cubbo ID of the order (`id` in the order responses), not your order number.
      schema:
        type: integer
        example: 987654
    WebhookEventHeader:
      name: X-Webhook-Event
      in: header
      required: true
      description: |
        Name of the event (`orderUpdated`, `orderFulfilled`, `shippingUpdated`, `inventoryMovement`,
        `replenishmentStatus`, `replenishmentCreated`, `replenishmentScheduled`). Route on this header,
        not on the URL: all feeds can share one endpoint. Treat a request without this header as an order
        event.
      schema:
        type: string
        enum:
          - orderUpdated
          - orderFulfilled
          - shippingUpdated
          - inventoryMovement
          - replenishmentStatus
          - replenishmentCreated
          - replenishmentScheduled
      example: shippingUpdated
    WebhookMessageIdHeader:
      name: X-Cubbo-Webhook-Message-Id
      in: header
      required: true
      description: |
        UUID of this delivery attempt. It is part of the signed string. A new value is generated on every
        attempt, so a retry of the same event carries a different message id.
      schema:
        type: string
        format: uuid
      example: 3f2b1c7e-9d4a-4e8f-9a1b-2c3d4e5f6a7b
    WebhookSignatureHeader:
      name: X-Cubbo-Hmac-SHA256
      in: header
      required: true
      description: |
        Lowercase hex HMAC-SHA256 of the string `<message id>.<isa>.<exp>.<raw request body>` computed
        with your webhook secret. Verify it against the exact bytes you received before parsing the body.
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
      example: 9b74c9897bac770ffc029102a200c5de3a1c7b5e0d5f4a6b8c9d0e1f2a3b4c5d
    WebhookIssuedAtHeader:
      name: isa
      in: header
      required: true
      description: Unix timestamp (seconds, UTC) at which the request was signed. Part of the signed string.
      schema:
        type: string
      example: "1791234567"
    WebhookExpiresAtHeader:
      name: exp
      in: header
      required: true
      description: |
        Unix timestamp (seconds, UTC) after which the signature should be rejected; always `isa` + 300.
        Part of the signed string.
      schema:
        type: string
      example: "1791234867"
    WebhookIdempotencyKeyHeader:
      name: X-Cubbo-Idempotency-Key
      in: header
      required: false
      description: |
        Stable key for the event: identical on every retry of the same event. Sent on `shippingUpdated`
        (carrier tracking events), `inventoryMovement` and the replenishment events. Not sent on
        `orderUpdated` or `orderFulfilled`. Store the keys you have processed and ignore repeats.
      schema:
        type: string
      example: lte-8812001-ci-4321
    WebhookAuthorizationHeader:
      name: Authorization
      in: header
      required: false
      description: |
        `Bearer <token>`, sent only when OAuth 2.0 client-credentials authentication has been configured
        for your integration by Cubbo. Cubbo requests the token from your token URL with
        `grant_type=client_credentials` and caches it until shortly before it expires.
      schema:
        type: string
      example: Bearer eyJhbGciOi...
paths:
  /auth/token:
    post:
      tags:
        - Authentication
      operationId: createAuthToken
      summary: Obtain an access token
      description: |
        Exchanges your API credential (`client_id` and `client_secret`) for a Bearer token that
        every other endpoint of this API requires in the `Authorization: Bearer <token>` header.
        Tokens are valid for `expires_in` seconds (24 hours by default). Request one token and
        reuse it until it expires; do not request a new token on every call.

        - Only the `client_credentials` grant is supported.
        - Rate limit: 60 requests per minute per `client_id` on this endpoint. Exceeding it
          returns HTTP 429 with a `Retry-After` header. Every other `/v1` endpoint shares a
          separate limit of 600 requests per minute per API account.
        - Store-scoped endpoints (`PATCH /store`, `POST /store/fiscal-account`,
          `POST /store/digital-certificate`) derive the store from the credential used to obtain
          the token, so authenticate with the credential of the store you want to configure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTokenRequest"
            example:
              client_id: 0f1e2d3c-0000-4000-8000-000000001234
              client_secret: <your-client-secret>
              expires_in: 86400
              grant_type: client_credentials
      responses:
        "201":
          description: Token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
              example:
                token: <jwt-access-token>
                expires_in: 86400
                type: Bearer
        "400":
          description: The request body is not valid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Error occurred while parsing request parameters
        "401":
          description: The credential pair is unknown or the secret does not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              example:
                error: Unauthorized
                message: invalid credentials
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingClientId:
                  value:
                    error: Parameter client_id is required
                missingClientSecret:
                  value:
                    error: Parameter client_secret is required
                expiresInOutOfRange:
                  value:
                    error: Parameter expires_in cannot be greater than 86400
                unsupportedGrantType:
                  value:
                    error: Parameter grant_type must be within ["client_credentials"]
        "429":
          description: More than 60 token requests in one minute for this `client_id`
          headers:
            Retry-After:
              description: Seconds to wait before retrying (the length of the throttle window, 60)
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Too many requests. Please slow down and try again later.
        "500":
          $ref: "#/components/responses/InternalServerError"
      security: []
  /brazil/orders:
    post:
      tags:
        - Orders
      operationId: createBrazilOrder
      summary: Create an order for a Brazil store
      description: |
        Creates an order for a store served from a Brazil warehouse. Brazil orders carry the fiscal
        data Cubbo needs to issue the NF-e (Nota Fiscal Eletrônica, the Brazilian electronic
        invoice): per-line prices, the buyer's shipping cost and a billing block with the buyer's
        tax id (CPF for a natural person, CNPJ for a company). `order_type` selects what kind of
        order you get; it defaults to `SALE`.

        - `SALE` and `DONATION` share the full contract: recipient, billing, shipping method,
          `buyer_shipping_price` and a `price_per_item` on every line. A donation is only
          different fiscally (the NF-e is issued with a donation purpose).
        - The four removal types (`REMOVE_STOCK`, `REMOVE_DAMAGED_STOCK`, `REMOVE_EXPIRED_STOCK`,
          `REMOVE_LOST_STOCK`) return stock to you. Cubbo synthesizes the recipient from the
          warehouse, the billing data from your store's fiscal registration and the shipping method
          from the warehouse's pickup method, so `shipping`, `billing`, `shipping_method_id` and
          `shipping_line_code` are optional and ignored. `price_per_item` becomes optional (falls back
          to the product's registered price), `quantity` must be at least 1, and you may hand in your
          own NF-e with `invoice_xml` or `client_invoice`.
        - `REMOVE_LOST_STOCK` is applied synchronously and all-or-nothing: units already recorded
          as lost are written off and the order comes back already `shipped`. It is available only
          to stores that have opted out of Cubbo issuing their removal NF-es (ask Cubbo support).
        - `STOCK_TRANSFER_OUT` is accepted by the parameter check but is reserved for Cubbo's
          stock-transfer feature; do not send it. `C2C` is refused.
        - Sale orders are validated asynchronously (CEP, CPF/CNPJ length, NCM, totals); check
          `status`, `has_missing_info` and `missing_info` on `GET /orders`.
        - Duplicate protection: an existing `order_number` in the store answers 422; a request still
          in progress for the same `order_number` answers 409 `DUPLICATE_REQUEST_IN_FLIGHT`.
        - Error bodies on this endpoint are `{"error": "<message>"}` with no code, except removal
          orders that fail field validation, which return `{"errors": [...]}`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrazilOrderCreateRequest"
            examples:
              sale:
                summary: Sale to a natural person (CPF)
                value:
                  store_id: 1234
                  order_number: ORD-BR-0001
                  shipping_method_id: 12
                  buyer_shipping_price: 15.9
                  shipping:
                    first_name: Ana
                    last_name: Silva
                    phone: "5511999999999"
                    email: buyer@example.com
                    address1: Av. Paulista
                    number: "1234"
                    interior_number: Apto 45
                    neighborhood: Bela Vista
                    country: BR
                    city: São Paulo
                    province: SP
                    zip_code: "01310100"
                  billing:
                    first_name: Ana
                    last_name: Silva
                    phone: "5511999999999"
                    email: buyer@example.com
                    address1: Av. Paulista
                    number: "1234"
                    neighborhood: Bela Vista
                    country: BR
                    city: São Paulo
                    province: SP
                    zip_code: "01310100"
                    tax_id: 000.000.000-00
                    tax_regime: PHYSICAL
                  products:
                    - sku: SKU-RED-M
                      quantity: 2
                      price_per_item: 59.9
                      discount_per_item: 5
              legalPerson:
                summary: Sale to a company (CNPJ)
                value:
                  store_id: 1234
                  order_number: ORD-BR-0002
                  shipping_line_code: Express
                  buyer_shipping_price: 0
                  is_b2b: true
                  shipping:
                    first_name: Carlos
                    last_name: Souza
                    phone: "5511888888888"
                    email: buyer@example.com
                    address1: Rua das Flores
                    number: "10"
                    neighborhood: Centro
                    country: BR
                    city: Campinas
                    province: SP
                    zip_code: "13010000"
                  billing:
                    first_name: Carlos
                    last_name: Souza
                    phone: "5511888888888"
                    email: buyer@example.com
                    address1: Rua das Flores
                    number: "10"
                    neighborhood: Centro
                    country: BR
                    city: Campinas
                    province: SP
                    zip_code: "13010000"
                    tax_id: 00.000.000/0000-00
                    tax_regime: LEGAL
                    company: Example Comércio LTDA
                    state_registration: "000000000"
                  products:
                    - sku: SKU-RED-M
                      quantity: 10
                      price_per_item: 49.9
              removal:
                summary: Stock removal with your own NF-e
                value:
                  store_id: 1234
                  order_number: REM-0001
                  order_type: REMOVE_STOCK
                  products:
                    - sku: SKU-RED-M
                      quantity: 10
                    - sku: SKU-BLUE-L
                      quantity: 4
                      price_per_item: 12.5
                  client_invoice:
                    key: "00000000000000000000000000000000000000000000"
                    serie: "1"
                    number: "987"
      responses:
        "200":
          description: >-
            Order created. Same payload as `POST /orders`. A `REMOVE_LOST_STOCK` order is returned already in
            status `shipped`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              example:
                id: 987656
                store_id: 1234
                order_number: ORD-BR-0001
                status: initial
                channel_created_at: "2026-10-12T15:04:05.000Z"
                order_date: "2026-10-12T15:04:05.000Z"
                shipping_date: null
                pending_at: null
                shipping_email: buyer@example.com
                shipping_status: null
                is_paid: true
                is_cod: false
                cod_amount: null
                requires_document_return: false
                requires_pickup_on_delivery: false
                has_carrier_insurance: false
                has_missing_info: false
                missing_info: null
                shipping_address_1: Av. Paulista
                currency: BRL
                total_price: "125.7"
                discount_price: "10.0"
                buyer_shipping_price: "15.9"
                extra_fees_price: null
                is_pick_and_ship: false
                is_b2b: false
                pick_n_ship_status: null
                return_shipping_labels: []
                shipping:
                  first_name: Ana
                  last_name: Silva
                  company: null
                  phone: "5511999999999"
                  address_1: Av. Paulista
                  address_2: null
                  email: buyer@example.com
                  zip_code: "01310100"
                  country: BR
                  state: SP
                  city: São Paulo
                  number: "1234"
                  interior_number: Apto 45
                  neighborhood: Bela Vista
                  references: null
                billing:
                  first_name: Ana
                  last_name: Silva
                  company: null
                  phone: "5511999999999"
                  tax_id: 000.000.000-00
                  tax_regime: PHYSICAL
                  state_registration: null
                  address_1: Av. Paulista
                  address_2: null
                  number: "1234"
                  interior_number: null
                  neighborhood: Bela Vista
                  email: buyer@example.com
                  zip_code: "01310100"
                  country: BR
                  state: SP
                  city: São Paulo
                delivery_tracking:
                  - shipping_number: null
                    tracking_url: null
                    cubbo_tracking_url: https://tracking.cubbo.com/t/def456
                    service_id: null
                    shipping_status: null
