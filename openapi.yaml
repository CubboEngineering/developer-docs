  /replenishments:
    post:
      tags:
        - Replenishments
      operationId: createReplenishment
      summary: Create a replenishment
      description: |
        Announces an inbound shipment (replenishment) of products to one of your store's warehouses.
        Every line is identified by SKU; all SKUs must already exist in your Cubbo catalog for the store.
        The replenishment is created in status `REQUESTED`, or `WITHOUT_SCHEDULING` when the target
        warehouse books receiving appointments natively (you then schedule the appointment separately;
        the replenishment is not visible to the warehouse's capacity planning until it is scheduled).

        - `warehouse_id` is optional; when omitted the store's first assigned warehouse is used. When
          sent, the warehouse must be assigned to the store.
        - Each SKU may appear once. Two different SKUs that point to the same product are refused
          (except for certain marketplace integrations, where such lines are merged into one and their quantities
          are added; the first declared `unit_value` is kept, and two different declared values for
          the same product are refused).
        - `unit_value` (declared unit cost in the store currency) is optional and must be a plain
          decimal with at most 2 decimal places, greater than 0 and below the supported ceiling. When
          omitted, Cubbo falls back to the catalog price wherever a cost is needed (for example on the
          Brazilian NF-e of entry).
        - `lots` lets you declare, per SKU, the lots (batches) that will arrive and how many units
          belong to each. The lot quantities must add up to the line quantity, and the SKU must have a
          master-box configuration in Cubbo. These expected quantities per lot are what the variance
          report compares against.
        - `sell_ahead: true` makes the announced units sellable immediately (before they physically
          arrive). The warehouse must have a presale location configured; otherwise the request is
          refused and nothing is created. Sell-ahead replenishments cannot be updated afterwards.
        - `unique_external_reference: true` makes the call idempotent on `(store_id, external_reference)`:
          if a non-canceled replenishment with that reference already exists in the store, the API
          answers 422 with code `REPLENISHMENT_ALREADY_EXISTS` and the existing `replenishment_id`
          instead of creating a second one. Canceled replenishments do not count. Without the flag,
          repeated references are accepted (existing behavior).
        - `inventory_scope` / `is_b2b` decide which sales channel the received stock serves. Omit both
          to use the store's business model (D2C-only stores receive as `d2c`, B2B-only as `b2b`, and
          stores with both models as `shared`). A scope incompatible with the store's model is refused.
        - Brazil: if your store's NF-e (Nota Fiscal eletrônica, the Brazilian fiscal invoice) for
          inbound stock is issued by your own invoicing provider rather than by Cubbo, you must send
          `invoice` with the already-issued NF-e (XML and PDF, base64). If Cubbo issues the NF-e for
          your store, it is generated automatically after the replenishment is created; some marketplace-integrated stores
          need neither.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplenishmentCreateRequest"
            example:
              store_id: 1234
              warehouse_id: 7
              expected_arrived_at: "2026-11-02T15:00:00Z"
              notes: Pallet 2 contains fragile items
              external_reference: PO-0001
              unique_external_reference: true
              sell_ahead: false
              inventory_scope: d2c
              products:
                - sku: SKU-RED-M
                  quantity: 100
                  unit_value: "12.50"
                - sku: SKU-BOX-BLUE
                  quantity: 48
                  lots:
                    - lot_code: LOT-2026-01
                      quantity: 24
                      external_reference: LOT-REF-1
                    - lot_code: LOT-2026-02
                      quantity: 24
                      external_reference: LOT-REF-2
      responses:
        "201":
          description: Replenishment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplenishmentSummary"
              example:
                id: 55001
                status: REQUESTED
                store_id: 1234
                notes: Pallet 2 contains fragile items
                created_at: "2026-10-12T14:03:11.512Z"
                expected_arrived_at: "2026-11-02T15:00:00.000Z"
                sell_ahead: false
                declared_value: null
                warehouse_id: 7
                replenishment_products:
                  - product_id: 9001
                    expected_quantity: 100
                    unit_value: "12.5"
                    product:
                      id: 9001
                      name: Red T-shirt M
                      bar_code: "7501234567890"
                      is_scannable: true
                      product_codes:
                        - id: 31001
                          sku: SKU-RED-M
                  - product_id: 9002
                    expected_quantity: 48
                    unit_value: null
                    product:
                      id: 9002
                      name: Blue box
                      bar_code: "7501234567891"
                      is_scannable: true
                      product_codes:
                        - id: 31002
                          sku: SKU-BOX-BLUE
                warehouse:
                  id: 7
                  name: Mexico City
                  unique_code: MX-CDMX-1
                  address1: Av. Ejemplo 123
                  address2: null
                  zip_code: "01000"
                  city: Ciudad de México
                  state: CDMX
                  country: MX
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: |
            Validation or business error. Most errors are `{error}`. The duplicate-reference refusal
            (`unique_external_reference: true`) also carries `code` and `context.replenishment_id`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ReplenishmentAlreadyExistsError"
              examples:
                missingParam:
                  value:
                    error: Parameter products is required
                invalidScope:
                  value:
                    error: Parameter inventory_scope must be within ["d2c", "b2b", "shared"]
                lotQuantityMismatch:
                  value:
                    error: total quantity for SKU-BOX-BLUE (48) does not match sum of lot quantities (40)
                unitValueFormat:
                  value:
                    error: >-
                      unit_value for SKU-RED-M must be a plain decimal number with at most 2 decimal places,
                      such as 12.50
                unitValueDecimals:
                  value:
                    error: unit_value for SKU-RED-M may have at most 2 decimal places
                unitValueOutOfRange:
                  value:
                    error: unit_value for SKU-RED-M is out of range (must be below 100000000000000)
                unitValueNotPositive:
                  value:
                    error: unit_value for SKU-RED-M must be greater than 0
                unitValueConflict:
                  value:
                    error: unit_value conflict between SKU-RED-M and SKU-RED-M-ALT for the same product
                storeNotFound:
                  value:
                    error: Couldn't find Store with 'id'=1234
                externalReferenceRequired:
                  value:
                    error: external_reference is required when unique_external_reference is true
                alreadyExists:
                  value:
                    error: replenishment with external_reference PO-0001 already exists with id 55001
                    code: REPLENISHMENT_ALREADY_EXISTS
                    context:
                      replenishment_id: 55001
                warehouseNotFound:
                  value:
                    error: Couldn't find Warehouse with 'id'=7
                warehouseNotAssigned:
                  value:
                    error: warehouse 7 is not assigned to this store
                invoiceRequired:
                  value:
                    error: "'invoice' parameter is required for this store"
                skusNotUnique:
                  value:
                    error: provided skus are not unique
                skusNotFound:
                  value:
                    error: "SKUs not found in cubbo: SKU-UNKNOWN-1, SKU-UNKNOWN-2"
                skusOfSameProduct:
                  value:
                    error: >-
                      skus of same product were provided, make sure skus belong to different products. Skus of
                      same product: [SKU-RED-M, SKU-RED-M-ALT]
                masterBoxMissing:
                  value:
                    error: master_box_quantity not found for product SKU-BOX-BLUE
                noPresaleLocation:
                  value:
                    error: Aborted, no PRESALE location found in warehouse id 7.
                scopeConflict:
                  value:
                    error: Store 1234 is D2C-only; cannot create a b2b receipt
                storeModelUnset:
                  value:
                    error: Store 1234 has neither b2b nor d2c enabled
        "500":
          $ref: "#/components/responses/InternalServerError"
  /replenishments/{replenishment_id}:
    get:
      tags:
        - Replenishments
      operationId: getReplenishment
      summary: Get a replenishment
      description: |
        Returns a replenishment with its lines, the quantities received so far, the supplier invoice
        numbers captured at reception and the documents uploaded during receiving.

        - `replenishment_products[].received_quantity` counts units physically received for the line
          (counted at the dock, stored, or reserved), so it is `0` until receiving starts and excludes
          sell-ahead units that have not arrived.
        - `replenishment_products[].received_by_invoice` splits `received_quantity` by the supplier
          invoice (factura) number each unit was stamped with at reception. Units received without a
          captured invoice fall into the `invoice_number: null` bucket, which is listed last. The
          buckets always add up to `received_quantity`. Supplier invoice capture must be enabled for the
          warehouse or the store by Cubbo support; otherwise everything lands in the `null` bucket.
        - `supplier_invoices` lists the distinct supplier invoice numbers captured for this replenishment
          (the fiscal record, kept even after the units are put away). `supplier_invoice_files` lists the
          documents uploaded during receiving as short-lived download links (valid for 15 minutes).
        - `return` is filled only when the replenishment is the reception of a return (`is_return: true`).
      security:
        - bearerAuth: []
      parameters:
        - name: replenishment_id
          in: path
          required: true
          description: Cubbo id of the replenishment.
          schema:
            type: integer
          example: 55001
      responses:
        "200":
          description: The replenishment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Replenishment"
              example:
                id: 55001
                status: PROCESSING
                store_id: 1234
                notes: Pallet 2 contains fragile items
                created_at: "2026-10-12T14:03:11.512Z"
                expected_arrived_at: "2026-11-02T15:00:00.000Z"
                sell_ahead: false
                declared_value: null
                is_return: false
                completed_at: null
                supplier_invoices:
                  - invoice_number: F-111
                  - invoice_number: F-222
                supplier_invoice_files:
                  - url: https://files.example.com/replenishments/55001/factura.pdf?signature=fake
                    filename: factura.pdf
                    content_type: application/pdf
                    byte_size: 48213
                    expires_at: "2026-10-12T14:18:11Z"
                return: null
                replenishment_products:
                  - product_id: 9001
                    expected_quantity: 100
                    unit_value: "12.5"
                    product:
                      id: 9001
                      name: Red T-shirt M
                      bar_code: "7501234567890"
                      is_scannable: true
                      product_codes:
                        - id: 31001
                          sku: SKU-RED-M
                    received_quantity: 80
                    received_by_invoice:
                      - invoice_number: F-111
                        quantity: 50
                      - invoice_number: F-222
                        quantity: 20
                      - invoice_number: null
                        quantity: 10
                  - product_id: 9002
                    expected_quantity: 48
                    unit_value: null
                    product:
                      id: 9002
                      name: Blue box
                      bar_code: "7501234567891"
                      is_scannable: true
                      product_codes:
                        - id: 31002
                          sku: SKU-BOX-BLUE
                    received_quantity: 0
                    received_by_invoice: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value:
                    error: no replenishment with id 55001 was found.
                invalidId:
                  value:
                    error: "'replenishment_id' is not a valid Integer"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Replenishments
      operationId: updateReplenishment
      summary: Update a replenishment
      description: |
        Updates the notes and the announced lines of a replenishment that has not started receiving.

        - Allowed only while the status is `WITHOUT_SCHEDULING`, `PENDING` or `REQUESTED`. Once the
          shipment is in transit or at the warehouse the update is refused.
        - Not available for sell-ahead replenishments, nor for replenishments bound to a Brazilian
          warehouse (code `br_warehouse_not_supported`): on the Brazilian path the declared values become
          the NF-e of entry and must not change afterwards.
        - `products` is a partial update: each listed SKU either replaces the quantity (and, when sent,
          the `unit_value`) of its existing line, or is added as a new line. Lines you do not list are
          left untouched; lines cannot be removed through this endpoint. Omitting `unit_value` keeps the
          stored value.
        - If the replenishment has a booked receiving appointment at a warehouse with native scheduling
          and the new quantities need more dock capacity than reserved, Cubbo tries to extend the booked
          time slots; when they cannot fit, the update is refused with code `reschedule_required` and
          nothing is changed. Reschedule the appointment first, then retry.
        - Errors raised by business rules use the `{error, code, context}` envelope (`code` may be an
          empty string and `context` null); parameter errors use the plain `{error}` envelope.
      security:
        - bearerAuth: []
      parameters:
        - name: replenishment_id
          in: path
          required: true
          description: Cubbo id of the replenishment.
          schema:
            type: integer
          example: 55001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplenishmentUpdateRequest"
            example:
              notes: Arrives on two pallets
              products:
                - sku: SKU-RED-M
                  quantity: 120
                  unit_value: "12.50"
                - sku: SKU-GREEN-L
                  quantity: 30
      responses:
        "200":
          description: Replenishment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplenishmentSummary"
              example:
                id: 55001
                status: REQUESTED
                store_id: 1234
                notes: Arrives on two pallets
                created_at: "2026-10-12T14:03:11.512Z"
                expected_arrived_at: "2026-11-02T15:00:00.000Z"
                sell_ahead: false
                declared_value: null
                warehouse_id: 7
                replenishment_products:
                  - product_id: 9001
                    expected_quantity: 120
                    unit_value: "12.5"
                    product:
                      id: 9001
                      name: Red T-shirt M
                      bar_code: "7501234567890"
                      is_scannable: true
                      product_codes:
                        - id: 31001
                          sku: SKU-RED-M
                  - product_id: 9003
                    expected_quantity: 30
                    unit_value: null
                    product:
                      id: 9003
                      name: Green T-shirt L
                      bar_code: "7501234567892"
                      is_scannable: true
                      product_codes:
                        - id: 31003
                          sku: SKU-GREEN-L
                warehouse:
                  id: 7
                  name: Mexico City
                  unique_code: MX-CDMX-1
                  address1: Av. Ejemplo 123
                  address2: null
                  zip_code: "01000"
                  city: Ciudad de México
                  state: CDMX
                  country: MX
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ReplenishmentUpdateError"
              examples:
                missingParam:
                  value:
                    error: Parameter quantity is required
                notFound:
                  value:
                    error: Couldn't find Replenishment with 'id'=55001
                brazilNotSupported:
                  value:
                    error: Replenishment updates via API are not available for Brazilian warehouses
                    code: br_warehouse_not_supported
                    context: null
                alreadyProcessing:
                  value:
                    error: >-
                      replenishment 55001 has started processing and cannot be updated. Current status:
                      PROCESSING
                    code: ""
                    context: null
                sellAhead:
                  value:
                    error: replenishment 55001 is sell_ahead and cannot be updated
                    code: ""
                    context: null
                skusNotUnique:
                  value:
                    error: provided skus are not unique
                    code: ""
                    context: null
                skuNotFound:
                  value:
                    error: SKU 'SKU-UNKNOWN-1' doesn't exist in Cubbo
                    code: ""
                    context: null
                skusOfSameProduct:
                  value:
                    error: >-
                      skus of same product were provided, make sure skus belong to different products. Skus of
                      same product: [SKU-RED-M, SKU-RED-M-ALT]
                    code: ""
                    context: null
                unitValueFormat:
                  value:
                    error: >-
                      unit_value for SKU-RED-M must be a plain decimal number with at most 2 decimal places,
                      such as 12.50
                    code: UNIT_VALUE_INVALID_FORMAT
                    context: null
                unitValueOutOfRange:
                  value:
                    error: unit_value for SKU-RED-M is out of range (must be below 100000000000000)
                    code: UNIT_VALUE_OUT_OF_RANGE
                    context: null
                unitValueNotPositive:
                  value:
                    error: unit_value for SKU-RED-M must be greater than 0
                    code: UNIT_VALUE_NOT_POSITIVE
                    context: null
                rescheduleRequired:
                  value:
                    error: >-
                      updated quantities need 12 units but only 8 fit the booked franjas — reschedule the
                      appointment
                    code: reschedule_required
                    context:
                      replenishment_id: 55001
                      inbound_appointment_id: 777
                appointmentChanged:
                  value:
                    error: appointment 777 changed concurrently — retry the update
                    code: reschedule_required
                    context:
                      replenishment_id: 55001
                      inbound_appointment_id: 777
        "500":
          $ref: "#/components/responses/InternalServerError"
  /replenishments/{replenishment_id}/attach-invoice:
    post:
      tags:
        - Replenishments
      operationId: attachReplenishmentInvoice
      summary: Attach an NF-e issued through Cubbo's Brazilian invoicing provider
      description: |
        Brazil only. Registers on the replenishment an NF-e (Nota Fiscal eletrônica, the Brazilian
        fiscal invoice) that was already authorized through the invoicing provider Cubbo integrates for
        your store, identified by its 44-digit access key. Cubbo stores the reference as pre-approved and
        then confirms the document with the provider in the background, downloading its XML and PDF.

        - Exactly one invoice per request (the `invoices` array must contain a single item).
        - `purpose` says what the document covers: `REPLENISHMENT_INVOICE` for the NF-e of entry of the
          goods, `REPLENISHMENT_ADJUSTMENT_INVOICE` for an adjustment note. A replenishment can hold only
          one active invoice per purpose; cancelled invoices do not count, so a cancelled one can be
          replaced.
        - If the access key is already registered in Cubbo, no new invoice is created: the existing one
          is re-synchronized with the provider and the response lists its key under `update_invoice_ids`.
        - A previously recorded invoice issuing error on the replenishment is cleared.
        - For `REPLENISHMENT_INVOICE`, Cubbo derives the expected quantities per lot from the invoice,
          which makes the variance report available for the replenishment.
      security:
        - bearerAuth: []
      parameters:
        - name: replenishment_id
          in: path
          required: true
          description: Cubbo id of the replenishment.
          schema:
            type: integer
          example: 55001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplenishmentAttachInvoiceRequest"
            example:
              invoice_type: WEBMANIA
              invoices:
                - key: "00000000000000000000000000000000000000000000"
                  identifier: "123456"
                  purpose: REPLENISHMENT_INVOICE
                  operation_type: ENTRADA
                  operation_nature: Remessa para armazenagem
      responses:
        "200":
          description: |
            Invoice registered. `new_invoice_ids` holds the ids of the invoices created. When the key was
            already known, `new_invoice_ids` is empty and `update_invoice_ids` lists the existing keys
            (comma-separated string) that were re-synchronized instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplenishmentAttachInvoiceResponse"
              examples:
                created:
                  value:
                    new_invoice_ids:
                      - 8801
                alreadyKnown:
                  value:
                    new_invoice_ids: []
                    update_invoice_ids: "00000000000000000000000000000000000000000000"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingParam:
                  value:
                    error: Parameter invoices is required
                badKey:
                  value:
                    error: Parameter key must contain numbers only
                badPurpose:
                  value:
                    error: >-
                      Parameter purpose must be within ["REPLENISHMENT_INVOICE",
                      "REPLENISHMENT_ADJUSTMENT_INVOICE"]
                unsupportedType:
                  value:
                    error: only WEBMANIA is supported for now
                notFound:
                  value:
                    error: Couldn't find Replenishment with 'id'=55001
                tooManyInvoices:
                  value:
                    error: only one invoice is expected per request
                identifierExists:
                  value:
                    error: "some identifiers provided already exist: [\"123456\"]"
                purposeExists:
                  value:
                    error: >-
                      some invoices with same replenishment and purpose already exist:
                      ["REPLENISHMENT_INVOICE"]
                providerError:
                  value:
                    error: "WebmaniaError: NF-e not found"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /replenishments/{replenishment_id}/invoice-issuing-error:
    patch:
      tags:
        - Replenishments
      operationId: updateReplenishmentInvoiceIssuingError
      summary: Record or clear an invoice issuing error
      description: |
        Brazil only. Records on the replenishment the reason your invoicing system could not issue the
        NF-e for it, so the problem is visible on the replenishment in Cubbo and can be followed up.
        Send `invoice_issuing_error` with a message to record it, or omit it (or send `null`) to clear a
        previously recorded error. The error is also cleared automatically when an invoice is attached.
      security:
        - bearerAuth: []
      parameters:
        - name: replenishment_id
          in: path
          required: true
          description: Cubbo id of the replenishment.
          schema:
            type: integer
          example: 55001
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplenishmentInvoiceIssuingErrorRequest"
            example:
              invoice_issuing_error: "SEFAZ rejected the NF-e: recipient CNPJ not registered"
      responses:
        "200":
          description: Error recorded or cleared. Empty body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value:
                    error: Couldn't find Replenishment with 'id'=55001
                invalidType:
                  value:
                    error: "'invoice_issuing_error' is not a valid String"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /replenishments/{replenishment_id}/variance-report:
    get:
      tags:
        - Replenishments
      operationId: getReplenishmentVarianceReport
      summary: Get the variance report of a replenishment
      description: |
        Compares, per declared lot, the quantity you announced with the quantity the warehouse actually
        received. Available only for replenishments that declared expected quantities per lot, either
        through `products[].lots` on creation or derived from an attached NF-e (see attach-invoice).

        - By default the replenishment must be `COMPLETED`. Send `ignore_not_completed=true` to read a
          partial report while receiving is still in progress.
        - `variance` is `received_quantity - expected_quantity`: negative means units are missing,
          positive means more units than announced were received.
        - A declared lot that was never matched to a received lot is reported with `lot_id: null`,
          `received_quantity: 0` and a variance equal to minus its expected quantity.
      security:
        - bearerAuth: []
      parameters:
        - name: replenishment_id
          in: path
          required: true
          description: Cubbo id of the replenishment.
          schema:
            type: integer
          example: 55001
        - name: ignore_not_completed
          in: query
          required: false
          description: When `true`, returns the report even if the replenishment is not `COMPLETED` yet.
          schema:
            type: boolean
            default: false
          example: false
      responses:
        "200":
          description: One row per declared lot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplenishmentVarianceReport"
              example:
                - product_id: 9002
                  expected_quantity: 24
                  box_sku: SKU-BOX-BLUE
                  received_quantity: 24
                  lot_id: 4101
                  variance: 0
                - product_id: 9002
                  expected_quantity: 24
                  box_sku: SKU-BOX-BLUE
                  received_quantity: 20
                  lot_id: 4102
                  variance: -4
                - product_id: 9004
                  expected_quantity: 10
                  box_sku: SKU-BOX-RED
                  received_quantity: 0
                  lot_id: null
                  variance: -10
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value:
                    error: Couldn't find Replenishment with 'id'=55001
                notCompleted:
                  value:
                    error: replenishment 55001 is not in COMPLETED
                notCompatible:
                  value:
                    error: >-
                      this replenishment is not compatible with variance report, no
                      expected_replenishment_product_quantities were found
        "500":
          $ref: "#/components/responses/InternalServerError"
  /replenishments/attach-external-invoice:
    post:
      x-excluded: true
      tags:
        - Replenishments
      operationId: attachReplenishmentExternalInvoice
      summary: Attach an externally issued NF-e to a replenishment
      description: |
        Brazil only. Pushes onto a replenishment an NF-e (Nota Fiscal eletrônica, the Brazilian fiscal
        invoice) of entry that was issued outside Cubbo, sending the authorized XML. Cubbo stores the
        document as approved, reads the series and total from the XML, renders the DANFE (printable
        representation) and keeps it with the replenishment.

        - Available only for stores where Cubbo does not issue the replenishment NF-e (you provide your
          own). Otherwise the request is refused with code `REPLENISHMENT_NOT_ELIGIBLE_FOR_INVOICE`.
          Ask Cubbo support to configure this for your store.
        - The replenishment must belong to one of the stores your API credentials can access; other ids
          are reported as not found.
        - `invoice_xml` is the complete authorized NF-e (`nfeProc`), either as raw XML or base64-encoded
          (a `data:` URI prefix is accepted). The access key embedded in the XML must match `access_key`.
        - Idempotent: if the replenishment already has an approved replenishment NF-e, that invoice is
          returned and nothing new is created. An access key already registered on another document is
          refused.
        - If another attach for the same replenishment is still being processed, the API answers 202 with
          a `transaction_id`; retry after a moment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplenishmentExternalInvoiceRequest"
            example:
              replenishment_id: 55001
              access_key: "00000000000000000000000000000000000000000000"
              invoice_number: "123"
              invoice_xml: >-
                <?xml version="1.0" encoding="UTF-8"?><nfeProc xmlns="http://www.portalfiscal.inf.br/nfe"
                versao="4.00">...</nfeProc>
              message: NF-e issued by our ERP
      responses:
        "200":
          description: NF-e attached (or already attached)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplenishmentExternalInvoiceResponse"
              example:
                invoice_id: 8802
                key: "00000000000000000000000000000000000000000000"
                status: APPROVED
        "202":
          description: Another attach for this replenishment is still processing; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplenishmentExternalInvoiceAccepted"
              example:
                message: Accepted, another invoice attach for this replenishment is still processing.
                transaction_id: a1b2c3d4
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error. `code` is present only for coded business errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplenishmentCodedError"
              examples:
                missingParam:
                  value:
                    error: Parameter invoice_xml is required
                badAccessKey:
                  value:
                    error: Parameter access_key must be the 44-digit NF-e access key
                notFound:
                  value:
                    error: no replenishment found with replenishment_id 55001
                notEligible:
                  value:
                    error: replenishment 55001 is not eligible for an external invoice
                    code: REPLENISHMENT_NOT_ELIGIBLE_FOR_INVOICE
                keyMismatch:
                  value:
                    error: access_key does not match the NF-e XML
                keyExists:
                  value:
                    error: an invoice with key 00000000000000000000000000000000000000000000 already exists
        "500":
          $ref: "#/components/responses/InternalServerError"
  /reports/inventory-transactions:
    get:
      tags:
        - Reports
      operationId: getInventoryTransactionsReport
      summary: Inventory transactions report
      description: >
        Returns every inventory movement of a store in a date range as data rows: the same rows the

        inventory transactional CSV report carries, with numbers as numbers and timestamps in ISO 8601.

        Each row is one movement (inbound, sale, return, damaged, lost, transfer) with its signed

        volume, the product's balance after the movement, the warehouse, and the Brazilian invoice

        (NF-e) linked to it when there is one.

        - **This report must be enabled for your store by Cubbo.** Until it is, every call returns 422 with
        code `REPORT_NOT_ENABLED`.

        - `from` and `to` accept a date (`YYYY-MM-DD`) or a timestamp. A bare date covers the whole day in the
        report's time zone (America/Sao_Paulo); a timestamp is used as sent. Both must be complete dates
        (year, month and day).

        - The range may not exceed 92 days, and `from` must be on or before `to`.

        - At most 10000 rows are returned per call. Larger results are refused with `RESULT_TOO_LARGE` rather
        than truncated, because `balance_after` is absolute and a narrower range is still correct: split the
        range and call again.

        - `skus[]` restricts the rows to the given SKUs of the store.

        - Rows are in chronological order. The data comes from a replica, so very recent movements can lag.

        - A store that does not exist or that your token cannot access returns 404 with code
        `STORE_NOT_FOUND`; the two cases are deliberately indistinguishable.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          description: Store to report on.
          schema:
            type: integer
          example: 1234
        - name: from
          in: query
          required: true
          description: >-
            Start of the range. A date (`YYYY-MM-DD`) starts at 00:00:00 of that day in America/Sao_Paulo; a
            timestamp is used as sent.
          schema:
            type: string
          example: "2026-06-01"
        - name: to
          in: query
          required: true
          description: >-
            End of the range. A date (`YYYY-MM-DD`) ends at 23:59:59 of that day in America/Sao_Paulo; a
            timestamp is used as sent (an explicit `T00:00:00` is midnight, not the whole day).
          schema:
            type: string
          example: "2026-06-30"
        - name: skus[]
          in: query
          required: false
          description: Only movements of products carrying one of these SKUs. Repeat the parameter for several SKUs.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example:
            - SKU-RED-M
      responses:
        "200":
          description: The report rows and the resolved range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransactionsResponse"
              example:
                data:
                  - cnpj: 00.000.000/0001-00
                    store_name: Example Store
                    transaction_type: inbound
                    invoice_access_key: "00000000000000000000000000000000000000000000"
                    invoice_number: S1 N1001
                    order_number: "5678"
                    inventory_type: physical
                    inbound_outbound: inbound
                    warehouse_code: WH-SP-01
                    warehouse_name: Sao Paulo
                    sku_cph: SKU-RED-M
                    name: Widget Pro Black
                    material_sku: SKU-RED-M
                    volume: 50
                    quantity: 50
                    balance_after: 50
                    timestamp: "2026-06-02T10:15:00-03:00"
                    quality: good
                    quality_source: null
                  - cnpj: 00.000.000/0001-00
                    store_name: Example Store
                    transaction_type: sale
                    invoice_access_key: "00000000000000000000000000000000000000000001"
                    invoice_number: S1 N1002
                    order_number: ORD-0001
                    inventory_type: physical
                    inbound_outbound: outbound
                    warehouse_code: WH-SP-01
                    warehouse_name: Sao Paulo
                    sku_cph: SKU-RED-M
                    name: Widget Pro Black
                    material_sku: SKU-RED-M
                    volume: -2
                    quantity: 2
                    balance_after: 48
                    timestamp: "2026-06-03T16:40:12-03:00"
                    quality: good
                    quality_source: null
                  - cnpj: 00.000.000/0001-00
                    store_name: Example Store
                    transaction_type: lost
                    invoice_access_key: null
                    invoice_number: null
                    order_number: ORD-0002
                    inventory_type: virtual
                    inbound_outbound: inbound
                    warehouse_code: WH-SP-01
                    warehouse_name: Sao Paulo
                    sku_cph: SKU-RED-M
                    name: Widget Pro Black
                    material_sku: SKU-RED-M
                    volume: 1
                    quantity: 1
                    balance_after: 1
                    timestamp: "2026-06-10T09:00:00-03:00"
                    quality: lost
                    quality_source: RETURN
                meta:
                  row_count: 3
                  from: "2026-06-01T00:00:00-03:00"
                  to: "2026-06-30T23:59:59-03:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The store does not exist or your token cannot access it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"
              example:
                error: store_not_found
                code: STORE_NOT_FOUND
        "422":
          description: >-
            Report not enabled, invalid range, or result too large. `code` identifies the case; parameter
            errors carry a null `code`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportError"
              examples:
                reportNotEnabled:
                  value:
                    error: the inventory transactional report is not enabled for this store
                    code: REPORT_NOT_ENABLED
                    context: null
                invalidDate:
                  value:
                    error: "`to` is not a valid date or timestamp"
                    code: INVALID_DATE
                    context: null
                invalidRange:
                  value:
                    error: "`from` must be on or before `to`"
                    code: INVALID_DATE_RANGE
                    context: null
                rangeTooWide:
                  value:
                    error: date range cannot exceed 92 days
                    code: DATE_RANGE_TOO_WIDE
                    context: null
                resultTooLarge:
                  value:
                    error: >-
                      the requested range returns 15230 rows, more than the 10000 this endpoint returns at
                      once; request a narrower range
                    code: RESULT_TOO_LARGE
                    context:
                      row_count: 15230
                      max_rows: 10000
                missingParam:
                  value:
                    error: Parameter from is required
                    code: null
                    context: null
        "500":
          $ref: "#/components/responses/InternalServerError"
  /returns:
    post:
      tags:
        - Returns
      operationId: createReturn
      summary: Request a return for a shipped order
      description: |
        Creates a return request for an order your store already shipped. By default the return is
        created as `TO_BE_DETERMINED` in status `PENDING`: it records what the customer says is coming
        back and waits to be reviewed (resolved) by Cubbo or by you. If you already know the outcome,
        set `return_type` to `SIMPLE_RETURN` or `EXCHANGE` and the return is resolved in the same call:
        the order moves to `returning`, the return moves to `REQUESTED`, the return instructions (RMA
        document) are generated and emailed to the customer, and optionally a prepaid return shipping
        label is booked with the carrier.

        - The order must belong to `store_id`, be in status `shipped`, must not be a pick-and-ship
          order, and must not already have an active (non-cancelled) return.
        - Omit `products` (or send `[]`) for a full return: every ordered item at its full ordered
          quantity. Otherwise list the SKUs and quantities coming back; repeated SKUs are summed.
        - Kits cannot be returned or exchanged; list the individual products instead.
        - `generate_guide` is required whenever `return_type` is not `TO_BE_DETERMINED`. Send
          `false` to resolve without booking a return shipping label (the RMA is still generated).
        - For `EXCHANGE`, `exchange_products` lists the replacement items (resolved against your
          store catalog, not the order) and their stock is reserved right away, to ship once the
          return arrives.
        - Return-level blockers (order not shipped, return already exists) are reported before
          item-level errors.
        - If the return is created but the immediate resolution fails (for example the carrier
          rejects the label), the return stays `PENDING` / `TO_BE_DETERMINED` and the error is
          returned; fetch it with `GET /returns/{return_id}` before retrying, since a second call
          would answer `RETURN_ALREADY_EXISTS`.
        - Your API credentials need the permission to create returns;
          ask Cubbo support if the call answers 401 with a valid token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnCreateRequest"
            examples:
              toBeDetermined:
                summary: Request a return to be reviewed later
                value:
                  store_id: 1234
                  order_number: ORD-0001
                  notes: Customer changed their mind
                  products:
                    - sku: SKU-RED-M
                      quantity: 1
              simpleReturnWithLabel:
                summary: Resolve immediately as a simple return with a prepaid label
                value:
                  store_id: 1234
                  order_number: ORD-0001
                  notes: Wrong size
                  return_type: SIMPLE_RETURN
                  generate_guide: true
                  products:
                    - sku: SKU-RED-M
                      quantity: 1
              exchange:
                summary: Resolve immediately as an exchange
                value:
                  store_id: 1234
                  order_number: ORD-0001
                  notes: Wants size L instead of M
                  return_type: EXCHANGE
                  generate_guide: true
                  products:
                    - sku: SKU-RED-M
                      quantity: 1
                  exchange_products:
                    - sku: SKU-RED-L
                      quantity: 1
      responses:
        "201":
          description: >-
            Return created. Only the listed fields are returned; `exchange_products` is present only for
            `EXCHANGE` returns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnCreated"
              examples:
                toBeDetermined:
                  value:
                    id: 98765
                    status: PENDING
                    return_type: TO_BE_DETERMINED
                    notes: Customer changed their mind
                    externally_requested: true
                    expected_products:
                      - product_id: 5551
                        quantity: 1
                        skus:
                          - SKU-RED-M
                    created_at: "2026-10-12T15:04:05.123Z"
                    order_number: ORD-0001
                exchange:
                  value:
                    id: 98766
                    status: REQUESTED
                    return_type: EXCHANGE
                    notes: Wants size L instead of M
                    externally_requested: true
                    expected_products:
                      - product_id: 5551
                        quantity: 1
                        skus:
                          - SKU-RED-M
                    exchange_products:
                      - product_id: 5552
                        quantity: 1
                        skus:
                          - SKU-RED-L
                    created_at: "2026-10-12T15:04:05.123Z"
                    order_number: ORD-0001
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another return request for the same order is still being processed. Retry after a moment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnError"
              example:
                error: a return request for this order is already in progress
                code: RETURN_REQUEST_IN_FLIGHT
        "422":
          description: |
            Validation or business error. `code` is a stable machine-readable identifier (`null` for
            parameter validation errors); `context` carries the offending `sku` when relevant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnError"
              examples:
                missingParam:
                  value:
                    error: Parameter store_id is required
                    code: null
                    context: null
                missingGenerateGuide:
                  summary: return_type given without generate_guide
                  value:
                    error: Parameter generate_guide is required
                    code: null
                    context: null
                invalidReturnType:
                  summary: return_type outside the accepted values (e.g. IMMEDIATE_EXCHANGE)
                  value:
                    error: Parameter return_type must be within ["TO_BE_DETERMINED", "SIMPLE_RETURN", "EXCHANGE"]
                    code: null
                    context: null
                storeNotFound:
                  value:
                    error: store 1234 not found
                    code: STORE_NOT_FOUND
                    context: null
                orderNotFound:
                  value:
                    error: order ORD-0001 not found
                    code: ORDER_NOT_FOUND
                    context: null
                returnAlreadyExists:
                  value:
                    error: order already has an active return
                    code: RETURN_ALREADY_EXISTS
                orderNotShipped:
                  value:
                    error: only shipped orders can be returned
                    code: ORDER_NOT_SHIPPED
                pickAndShipNotSupported:
                  value:
                    error: pick and ship orders cannot be returned this way
                    code: PICK_AND_SHIP_NOT_SUPPORTED
                invalidSku:
                  value:
                    error: sku SKU-BLUE-S is not part of order ORD-0001
                    code: INVALID_SKU
                    context:
                      sku: SKU-BLUE-S
                invalidExchangeSku:
                  value:
                    error: sku SKU-BLUE-S is not a product in the store
                    code: INVALID_SKU
                    context:
                      sku: SKU-BLUE-S
                ambiguousSku:
                  value:
                    error: sku SKU-RED-M maps to more than one product on order ORD-0001
                    code: AMBIGUOUS_SKU
                    context:
                      sku: SKU-RED-M
                kitNotSupported:
                  value:
                    error: sku KIT-001 is a kit and cannot be returned
                    code: KIT_NOT_SUPPORTED
                    context:
                      sku: KIT-001
                invalidQuantity:
                  value:
                    error: quantity 3 for sku SKU-RED-M exceeds the ordered quantity 1
                    code: INVALID_QUANTITY
                    context:
                      sku: SKU-RED-M
                      ordered_quantity: 1
        "500":
          $ref: "#/components/responses/InternalServerError"
  /returns/{return_id}:
    get:
      tags:
        - Returns
      operationId: getReturn
      summary: Get a return
      description: |
        Returns the current state of one return of your store: its status and type, what the customer
        declared is coming back (`expected_products`), and the products of the original order that can
        be received (`return_products`). Use it to follow a return after creating it, or to check a
        return reported on an order (`returned_order_id` / `returned_order_number`).

        - For products tracked by unit code (IMEI or serial number), each `return_products` entry
          also lists the `unit_codes` that shipped on the original order. Products that do not track
          unit codes never carry that key.
        - A return that does not exist or does not belong to one of your stores answers 404.
      security:
        - bearerAuth: []
      parameters:
        - name: return_id
          in: path
          required: true
          description: Numeric id of the return, as returned when it was created or on the order.
          schema:
            type: integer
          example: 98765
      responses:
        "200":
          description: The return.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnDetail"
              example:
                id: 98765
                status: PENDING
                return_type: TO_BE_DETERMINED
                resolved_at: null
                notes: Customer changed their mind
                expected_products:
                  - product_id: 5551
                    quantity: 1
                    skus:
                      - SKU-RED-M
                return_products:
                  - product_id: 5551
                    name: Red T-shirt M
                    barcode: "7501234567890"
                    quantity: 1
                    skus:
                      - SKU-RED-M
                    image_url: /rails/active_storage/blobs/redirect/abc123/red-tshirt.png
                  - product_id: 5560
                    name: Smartphone 128GB
                    barcode: "7509876543210"
                    quantity: 1
                    skus:
                      - PHONE-BLK-128
                    image_url: null
                    unit_codes:
                      - IMEI-000000000000001
                returned_order_id: 445566
                returned_order_number: ORD-0001
                created_at: "2026-10-12T15:04:05.123Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No return with that id in your stores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no return found with return_id 98765
        "500":
          $ref: "#/components/responses/InternalServerError"
  /returns/{return_id}/attach-invoice:
    post:
      tags:
        - Returns
      operationId: attachReturnInvoice
      summary: Register the inbound NF-e issued for a return (Brazil)
      description: |
        Brazil only, for stores whose NF-e are issued through Cubbo's fiscal provider. After your
        store issues the inbound NF-e (*Nota Fiscal Eletrônica de entrada*) for a returned order, call
        this endpoint with the invoice references so Cubbo can link them to the return and fetch the
        authorized document. Each item is linked according to its `purpose`:

        - `RETURN_INVOICE`: the NF-e that documents the goods coming back from the customer; linked
          to the return.
        - `REPLENISHMENT_INVOICE`: the NF-e that documents the stock re-entering the warehouse;
          linked to the return's stock re-entry (`replenishment_id` in the awaiting-invoice list).

        Behaviors:
        - The return's stock re-entry must be in the put-away stage (the same condition that lists
          it under `GET /returns/awaiting-invoice`); otherwise 422.
        - If every `key` you send is already registered, nothing is created: Cubbo re-syncs the
          existing invoices and answers 200 with `new_invoice_ids: []` and the matched keys in
          `update_invoice_ids`.
        - An `identifier` that is already used by a non-cancelled invoice is rejected (422). You
          may reuse an identifier whose previous invoice was cancelled.
        - Duplicate keys or identifiers within the same request are rejected (422).
        - Invoices are stored as pre-approved and confirmed asynchronously with the fiscal provider.
        - Your API credentials need the permission to update orders.
      security:
        - bearerAuth: []
      parameters:
        - name: return_id
          in: path
          required: true
          description: Numeric id of the return.
          schema:
            type: integer
          example: 98765
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnAttachInvoiceRequest"
            example:
              invoices:
                - key: "00000000000000000000000000000000000000000000"
                  identifier: RET-98765-M
                  purpose: RETURN_INVOICE
                  operation_type: ENTRADA
                  operation_nature: Retorno de mercadoria nao entregue
                  total_value: "116.56"
      responses:
        "200":
          description: Invoices registered (or already present and re-synced).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnAttachInvoiceResult"
              examples:
                created:
                  value:
                    new_invoice_ids:
                      - 880001
                alreadyRegistered:
                  value:
                    new_invoice_ids: []
                    update_invoice_ids: "00000000000000000000000000000000000000000000"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingInvoices:
                  value:
                    error: Parameter invoices is required
                badKey:
                  value:
                    error: Parameter key must contain numbers only
                badPurpose:
                  value:
                    error: Parameter purpose must be within ["RETURN_INVOICE", "REPLENISHMENT_INVOICE"]
                badOperationType:
                  value:
                    error: Parameter operation_type must be within ["ENTRADA"]
                unsupportedInvoiceType:
                  value:
                    error: only WEBMANIA is supported for now
                returnNotFound:
                  value:
                    error: Couldn't find Return with 'id'=98765
                notInPutaway:
                  value:
                    error: replenishment id 77001 of return id 98765 is not in putaway status, status is RECEIVED
                duplicateIdentifiers:
                  value:
                    error: "duplicate invoice identifiers provided: [\"RET-98765-M\"]"
                duplicateKeys:
                  value:
                    error: "duplicate invoice keys provided: [\"00000000000000000000000000000000000000000000\"]"
                identifierExists:
                  value:
                    error: "some identifiers provided already exist: [\"RET-98765-M\"]"
                providerError:
                  value:
                    error: "WebmaniaError: <provider message>"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /returns/{return_id}/cancel:
    patch:
      tags:
        - Returns
      operationId: cancelReturn
      summary: Cancel a pending return
      description: |
        Cancels a return that is still `PENDING` (not yet resolved or received). Any stock reserved
        for the return (for example replacement items of an exchange, or units of a return by
        carrier) is released back to available inventory. Cancelling is a resolution of the return:
        your API credentials need the permission to resolve returns.

        - Only `PENDING` returns can be cancelled; any other status answers 422 `RETURN_NOT_CANCELABLE`.
        - The request body is empty.
        - After cancellation the order can receive a new return request.
      security:
        - bearerAuth: []
      parameters:
        - name: return_id
          in: path
          required: true
          description: Numeric id of the return.
          schema:
            type: integer
          example: 98765
      responses:
        "200":
          description: The return, now cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnCancelled"
              example:
                id: 98765
                status: CANCELLED
                return_type: TO_BE_DETERMINED
                resolved_at: "2026-10-12T16:00:00.000Z"
                created_at: "2026-10-12T15:04:05.123Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No return with that id in your stores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no return found with return_id 98765
        "409":
          description: Another cancel for the same return is still being processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnError"
              example:
                error: a cancel for this return is already in progress
                code: CANCEL_IN_FLIGHT
        "422":
          description: The return cannot be cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnError"
              examples:
                notCancelable:
                  value:
                    error: return 98765 is not pending and cannot be cancelled
                    code: RETURN_NOT_CANCELABLE
        "500":
          $ref: "#/components/responses/InternalServerError"
  /returns/{return_id}/decision:
    post:
      tags:
        - Returns
      operationId: decideReturn
      summary: Decide what to do with an order returned by the carrier
      description: |
        When a carrier cannot deliver an order and brings it back, Cubbo creates a return of type
        `RETURNED_BY_CARRIER` in status `PENDING` and waits for a decision. Use this endpoint to take
        that decision:

        - `resend`: Cubbo duplicates the original order into a new order (same items, same shipping
          data, cash-on-delivery and document/pickup requirements carried over), assigns the units
          reserved by the return to it and ships it again. The return moves to `ORDERED` and the new
          order is returned in `created_order`. Answers 201.
        - `cancel_forward`: the order is not resent. The reserved units are released back to
          available inventory and the return moves to `CANCELLED`. Answers 200.

        Only a `PENDING` return of type `RETURNED_BY_CARRIER` can be decided; anything else answers
        422 `RETURN_NOT_DECIDABLE`. Your API credentials need the permission to resolve returns.
      security:
        - bearerAuth: []
      parameters:
        - name: return_id
          in: path
          required: true
          description: Numeric id of the return.
          schema:
            type: integer
          example: 98765
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnDecisionRequest"
            examples:
              resend:
                value:
                  decision: resend
              cancelForward:
                value:
                  decision: cancel_forward
      responses:
        "200":
          description: Decision `cancel_forward` applied; the return is cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnDecisionCancelForwardResult"
              example:
                decision: cancel_forward
                return_id: 98765
                return_status: CANCELLED
        "201":
          description: Decision `resend` applied; a new order was created from the returned one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnDecisionResendResult"
              example:
                decision: resend
                return_id: 98765
                return_status: ORDERED
                created_order:
                  id: 445577
                  order_number: ORD-0001_RC
                  status: pending
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No return with that id in your stores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no return found with return_id 98765
        "409":
          description: >-
            Another decision for the same return is still being processed (or Cubbo is resolving it
            internally).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnError"
              example:
                error: a decision for this return is already in progress
                code: DECISION_IN_FLIGHT
        "422":
          description: Validation or business error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnError"
              examples:
                invalidDecision:
                  value:
                    error: Parameter decision must be within ["resend", "cancel_forward"]
                    code: null
                missingDecision:
                  value:
                    error: Parameter decision is required
                    code: null
                notDecidable:
                  value:
                    error: return 98765 is not a pending returned-by-carrier return and cannot be decided
                    code: RETURN_NOT_DECIDABLE
                notCancelable:
                  summary: cancel_forward raced with a concurrent cancellation
                  value:
                    error: return 98765 is not pending and cannot be cancelled
                    code: RETURN_NOT_CANCELABLE
        "500":
          $ref: "#/components/responses/InternalServerError"
  /returns/attach-external-invoice:
    post:
      x-excluded: true
      tags:
        - Returns
      operationId: attachReturnExternalInvoice
      summary: Upload an inbound NF-e issued outside Cubbo for a return (Brazil)
      description: |
        Brazil only, for stores that issue their own NF-e (Cubbo does not issue the return invoice for
        the store). Sends the authorized NF-e XML of the inbound return invoice so Cubbo stores it on
        the return, renders the DANFE and uses it for the reception of the goods.

        - The return must belong to one of your stores and be eligible: the store issues its own
          invoices, the returned order ships from a Brazil warehouse, and the return does not carry an
          invoice yet. Otherwise 422 `RETURN_NOT_ELIGIBLE_FOR_INVOICE`.
        - `invoice_xml` must be the authorized, protocol-wrapped NF-e (`nfeProc`), either as raw
          XML or base64-encoded. The access key embedded in the XML must match `access_key`.
        - The call is idempotent for a return that already has an approved return NF-e: the existing
          invoice is returned. A different key that already exists elsewhere is rejected.
        - If another upload for the same return is still in progress the call answers 202; retry
          after a moment.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnAttachExternalInvoiceRequest"
            example:
              return_id: 98765
              access_key: "00000000000000000000000000000000000000000000"
              invoice_number: "123"
              invoice_xml: PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0iVVRGLTgiPz4KPG5mZVByb2MgLi4uPg==
              message: Return NF-e for order ORD-0001
      responses:
        "200":
          description: Invoice stored on the return (or the existing approved one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnExternalInvoiceResult"
              example:
                invoice_id: 880002
                key: "00000000000000000000000000000000000000000000"
                status: APPROVED
        "202":
          description: Another upload for this return is still being processed; nothing was stored by this call.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable explanation.
                    example: Accepted, another invoice attach for this return is still processing.
                  transaction_id:
                    type: string
                    description: Identifier of the in-flight operation, for support.
                    example: 0f1e2d3c
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >-
            Validation or business error. The return not existing, or not belonging to your stores, also
            answers 422.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingXml:
                  value:
                    error: Parameter invoice_xml is required
                badAccessKey:
                  value:
                    error: Parameter access_key must be the 44-digit NF-e access key
                returnNotFound:
                  value:
                    error: no return found with return_id 98765
                notEligible:
                  value:
                    error: return 98765 is not eligible for an external invoice
                keyMismatch:
                  value:
                    error: access_key does not match the NF-e XML
                keyExists:
                  value:
                    error: an invoice with key 00000000000000000000000000000000000000000000 already exists
                notAuthorizedXml:
                  value:
                    error: invoice_xml must be an authorized NF-e (nfeProc/NFe/infNFe not found)
        "500":
          $ref: "#/components/responses/InternalServerError"
  /returns/awaiting-invoice:
    get:
      tags:
        - Returns
      operationId: listReturnsAwaitingInvoice
      summary: List returns that still need an inbound NF-e (Brazil)
      description: |
        Brazil only. In Brazil, goods entering Cubbo's warehouse must be covered by an electronic
        invoice (NF-e, *Nota Fiscal Eletrônica*). When a returned order is received and is being put
        away, your store must issue the inbound NF-e for the return (and, when applicable, for the
        stock re-entry) and attach it with `POST /returns/{return_id}/attach-invoice`. This endpoint
        lists the returns of a store that are waiting for that document, newest first, so you can
        poll it and issue the missing invoices.

        A return is listed when all of the following hold:
        - its received stock is being put away (the reception has reached the put-away stage),
        - the original order has an approved sale (or donation) NF-e, whose access key is given in
          `related_sale_invoice` so you can reference it on the inbound invoice, and
        - it is still missing an approved, processing, contingency or pre-approved NF-e for either
          the return itself or its stock re-entry.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          description: Id of the store whose returns you want to list.
          schema:
            type: integer
          example: 1234
        - name: page
          in: query
          required: false
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: Results per page, at most 100.
          schema:
            type: integer
            maximum: 100
            default: 10
          example: 10
      responses:
        "200":
          description: Paginated list of returns awaiting an inbound NF-e.
          content:
            application/json:
              schema:
                type: object
                properties:
                  returns:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReturnAwaitingInvoice"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              example:
                returns:
                  - id: 98765
                    return_type: RETURNED_BY_CARRIER
                    replenishment_id: 77001
                    related_sale_invoice:
                      invoice_key: "00000000000000000000000000000000000000000000"
                    returned_order:
                      id: 445566
                      channel_order_id: "1000123"
                      order_number: ORD-0001
                      integration_details:
                        marketplace: MERCADOLIBRE
                meta:
                  current_page: 1
                  next_page: null
                  prev_page: null
                  total_pages: 1
                  first_page: true
                  last_page: true
                  per_page: 10
                  total_count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingStore:
                  value:
                    error: Parameter store_id is required
                storeNotFound:
                  value:
                    error: Couldn't find Store with 'id'=1234
                perPageTooLarge:
                  value:
                    error: Parameter per_page cannot be greater than 100
        "500":
          $ref: "#/components/responses/InternalServerError"
  /sandbox/orders/{order_id}/ship:
    post:
      tags:
        - Sandbox
      operationId: sandboxShipOrder
      summary: Ship an order
      description: |
        Simulates the warehouse picking, packing and shipping an order with a test shipping label, so you
        can test how your system reacts to an order being fulfilled.

        The order moves through `processing`, `picking` and `packing` to `shipped`. You receive an
        `orderUpdated` event for each of the first three statuses and an `orderFulfilled` event when it
        ships, with the same payloads as a real shipment.

        - Works only for test stores. See the "Test your integration" guide.
        - Only orders created through this API. Click and collect, pick-and-ship and stock removal
          orders are not supported.
        - The order must have stock assigned: status `pending`, or already in `processing`, `picking` or
          `packing` (it continues from there). An order in `backorder` answers `ORDER_WITHOUT_STOCK`;
          complete a replenishment with its products first.
        - No carrier is contacted. The tracking number starts with `SANDBOX-`, and the carrier name is
          the one of the order's shipping method.
        - `shipping_date` stays empty on orders shipped through the sandbox.
        - Move the shipment forward with `POST /sandbox/orders/{order_id}/tracking`.
        - No charges, invoices or customer emails are generated.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SandboxOrderId"
      responses:
        "200":
          description: The order was shipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxOrderShipment"
              example:
                id: 987654
                order_number: ORD-0001
                store_id: 1234
                status: shipped
                shipping_status: null
                tracking_number: SANDBOX-987654-1A2B3C4D
                carrier_name: DHL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SandboxForbidden"
        "404":
          $ref: "#/components/responses/SandboxNotFound"
        "409":
          description: The order cannot be shipped in its current state, or another request is updating it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxError"
              examples:
                withoutStock:
                  summary: No stock assigned
                  value:
                    error:
                      message: This order has no stock assigned yet. Complete a receipt with its products first.
                      code: ORDER_WITHOUT_STOCK
                invalidStatus:
                  summary: Status that cannot be shipped
                  value:
                    error:
                      message: This order is in status shipped and cannot be shipped.
                      code: INVALID_ORDER_STATUS
                concurrentRequest:
                  summary: Another request is updating it
                  value:
                    error:
                      message: This record is being updated by another request. Try again in a moment.
                      code: CONCURRENT_REQUEST
        "422":
          description: The order is not supported by the sandbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxError"
              examples:
                notFromApi:
                  summary: Order not created through the API
                  value:
                    error:
                      message: Only orders created through the API can be shipped through the sandbox.
                      code: ORDER_NOT_FROM_API
                unsupportedType:
                  summary: Unsupported order type
                  value:
                    error:
                      message: This order's type is not supported by the sandbox.
                      code: ORDER_TYPE_NOT_SUPPORTED
                noShippingMethod:
                  summary: No shipping method
                  value:
                    error:
                      message: This order has no shipping method.
                      code: ORDER_WITHOUT_SHIPPING_METHOD
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SandboxUnexpectedError"
  /sandbox/orders/{order_id}/tracking:
    post:
      tags:
        - Sandbox
      operationId: sandboxUpdateTracking
      summary: Change the tracking status
      description: |
        Simulates a carrier tracking event on an order shipped through the sandbox. You receive a
        `shippingUpdated` event with the same payload a real carrier event produces, and the order's
        `shipping_status` changes as it would.

        Call it as many times as you need, for example `shipment_collected`, then `shipment_in_transit`,
        `shipment_out_for_delivery` and `shipment_delivered`, or `shipment_with_incident` with an
        `incident_description` to test your incident handling.

        - Works only for test stores and only on orders shipped with `POST /sandbox/orders/{order_id}/ship`.
        - `shipment_delivered` is final: later changes answer `ORDER_ALREADY_DELIVERED`.
        - Sending the current status again answers `SAME_TRACKING_STATUS`, except for
          `shipment_with_incident`, which can repeat.
        - With `incident_description` `lost` or `stolen`, the webhook has no `estimated_time_arrival`,
          as with a real carrier.
        - No customer notifications are sent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SandboxOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxTrackingRequest"
            examples:
              inTransit:
                summary: In transit
                value:
                  status: shipment_in_transit
              incident:
                summary: Failed delivery attempt
                value:
                  status: shipment_with_incident
                  incident_description: not_at_home
              delivered:
                summary: Delivered
                value:
                  status: shipment_delivered
      responses:
        "200":
          description: The tracking event was recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxOrderShipment"
              example:
                id: 987654
                order_number: ORD-0001
                store_id: 1234
                status: shipped
                shipping_status: shipment_in_transit
                tracking_number: SANDBOX-987654-1A2B3C4D
                carrier_name: DHL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SandboxForbidden"
        "404":
          $ref: "#/components/responses/SandboxNotFound"
        "409":
          description: The order was not shipped through the sandbox, was already delivered, or already has that status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxError"
              examples:
                notShipped:
                  summary: Not shipped through the sandbox
                  value:
                    error:
                      message: Ship this order through the sandbox before changing its tracking status.
                      code: ORDER_NOT_SHIPPED_BY_SANDBOX
                delivered:
                  summary: Already delivered
                  value:
                    error:
                      message: This order was already delivered.
                      code: ORDER_ALREADY_DELIVERED
                sameStatus:
                  summary: Same status
                  value:
                    error:
                      message: This order already has tracking status shipment_in_transit.
                      code: SAME_TRACKING_STATUS
        "422":
          description: Invalid status or incident description.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxError"
              examples:
                invalidStatus:
                  summary: Unknown status
                  value:
                    error:
                      message: >-
                        status must be one of: shipment_collected, shipment_in_transit,
                        shipment_out_for_delivery, shipment_with_incident, shipment_delivered.
                      code: INVALID_TRACKING_STATUS
                invalidDescription:
                  summary: Description without an incident
                  value:
                    error:
                      message: incident_description is only accepted with status shipment_with_incident.
                      code: INVALID_INCIDENT_DESCRIPTION
                missingStatus:
                  summary: Missing status
                  value:
                    error:
                      message: Parameter status is required
                      code: INVALID_PARAMETER
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SandboxUnexpectedError"
  /sandbox/replenishments/{replenishment_id}/complete:
    post:
      tags:
        - Sandbox
      operationId: sandboxCompleteReplenishment
      summary: Complete a replenishment
      description: |
        Simulates the warehouse receiving and putting away everything a replenishment declared, so the
        stock becomes available to your orders. Use it after `POST /replenishments` to test your
        receiving and inventory flow without waiting for a real delivery.

        The replenishment moves through `PROCESSING` and `IN_PUTAWAY` to `COMPLETED`, and you receive the
        same webhooks as for a real receipt: one `replenishmentStatus` event per status, then an
        `inventoryMovement` event for the received products (if your inventory webhook is enabled).

        - Works only for test stores. See the "Test your integration" guide.
        - Every declared unit is received in full: no shortages, damages or lots.
        - The replenishment must not be canceled or completed, and Cubbo must not have started receiving it.
        - Return replenishments and pre-sale (`sell_ahead`) replenishments are not supported.
        - Orders already waiting for these products (`backorder`) pick up the new stock through Cubbo's
          regular backorder processing, which can take a few minutes. To test the shortest path, complete
          the replenishment before creating the order.
        - No receiving charges are generated and no email is sent.
      security:
        - bearerAuth: []
      parameters:
        - name: replenishment_id
          in: path
          required: true
          description: ID of the replenishment, as returned by `POST /replenishments`.
          schema:
            type: integer
            example: 5678
      responses:
        "200":
          description: The replenishment was completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxReplenishment"
              example:
                id: 5678
                store_id: 1234
                status: COMPLETED
                completed_at: "2026-10-20T15:04:05Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/SandboxForbidden"
        "404":
          $ref: "#/components/responses/SandboxNotFound"
        "409":
          description: The replenishment cannot be completed in its current state, or another request is updating it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxError"
              examples:
                invalidStatus:
                  summary: Already completed or canceled
                  value:
                    error:
                      message: This receipt is in status COMPLETED and cannot be completed.
                      code: INVALID_REPLENISHMENT_STATUS
                receivingStarted:
                  summary: Cubbo started receiving it
                  value:
                    error:
                      message: >-
                        Cubbo already started receiving this receipt, so it cannot be completed through the
                        sandbox.
                      code: RECEIVING_ALREADY_STARTED
                receptionUnavailable:
                  summary: No reception area free
                  value:
                    error:
                      message: No reception area is free right now. Try again in a few minutes.
                      code: RECEPTION_UNAVAILABLE
                concurrentRequest:
                  summary: Another request is updating it
                  value:
                    error:
                      message: This record is being updated by another request. Try again in a moment.
                      code: CONCURRENT_REQUEST
        "422":
          description: >-
            The replenishment is not supported by the sandbox, or the sandbox is not set up for your test
            store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxError"
              examples:
                notConfigured:
                  summary: Sandbox not set up
                  value:
                    error:
                      message: The sandbox is not set up for this test store yet. Contact your Cubbo account manager.
                      code: SANDBOX_NOT_CONFIGURED
                returnReplenishment:
                  summary: Return replenishment
                  value:
                    error:
                      message: Return receipts cannot be completed through the sandbox.
                      code: RETURN_REPLENISHMENT_NOT_SUPPORTED
                sellAhead:
                  summary: Pre-sale replenishment
                  value:
                    error:
                      message: Pre-sale receipts cannot be completed through the sandbox.
                      code: SELL_AHEAD_NOT_SUPPORTED
                empty:
                  summary: No products
                  value:
                    error:
                      message: This receipt has no products to receive.
                      code: EMPTY_REPLENISHMENT
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/SandboxUnexpectedError"
  /shipping-labels/{shipping_label_id}:
    get:
      tags:
        - Shipping labels
      operationId: getShippingLabel
      summary: Get a shipping label
      description: |
        Returns one shipping label of an order your credential can access, including the label
        file, the carrier tracking number and the tracking URLs. Return labels that travel inside
        the box for the recipient's later use are not shipping labels of the order and are not
        served by this endpoint (the response is the same as for an unknown id).
      security:
        - bearerAuth: []
      parameters:
        - name: shipping_label_id
          in: path
          required: true
          description: Id of the shipping label, as returned in the order's `shipping_labels`
          schema:
            type: integer
            example: 98765
      responses:
        "200":
          description: The shipping label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingLabel"
              example:
                id: 98765
                order_id: 55501
                billing_file: null
                shipping_number: TRACK0000001
                label_file:
                  path: /rails/active_storage/blobs/redirect/<blob-key>/label.pdf
                  url: https://api.cubbo.com/rails/active_storage/blobs/redirect/<blob-key>/label.pdf
                  filename: label.pdf
                  byte_size: 48213
                  content_type: application/pdf
                label_type: Shipping
                tracking_url: https://carrier.example.com/track/TRACK0000001
                cubbo_tracking_url: https://tracking.example.com/orders/<encoded-order-id>
        "401":
          description: Missing or invalid token, or no access to the label's order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              examples:
                invalidToken:
                  value:
                    error: Unauthorized
                    message: invalid token
                noOrderAccess:
                  value:
                    error: Unauthorized
                    message: not allowed to show? this Order
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidId:
                  value:
                    error: "'abc' is not a valid Integer"
                notFound:
                  value:
                    error: no shipping_label with id 98765 was found.
        "500":
          $ref: "#/components/responses/InternalServerError"
  /shipping-methods:
    get:
      tags:
        - Shipping methods
      operationId: listShippingMethods
      summary: List active shipping methods available to a store
      description: |
        Returns every active shipping method offered by the warehouses assigned to the store.
        Use the `id` values when creating orders or shipping groups that reference a shipping
        method. Carrier names are the customer-facing names.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          description: Id of the store. Your credential must have access to it.
          schema:
            type: integer
            example: 1234
      responses:
        "200":
          description: Active shipping methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShippingMethod"
              example:
                - id: 12
                  carrier_name: ESTAFETA
                  shipping_type: national
                  delivery_type: Ground
                  country: MX
                  is_cod: false
                - id: 15
                  carrier_name: CUBBO
                  shipping_type: national
                  delivery_type: NextDay
                  country: MX
                  is_cod: false
        "401":
          description: Missing or invalid token, or no access to the store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              examples:
                invalidToken:
                  value:
                    error: Unauthorized
                    message: invalid token
                noStoreAccess:
                  value:
                    error: Unauthorized
                    message: not allowed to show? this Store
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingStoreId:
                  value:
                    error: Parameter store_id is required
        "500":
          description: Unexpected error, including an unknown `store_id`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unexpected error, timestamp: 1700000000"
  /shipping-methods/configuration-coverage:
    get:
      tags:
        - Shipping methods
      operationId: getShippingConfigurationCoverage
      summary: Check which shipping method a shipping configuration would select for a postcode
      description: |
        Simulates routing an order to the given postcode through one of the store's shipping
        configurations (shipping groups, matched by name, case-insensitive) and returns the
        shipping method that would be selected. Use it to validate coverage before creating
        orders. When no shipping method in the configuration covers the destination, the
        response is still HTTP 200 with `id: null` and a message.

        - `country` accepts an English country name or an ISO 3166-1 two-letter code. Colombia
          is not supported by this endpoint.
        - `shipping_scope` must be `international` when the destination country differs from
          the warehouse country.
        - `is_cod` in the response names a dedicated cash-on-delivery shipping method; it does
          not indicate whether cash on delivery can be offered at checkout.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          description: Id of the store. Your credential must have access to it.
          schema:
            type: integer
            example: 1234
        - name: shipping_configuration_name
          in: query
          required: true
          description: Name of one of the store's shipping configurations (shipping groups); matched case-insensitively
          schema:
            type: string
            example: Economy
        - name: shipping_scope
          in: query
          required: true
          description: Scope of the shipment to simulate
          schema:
            type: string
            enum:
              - national
              - international
              - pickup
            example: national
        - name: postcode
          in: query
          required: true
          description: Destination postcode
          schema:
            type: string
            example: "06600"
        - name: country
          in: query
          required: true
          description: Destination country, as an English name or ISO 3166-1 alpha-2 code
          schema:
            type: string
            example: MX
        - name: for_cod
          in: query
          required: false
          description: Simulate a cash-on-delivery order
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: "The selected shipping method, or `id: null` with a message when none covers the destination"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingCoverage"
              examples:
                covered:
                  value:
                    id: 12
                    carrier_name: ESTAFETA
                    shipping_type: national
                    delivery_type: Ground
                    country: MX
                    is_cod: false
                notCovered:
                  value:
                    id: null
                    message: no compatible shipping method found.
        "401":
          description: Missing or invalid token, or no access to the store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              examples:
                invalidToken:
                  value:
                    error: Unauthorized
                    message: invalid token
                noStoreAccess:
                  value:
                    error: Unauthorized
                    message: not allowed to show? this Store
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingParam:
                  value:
                    error: Parameter shipping_configuration_name is required
                invalidScope:
                  value:
                    error: Parameter shipping_scope must be within ["international", "national", "pickup"]
                storeNotFound:
                  value:
                    error: store_id 1234 not found
                unknownCountry:
                  value:
                    error: Unrecognized country 'Narnia'. Try in english or using ISO 3166-1 two-letter code.
                colombiaUnsupported:
                  value:
                    error: This service is unavailable for country CO.
                configurationNotFound:
                  value:
                    error: shipping configuration not found with name 'Economy'
                scopeMismatch:
                  value:
                    error: shipping_scope 'national' selected for intenational order.
        "500":
          $ref: "#/components/responses/InternalServerError"
  /shipping-methods/quote:
    get:
      tags:
        - Shipping methods
      operationId: getShippingQuote
      summary: Quote shipping options for a destination and package
      description: |
        Returns the shipping options (carrier, delivery type, estimated delivery and price) that
        the store's shipping configuration would offer for a package going to the given zip code.
        Use it to show shipping choices at checkout. Mexico and Brazil destinations only.

        To create an order with a specific shipping method, send the `shipping_method_id` of the option
        you choose as `shipping_method_id` in `POST /orders`, `POST /orders/create-and-ship` or
        `POST /brazil/orders`.

        - The shipping configuration is chosen from the store's product shipping rules when
          `sku` matches one; otherwise the default configuration of the store's Open API
          integration is used. If none can be resolved the request fails.
        - The quoted weight is the greater of the declared weight and the volumetric weight
          computed from the dimensions.
        - When click and collect is enabled for the store's integration, pickup-point options
          are appended to the same array with `is_click_and_collect: true`. `order_total` or
          `item_count` are used to price those options, depending on how the store prices
          click and collect (see `cnc_pricing_basis`). If pickup-point pricing fails, the
          regular options are still returned.
        - `delivery_eta_range` is omitted when no estimate is available.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          description: Id of the store. Your credential must have access to it.
          schema:
            type: integer
            example: 1234
        - name: zip_code
          in: query
          required: true
          description: Destination zip code
          schema:
            type: string
            example: "06600"
        - name: country
          in: query
          required: false
          description: Destination country code. Only `MX` and `BR` are supported.
          schema:
            type: string
            enum:
              - MX
              - BR
            default: MX
        - name: sku
          in: query
          required: false
          description: SKU used to match the store's product shipping rules, when configured
          schema:
            type: string
            example: SKU-RED-M
        - name: shipping_type
          in: query
          required: false
          description: Shipment scope
          schema:
            type: string
            enum:
              - national
              - international
            default: national
        - name: width_cm
          in: query
          required: true
          description: Package width in centimeters
          schema:
            type: number
            minimum: 0.1
            example: 20
        - name: height_cm
          in: query
          required: true
          description: Package height in centimeters
          schema:
            type: number
            minimum: 0.1
            example: 10
        - name: length_cm
          in: query
          required: true
          description: Package length in centimeters
          schema:
            type: number
            minimum: 0.1
            example: 30
        - name: weight_kg
          in: query
          required: true
          description: Declared package weight in kilograms
          schema:
            type: number
            example: 1.5
        - name: order_total
          in: query
          required: false
          description: Cart value, used to price click-and-collect options when the store prices them by cart value
          schema:
            type: number
            example: 1500
        - name: item_count
          in: query
          required: false
          description: >-
            Number of units in the cart, used to price click-and-collect options when the store prices them by
            item count. Digits only.
          schema:
            type: string
            pattern: ^\d+$
            example: "3"
      responses:
        "200":
          description: Shipping options. Regular options come first, click-and-collect options (if any) after them.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShippingQuote"
              example:
                - shipping_method_id: 12
                  carrier_name: ESTAFETA
                  carrier_delivery: Ground
                  quoted_weight_kg: 2
                  delivery_sla_in_hours: 72
                  delivery_eta_range:
                    range_begin: "2026-10-14T06:00:00.000Z"
                    range_end: "2026-10-16T05:59:59.999Z"
                  price: 149
                - shipping_method_id: 15
                  carrier_name: CUBBO
                  carrier_delivery: NextDay
                  quoted_weight_kg: 2
                  delivery_sla_in_hours: null
                  delivery_eta_range: null
                  price: 125
                  is_click_and_collect: true
                  service_code: CUBBOCNCCUBBOCUBBO001
                  location_name: Punto Cubbo Centro
                  distance_km: 0.8
                  pickup_address: Calle Centro 300, CDMX, 06000
                  cnc_pricing_basis: cart_value
        "401":
          description: Missing or invalid token, or no access to the store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              examples:
                invalidToken:
                  value:
                    error: Unauthorized
                    message: invalid token
                noStoreAccess:
                  value:
                    error: Unauthorized
                    message: not allowed to show? this Store
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingParam:
                  value:
                    error: Parameter width_cm is required
                dimensionTooSmall:
                  value:
                    error: Parameter width_cm cannot be less than 0.1
                invalidItemCount:
                  value:
                    error: Parameter item_count must match format ^\d+$
                storeNotFound:
                  value:
                    error: store_id 1234 not found
                countryUnsupported:
                  value:
                    error: destination country CO not found
                zipNotFound:
                  value:
                    error: destination not found for zip code 00000
                noConfiguration:
                  value:
                    error: No shipping configuration found
                noCoverage:
                  value:
                    error: No shipping costs found due to lack of coverage.
        "500":
          $ref: "#/components/responses/InternalServerError"
  /store:
    patch:
      tags:
        - Stores
      operationId: updateStore
      summary: Update your own store
      description: |
        Partially updates the store bound to your credential. No store id is accepted: the store
        is derived from the Open API integration credential used to obtain the token, so this
        endpoint only works with a token issued from the credential returned by `POST /stores`
        (or any other store-bound integration credential). Only the fields present in the body
        are written; only the store's identity and fiscal fields can be edited.

        - At least one editable field must be present, otherwise the request is rejected.
        - `tax_regime` is case-insensitive and normalized to upper case; values outside the
          accepted set are rejected.
        - `state` is normalized to upper case. For stores operating in Brazil it must be a valid
          two-letter UF code (for example `SP`); for other countries it is stored as sent.
        - `invoice_customization` replaces the current value (no merge). Only known NF-e
          purposes are kept; a blank object, or one containing only unknown purposes, is treated
          as if the field was not sent and does not clear the existing customization.
        - Unknown or non-editable fields (such as `account_id` or `store_type`) are silently
          ignored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreUpdateRequest"
            example:
              tax_company_name: Partner Store SP LTDA
              tax_address: Av. Paulista
              tax_address_number: "1000"
              tax_city: Sao Paulo
              state: SP
      responses:
        "200":
          description: Store updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Store"
              example:
                id: 4821
                name: Partner Store SP
                description: Store provisioned via API
                created_at: "2026-09-03T14:02:11.000Z"
                updated_at: "2026-09-03T14:05:47.000Z"
                tax_id: null
                invoice_customization: {}
                state: SP
                tax_regime: null
                tax_company_name: Partner Store SP LTDA
                tax_address: Av. Paulista
                tax_address_number: "1000"
                tax_address_neighborhood: null
                tax_city: Sao Paulo
                tax_zipcode: null
                tax_state_phone: null
                tax_state_registration: null
                store_type: ALL_SERVICES
        "401":
          description: Missing or invalid token, or the credential is not bound to a store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              examples:
                invalidToken:
                  value:
                    error: Unauthorized
                    message: invalid token
                notBoundToStore:
                  value:
                    error: Unauthorized
                    message: credential is not bound to a store
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noFields:
                  value:
                    error: no updatable fields provided
                invalidTaxRegime:
                  value:
                    error: "tax_regime must be one of: SIMPLES_NACIONAL, LUCRO_REAL, LUCRO_PRESUMIDO."
                invalidState:
                  value:
                    error: state must be a two-letter Brazilian UF code (e.g. SP).
        "500":
          $ref: "#/components/responses/InternalServerError"
  /store/digital-certificate:
    post:
      tags:
        - Stores
      operationId: uploadStoreDigitalCertificate
      summary: Upload the store's digital certificate and set NF-e numbering (Brazil)
      description: |
        Brazil only. Uploads the store's A1 digital certificate (the `.pfx`/`.p12` file used to
        sign NF-e) and, in the same call, sets the NF-e series and the next invoice number. The
        store is derived from the credential used to obtain the token; no store id is accepted.
        Requires the fiscal account to exist already (`POST /store/fiscal-account`).

        - Every call overwrites the store's NF-e counter. `next_invoice_number` must be the
          number of the next NF-e the store will actually issue, not the last one used and not
          `1` for a store that has already issued invoices. Reusing a number makes the tax
          authority reject the following invoices as duplicates.
        - `invoice_series` and `next_invoice_number` are accepted as strings or integers and are
          parsed in base 10, so zero-padded values such as `"089"` are read as 89.
        - The certificate and its password are never returned or logged.
        - After upload, the certificate validity is read back on a best-effort basis; if it
          cannot be read, `status` is `active` and `days_until_expiration`/`expires_at` are null.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DigitalCertificateRequest"
            example:
              certificate_base64: <base64-encoded-pfx-file>
              certificate_password: <certificate-password>
              invoice_series: 1
              next_invoice_number: 4567
      responses:
        "200":
          description: Certificate uploaded and numbering configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DigitalCertificateResponse"
              example:
                store_id: 4821
                certificate:
                  status: active
                  days_until_expiration: 365
                  expires_at: "2027-09-03"
                  uploaded_at: "2026-09-03T14:10:03Z"
                invoice_numbering:
                  series: 1
                  next_number: 4567
        "401":
          description: Missing or invalid token, or the credential is not bound to a store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              example:
                error: Unauthorized
                message: credential is not bound to a store
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingCertificate:
                  value:
                    error: Parameter certificate_base64 is required
                invalidSeriesFormat:
                  value:
                    error: invoice_series must be a positive integer with at most 3 digits
                invalidNumberFormat:
                  value:
                    error: next_invoice_number must be a positive integer with at most 9 digits
                seriesOutOfRange:
                  value:
                    error: invoice_series must be an integer between 1 and 999.
                numberOutOfRange:
                  value:
                    error: next_invoice_number must be an integer between 1 and 999999999.
                invalidBase64:
                  value:
                    error: certificate_base64 is not valid Base64.
                storeNotConfigured:
                  value:
                    error: Store 4821 is not configured to issue fiscal documents.
                wrongPassword:
                  value:
                    error: Incorrect certificate password.
                invalidFormat:
                  value:
                    error: >-
                      The digital certificate is corrupted or in an invalid format. Export it again as .pfx or
                      .p12.
                numberingRejected:
                  value:
                    error: >-
                      The fiscal provider rejected the NF-e series or number. Confirm them with your
                      accountant.
        "500":
          $ref: "#/components/responses/InternalServerError"
  /store/fiscal-account:
    post:
      tags:
        - Stores
      operationId: provisionStoreFiscalAccount
      summary: Provision the store's fiscal account (Brazil)
      description: |
        Brazil only. Creates the store's electronic invoicing account and registers its company
        data so the store can later upload a digital certificate and issue NF-e (Nota Fiscal
        Eletronica, the Brazilian electronic invoice). The store is derived from the credential
        used to obtain the token; no store id is accepted.

        - Idempotent: if the store already has a fiscal account, the account is not created
          again; the company data is re-sent and `status` comes back as `updated` instead of
          `created`. Retrying after a partial failure is safe.
        - The company data is also copied onto the store's own fiscal fields (the ones
          `PATCH /store` edits), but only where they are still blank. `mirrored_fields` lists
          what was written; `skipped_fields` lists what already had a value and was left alone.
        - `cnpj` and `tax_regime` are identity fields: if the store already holds a different
          value for either (from an earlier call or from `PATCH /store`), the request is rejected
          instead of overwriting it. Resubmitting the same value is not a conflict. For this
          reason, call this endpoint before setting those fields through `PATCH /store`.
        - `address.state` must be a two-letter Brazilian UF code; it is validated before the
          account is created.
        - The CNPJ (Cadastro Nacional da Pessoa Juridica, the Brazilian company tax id) is
          accepted with or without punctuation and stored on the store as digits only.
        - Provider credentials are never returned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FiscalAccountRequest"
            example:
              cnpj: 00.000.000/0001-91
              legal_name: Partner Store SP LTDA
              trade_name: Partner Store
              state_registration: "123456789"
              tax_regime: SIMPLES_NACIONAL
              unit_type: matriz
              email: fiscal@example.com
              address:
                zip_code: 01310-100
                street: Av. Paulista
                number: "1000"
                complement: Sala 1
                neighborhood: Bela Vista
                city: Sao Paulo
                state: SP
      responses:
        "200":
          description: Fiscal account provisioned (or updated) and company data registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalAccountResponse"
              example:
                store_id: 4821
                fiscal_account:
                  status: created
                  cnpj: 00.000.000/0001-91
                  legal_name: Partner Store SP LTDA
                  tax_regime: SIMPLES_NACIONAL
                  mirrored_fields:
                    - tax_id
                    - tax_company_name
                    - tax_state_registration
                    - tax_regime
                    - tax_address
                    - tax_address_number
                    - tax_address_neighborhood
                    - tax_city
                    - tax_zipcode
                    - state
                  skipped_fields: []
                  mirror_error: null
        "401":
          description: Missing or invalid token, or the credential is not bound to a store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
              example:
                error: Unauthorized
                message: credential is not bound to a store
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingCnpj:
                  value:
                    error: Parameter cnpj is required
                missingAddress:
                  value:
                    error: address is required
                invalidTaxRegime:
                  value:
                    error: "tax_regime must be one of: SIMPLES_NACIONAL, LUCRO_REAL, LUCRO_PRESUMIDO."
                invalidUnitType:
                  value:
                    error: "unit_type must be one of: matriz, filial."
                invalidState:
                  value:
                    error: address.state must be a two-letter Brazilian UF code (e.g. SP).
                identityConflict:
                  value:
                    error: >-
                      tax_regime already set on this store to a different value. Update it with PATCH
                      /v1/store first, or submit the value already on record.
                rejectedByProvider:
                  value:
                    error: >-
                      The fiscal registration was rejected. Check the CNPJ, state registration, address, and
                      tax regime.
        "500":
          $ref: "#/components/responses/InternalServerError"
  /stores:
    post:
      tags:
        - Stores
      operationId: createStore
      summary: Create a store from an existing one
      description: |
        Creates a new store in the same account as an existing store (`source_store_id`) used as
        a template. The new store inherits the source store's billing configuration and, unless
        you override them, its store type and warehouse. Your credential must have access to the
        source store, and the source store must already have a billing configuration.

        - Send `source_shipping_group_ids` to copy specific shipping groups from the source store
          instead of receiving the country defaults. Doing so also creates an Open API
          integration for the new store and returns its credentials once in
          `open_api_integration`. Without `source_shipping_group_ids` no integration is created,
          the response has no `open_api_integration` key, and the store-scoped endpoints
          (`PATCH /store`, fiscal account, digital certificate) cannot be used for it.
        - `default_shipping_group_id` is required whenever `source_shipping_group_ids` is sent;
          it must be one of the copied ids and must not be a group with only international
          shipping methods. It becomes the fallback for orders that arrive without a recognized
          shipping method.
        - `webhook_consumer_url` and `webhook_feeds` are only accepted together with
          `source_shipping_group_ids`. The URL is validated for format only (https, real host, no
          raw IP) and is not probed. When omitted, no webhook signing secret is issued.
        - The returned `client_secret` and `webhook_consumer_secret` are shown only in this
          response. The credential grants access to every store of the same account, so treat it
          as an account-level secret.
        - The whole operation is transactional: on any validation failure nothing is created.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCreateRequest"
            example:
              name: Partner Store SP
              source_store_id: 1234
              created_by_email: integrations@example.com
              store_type: ALL_SERVICES
              description: Store provisioned via API
              source_shipping_group_ids:
                - 101
                - 102
              default_shipping_group_id: 101
              webhook_consumer_url: https://example.com/cubbo/webhooks
              webhook_feeds:
                - order_status
                - inventory_movement
                - replenishment_status
      responses:
        "201":
          description: >-
            Store created. The body is the full store record plus, when an integration was created, its
            credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreCreated"
              example:
                id: 4821
                name: Partner Store SP
                description: Store provisioned via API
                created_at: "2026-09-03T14:02:11.000Z"
                updated_at: "2026-09-03T14:02:11.000Z"
                tax_id: null
                invoice_customization: {}
                state: null
                tax_regime: null
                tax_company_name: null
                tax_address: null
                tax_address_number: null
                tax_address_neighborhood: null
                tax_city: null
                tax_zipcode: null
                tax_state_phone: null
                tax_state_registration: null
                store_type: ALL_SERVICES
                b2b: false
                d2c: true
                skip_product_lot_in_returns: null
                receive_only_complete_returns: null
                return_inspection_enabled: null
                requires_stock_only_from_confirmed_replenishments: false
                has_store_branches: false
                is_oxxo_store: false
                enable_replenishment_invoices: null
                enable_removal_order_invoices: null
                enable_manual_client_invoice: false
                enable_b2b_cnpj_client_invoice: false
                account:
                  id: 900
                  name: Partner Ltd
                  account_type: COMPANY
                warehouses:
                  - id: 232
                    name: CD Sao Paulo
                    unique_code: SP1
                open_api_integration:
                  client_id: b6e3a1f0-1234-4c9a-9a11-000000000001
                  client_secret: <client-secret-shown-once>
                  webhook_consumer_url: https://example.com/cubbo/webhooks
                  webhook_feeds:
                    - order_status
                    - inventory_movement
                    - replenishment_status
                  webhook_consumer_secret: <webhook-secret-shown-once>
                  webhook_consumer_secret_reason: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingName:
                  value:
                    error: Parameter name is required
                sourceStoreNotFound:
                  value:
                    error: source store 1234 not found
                creatorNotFound:
                  value:
                    error: No user with email integrations@example.com found in the source store's account
                warehouseNotFound:
                  value:
                    error: warehouse 55 not found
                warehouseNotAssigned:
                  value:
                    error: warehouse 55 is not assigned to the source store
                noWarehouse:
                  value:
                    error: no warehouse available for the new store
                invalidStoreType:
                  value:
                    error: "Invalid store_type. Valid options are: ALL_SERVICES, PICK_AND_SHIP, DEMO_ALL_SERVICES"
                defaultGroupRequiresCopy:
                  value:
                    error: default_shipping_group_id requires source_shipping_group_ids
                webhookUrlRequiresCopy:
                  value:
                    error: webhook_consumer_url requires source_shipping_group_ids
                webhookFeedsRequireCopy:
                  value:
                    error: webhook_feeds requires source_shipping_group_ids
                webhookFeedsRequireUrl:
                  value:
                    error: webhook_feeds requires webhook_consumer_url
                defaultGroupRequired:
                  value:
                    error: default_shipping_group_id is required with source_shipping_group_ids
                defaultGroupNotInList:
                  value:
                    error: default_shipping_group_id must be one of source_shipping_group_ids
                defaultGroupInternational:
                  value:
                    error: default_shipping_group_id cannot be a shipping group with international shipping methods
                invalidWebhookUrl:
                  value:
                    error: webhook_consumer_url must be https
                invalidWebhookFeed:
                  value:
                    error: >-
                      Parameter webhook_feeds[1] must be within ["order_status", "inventory_movement",
                      "replenishment_status"]
                noShippingGroupsFound:
                  value:
                    error: No shipping groups found on source store 1234 for the given ids
        "500":
          $ref: "#/components/responses/InternalServerError"
webhooks:
  orderUpdated:
    post:
      tags:
        - Webhooks
      summary: Order status changed
      operationId: webhookOrderUpdated
      description: |
        Cubbo sends this event to your order webhook URL every time an order's fulfillment status
        changes: when the order is created (initial status), when it starts processing, enters picking
        or packing, is put on hold or released, is interrupted, canceled, errored, shipped, and on every
        return-related status (returning, return_arrived, returned, reentered). It is also sent when a
        picking is sent to review (`picking_status: "in_review"`) and on every consumer-to-consumer (C2C)
        lifecycle step.

        - The body always carries `id`, `status`, `order_number`, `updated_at` and `store_id`.
        - `products` (with the picked `unit_codes`) is present only while the order is in `picking` or
          `packing`.
        - `channel_name` and `channel_order_id` are included for every Open API integration created
          recently; older integrations may not receive them.
        - `channel_integration_id`, `channel_order_id` and `subchannel_name` are added when the
          "include channel details in webhooks" setting is enabled for your store by Cubbo.
        - `latest_estimated_time_arrival_range` is added when that extra field is enabled for your
          integration by Cubbo.
        - Retries resend the exact same body, so `(id, status, updated_at)` is a safe deduplication key.
          There is no `X-Cubbo-Idempotency-Key` header on this event.
      parameters:
        - $ref: "#/components/parameters/WebhookEventHeader"
        - $ref: "#/components/parameters/WebhookMessageIdHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIssuedAtHeader"
        - $ref: "#/components/parameters/WebhookExpiresAtHeader"
        - $ref: "#/components/parameters/WebhookAuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdatedEvent"
            examples:
              picking:
                summary: Order entered picking
                value:
                  id: 987654
                  status: picking
                  order_number: ORD-0001
                  updated_at: "2026-10-12T15:04:05Z"
                  store_id: 1234
                  products:
                    - id: 5551
                      sku: SKU-RED-M
                      quantity: 2
                    - id: 5552
                      sku: SKU-PHONE-128
                      quantity: 1
                      unit_codes:
                        - "356789012345678"
                  channel_name: openapi
                  channel_order_id: SHOP-77421
              exchangeOrder:
                summary: Order created by an exchange
                value:
                  id: 987655
                  status: pending
                  order_number: ORD-0001-EXCHANGE
                  updated_at: "2026-10-12T15:04:05Z"
                  store_id: 1234
                  created_by_return:
                    id: 4410
                    status: RECEIVED
                    notes: Wrong size
                    return_type: EXCHANGE
                    created_at: "2026-10-10T12:00:00Z"
                    returned_order:
                      id: 987654
                      order_number: ORD-0001
                      status: returned
                  channel_name: openapi
      responses:
        2XX:
          description: |
            Acknowledge receipt with any 2xx status. The response body is ignored. Respond as soon as the
            event is persisted and process it asynchronously. A 429 or any 5xx response is retried; any
            other 4xx response is treated as a permanent rejection and is not retried.
  orderFulfilled:
    post:
      tags:
        - Webhooks
      summary: Order shipped (fulfilled)
      operationId: webhookOrderFulfilled
      description: |
        Cubbo sends this event to your order webhook URL when the order's shipping labels are generated
        and the order leaves packing, i.e. when it becomes `shipped`. It carries the recipient's name and
        destination, the carrier, the tracking number of the first package and the Cubbo tracking page URL.
        An `orderUpdated` event with `status: shipped` is sent separately for the same transition.

        - `tracking_number` is the first package's carrier tracking number; `tracking_urls` contains the
          Cubbo tracking page link, not the carrier's.
        - `zip_code` is `"-"` for orders shipped from Chile when no postal code was given; `city` and
          `zip_code` can be `null` for orders the client collects at the warehouse.
        - `extended_zone` is added when the "include extended zone in webhooks" setting is enabled for
          your store by Cubbo.
        - `order_lines` is added when the "include order line details in webhooks" setting is enabled for
          your store by Cubbo.
        - `channel_integration_id`, `channel_order_id` and `subchannel_name` are added when the "include
          channel details in webhooks" setting is enabled for your store by Cubbo.
        - `shipping_type`, `delivery_type`, `billing_category` and `latest_estimated_time_arrival_range`
          are added only when those extra fields are enabled for your integration by Cubbo.
        - Retries resend the same body. There is no `X-Cubbo-Idempotency-Key` header on this event; use
          `(id, status, updated_at)` or `(order_number, tracking_number)` to deduplicate.
      parameters:
        - $ref: "#/components/parameters/WebhookEventHeader"
        - $ref: "#/components/parameters/WebhookMessageIdHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIssuedAtHeader"
        - $ref: "#/components/parameters/WebhookExpiresAtHeader"
        - $ref: "#/components/parameters/WebhookAuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderFulfilledEvent"
            example:
              id: 987654
              order_number: ORD-0001
              carrier_name: Estafeta
              first_name: Ana
              last_name: Example
              city: Ciudad de México
              country: MX
              status: shipped
              store_id: 1234
              tracking_urls:
                - https://tracking.example.com/orders/abc123
              tracking_number: "1234567890123456789012"
              updated_at: "2026-10-12T16:20:00Z"
              zip_code: "06600"
              estimated_time_arrival: "2026-10-14T23:59:59Z"
              channel_name: openapi
              channel_order_id: SHOP-77421
      responses:
        2XX:
          description: |
            Acknowledge receipt with any 2xx status. The response body is ignored. A 429 or any 5xx
            response is retried; any other 4xx response is treated as a permanent rejection and is not
            retried.
  shippingUpdated:
    post:
      tags:
        - Webhooks
      summary: Carrier tracking status changed
      operationId: webhookShippingUpdated
      description: |
        Cubbo sends this event to your order webhook URL every time the carrier tracking status of a
        shipped order changes (in transit, out for delivery, delivered, incident, returned, canceled,
        partially delivered, to be self-collected). A tracking update whose status equals the previous
        status is not sent.

        - `status` is the shipment status that triggered the event. For multi-package orders it describes
          the package that changed; the full set is listed in `packages`, and `triggered_by_package`
          identifies the one that changed.
        - `updated_at` is the timestamp of the carrier event, not the time of delivery of the webhook.
        - `incident_description` is set only when `status` is `shipment_with_incident`.
        - `estimated_time_arrival` is `null` when the shipment was returned or the package was reported
          stolen or lost.
        - `label_tracking_event_id` identifies the exact tracking event; combined with the
          `X-Cubbo-Idempotency-Key` header it lets you deduplicate retries while still receiving one event
          per package.
        - `channel_integration_id` and `channel_order_id` are added when the "include channel details in
          webhooks" setting is enabled for your store by Cubbo. `channel_name` and `channel_order_id` are
          included for every recently created Open API integration.
        - This event has no `id` field; correlate by `order_number` (unique within a store) or
          `channel_order_id`.
      parameters:
        - $ref: "#/components/parameters/WebhookEventHeader"
        - $ref: "#/components/parameters/WebhookMessageIdHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIssuedAtHeader"
        - $ref: "#/components/parameters/WebhookExpiresAtHeader"
        - $ref: "#/components/parameters/WebhookIdempotencyKeyHeader"
        - $ref: "#/components/parameters/WebhookAuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingUpdatedEvent"
            examples:
              delivered:
                summary: Single-package order delivered
                value:
                  status: shipment_delivered
                  store_id: 1234
                  carrier_name: Estafeta
                  tracking_urls:
                    - https://tracking.example.com/orders/abc123
                  tracking_number: "1234567890123456789012"
                  zip_code: "06600"
                  order_number: ORD-0001
                  updated_at: "2026-10-14T18:32:10Z"
                  estimated_time_arrival: "2026-10-14T23:59:59Z"
                  incident_description: null
                  label_tracking_event_id: 8812001
                  is_multi_package: false
                  packages:
                    - shipping_number: "1234567890123456789012"
                      tracking_url: https://carrier.example.com/track/1234567890123456789012
                      shipping_status: shipment_delivered
                      carrier_name: Estafeta
                      package_index: 1
                      total_packages: 1
                  triggered_by_package:
                    shipping_number: "1234567890123456789012"
                    shipping_status: shipment_delivered
                    carrier_name: Estafeta
                    tracking_url: https://carrier.example.com/track/1234567890123456789012
                    previous_status: shipment_out_for_delivery
                    package_index: 1
                    total_packages: 1
                  channel_name: openapi
              incident:
                summary: Delivery attempt failed
                value:
                  status: shipment_with_incident
                  store_id: 1234
                  carrier_name: Estafeta
                  tracking_urls:
                    - https://tracking.example.com/orders/abc123
                  tracking_number: "1234567890123456789012"
                  zip_code: "06600"
                  order_number: ORD-0001
                  updated_at: "2026-10-13T11:05:00Z"
                  estimated_time_arrival: "2026-10-14T23:59:59Z"
                  incident_description: not_at_home
                  label_tracking_event_id: 8811990
                  is_multi_package: false
                  packages:
                    - shipping_number: "1234567890123456789012"
                      tracking_url: https://carrier.example.com/track/1234567890123456789012
                      shipping_status: shipment_with_incident
                      carrier_name: Estafeta
                      package_index: 1
                      total_packages: 1
                  triggered_by_package:
                    shipping_number: "1234567890123456789012"
                    shipping_status: shipment_with_incident
                    carrier_name: Estafeta
                    tracking_url: https://carrier.example.com/track/1234567890123456789012
                    previous_status: shipment_in_transit
                    package_index: 1
                    total_packages: 1
                  channel_name: openapi
      responses:
        2XX:
          description: |
            Acknowledge receipt with any 2xx status. The response body is ignored. A 429 or any 5xx
            response is retried; any other 4xx response is treated as a permanent rejection and is not
            retried.
  inventoryMovement:
    post:
      tags:
        - Webhooks
      summary: Inventory snapshot after a stock movement
      operationId: webhookInventoryMovement
      description: |
        Cubbo sends this event to your inventory webhook URL whenever the stock of one or more products
        changes (an order ships, stock is received or put away, a return is reentered, an adjustment is
        made, and so on). The body is a snapshot of the current stock of the affected products, not a
        delta. When Cubbo runs a full resynchronization for your store, the snapshot contains every
        product of the store.

        - This feed must be enabled for your integration (it is opt-in and requires the order webhook
          feed to be active). It can point at a different URL than the order feed and can carry its own
          custom headers.
        - Products without any SKU are omitted. If no product remains, nothing is sent.
        - Events for one integration are delivered one at a time, in order. `sequence` is a monotonic
          counter per integration: process events by `sequence`, not by arrival time, and treat a lower
          `sequence` than the last one you processed as stale. Gaps are possible.
        - `X-Cubbo-Idempotency-Key` is a UUID that stays the same on every retry of the same event.
        - The payload is additive: ignore fields you do not know.
      parameters:
        - $ref: "#/components/parameters/WebhookEventHeader"
        - $ref: "#/components/parameters/WebhookMessageIdHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIssuedAtHeader"
        - $ref: "#/components/parameters/WebhookExpiresAtHeader"
        - $ref: "#/components/parameters/WebhookIdempotencyKeyHeader"
        - $ref: "#/components/parameters/WebhookAuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryMovementEvent"
            example:
              event: inventoryMovement
              occurred_at: "2026-10-12T16:25:00-06:00"
              sequence: 42
              store_id: 1234
              products:
                - product_name: Red T-Shirt M
                  product_code: "7501234567890"
                  skus:
                    - SKU-RED-M
                  quantity: 148
                - product_name: Smartphone 128GB
                  product_code: "7509876543210"
                  skus:
                    - SKU-PHONE-128
                  quantity: 2
                  units:
                    - unit_code: "356789012345678"
                      status: ACTIVE
                    - unit_code: "356789012345679"
                      status: RESERVED
                    - unit_code: "356789012345680"
                      status: DAMAGED
                      damaged_source: RETURN
                - product_name: Vitamin C 500mg
                  product_code: "7501111222333"
                  skus:
                    - SKU-VITC-500
                  quantity: 8
                  lots:
                    - lot_code: LOT-2026A
                      expiration_date: "2026-12-31"
                      quantity: 3
                    - lot_code: LOT-2027B
                      expiration_date: "2027-06-30"
                      quantity: 5
      responses:
        2XX:
          description: |
            Acknowledge receipt with any 2xx status. The response body is ignored. A 429 or any 5xx
            response is retried; any other 4xx response is treated as a permanent rejection and is not
            retried. While a delivery is pending, later inventory events for the same integration wait
            behind it.
  replenishmentCreated:
    post:
      tags:
        - Webhooks
      summary: Replenishment announced
      operationId: webhookReplenishmentCreated
      description: |
        Cubbo sends this event to your replenishment webhook URL when a replenishment (inbound receipt)
        is created before any merchandise has arrived, i.e. created in status `WITHOUT_SCHEDULING`,
        `PENDING`, `REQUESTED` or `IN_TRANSIT`. Receipts that are born already in the warehouse (reverse
        logistics, relocations, transfers) do not produce this event; they only produce
        `replenishmentStatus` events on later transitions.

        - This feed must be enabled for your integration (opt-in, with its own URL). It does not require
          the order webhook feed.
        - `products` lists the expected and received quantities per product; `received_quantity` is 0 at
          this point.
        - `sequence` is the timestamp of the transition in epoch milliseconds; order events of the same
          replenishment by it.
        - `X-Cubbo-Idempotency-Key` is deterministic (`replenishment:<id>:<status>:<integration>`), so a
          retry carries the same key.
      parameters:
        - $ref: "#/components/parameters/WebhookEventHeader"
        - $ref: "#/components/parameters/WebhookMessageIdHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIssuedAtHeader"
        - $ref: "#/components/parameters/WebhookExpiresAtHeader"
        - $ref: "#/components/parameters/WebhookIdempotencyKeyHeader"
        - $ref: "#/components/parameters/WebhookAuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplenishmentCreatedEvent"
            example:
              event: replenishmentCreated
              occurred_at: "2026-10-12T09:00:00-06:00"
              store_id: 1234
              replenishment_id: 55010
              status: REQUESTED
              sell_ahead: false
              appointment_date: null
              products:
                - product_code: "7501234567890"
                  skus:
                    - SKU-RED-M
                  expected_quantity: 200
                  received_quantity: 0
              supplier_invoices: []
              sequence: 1791234567890
      responses:
        2XX:
          description: |
            Acknowledge receipt with any 2xx status. The response body is ignored. A 429 or any 5xx
            response is retried; any other 4xx response is treated as a permanent rejection and is not
            retried. Replenishment events for one integration are delivered one at a time, in order.
  replenishmentScheduled:
    post:
      tags:
        - Webhooks
      summary: Replenishment appointment booked or canceled
      operationId: webhookReplenishmentScheduled
      description: |
        Cubbo sends this event to your replenishment webhook URL when a delivery appointment (dock slot)
        is booked for a replenishment, including the new slot created by a reschedule, and when a booked
        appointment is canceled. The replenishment's own `status` does not change on these events; the
        news is `appointment_date`, which carries the booked date or `null` after a cancellation.
        Walk-in deliveries, no-shows and check-ins do not produce this event.

        - `X-Cubbo-Idempotency-Key` is deterministic and includes the appointment
          (`replenishment:<id>:<status>:appointment:<appointment id>:<booked|canceled>:<integration>`).
      parameters:
        - $ref: "#/components/parameters/WebhookEventHeader"
        - $ref: "#/components/parameters/WebhookMessageIdHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIssuedAtHeader"
        - $ref: "#/components/parameters/WebhookExpiresAtHeader"
        - $ref: "#/components/parameters/WebhookIdempotencyKeyHeader"
        - $ref: "#/components/parameters/WebhookAuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplenishmentScheduledEvent"
            example:
              event: replenishmentScheduled
              occurred_at: "2026-10-12T10:15:00-06:00"
              store_id: 1234
              replenishment_id: 55010
              status: REQUESTED
              sell_ahead: false
              appointment_date: "2026-10-20"
              products:
                - product_code: "7501234567890"
                  skus:
                    - SKU-RED-M
                  expected_quantity: 200
                  received_quantity: 0
              supplier_invoices: []
              sequence: 1791239000000
      responses:
        2XX:
          description: |
            Acknowledge receipt with any 2xx status. The response body is ignored. A 429 or any 5xx
            response is retried; any other 4xx response is treated as a permanent rejection and is not
            retried.
  replenishmentStatus:
    post:
      tags:
        - Webhooks
      summary: Replenishment status changed
      operationId: webhookReplenishmentStatus
      description: |
        Cubbo sends this event to your replenishment webhook URL when a replenishment transitions to
        `PROCESSING` (merchandise received and being counted), `IN_PUTAWAY` (units being stored),
        `COMPLETED` (receipt closed) or `CANCELED`. Other statuses (`RECEIVED` at dock arrival, the
        pre-arrival statuses) do not produce this event.

        - `products` carries, per product, the expected quantity and the quantity received so far;
          `supplier_invoices` carries the supplier invoice numbers captured at reception. Both are omitted
          when `status` is `CANCELED`.
        - `sell_ahead` is `true` for presale replenishments whose stock could be sold before arrival.
        - `sequence` is the timestamp of the transition in epoch milliseconds; retries keep it.
        - `X-Cubbo-Idempotency-Key` is deterministic (`replenishment:<id>:<status>:<integration>`).
      parameters:
        - $ref: "#/components/parameters/WebhookEventHeader"
        - $ref: "#/components/parameters/WebhookMessageIdHeader"
        - $ref: "#/components/parameters/WebhookSignatureHeader"
        - $ref: "#/components/parameters/WebhookIssuedAtHeader"
        - $ref: "#/components/parameters/WebhookExpiresAtHeader"
        - $ref: "#/components/parameters/WebhookIdempotencyKeyHeader"
        - $ref: "#/components/parameters/WebhookAuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplenishmentStatusEvent"
            examples:
              completed:
                summary: Receipt completed
                value:
                  event: replenishmentStatus
                  occurred_at: "2026-10-21T17:45:00-06:00"
                  store_id: 1234
                  replenishment_id: 55010
                  status: COMPLETED
                  sell_ahead: false
                  appointment_date: "2026-10-20"
                  products:
                    - product_code: "7501234567890"
                      skus:
                        - SKU-RED-M
                      expected_quantity: 200
                      received_quantity: 198
                  supplier_invoices:
                    - invoice_number: F-0001
                  sequence: 1792000000000
              canceled:
                summary: Receipt canceled
                value:
                  event: replenishmentStatus
                  occurred_at: "2026-10-15T08:00:00-06:00"
                  store_id: 1234
                  replenishment_id: 55011
                  status: CANCELED
                  sell_ahead: false
                  appointment_date: null
                  sequence: 1791500000000
      responses:
        2XX:
          description: |
            Acknowledge receipt with any 2xx status. The response body is ignored. A 429 or any 5xx
            response is retried; any other 4xx response is treated as a permanent rejection and is not
            retried.
