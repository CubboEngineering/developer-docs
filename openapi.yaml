    OrderInvoiceFile:
      type: object
      description: A downloadable invoice file.
      properties:
        path:
          type: string
          description: Relative download path.
          example: /rails/active_storage/blobs/redirect/example/nfe.xml
        filename:
          type: string
          description: File name.
          example: nfe.xml
        byte_size:
          type: integer
          description: Size in bytes.
          example: 10240
        content_type:
          type: string
          description: MIME type.
          example: application/xml
        url:
          type: string
          description: Absolute download URL.
          example: https://api.cubbo.com/rails/active_storage/blobs/redirect/example/nfe.xml
    OrderInvoice:
      type: object
      description: >-
        An NF-e (Brazilian electronic invoice) attached to an order. Fiscal events (cancellations,
        corrections) are not listed; only the documents themselves.
      properties:
        id:
          type: integer
          description: Invoice ID.
          example: 7801
        invoice_type:
          type:
            - string
            - "null"
          description: >-
            Where the invoice was issued. `WEBMANIA` and `BLING` are issued through Cubbo's fiscal
            integration; `IOTA` and `EXTERNAL` were issued by the client's own system; `WEBMANIA_CTE` /
            `WEBMANIA_NFSE` are transport and service documents.
          enum:
            - WEBMANIA
            - SELIA_BR
            - WEBMANIA_CTE
            - WEBMANIA_NFSE
            - NATURA
            - BLING
            - IOTA
            - EXTERNAL
            - null
          example: WEBMANIA
        status:
          type:
            - string
            - "null"
          description: Fiscal status. `PREAPPROVED` means registered and awaiting confirmation from the fiscal provider.
          enum:
            - APPROVED
            - REJECTED
            - CANCELLED
            - DENIED
            - PROCESSING
            - CONTINGENCY
            - PREAPPROVED
            - null
          example: APPROVED
        invoiceable_id:
          type: integer
          description: ID of the order the invoice belongs to.
          example: 987654
        invoiceable_type:
          type: string
          description: Type of the document the invoice belongs to; `Order` here.
          example: Order
        operation_nature:
          type:
            - string
            - "null"
          description: Nature of the operation (natureza da operacao).
          example: Venda de mercadoria
        operation_type:
          type:
            - string
            - "null"
          description: >-
            Direction of the operation, as sent when the invoice was attached: `SAIDA`/`ENTRADA` or
            `OUTGOING`/`INCOMING`.
          example: OUTGOING
        key:
          type:
            - string
            - "null"
          description: The 44-digit NF-e access key.
          example: "00000000000000000000000000000000000000000000"
        xml_file:
          oneOf:
            - $ref: "#/components/schemas/OrderInvoiceFile"
            - type: "null"
          description: The authorized NF-e XML, or null if not yet available.
        pdf_file:
          oneOf:
            - $ref: "#/components/schemas/OrderInvoiceFile"
            - type: "null"
          description: The DANFE (printable invoice) PDF, or null if not yet available.
        label_pdf_file:
          oneOf:
            - $ref: "#/components/schemas/OrderInvoiceFile"
            - type: "null"
          description: The DANFE in label format (DANFE etiqueta) PDF, or null if not available.
    OrderHistoryEvent:
      type: object
      description: >-
        An event in the order timeline (status change, tracking update, incident). `GET /orders` with
        `include_event_history=true` returns only `new_status`, `incident_description`, `timestamp` and
        `origin`.
      properties:
        id:
          type: integer
          description: Event ID.
          example: 120001
        order_id:
          type: integer
          description: Order ID.
          example: 987654
        created_by_id:
          type:
            - integer
            - "null"
          description: ID of the user who triggered the event, if any.
          example: null
        previous_status:
          type:
            - string
            - "null"
          description: Status before the event.
          example: packing
        new_status:
          type:
            - string
            - "null"
          description: Status after the event (an order status or a shipping status).
          example: shipped
        action:
          type:
            - string
            - "null"
          description: Kind of event (for example `order_status_update`, `tracking_update`, `cancel`).
          example: order_status_update
        metadata:
          type:
            - object
            - "null"
          description: Additional event data.
          example: {}
        origin:
          type:
            - string
            - "null"
          description: Who or what produced the event.
          enum:
            - cubbo
            - integration_webhook
            - shipping_webhook
            - tracking_watcher
            - cubbo_user
            - cubbo_user_import
            - cubbo_user_api
            - cubbo_business_rule
            - awaiting_client_invoice
            - homolog_invoice_precheck
            - cubbo_automation
            - tracking_app
            - system_auto_coverage_retry
            - zapier
            - integration_api
            - null
          example: shipping_webhook
        reference_timestamp:
          type:
            - string
            - "null"
          format: date-time
          description: When the event actually happened (for tracking events, the carrier's timestamp).
          example: "2026-01-11T18:30:00.000Z"
        timestamp:
          type:
            - string
            - "null"
          format: date-time
          description: Same as `reference_timestamp`.
          example: "2026-01-11T18:30:00.000Z"
        incident_description:
          type:
            - string
            - "null"
          description: Carrier description of the incident; only when `new_status` is `shipment_with_incident`.
          example: null
        difal_error_description:
          type:
            - string
            - "null"
          description: Error message(s) from the DIFAL guide issuer; only for DIFAL error events (Brazil).
          example: null
        created_by_cubbo_user:
          type: boolean
          description: True when the event was triggered by Cubbo staff rather than a user of your account.
          example: false
        created_at:
          type: string
          format: date-time
          description: When the event was recorded.
          example: "2026-01-11T18:31:00.000Z"
        updated_at:
          type: string
          format: date-time
          description: Last update of the event record.
          example: "2026-01-11T18:31:00.000Z"
    OrderShippingMethod:
      type: object
      description: >-
        Shipping method (carrier + service) assigned to the order. `GET /orders` returns only `id`,
        `carrier_name`, `shipping_name` and `is_cod`.
      properties:
        id:
          type: integer
          description: Shipping method ID.
          example: 42
        shipping_name:
          type: string
          description: Name of the shipping service.
          example: DHL Express
        carrier_name:
          type: string
          description: Carrier name as presented to your customers.
          example: DHL
        capitalized_carrier:
          type:
            - string
            - "null"
          description: Carrier name with the first letter capitalized.
          example: Dhl
        is_active:
          type: boolean
          description: Whether the method is currently available.
          example: true
        shipping_type:
          type:
            - string
            - "null"
          description: Coverage of the method.
          enum:
            - national
            - international
            - pickup
            - null
          example: national
        delivery_type:
          type:
            - string
            - "null"
          description: Service level.
          enum:
            - SameDay
            - NextDay
            - Ground
            - Pickup
            - International
            - null
          example: Ground
        country:
          type: string
          description: Two-letter country code the method operates in.
          example: MX
        is_cod:
          type: boolean
          description: Whether the method supports cash on delivery.
          example: false
        extended_zone:
          type: boolean
          description: Whether the carrier delivers to extended zones.
          example: true
        po_box_dropoff:
          type: boolean
          description: Whether the carrier delivers to PO boxes.
          example: true
        provides_pod:
          type: boolean
          description: Whether the carrier provides proof of delivery.
          example: false
        contract_provider:
          type:
            - string
            - "null"
          description: Carrier contract used.
          example: null
        enable_multipackage:
          type: boolean
          description: Whether multi-package shipments are enabled.
          example: false
        non_working_days:
          type: array
          items:
            type: integer
          description: Weekdays the carrier does not operate (0 = Sunday).
          example:
            - 0
            - 6
        dispatch_carrier_alias:
          type:
            - string
            - "null"
          description: Alias used at dispatch.
          example: null
        handles_fragile:
          type: boolean
          description: Whether the carrier handles fragile goods.
          example: false
        multipackage_label_mode:
          type: string
          description: How multi-package labels are produced.
          enum:
            - per_package
            - bulk
          example: bulk
        generates_label_per_package:
          type: boolean
          description: Whether one label is generated per package.
          example: false
        carrier_supports_per_box_label:
          type: boolean
          description: Whether the carrier mints one label per box at packing. Not in use yet.
          example: false
