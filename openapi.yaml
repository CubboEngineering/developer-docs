  /orders/{id}:
    put:
      tags:
        - Orders
      operationId: updateOrder
      summary: Update an order
      description: |
        Replaces the editable parts of an order that has not entered fulfillment yet: shipping and
        billing addresses, payment flag, shipping method, product lines and client-uploaded shipping
        documents. After a successful update the order goes back to `initial` and is re-validated and
        re-processed by Cubbo, so the response shows the order as it was saved, not its final status.
        - Allowed only while the order is in `unpaid`, `empty`, `error`, `cancelation_window`,
          `awaiting_fulfillment_request`, `entirely_dropshipping`, `backorder`, `hold` or `pending`.
          An order still in `initial` has not been processed yet and is refused (retry later). Orders in
          `processing` or any later status cannot be updated with this endpoint.
        - On a pick-and-ship store an order that already generated its label cannot be modified.
        - Only the keys you send are changed. `shipping` and `billing`, when present, replace the whole
          address block (fields you omit become empty). `products`, when present and non-empty,
          replaces every order line with the list you send; each line keeps the price it was created
          with (a price sent here is ignored) and a product new to the order gets no price.
        - `products` cannot be sent for an order that has a line pinned to a unit code, and it cannot
          pin one (`unit_code` on a product is refused).
        - The D2C/B2B classification (`is_b2b`) is immutable: on a store that handles both models a
          value different from the order's is refused; on a single-model store it is ignored.
        - When you change `shipping` without sending `shipping_method_id`, an order created through a
          sales-channel integration with a shipping-method mapping gets its shipping method re-evaluated
          during re-processing, unless the order ships on the marketplace's own label.
        - Chile: when you send `shipping_method_id` and `shipping.city` cannot be
          identified, the update is still saved with the rest of your changes. The order goes back to
          `error` until `shipping.city` is corrected.
        - A marketplace order that ships on the marketplace's own label can only move to another
          marketplace-label shipping method; the refusal carries the code
          `MARKETPLACE_WITH_EXTERNAL_GUIDE` so you can tell it apart from a fixable validation error.
        - `shipping_documents`, when present, deletes every document previously uploaded by you
          (`document_type` other than `file`) and stores the new ones. Documents generated by Cubbo
          are kept.
        - Requires an API user with the "orders update" permission and access to the store. Note that
          a permission failure inside this action is currently answered with `500 unexpected error`
          rather than `401`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo order id.
          schema:
            type: integer
          example: 123456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateRequest"
            example:
              store_id: 1234
              is_paid: true
              shipping_method_id: 77
              shipping:
                first_name: Jane
                last_name: Buyer
                phone: "5551234567"
                address1: Calle Falsa 123
                address2: Depto 4
                interior_number: "4"
                country: MX
                city: Ciudad de Mexico
                province: CDMX
                zip_code: "06600"
              products:
                - sku: SKU-RED-M
                  quantity: 2
                - sku: SKU-BLUE-L
                  quantity: 1
      responses:
        "200":
          description: The updated order (with its order lines) as saved, before re-processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              example:
                id: 123456
                store_id: 1234
                order_number: ORD-0001
                status: initial
                is_paid: true
                shipping_email: buyer@example.com
                shipping:
                  first_name: Jane
                  last_name: Buyer
                  address_1: Calle Falsa 123
                  city: Ciudad de Mexico
                  state: CDMX
                  zip_code: "06600"
                  country: MX
                order_lines:
                  - sku: SKU-RED-M
                    quantity: 2
                  - sku: SKU-BLUE-L
                    quantity: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another request is modifying this order right now. Retry shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Order is being processed by another request. Please try again in a moment.
        "422":
          description: Validation or business error. The external-label refusal also carries a `code`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/OrderUpdateLockedError"
              examples:
                missingParam:
                  value:
                    error: Parameter store_id is required
                wrongStore:
                  value:
                    error: Order id 123456 does not belong to store id 1234
                notProcessedYet:
                  value:
                    error: Order id 123456 is in status initial and has not been processed yet, try again later.
                notEditable:
                  value:
                    error: You can't edit an order if an order it is in processing or further statuses
                labelAlreadyGenerated:
                  value:
                    error: order id 123456 has already generated a label, cannot be modified
                businessModelImmutable:
                  value:
                    error: An order cannot change between D2C and B2B once it exists
                pinnedLines:
                  value:
                    error: >-
                      order id 123456 has lines pinned to a unit code, or the request pins one; its products
                      cannot be replaced
                productNotFound:
                  value:
                    error: Product SKU-RED-M was not found in this store
                personalizedProductNeedsUnitCode:
                  value:
                    error: "unit_code is required for sku SKU-CARD: each unit belongs to one recipient"
                personalizedUnitInKit:
                  value:
                    error: sku SKU-KIT is a kit holding a personalized unit, which cannot be ordered as a kit
                shippingMethodNotFound:
                  value:
                    error: Shipping method 77 was not found
                shippingMethodInactive:
                  value:
                    error: Shipping method 77 (Express) is not active
                internationalOnDomestic:
                  value:
                    error: >-
                      Shipping method 77 (DHL International) is international and this order ships within MX.
                      Assign a national shipping method.
                noCoverage:
                  value:
                    error: Shipping method 77 (Express) does not have coverage for this order
                externalLabelLocked:
                  value:
                    error: >-
                      Order 123456 ships on the marketplace's own label (Mercado Envios), so its shipping
                      method cannot be changed to Express: the marketplace would cancel the order and refund
                      the buyer. It can only move to another marketplace-label shipping method.
                    code: MARKETPLACE_WITH_EXTERNAL_GUIDE
        "500":
          description: >-
            Unexpected error. Also returned when the order id does not exist or when the API user lacks
            permission on this order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unexpected error
    patch:
      tags:
        - Orders
      operationId: patchOrderShippingFields
      summary: Update shipping contact and address fields
      description: |
        Partially updates the recipient and shipping address of an order. Send only the fields you want
        to change; a field that is absent or `null` is left untouched, an empty string clears it. The
        response echoes exactly the fields you changed with their saved values.
        - Allowed in every status except `shipped`, `returning`, `returned`, `return_arrived` and
          `reentered`. Unlike `PUT /orders/{id}`, this works during `processing`, `picking` and
          `packing` (for example to fix an address before the label is generated).
        - An order in `pending` goes back to `initial` and is re-processed; an order in another
          editable status is re-processed without a status change. Orders in `canceled`, `interrupted`
          or in fulfillment (`processing`, `picking`, `packing`) are saved but not re-processed.
        - At least one field must be provided.
        - Requires an API user with the "orders update" permission and access to the store. The order
          must also be editable for your store: a Brazilian order whose NF-e was approved more than
          24 hours ago, or a store with order editing restricted by Cubbo, is answered with `401`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo order id.
          schema:
            type: integer
          example: 123456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderPatchRequest"
            example:
              shipping_address_1: Calle Falsa 123
              shipping_number: "123"
              shipping_number_int: "4"
              shipping_neighborhood: Centro
              shipping_zip_code: "06600"
              shipping_references: Blue door, ring twice
      responses:
        "200":
          description: The fields that were updated, with the values now stored on the order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPatchResponse"
              example:
                shipping_address_1: Calle Falsa 123
                shipping_number: "123"
                shipping_number_int: "4"
                shipping_neighborhood: Centro
                shipping_zip_code: "06600"
                shipping_references: Blue door, ring twice
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another request is modifying this order right now. Retry shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Order is being processed by another request. Please try again in a moment.
        "422":
          description: Validation or business error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noFields:
                  value:
                    error: No fields to update were provided.
                statusNotEditable:
                  value:
                    error: Order id 123456 has status shipped, cannot update fields.
                orderNotFound:
                  value:
                    error: Couldn't find Order with 'id'=123456
                invalidParam:
                  value:
                    error: "'123' is not a valid String"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders/{id}/hold:
    patch:
      tags:
        - Orders
      operationId: holdOrder
      summary: Put an order on hold
      description: |
        Pauses an order so Cubbo does not process or fulfill it until you release it with
        `PATCH /orders/{id}/unhold`. The order's status becomes `hold`.
        - Allowed only while the order is in `initial`, `unpaid`, `empty`, `error`,
          `cancelation_window`, `awaiting_fulfillment_request`, `entirely_dropshipping`, `backorder`
          or `pending`, and (on pick-and-ship stores) before the package is picked up.
        - If your sales-channel integration has status webhooks enabled, a status update is sent.
        - Requires an API user with the "orders update" permission and access to the store.
        - No request body.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo order id.
          schema:
            type: integer
          example: 123456
      responses:
        "200":
          description: The order is now on hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderHoldResult"
              example:
                id: 123456
                status: hold
                order_number: ORD-0001
                store_id: 1234
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another request is modifying this order right now. Retry shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Order is being processed by another request. Please try again in a moment.
        "422":
          description: The order cannot be put on hold in its current status, or it was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                cannotHold:
                  description: Returned (in Spanish) when the order's status does not allow holding it.
                  value:
                    error: "Error al pausar la orden: 123456"
                orderNotFound:
                  value:
                    error: Couldn't find Order with 'id'=123456
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders/{id}/unhold:
    patch:
      tags:
        - Orders
      operationId: unholdOrder
      summary: Release an order from hold
      description: |
        Releases an order that is on `hold`. The order goes back to `initial` and Cubbo re-validates and
        processes it again; any "hold order" business rule configured for your store is skipped on this
        re-processing, and a potential-fraud flag on the order is cleared.
        - The order must be in `hold`; any other status is refused.
        - Requires an API user with the "orders update" permission and access to the store.
        - No request body.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo order id.
          schema:
            type: integer
          example: 123456
      responses:
        "200":
          description: The order was released and queued for processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderHoldResult"
              example:
                id: 123456
                status: initial
                order_number: ORD-0001
                store_id: 1234
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another request is modifying this order right now. Retry shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Order is being processed by another request. Please try again in a moment.
        "422":
          description: The order is not on hold, or it was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notOnHold:
                  value:
                    error: An order in pending status cannot be changed on unhold
                orderNotFound:
                  value:
                    error: Couldn't find Order with 'id'=123456
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders/{id}/upload-shipping-documents:
    patch:
      tags:
        - Orders
      operationId: uploadOrderShippingDocuments
      summary: Upload shipping documents to an order
      description: |
        Attaches one or more files (shipping labels, invoices, other printable documents) to an order.
        Files are sent as base64 strings inside a JSON body, not as multipart form data. Use it to
        provide the shipping label of an order that ships with your own carrier, or to add documents
        the warehouse must print and include in the package.
        - Documents are appended; documents that have content are not removed. Use `PUT /orders/{id}`
          with `shipping_documents` if you need to replace the ones you uploaded before.
        - An existing document of the same `printing_type` whose file is empty is replaced by the one
          you upload, so the warehouse prints the new file instead of the empty one. Use this to fix
          a label that arrived empty.
        - If you send a document without `metadata`, it keeps the metadata of the empty document it
          replaces. For a `label`, if no empty document had any, it takes the metadata sent with a
          label URL of this order that has not given back a label yet.
        - Each file must have content, and a file declared as `application/pdf` must be a PDF.
          Otherwise the request is refused with `422` and nothing is stored or removed.
        - The order can be in any status. If the order is in `error` (for example because its label
          was missing), it is automatically re-processed after the upload.
        - Accepted file types: PDF, PNG and JPEG, each under 5 MB. `metadata` is free-form JSON of at
          most 10 KB.
        - At least one document is required.
        - Requires an API user with the "orders update" permission and access to the store.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Cubbo order id.
          schema:
            type: integer
          example: 123456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingDocumentsUploadRequest"
            example:
              shipping_documents:
                - filename: label.pdf
                  base64_data: >-
                    JVBERi0xLjQKJcOkw7zDtsOfCjIgMCBvYmoKPDwvTGVuZ3RoIDMgMCBSL0ZpbHRlci9GbGF0ZURlY29kZT4+CnN0cmVhbQ==
                  content_type: application/pdf
                  printing_type: label
                  document_type: base64
                  metadata:
                    tracking_number: TRACK0000001
                    carrier: DHL
      responses:
        "200":
          description: The documents were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingDocumentsUploadResponse"
              example:
                message: "Shipping documents uploaded: label.pdf"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                emptyList:
                  value:
                    error: shipping_documents is expected to be an array of at least one element.
                missingField:
                  value:
                    error: Parameter base64_data is required
                orderNotFound:
                  value:
                    error: Couldn't find Order with 'id'=123456
                emptyFile:
                  value:
                    error: shipping document label.pdf is empty
                notAPdf:
                  value:
                    error: shipping document label.pdf is not a PDF
        "500":
          description: >-
            Unexpected error. Also returned when a file is rejected for its type (other than PDF, PNG or
            JPEG), size (over 5 MB) or metadata (over 10 KB).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unexpected error
  /orders/{order_id}/attach-invoice:
    post:
      tags:
        - Orders
      operationId: attachOrderInvoice
      summary: Attach NF-e invoices issued through Cubbo's fiscal integration
      description: |
        Brazil only. Registers one or more NF-e (Nota Fiscal Eletronica, the Brazilian electronic invoice)
        that were issued for this order through Cubbo's fiscal integration. Cubbo then fetches the
        authorized XML and DANFE for each invoice from the fiscal provider and attaches them to the order so
        the warehouse can print them and ship. Use this when your store issues NF-e through Cubbo's
        integrated fiscal provider and you need to tell Cubbo which invoices belong to the order.

        - The order must be in `pending`, `processing`, `picking` or `packing`; otherwise the request is
          rejected with 422.
        - Each invoice needs its 44-digit access key (`key`), the identifier you used when issuing it
          (`identifier`), a `purpose`, the operation type (`SAIDA` outgoing / `ENTRADA` incoming) and the
          operation nature (`operation_nature`, the CFOP description such as "Venda de mercadoria").
        - Keys and identifiers must be unique within the request. If one of the keys already exists in
          Cubbo, no new invoice is created: Cubbo refreshes the existing invoices from the fiscal provider
          and responds with `update_invoice_ids` listing those keys.
        - An identifier that already belongs to a non-cancelled invoice is rejected. Identifiers of
          cancelled invoices can be reused.
        - Invoices are created as `PREAPPROVED` and move to `APPROVED` once the fiscal provider confirms
          them. Read their status in the `invoices` array of `GET /orders`.
        - Only `invoice_type` `WEBMANIA` is accepted today.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
          description: Cubbo ID of the order.
          example: 987654
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invoices
              properties:
                invoice_type:
                  type: string
                  enum:
                    - WEBMANIA
                  default: WEBMANIA
                  description: Fiscal provider the invoices were issued with. Only `WEBMANIA` is supported.
                  example: WEBMANIA
                invoices:
                  type: array
                  minItems: 1
                  description: Invoices to attach to the order.
                  items:
                    type: object
                    required:
                      - key
                      - identifier
                      - purpose
                      - operation_type
                      - operation_nature
                    properties:
                      key:
                        type: string
                        pattern: ^[0-9]{44}$
                        description: The 44-digit NF-e access key (chave de acesso). Digits only.
                        example: "00000000000000000000000000000000000000000000"
                      identifier:
                        type: string
                        description: >-
                          The identifier used when the invoice was issued with the fiscal provider. Must be
                          unique.
                        example: SALE987654
                      purpose:
                        type: string
                        description: >-
                          What the invoice documents. Replenishment and unidentified-return purposes are not
                          accepted on orders.
                        enum:
                          - SALE_INVOICE
                          - DONATION_INVOICE
                          - SYMBOLIC_RETURN_INVOICE
                          - DONATION_RETURN_INVOICE
                          - RETURN_INVOICE
                          - REMOVE_STOCK_INVOICE
                          - REMOVE_DAMAGED_STOCK_INVOICE
                          - REMOVE_EXPIRED_STOCK_INVOICE
                          - REMOVE_LOST_STOCK_INVOICE
                          - SHIPPING
                          - SHIPPING_RETURN
                          - SHIPPING_COMPLEMENT
                          - SHIPPING_SERVICE
                          - RETURN_REPLENISHMENT_INVOICE
                          - CUSTOMER_RETURN_INVOICE
                          - CUSTOMER_RETURN_REPLENISHMENT_INVOICE
                          - REPLENISHMENT_POSITIVE_ADJUSTMENT_INVOICE
                          - RETURN_REFUSAL_INVOICE
                          - RETURN_REFUSAL_PARTIAL_INVOICE
                          - VALUE_REDUCTION_INVOICE
                          - EVENT_112130
                          - EVENT_112150
                          - EVENT_110111
                          - EVENT_110110
                        example: SALE_INVOICE
                      operation_type:
                        type: string
                        enum:
                          - SAIDA
                          - ENTRADA
                        description: "`SAIDA` for outgoing (goods leaving the warehouse), `ENTRADA` for incoming."
                        example: SAIDA
                      operation_nature:
                        type: string
                        description: Nature of the operation as printed on the NF-e (natureza da operacao).
                        example: Venda de mercadoria
            example:
              invoice_type: WEBMANIA
              invoices:
                - key: "00000000000000000000000000000000000000000000"
                  identifier: SALE987654
                  purpose: SALE_INVOICE
                  operation_type: SAIDA
                  operation_nature: Venda de mercadoria
      responses:
        "200":
          description: >-
            Invoices registered. `new_invoice_ids` holds the IDs of the invoices created; when every key
            already existed, it is empty and `update_invoice_ids` lists the keys that were refreshed instead.
          content:
            application/json:
              schema:
                type: object
                required:
                  - new_invoice_ids
                properties:
                  new_invoice_ids:
                    type: array
                    items:
                      type: integer
                    description: IDs of the invoices created by this request.
                    example:
                      - 7801
                  update_invoice_ids:
                    type: string
                    description: >-
                      Comma-separated access keys of invoices that already existed and were refreshed. Only
                      present when nothing new was created.
                    example: "00000000000000000000000000000000000000000000"
              examples:
                created:
                  value:
                    new_invoice_ids:
                      - 7801
                alreadyExisted:
                  value:
                    new_invoice_ids: []
                    update_invoice_ids: "00000000000000000000000000000000000000000000"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingInvoices:
                  value:
                    error: Parameter invoices is required
                badKey:
                  value:
                    error: Parameter key must contain numbers only
                invalidPurpose:
                  value:
                    error: Parameter purpose must be within ["SYMBOLIC_RETURN_INVOICE", "SALE_INVOICE", ...]
                unsupportedType:
                  value:
                    error: only WEBMANIA is supported for now
                invalidStatus:
                  value:
                    error: "order id 987654 is not in a valid status: shipped"
                duplicateIdentifiers:
                  value:
                    error: "duplicate invoice identifiers provided: [\"SALE987654\"]"
                duplicateKeys:
                  value:
                    error: "duplicate invoice keys provided: [\"00000000000000000000000000000000000000000000\"]"
                identifierExists:
                  value:
                    error: "some identifiers provided already exist: [\"SALE987654\"]"
                orderNotFound:
                  value:
                    error: Couldn't find Order with 'id'=0
                fiscalProviderError:
                  value:
                    error: "WebmaniaError: <message from the fiscal provider>"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders/{order_id}/convert-to-click-and-collect:
    patch:
      tags:
        - Click and collect
      operationId: convertOrderToClickAndCollect
      summary: Convert an order to click and collect
      description: |
        Changes an order's delivery to pickup at the point identified by `service_code` (obtained
        from `GET /orders/{order_id}/pickup-points`) and reprocesses it with the pickup carrier.
        On success the full updated order is returned.

        - The order must be in a pre-label status (paused orders are allowed) and must not be
          click and collect already.
        - Click and collect must be enabled for the store, and the point's carrier must be one
          the store allows. The store's order-editing restrictions apply.
        - The pickup option must not cost more than the order's original shipping unless the
          store waived that check. Orders shipped by carriers not billed through Cubbo, or
          international orders, cannot be converted.
        - Business rejections answer 422 with a stable `code`. On `ALREADY_CLICK_AND_COLLECT`
          the body also carries the order's current `click_and_collect_metadata` (public fields
          only) so a client retrying after a timeout can tell whether its own conversion won.
        - If the conversion succeeds but the order cannot be rendered, the response is still
          200 with `{"converted": true}`; fetch the order to see its new state.
        - Unknown orders, orders of other accounts and orders your credential cannot update all
          answer the same 404 body.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          description: Id of the order
          schema:
            type: integer
            example: 55501
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertToClickAndCollectRequest"
            example:
              store_id: 1234
              service_code: CUBBOCNCESTEST001
      responses:
        "200":
          description: >-
            Order converted. The body is the updated order (with `order_lines` and `shipping_method`), or
            `{"converted": true}` if the order could not be rendered.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Order"
                  - $ref: "#/components/schemas/ConvertedWithoutOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The order or the claimed store does not exist or is not accessible to your credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickAndCollectError"
              examples:
                orderNotFound:
                  value:
                    error: Order not found
                    code: ORDER_NOT_FOUND
                storeNotFound:
                  value:
                    error: store_not_found
        "422":
          description: Validation error (`error` only) or business rejection (`error` plus a stable `code`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickAndCollectConversionError"
              examples:
                missingServiceCode:
                  value:
                    error: Parameter service_code is required
                invalidStatus:
                  value:
                    error: Order cannot be converted to click and collect in status shipped
                    code: INVALID_ORDER_STATUS
                alreadyClickAndCollect:
                  value:
                    error: Order is already click and collect
                    code: ALREADY_CLICK_AND_COLLECT
                    click_and_collect_metadata:
                      carrier_name: Estafeta
                      service_code: CUBBOCNCESTEST001
                storeEditRestricted:
                  value:
                    error: Order editing is currently restricted for this store
                    code: STORE_EDIT_RESTRICTED
                invalidServiceCode:
                  value:
                    error: Invalid click_and_collect_service_code
                    code: INVALID_CNC_SERVICE_CODE
                carrierTemporarilyUnavailable:
                  value:
                    error: This pickup carrier is temporarily unavailable
                    code: CNC_CARRIER_TEMPORARILY_UNAVAILABLE
                notEnabledForStore:
                  value:
                    error: Click and collect is not enabled for this store
                    code: CNC_NOT_ENABLED_FOR_STORE
                carrierNotEnabledForStore:
                  value:
                    error: This pickup carrier is not enabled for this store
                    code: CNC_CARRIER_NOT_ENABLED_FOR_STORE
                shippingMethodNotFound:
                  value:
                    error: No shipping method found for click and collect with carrier ESTAFETA
                    code: CNC_SHIPPING_METHOD_NOT_FOUND
                originalNotCubboBilled:
                  value:
                    error: This order's shipping carrier doesn't support click and collect conversion
                    code: CNC_ORIGINAL_NOT_CUBBO_BILLED
                originalNotNational:
                  value:
                    error: Click and collect is only available for national orders
                    code: CNC_ORIGINAL_NOT_NATIONAL_SHIPPING
                priceExceedsOriginal:
                  value:
                    error: This pickup option would cost more than the original shipping
                    code: CNC_PRICE_EXCEEDS_ORIGINAL
                rateCardUnavailable:
                  value:
                    error: Click and collect pricing could not be determined for this order
                    code: CNC_RATE_CARD_UNAVAILABLE
                locationConfirmationFailed:
                  value:
                    error: The pickup point could not be confirmed with the carrier
                    code: CNC_LOCATION_CONFIRMATION_FAILED
                genericIneligible:
                  value:
                    error: Click and collect conversion is not eligible
                    code: CNC_SHIPPING_METHOD_NOT_FOUND
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickAndCollectUnexpectedError"
              example:
                error: unexpected_error
                timestamp: 1700000000
  /orders/{order_id}/pickup-points:
    get:
      tags:
        - Click and collect
      operationId: listOrderPickupPoints
      summary: List click-and-collect pickup points eligible for an order
      description: |
        Returns the pickup points (carrier branches and Cubbo points) near a postal code to which
        the order could be converted with
        `PATCH /orders/{order_id}/convert-to-click-and-collect`. Only points whose conversion
        would be accepted are listed: the order must be in a pre-label status (paused orders are
        allowed), click and collect must be enabled for the store, and each point's pickup
        carrier must be allowed for the store and not cost more than the order's original
        shipping (unless the store waived that check).

        - `store_id` is the store that owns the order and must be a store of your account; an
          order that does not belong to it answers 404.
        - `postal_code` defaults to the order's shipping zip code. `address` refines the search
          for carriers that need a street address.
        - An ineligible order still answers 200, with `cnc_eligible: false`, a `code` explaining
          why and an empty list.
        - Unknown orders, orders of other accounts and orders your credential cannot read all
          answer the same 404 body.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          description: Id of the order
          schema:
            type: integer
            example: 55501
        - name: store_id
          in: query
          required: true
          description: Id of the store that owns the order; must belong to your account
          schema:
            type: integer
            example: 1234
        - name: postal_code
          in: query
          required: false
          description: Postal code to search around. Defaults to the order's shipping zip code.
          schema:
            type: string
            example: "06600"
        - name: address
          in: query
          required: false
          description: Street address to refine the search
          schema:
            type: string
            example: Av. Reforma 123
      responses:
        "200":
          description: Eligible pickup points, or the reason the order is not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickupPointsResponse"
              examples:
                eligible:
                  value:
                    cnc_eligible: true
                    pickup_points:
                      - carrier: ESTAFETA
                        service_code: CUBBOCNCESTEST001
                        name: Sucursal Centro
                        address: Av. Reforma 123, CDMX
                        distance_km: 1.2
                        schedule: "Lun a Vie: 10:00-18:00, Sab: 10:00-14:00, Dom: cerrado"
                      - carrier: CUBBO
                        service_code: CUBBOCNCCUBBOCUBBO001
                        name: Punto Cubbo Centro
                        address: Calle Centro 300, CDMX, 06000
                        distance_km: 0.8
                        schedule: "Lunes a Sabado: 10:00-20:00"
                notEligible:
                  value:
                    cnc_eligible: false
                    code: CNC_NOT_ENABLED_FOR_STORE
                    pickup_points: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The order or the claimed store does not exist or is not accessible to your credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickAndCollectError"
              examples:
                orderNotFound:
                  value:
                    error: Order not found
                    code: ORDER_NOT_FOUND
                storeNotFound:
                  value:
                    error: store_not_found
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingStoreId:
                  value:
                    error: Parameter store_id is required
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickAndCollectUnexpectedError"
              example:
                error: unexpected_error
                timestamp: 1700000000
  /orders/{order_id}/shipping-labels:
    get:
      tags:
        - Shipping labels
      operationId: listOrderShippingLabels
      summary: List an order's shipping labels
      description: >
        Returns the valid shipping labels (carrier guides) generated for an order, including the label

        PDF, the tracking number and tracking URLs. Use it to print labels or to look up tracking numbers

        after the order has been packed.


        - Only labels that are still valid are returned; labels that were cancelled or replaced are excluded.

        - The prepaid return label that travels inside the package is never included. Other return-type
          labels (`Return`, `Return By Carrier`) are included when they exist.
        - Returns an empty array when the order has no labels yet (for example before packing).

        - `label_file` is `{}` (an empty object) when the label PDF is not available; `billing_file` is
        `null`.
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
          description: Cubbo ID of the order (the `id` field of `Order`, not the order number).
          example: 987654
      responses:
        "200":
          description: Shipping labels of the order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShippingLabel"
              example:
                - id: 4401
                  order_id: 987654
                  shipping_number: TRK000000001
                  label_type: Shipping
                  tracking_url: https://carrier.example.com/track/TRK000000001
                  cubbo_tracking_url: https://tracking.example.com/orders/abc123
                  billing_file: null
                  label_file:
                    path: /rails/active_storage/blobs/redirect/example/label.pdf
                    url: https://api.cubbo.com/rails/active_storage/blobs/redirect/example/label.pdf
                    filename: label.pdf
                    byte_size: 48213
                    content_type: application/pdf
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The order does not exist or the parameter is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type:
                      - string
                      - "null"
                  context:
                    type:
                      - object
                      - "null"
              examples:
                notFound:
                  value:
                    error: Couldn't find Order with 'id'=0
                    code: null
                    context: null
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders/attach-external-invoice:
    post:
      x-excluded: true
      tags:
        - Orders
      operationId: attachExternalOrderInvoice
      summary: Attach an NF-e issued by your own system
      description: |
        Brazil only. Uploads an NF-e (Nota Fiscal Eletronica) that your own ERP or fiscal system already
        issued and had authorized by SEFAZ, and attaches it to the order. Cubbo stores the XML, generates the
        DANFE (the printable invoice) and, for sale orders of stores enrolled in DIFAL, starts the
        interstate-tax (DIFAL) payment-slip process. Use this when you issue invoices outside Cubbo; if you
        issue them through Cubbo's fiscal integration, use `POST /orders/{order_id}/attach-invoice` instead.

        - Identify the order with exactly one of `order_id` or `order_number`. Both are looked up only
          among the stores your token can access. `order_number` must resolve to a single order.
        - `invoice_xml` is the authorized, protocol-wrapped `nfeProc` XML, base64-encoded (a data-URI
          prefix is accepted) or as the raw XML string. The access key embedded in the XML must match
          `access_key`, and the XML must contain the `total/ICMSTot` section.
        - The request is idempotent: if the order already has an approved sale (or donation) NF-e, that
          invoice is returned and nothing new is created. A key that already exists on another document is
          rejected.
        - The invoice is stored as `APPROVED` with `invoice_type` `IOTA` and purpose `SALE_INVOICE`
          (or the matching stock-removal purpose for removal orders).
        - If another upload for the same order is still being processed, the API responds `202 Accepted`
          with a `transaction_id`; retry after a few seconds.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - invoice_xml
                - access_key
                - invoice_number
              properties:
                order_id:
                  type: integer
                  description: Cubbo ID of the order. Send either this or `order_number`, not both.
                  example: 987654
                order_number:
                  type: string
                  description: Your order number. Send either this or `order_id`, not both.
                  example: ORD-0001
                invoice_xml:
                  type: string
                  description: The authorized NF-e XML (`nfeProc`), base64-encoded or as raw XML.
                  example: PD94bWwgdmVyc2lvbj0iMS4wIj8+PG5mZVByb2M+Li4uPC9uZmVQcm9jPg==
                access_key:
                  type: string
                  pattern: ^[0-9]{44}$
                  description: The 44-digit NF-e access key. Must match the key inside `invoice_xml`.
                  example: "00000000000000000000000000000000000000000000"
                invoice_number:
                  type: string
                  description: The NF-e number (nNF).
                  example: "123"
                message:
                  type: string
                  description: >-
                    Optional free-text note stored with the invoice (for example your system's status
                    message).
                  example: "issued: awaiting danfe"
                invoice_type:
                  type: string
                  enum:
                    - IOTA
                  default: IOTA
                  description: Source of the invoice. Only `IOTA` is accepted.
                  example: IOTA
            example:
              order_id: 987654
              access_key: "00000000000000000000000000000000000000000000"
              invoice_number: "123"
              invoice_xml: PD94bWwgdmVyc2lvbj0iMS4wIj8+PG5mZVByb2M+Li4uPC9uZmVQcm9jPg==
      responses:
        "200":
          description: Invoice attached (or already attached) to the order.
          content:
            application/json:
              schema:
                type: object
                required:
                  - invoice_id
                  - key
                  - status
                properties:
                  invoice_id:
                    type: integer
                    description: ID of the invoice attached to the order.
                    example: 7801
                  key:
                    type: string
                    description: The NF-e access key.
                    example: "00000000000000000000000000000000000000000000"
                  status:
                    type: string
                    description: Invoice status; `APPROVED` for an authorized NF-e.
                    example: APPROVED
              example:
                invoice_id: 7801
                key: "00000000000000000000000000000000000000000000"
                status: APPROVED
        "202":
          description: Another upload for this order is still being processed. Retry later.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Accepted, another invoice attach for this order is still processing.
                  transaction_id:
                    type: string
                    example: tx-0001
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: >-
            Validation or business error. An order outside the stores your token can access is reported as not
            found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingXml:
                  value:
                    error: Parameter invoice_xml is required
                badAccessKey:
                  value:
                    error: Parameter access_key must be the 44-digit NF-e access key
                noOrderReference:
                  value:
                    error: provide either order_id or order_number
                bothOrderReferences:
                  value:
                    error: provide only one of order_id or order_number
                orderNotFoundById:
                  value:
                    error: no order found with order_id 0
                orderNotFoundByNumber:
                  value:
                    error: no order found with order_number ORD-0000
                ambiguousOrderNumber:
                  value:
                    error: multiple orders found with order_number ORD-0001; provide order_id instead
                keyMismatch:
                  value:
                    error: access_key does not match the NF-e XML
                keyExists:
                  value:
                    error: an invoice with key 00000000000000000000000000000000000000000000 already exists
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders/awaiting-invoice:
    get:
      tags:
        - Orders
      operationId: listOrdersAwaitingInvoice
      summary: List orders waiting for an NF-e
      description: >
        Brazil only. Returns the orders of a store that have been picked (or are about to be) and do not yet

        have an approved NF-e, so your fiscal system can issue the invoice and attach it with

        `POST /orders/{order_id}/attach-invoice`. Each order

        includes its lines, the picked quantities per lot and the replenishment invoices those lots came

        from, which lets you reference the inbound NF-e on the outbound one.


        - By default (`only_picked_orders=true`) only orders in `packing` are returned. With
          `only_picked_orders=false`, orders in `pending`, `processing`, `picking` and `packing` are included.
        - Orders are sorted by the time of their last status change, oldest first.

        - Orders with an approved NF-e are excluded. Use `order_ids` to restrict the result to specific
        orders.

        - `picked_sku_quantities` on each line groups the picked units by lot; `related_replenishments` on
          each order lists the replenishment NF-e keys of those lots. Orders whose picked lot codes cannot be
          parsed into a material code are omitted from the page (but still counted in `meta.total_count`).
        - `integration_details` carries the raw sales-channel order for AnyMarket integrations and is
          `null` otherwise.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the store.
          example: 1234
        - name: only_picked_orders
          in: query
          required: false
          schema:
            type: boolean
            default: true
          description: >-
            When true only `packing` orders are returned; when false, `pending`, `processing`, `picking` and
            `packing`.
          example: true
        - name: order_ids
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
          description: Restrict the result to these order IDs.
          example:
            - 987654
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starting at 1.
          example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 10
          description: Orders per page.
          example: 10
      responses:
        "200":
          description: Orders awaiting an invoice, with pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                  - meta
                properties:
