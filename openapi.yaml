    get:
      tags:
        - Orders
      operationId: listOrders
      summary: List orders
      description: >
        Returns a paginated list of a store's orders with their order lines, invoices (NF-e, Brazil only),

        shipping method, delivery tracking and, optionally, the order's event history. Use it to sync order

        status and tracking into your own systems. Filter by status, order type, order number, buyer email

        or date ranges.


        - Results are paginated: `page` (default 1) and `per_page` (default 10, capped at 100). The `meta`
          object tells you whether more pages exist.
        - Filtering `status` by `processing` also returns orders in `picking` and `packing`, since all three
          mean "being prepared in the warehouse".
        - `order_number` accepts a single string or an array of strings
        (`order_number[]=ORD-0001&order_number[]=ORD-0002`).
          When you filter by order number, stock units of products that use unit codes also expose their
          `unit_code` while the order is `packing` or `shipped`.
        - `sort_by` accepts any order field (for example `created_at`, `channel_created_at`, `shipping_date`,
          `updated_at`), or `shipping_methods.<field>` / `stores.<field>`; an unknown field returns 422
          `Field not found`. `sort` is `desc` unless you pass `asc`. Without `sort_by` the order of results is not guaranteed.
        - `include_event_history=true` adds `order_histories` to every order (status changes, tracking
          updates and incidents).
        - `is_b2b` is only present for stores that handle both B2B and D2C orders.

        - Each order in this list carries the subset of `Order` fields listed in the response schema
          description; the full `Order` object is returned by the create and update endpoints.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the store whose orders you want to list.
          example: 1234
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OrderStatus"
          description: Only return orders in these statuses. `processing` implicitly includes `picking` and `packing`.
          example:
            - pending
            - processing
        - name: order_type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OrderType"
          description: Only return orders of these types.
          example:
            - SALE
        - name: order_number
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Exact order number, or an array of order numbers. Enables `unit_code` exposure on stock units.
          example: ORD-0001
        - name: shipping_email
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial match on the buyer's shipping email.
          example: buyer@example.com
        - name: shipping_date[from]
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Lower bound of the shipping date range. Required when `shipping_date[to]` is sent.
          example: "2026-01-01T00:00:00Z"
        - name: shipping_date[to]
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Upper bound of the shipping date range. Required when `shipping_date[from]` is sent.
          example: "2026-01-31T23:59:59Z"
        - name: channel_created_at[from]
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >-
            Lower bound of the range on the date the order was created in the sales channel. Required when
            `channel_created_at[to]` is sent.
          example: "2026-01-01T00:00:00Z"
        - name: channel_created_at[to]
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: >-
            Upper bound of the range on the date the order was created in the sales channel. Required when
            `channel_created_at[from]` is sent.
          example: "2026-01-31T23:59:59Z"
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
          description: >-
            Field to sort by. Any order field, or `shipping_methods.<field>` / `stores.<field>`. Unknown
            fields return 422.
          example: channel_created_at
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Sort direction. Any value other than `asc` sorts descending.
          example: desc
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
          description: Page number, starting at 1.
          example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 100
          description: Orders per page. Values above 100 are capped at 100.
          example: 50
        - name: include_event_history
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, each order includes `order_histories` with its status and tracking events.
          example: false
      responses:
        "200":
          description: Orders matching the filters, with pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                  - meta
                properties:
                  orders:
                    type: array
                    description: >
                      Orders on this page. Each item is an `Order` limited to: `id`, `store_id`,
                      `order_number`, `status`,

                      `channel_created_at`, `order_date`, `shipping_date`, `pending_at`, `shipping_email`,
                      `shipping_status`,

                      `is_paid`, `channel_order_id`, `channel_name`, `is_cod`, `cod_amount`,
                      `has_carrier_insurance`,

                      `requires_document_return`, `requires_pickup_on_delivery`, `currency`, `total_price`,
                      `shipping`,

                      `billing`, `delivery_tracking`, `return_shipping_labels`, `estimated_time_arrival`,
                      `delivered_at`,

                      `updated_at`, `is_click_and_collect`, `click_and_collect_metadata`,
                      `latest_estimated_time_arrival_range`,

                      `channel_shipping_line_code`, `warehouse_timezone`, `is_first_time_buyer`,
                      `is_subscription_renewal`,

                      `is_multi_package`, `is_b2b` (mixed B2B/D2C stores only), plus the associations
                      `shipping_method`

                      (`id`, `carrier_name`, `shipping_name`, `is_cod`), `order_lines` (`id`, `name`, `sku`,
                      `quantity`,

                      `generated`, `price_per_item`, `product`, `stock_units`), `invoices`, `store` (`id`,
                      `name`),

                      `channel_integration` (`id`, `channel_type_name`), `return`, `created_by_return` and,
                      when

                      `include_event_history=true`, `order_histories` (`new_status`, `incident_description`,
                      `timestamp`, `origin`).
                    items:
                      $ref: "#/components/schemas/Order"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              example:
                orders:
                  - id: 987654
