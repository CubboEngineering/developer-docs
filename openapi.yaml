        store_id:
          type: integer
          description: Store the replenishment belongs to.
          example: 1234
        notes:
          type:
            - string
            - "null"
          description: Free-text notes for the warehouse.
          example: Pallet 2 contains fragile items
        created_at:
          type: string
          format: date-time
          description: Creation time.
          example: "2026-10-12T14:03:11.512Z"
        expected_arrived_at:
          type:
            - string
            - "null"
          format: date-time
          description: Expected arrival date declared on creation.
          example: "2026-11-02T15:00:00.000Z"
        sell_ahead:
          type:
            - boolean
            - "null"
          description: Whether the announced units were made sellable before arrival.
          example: false
        declared_value:
          type:
            - string
            - "null"
          description: Declared total value of the shipment, as a decimal string; usually `null`.
          example: null
        is_return:
          type: boolean
          description: "`true` when this replenishment is the reception of a return."
          example: false
        completed_at:
          type:
            - string
            - "null"
