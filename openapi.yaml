    OrderUpdateShippingDocument:
      type: object
      description: A document sent as base64 inside the update body.
      required:
        - filename
        - data
        - content_type
        - printing_type
        - document_type
      properties:
        filename:
          type: string
          description: File name, including extension.
          example: label.pdf
        data:
          type: string
          description: File contents encoded in base64. A `data:...;base64,` prefix is tolerated.
          example: JVBERi0xLjQKJcOkw7zDtsOfCg==
        content_type:
          type: string
          description: MIME type of the file. PDF, PNG and JPEG are accepted.
          enum:
            - application/pdf
            - image/png
            - image/jpeg
          example: application/pdf
        printing_type:
          type: string
          description: >-
            How the warehouse must print and use the document. `label` is a shipping label; `document` is any
            other printable to include in the package.
          enum:
            - label
            - document
            - difal_bill
            - difal_payment_receipt
            - identifier_label
            - oxxo_digital_card
          example: label
        document_type:
          type: string
          description: >-
            Origin of the document. Use `base64` for documents you upload; `file` marks Cubbo-generated
            documents and is never replaced by later updates.
          enum:
            - base64
            - url
            - file
          example: base64
        metadata:
          type: object
          description: >-
            Free-form JSON stored with the document (at most 10 KB), for example the tracking number of a
            label.
          additionalProperties: true
          example:
            tracking_number: TRACK0000001
            carrier: DHL
