        - store_id
      properties:
        id:
          type: integer
          description: Cubbo order id.
          example: 123456
        status:
          type: string
          description: Order status after the action (`hold` after holding, `initial` after releasing).
          example: hold
        order_number:
          type: string
          description: Your order number.
          example: ORD-0001
        store_id:
          type: integer
          description: Id of the store the order belongs to.
          example: 1234
    ShippingDocumentsUploadRequest:
      type: object
      description: One or more documents, each sent as base64 inside the JSON body.
      required:
        - shipping_documents
      properties:
        shipping_documents:
          type: array
          minItems: 1
          description: Documents to attach to the order.
          items:
            $ref: "#/components/schemas/ShippingDocumentUpload"
    ShippingDocumentUpload:
      type: object
      description: >-
        A document sent as base64. Same fields as the documents accepted by `PUT /orders/{id}`, except that
        the content key is `base64_data`.
      required:
        - filename
        - base64_data
        - content_type
        - printing_type
        - document_type
      properties:
        filename:
          type: string
          description: File name, including extension.
          example: label.pdf
        base64_data:
          type: string
          description: File contents encoded in base64. A `data:...;base64,` prefix is tolerated.
          example: JVBERi0xLjQKJcOkw7zDtsOfCg==
        content_type:
          type: string
          description: MIME type of the file. PDF, PNG and JPEG are accepted.
          enum:
            - application/pdf
            - image/png
            - image/jpeg
          example: application/pdf
        printing_type:
          type: string
          description: >-
            How the warehouse must print and use the document. `label` is a shipping label; `document` is any
            other printable to include in the package.
          enum:
            - label
            - document
            - difal_bill
            - difal_payment_receipt
            - identifier_label
            - oxxo_digital_card
          example: label
        document_type:
          type: string
          description: >-
            Origin of the document. Use `base64` for documents you upload; `file` marks Cubbo-generated
            documents and is never replaced by `PUT /orders/{id}`.
          enum:
            - base64
            - url
            - file
          example: base64
        metadata:
          type: object
          description: >-
            Free-form JSON stored with the document (at most 10 KB), for example the tracking number of a
            label.
          additionalProperties: true
          example:
            tracking_number: TRACK0000001
            carrier: DHL
    ShippingDocumentsUploadResponse:
      type: object
      description: Confirmation listing the stored file names.
      required:
        - message
      properties:
        message:
          type: string
          description: Confirmation message with the uploaded file names, comma separated.
          example: "Shipping documents uploaded: label.pdf"
    OrderCancelRequest:
      type: object
      description: Identifies the single order to cancel.
      required:
        - order_number
        - store_id
      properties:
        order_number:
          type: string
          description: Your order number, unique within the store.
          example: ORD-0001
        store_id:
          type: integer
          description: Id of the store the order belongs to.
          example: 1234
    OrderDeleteRequest:
      type: object
      description: Identifies the single order to delete.
