                pickupOnDeliveryB2b:
                  summary: The order resolves to B2B (explicit is_b2b or a B2B-only store)
                  value:
                    error: requires_pickup_on_delivery is a D2C-only service.
                    code: PICKUP_ON_DELIVERY_B2B_UNSUPPORTED
                    context: null
                pickupOnDeliveryReturnMethodNotConfigured:
