  /lots:
    get:
      tags:
        - Lots
      operationId: listLots
      summary: List the lots of a product
      description: >
        **Send `sku` or `bar_code`.** Both show as optional because you may send either one, but a request

        with neither returns 422 `either sku or bar_code is required`. In the playground, open the optional

        fields and fill in one of them.


        Returns the lots of exactly one product, with each lot's status, expiration date and stock

        buckets. The product is addressed by `sku` or `bar_code` (at least one is required) and is

        looked up across the stores your token can access; there is no `store_id` parameter.

        - Lots are ordered by expiration date, soonest first; lots without an expiration date come last.
        Default page size is 25, maximum 200.

        - A product that exists but has no lots returns `lots: []` with `total_count: 0`.

        - If you send both `sku` and `bar_code` they must identify the same product; otherwise the response is
        404. A product in a store your token cannot see is indistinguishable from a missing one (404).

        - If the identifier matches more than one product (possible when the same SKU exists in two of your
        stores) the response is 422 naming the product ids.

        - Variant parent products are not addressable; query the variant's own SKU.
      security:
        - bearerAuth: []
      parameters:
        - name: sku
          in: query
          required: false
          description: Exact SKU of the product. Required unless `bar_code` is sent. Must not be blank.
          schema:
            type: string
          example: SKU-RED-M
        - name: bar_code
          in: query
          required: false
          description: Exact barcode (UPC/EAN) of the product. Required unless `sku` is sent. Must not be blank.
          schema:
            type: string
          example: "7501234567890"
        - name: lot_code
          in: query
          required: false
          description: Exact lot code to return (no substring matching).
          schema:
            type: string
          example: SKU-RED-M-L2026-04
        - name: status
          in: query
          required: false
          description: Lot status to include. Send a single value or repeat as `status[]` for several.
          schema:
            oneOf:
              - type: string
                enum:
                  - ACTIVE
                  - HOLDED
                  - DAMAGED
                  - EXPIRED
              - type: array
                items:
                  type: string
                  enum:
                    - ACTIVE
                    - HOLDED
                    - DAMAGED
                    - EXPIRED
          style: form
          explode: true
          example: ACTIVE
        - name: expiration_from
          in: query
          required: false
          description: Only lots expiring on or after this date (`YYYY-MM-DD`, inclusive).
          schema:
            type: string
            format: date
          example: "2026-01-01"
        - name: expiration_to
          in: query
          required: false
          description: Only lots expiring on or before this date (`YYYY-MM-DD`, inclusive).
          schema:
            type: string
            format: date
          example: "2026-12-31"
        - name: page
          in: query
          required: false
          description: Page number, starting at 1.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: per_page
          in: query
          required: false
          description: Lots per page, between 1 and 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
          example: 25
      responses:
        "200":
          description: The product and one page of its lots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotsResponse"
              example:
                product:
                  id: 12345
                  store_id: 1234
                  name: Widget Pro Black
                  skus:
                    - SKU-RED-M
                  bar_code: "7501234567890"
                  has_expiration: true
                lots:
                  - id: 987
                    lot_code: SKU-RED-M-L2026-04
                    status: ACTIVE
                    expiration_date: "2026-06-30"
                    stock:
                      IN_WAREHOUSE: 15
                      AVAILABLE: 12
                      AVAILABLE_NOT_EXTERNALLY_CONFIRMED: 0
                      AVAILABLE_EXTERNALLY_CONFIRMED: 12
                      RECEPTION-INCOMING-SELL-AHEAD: 0
                      DAMAGED: 0
                      HOLDED: 0
                      EXPIRED: 0
                      RESERVED: 3
                      ACTIVE: 12
                      SHIPPED: 40
                      RESERVED-WITHOUT-SELL-AHEAD: 3
                meta:
                  current_page: 1
                  next_page: null
                  prev_page: null
                  total_pages: 1
                  first_page: true
                  last_page: true
                  per_page: 25
                  total_count: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No product your token can see matches the identifier(s).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: no product found for the given sku/bar_code
        "422":
          description: Invalid parameters or ambiguous identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                noIdentifier:
                  value:
                    error: either sku or bar_code is required
                blankSku:
                  value:
                    error: Parameter sku cannot be blank
                unknownStatus:
                  value:
                    error: Parameter status must be within ["ACTIVE", "HOLDED", "DAMAGED", "EXPIRED"]
                badDate:
                  value:
                    error: "'2026-13-45' is not a valid Date"
                perPageTooLarge:
                  value:
                    error: Parameter per_page cannot be greater than 200
                ambiguous:
                  value:
                    error: "ambiguous identifier: it matches product ids 12345, 67890"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lots/hold/store/{store_id}:
    post:
      tags:
        - Lots
      operationId: holdLot
      summary: Put a lot on hold
      description: >
        Withholds a lot's stock from fulfillment. The lot is identified by `<material_code>-<lot_code>`

        (material code is the product SKU). The hold is applied asynchronously right after the call:

        the lot moves to `HOLDED` and its sellable units stop being assigned to orders. Use

        `POST /lots/unhold/store/{store_id}` to release it.

        - The `status` in the response is the lot status at the moment of the request, in lowercase, so it
        still reads `active` on a successful hold request.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          description: Store the lot belongs to.
          schema:
            type: integer
          example: 1234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LotHoldRequest"
            example:
              material_code: SKU-RED-M
              lot_code: L2026-04
      responses:
        "200":
          description: Hold requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotHoldResponse"
              example:
                unique_code: SKU-RED-M-L2026-04
                status: active
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingParam:
                  value:
                    error: Parameter material_code is required
                lotNotFound:
                  value:
                    error: No lot found with unique_code SKU-RED-M-L2026-04
                ambiguous:
                  value:
                    error: Mutiple lots with unique_code SKU-RED-M-L2026-04, this identifier must be unique
                storeNotFound:
                  value:
                    error: Couldn't find Store with 'id'=1234
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lots/unhold/store/{store_id}:
    post:
      tags:
        - Lots
      operationId: unholdLot
      summary: Release a lot from hold
      description: >
        Releases a lot previously put on hold so its stock becomes sellable again. The lot is

        identified by `<material_code>-<lot_code>` (material code is the product SKU). The release is

        applied asynchronously right after the call.

        - The `status` in the response is the lot status at the moment of the request, in lowercase, so it
        still reads `holded` on a successful release request.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: path
          required: true
          description: Store the lot belongs to.
          schema:
            type: integer
          example: 1234
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LotHoldRequest"
            example:
              material_code: SKU-RED-M
              lot_code: L2026-04
      responses:
        "200":
          description: Release requested.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotHoldResponse"
              example:
                unique_code: SKU-RED-M-L2026-04
                status: holded
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingParam:
                  value:
                    error: Parameter lot_code is required
                lotNotFound:
                  value:
                    error: No lot found with unique_code SKU-RED-M-L2026-04
                ambiguous:
                  value:
                    error: Mutiple lots with unique_code SKU-RED-M-L2026-04, this identifier must be unique
                storeNotFound:
                  value:
                    error: Couldn't find Store with 'id'=1234
        "500":
          $ref: "#/components/responses/InternalServerError"
  /lots/upsert:
    post:
      tags:
        - Lots
      operationId: upsertLot
      summary: Create a lot or update its expiration date
      description: >
        Creates a lot for a product, or updates the expiration date of an existing lot. The lot is

        identified by its unique code inside the store, which is built as `<sku>-<lot_code>` when

        `sku` is sent, or is exactly `lot_code` when it is not.

        - If no lot with that code exists, `sku` is required and must belong to a product of the store; the
        lot is created with the given `expiration_date` (optional).

        - If the lot exists, only `expiration_date` is updated, and only when you send one; omitting it leaves
        the stored date untouched.

        - Moving the date into the future re-validates the lot shortly after the call: a lot that had been
        expired is reactivated, together with its stock units. Moving it into the past expires the lot.

        - `expiration_date` in the response is returned as an ISO 8601 timestamp at UTC midnight of the stored
        date.

        - `status` in the response is the lot status in lowercase (`active`, `holded`, `damaged`, `expired`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LotUpsertRequest"
            examples:
              create:
                value:
                  store_id: 1234
                  sku: SKU-RED-M
                  lot_code: L2026-04
                  expiration_date: "2026-12-31"
              updateDate:
                value:
                  store_id: 1234
                  lot_code: SKU-RED-M-L2026-04
                  expiration_date: "2027-01-15"
      responses:
        "200":
          description: Lot created or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LotUpsertResponse"
              example:
                id: 987
                unique_code: SKU-RED-M-L2026-04
                expiration_date: "2026-12-31T00:00:00Z"
                status: active
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation or business error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingLotCode:
                  value:
                    error: Parameter lot_code is required
                missingStoreId:
                  value:
                    error: Parameter store_id is required
                badDate:
                  value:
                    error: "'31/31/2026' is not a valid Date"
                skuRequiredOnCreate:
                  value:
                    error: sku is required when creating a new lot
                productNotFound:
                  value:
                    error: No product found with sku SKU-RED-M in store 1234
                storeNotFound:
                  value:
                    error: Couldn't find Store with 'id'=1234
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders:
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Create an order
      description: |
        Creates a sales order for a store whose warehouse is in Mexico, Colombia, Chile or the
        United States, and queues it for processing. Use it for every non-Brazil store; a store
        served from a Brazil warehouse is refused and must use `POST /brazil/orders`. The request
        needs a store, a unique `order_number` per store, a recipient address, at least one product
        line and a way to pick the carrier:

        - `shipping_line_code`: the exact name of a shipping method you created in the Cubbo app
          (**Integrations** > Open API > **Shipping Methods**). Cubbo picks the carrier with the
          configuration assigned to it.
        - `shipping_method_id`: a specific Cubbo shipping method, taken from the `shipping_method_id` of
          an option returned by `GET /shipping-methods/quote`.

        - The order is returned immediately in its initial status. Address, coverage, stock and
          carrier validations run asynchronously; poll `GET /orders` and read `status`,
          `has_missing_info` and `missing_info` to learn whether it was accepted.
        - Every product is identified by SKU and must already exist in the store; unknown SKUs
          reject the whole request.
        - `zip_code` is mandatory when the warehouse is in Mexico (and Brazil); it is optional for
          Chile and Colombia.
        - Chile: when `shipping.city` cannot be identified (a misspelling, or a province instead of a
          city), an order sent with `shipping_method_id` is not refused. It is created and moves to
          `error` until you correct `shipping.city` with `PUT /orders/{id}` or in
          the Cubbo app, where the order shows the reason. An order that ships on your own label (Blue
          Express EX, with the label attached) continues normally. A `shipping.city` that is identified
          but not covered by the method is still refused with 422.
        - Duplicate protection: an `order_number` that already exists in the store answers 422 with
          code `ORDER_ALREADY_EXISTS` and the existing `order_id` in `context`. While another request
          for the same `store_id` + `order_number` is still being processed you get 409
          `DUPLICATE_REQUEST_IN_FLIGHT` with a `Retry-After` header; retry after that delay and you
          will converge on the real outcome (200, 422 or `ORDER_ALREADY_EXISTS`).
        - Complementary carrier services (`has_carrier_insurance`, `cod_amount`,
          `requires_document_return`, `requires_pickup_on_delivery`) are currently honoured only for
          stores with a warehouse in Chile; sending `true` (or a non-zero amount) from any other
          country is refused with a typed error code rather than silently ignored.
        - Click and collect: send `is_click_and_collect: true` and the `click_and_collect_service_code`
          you obtained from `GET /carrier-services/pickup-locations`. Cubbo replaces the shipping
          method you sent with the pickup carrier's method. A full shipping address is still required.
        - `is_b2b` only matters for stores enabled for both B2B and D2C ("mixed"); omit it to create a
          consumer (D2C) order. Stores enabled for a single model always get that model.
        - Error bodies on this endpoint carry an `error` message plus a machine-readable `code`
          (empty string or null when the error has no code) and an optional `context` object.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
            examples:
              basic:
                summary: Minimal sale with a Cubbo shipping method
                value:
                  store_id: 1234
                  order_number: ORD-0001
                  shipping_method_id: 12
                  shipping:
                    first_name: Jaime
                    last_name: Carrera
                    phone: "5555555555"
                    email: buyer@example.com
                    address1: Av. Reforma 123
                    address2: Piso 4
                    references: Blue door
                    country: MX
                    city: Ciudad de México
                    province: CDMX
                    zip_code: "06600"
                  products:
                    - sku: SKU-RED-M
                      quantity: 2
              shippingLineCode:
                summary: Carrier picked from your integration's shipping configuration
                value:
                  store_id: 1234
                  order_number: ORD-0002
                  shipping_line_code: Express
                  is_paid: true
                  channel_name: my-webstore
                  channel_order_id: WEB-98765
                  shipping:
                    first_name: Ana
                    last_name: Pérez
                    phone: "5512345678"
                    email: buyer@example.com
                    address1: Calle Falsa 123
                    country: MX
                    city: Guadalajara
                    province: Jalisco
                    zip_code: "44100"
                  billing:
                    first_name: Ana
                    last_name: Pérez
                    phone: "5512345678"
                    email: buyer@example.com
                    address1: Calle Falsa 123
                    country: MX
                    city: Guadalajara
                    province: Jalisco
                    zip_code: "44100"
                  products:
                    - sku: SKU-RED-M
                      quantity: 1
                    - sku: SKU-BLUE-L
                      quantity: 3
              chileCashOnDelivery:
                summary: Chile order with partial cash-on-delivery and carrier insurance
                value:
                  store_id: 1234
                  order_number: ORD-0003
                  shipping_method_id: 45
                  is_cod: true
                  cod_amount: 30000
                  has_carrier_insurance: true
                  shipping:
                    first_name: Jaime
                    last_name: Carrera
                    phone: "56900000000"
                    email: buyer@example.com
                    address1: Av Test 123
                    country: CL
                    city: Santiago
                    province: Región Metropolitana
                    zip_code: "8320000"
                  products:
                    - sku: SKU-RED-M
                      quantity: 1
              clickAndCollect:
                summary: Click and collect at a carrier pickup point
                value:
                  store_id: 1234
                  order_number: ORD-0004
                  shipping_method_id: 12
                  is_click_and_collect: true
                  click_and_collect_service_code: CUBBOCNCEST001
                  shipping:
                    first_name: Jaime
                    last_name: Carrera
                    phone: "5555555555"
                    email: buyer@example.com
                    address1: Av. Reforma 123
                    country: MX
                    city: Ciudad de México
                    province: CDMX
                    zip_code: "06600"
                  products:
                    - sku: SKU-RED-M
                      quantity: 1
      responses:
        "200":
          description: >-
            Order created. The body is the full order as Cubbo stores it, including its lines and the resolved
            shipping method. The order is still in its initial status; processing happens asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              example:
                id: 987654
                store_id: 1234
                order_number: ORD-0001
                status: initial
                channel_created_at: "2026-10-12T15:04:05.000Z"
                order_date: "2026-10-12T15:04:05.000Z"
                shipping_date: null
                pending_at: null
                shipping_email: buyer@example.com
                shipping_status: null
                is_paid: true
                is_cod: false
                cod_amount: null
                requires_document_return: false
                requires_pickup_on_delivery: false
                has_carrier_insurance: false
                has_missing_info: false
                missing_info: null
                shipping_address_1: Av. Reforma 123
                currency: MXN
                total_price: "598.0"
                discount_price: "0.0"
                buyer_shipping_price: null
                extra_fees_price: null
                is_pick_and_ship: false
                is_b2b: false
                pick_n_ship_status: null
                return_shipping_labels: []
                shipping:
                  first_name: Jaime
                  last_name: Carrera
                  company: null
                  phone: "5555555555"
                  address_1: Av. Reforma 123
                  address_2: Piso 4
                  email: buyer@example.com
                  zip_code: "06600"
                  country: MX
                  state: CDMX
                  city: Ciudad de México
                  number: null
                  interior_number: null
                  neighborhood: null
                  references: Blue door
                billing:
                  first_name: null
                  last_name: null
                  company: null
                  phone: null
                  tax_id: null
                  tax_regime: null
                  state_registration: null
                  address_1: null
                  address_2: null
                  number: null
                  interior_number: null
                  neighborhood: null
                  email: null
                  zip_code: null
                  country: null
                  state: null
                  city: null
                delivery_tracking:
                  - shipping_number: null
                    tracking_url: null
                    cubbo_tracking_url: https://tracking.cubbo.com/t/abc123
                    service_id: null
                    shipping_status: null
                    package_index: 1
                    total_packages: 1
                proof_of_delivery: null
                estimated_time_arrival: null
                delivered_at: null
                updated_at: "2026-10-12T15:04:05.000Z"
                is_click_and_collect: false
                click_and_collect_metadata: null
                latest_estimated_time_arrival_range: null
                channel_order_id: null
                channel_name: openapi
                channel_shipping_line_code: null
                warehouse_timezone: America/Mexico_City
                is_multi_package: false
                is_first_time_buyer: true
                is_subscription_renewal: false
                shipping_method:
                  id: 12
                  shipping_name: Estafeta Terrestre
                  is_active: true
                  carrier_name: ESTAFETA
                  shipping_type: national
                  delivery_type: Ground
                  country: MX
                order_lines:
                  - id: 55501
                    name: Red T-shirt M
                    sku: SKU-RED-M
                    quantity: 2
                    generated: false
                    price_per_item: "299.0"
                    discount_per_item: "0.0"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/DuplicateRequestInFlight"
        "422":
          description: >-
            Validation or business error. `code` identifies the failure when one is defined; `context` carries
            extra data for some codes (for example the existing `order_id` on `ORDER_ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreateError"
              examples:
                missingParam:
                  summary: A required parameter is missing (any `param!` failure)
                  value:
                    error: Parameter store_id is required
                    code: null
                    context: null
                invalidParamType:
                  summary: A parameter has the wrong type
                  value:
                    error: "'abc' is not a valid Integer"
                    code: null
                    context: null
                codAmountNegative:
                  summary: cod_amount below its minimum
                  value:
                    error: Parameter cod_amount cannot be less than 0
                    code: null
                    context: null
                brazilStore:
                  summary: The store ships from Brazil
                  value:
                    error: store is from Brazil, use /brazil/orders endpoint
                    code: ""
                    context: null
                missingZipCode:
                  value:
                    error: zip_code is required for this warehouse's country
                    code: MISSING_ZIP_CODE
                    context: null
                carrierInsuranceNotAvailable:
