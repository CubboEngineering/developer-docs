    OrderClickAndCollectMetadata:
      type: object
      description: |
        Pickup-point information for click-and-collect orders. Keys depend on the carrier that operates
        the pickup point (typically `name`, `address`, `zipcode`, `description`, `carrier_name`,
        coordinates and a location ID). `pickup_codes` is keyed by package tracking number and holds the
        short code and QR image the buyer presents at pickup. Internal fields are never included.
      additionalProperties: true
      properties:
        name:
          type: string
          description: Pickup point name.
          example: Pickup point name
        address:
          type: string
          description: Pickup point address.
          example: Pickup point address
        zipcode:
          type: string
          description: Pickup point postal code.
          example: "01000"
        description:
          type: string
          description: Human-readable description of the pickup point.
          example: Punto fisico - Centro
        carrier_name:
          type: string
          description: Carrier operating the pickup point.
          example: ESTAFETA
        pickup_codes:
          type: object
          description: Pickup codes per package, keyed by the package tracking number.
          additionalProperties:
            type: object
            properties:
              pickup_short:
                type: string
                description: Short pickup code.
                example: AB12CD
              pickup_qr_image_url:
                type: string
                description: URL of the QR image to present at pickup.
                example: https://api.cubbo.com/rails/active_storage/blobs/redirect/example/pickup_qr.png
    OrderStockUnit:
      type: object
      description: >-
        A physical unit assigned to an order line. In `GET /orders` only `id`, `imei` (when the product tracks
        IMEI) and `unit_code` (when requested by order number, for unit-code products in `packing`/`shipped`)
        are returned.
      properties:
        id:
          type: integer
          description: Stock unit ID.
          example: 31001
        status:
          type: string
          description: Stock unit status.
          example: PICKED
        product_id:
          type: integer
          description: Product ID of the unit.
          example: 777
        picked_at:
          type:
            - string
            - "null"
          format: date-time
          description: When the unit was picked.
          example: "2026-01-11T15:00:00.000Z"
        created_at:
          type: string
          format: date-time
          description: Creation time.
          example: "2025-12-01T10:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          description: Last update time.
          example: "2026-01-11T15:00:00.000Z"
        imei:
          type: object
          description: IMEI of the unit, only for products that track IMEI.
          properties:
            id:
              type: integer
              description: IMEI record ID.
              example: 12
            imei:
              type: string
              description: The IMEI number.
              example: "000000000000000"
        unit_code:
          type: string
          description: >-
            Serial / unit code of the unit, only for products that require unit codes and only when the
            request filters by `order_number`.
          example: UC-0001
    OrderLineProduct:
      type: object
      description: >-
        Product of an order line. `GET /orders` and `GET /orders/awaiting-invoice` return the subset shown
        here.
      properties:
        id:
          type: integer
          description: Product ID.
          example: 777
        name:
          type: string
          description: Product name.
          example: Red T-shirt M
        billing_name:
          type:
            - string
            - "null"
          description: Name used on invoices.
          example: T-shirt
        description:
          type:
            - string
            - "null"
          description: Product description (HTML).
          example: null
        has_imei:
          type: boolean
          description: Whether units of this product carry an IMEI.
          example: false
        is_fragile:
          type: boolean
          description: Whether the product needs fragile handling.
          example: false
        is_kit:
          type: boolean
          description: Whether the product is a kit of other products.
          example: false
        bar_code:
          type:
            - string
            - "null"
          description: Barcode (UPC/EAN).
          example: "7500000000001"
        is_dropshipping:
          type: boolean
          description: Whether the product is fulfilled by a third party.
          example: false
        is_scannable:
          type: boolean
          description: Whether units are scanned during picking.
          example: true
        price:
          type:
            - string
            - "null"
          description: Product price as a decimal string.
          example: "449.5"
        weight:
          type:
            - number
            - "null"
          description: Product weight.
          example: 0.3
        product_codes:
          type: array
          description: SKUs registered for the product.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Product code ID.
                example: 9001
              sku:
                type: string
                description: SKU.
                example: SKU-RED-M
    OrderLine:
      type: object
      description: A line of an order (one SKU and its quantity).
      properties:
        id:
          type: integer
          description: Order line ID.
          example: 5551
        name:
          type:
            - string
            - "null"
          description: Product name at the time of the order.
          example: Red T-shirt M
        sku:
          type:
            - string
            - "null"
          description: SKU ordered.
          example: SKU-RED-M
        quantity:
          type: integer
          description: Units ordered.
          example: 2
        generated:
          type: boolean
          description: >-
            True when Cubbo generated the line automatically (for example a kit component or a promotional
            insert).
          example: false
        price_per_item:
          type:
            - string
            - "null"
          description: Unit price as a decimal string.
          example: "449.5"
        discount_per_item:
          type:
            - string
            - "null"
          description: Unit discount as a decimal string.
          example: "0.0"
        product:
          oneOf:
            - $ref: "#/components/schemas/OrderLineProduct"
            - type: "null"
