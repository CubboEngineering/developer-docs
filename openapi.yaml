          description: Billing document attached to the label, or null.
          oneOf:
            - $ref: "#/components/schemas/ShippingLabelFile"
            - type: "null"
    OrderUpdateRequest:
      type: object
      description: >-
        Full update of an order. Only the keys present are applied; see the endpoint description for
        replacement semantics.
      required:
        - store_id
      properties:
        store_id:
          type: integer
          description: Id of the store the order belongs to. Must match the order's store.
          example: 1234
        is_paid:
          type:
            - boolean
            - "null"
          description: Marks the order as paid or unpaid. Omit or send `null` to leave it unchanged.
          example: true
        shipping_method_id:
          type:
            - integer
            - "null"
          description: >-
            Id of the shipping method to assign. Get it from `GET /shipping-methods/quote`
            (`shipping_method_id` of each option). It must be active and cover the (updated) shipping address;
            an international method is refused for a destination inside the warehouse's country. In Chile a
            `shipping.city` that cannot be identified is not refused; the update is saved and the order waits
            in `error` until it is corrected.
          example: 77
        is_b2b:
          type:
            - boolean
            - "null"
          description: >-
            Order classification. Immutable once the order exists; a value different from the order's is
            refused on a store handling both D2C and B2B, and ignored on a single-model store.
          example: false
        shipping:
          $ref: "#/components/schemas/OrderUpdateAddress"
        billing:
          $ref: "#/components/schemas/OrderUpdateBillingAddress"
        products:
          type: array
          description: >-
            New list of order lines. When non-empty it replaces every line of the order. Do not send it for
            orders with lines pinned to a unit code.
          items:
            $ref: "#/components/schemas/OrderUpdateProduct"
        shipping_documents:
          type: array
          description: >-
            Documents to attach. Replaces every document you uploaded before (Cubbo-generated documents are
            kept).
          items:
            $ref: "#/components/schemas/OrderUpdateShippingDocument"
