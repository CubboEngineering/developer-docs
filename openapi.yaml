                storeNotFound:
                  value:
                    error: Couldn't find Store with 'id'=0
                perPageTooHigh:
                  value:
                    error: Parameter per_page cannot be greater than 100
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders/cancel:
    post:
      tags:
        - Orders
      operationId: cancelOrder
      summary: Cancel an order
      description: |
        Cancels one order, identified by its `order_number` within your store, and releases the stock
        reserved for it. The cancellation is recorded in the order history with the reason
        "Canceled from API"; it is not propagated to the sales channel the order came from.
        - An order can be canceled while it is in `initial`, `unpaid`, `empty`, `error`,
          `cancelation_window`, `awaiting_fulfillment_request`, `entirely_dropshipping`, `backorder`,
          `hold`, `pending`, `processing`, `picking` or `packing` (on pick-and-ship stores, only before
          the package is picked up). A `shipped` order can still be canceled while the carrier has not
          collected it (no dispatch yet and shipping status still `created`, `awaiting_collection` or
          undefined), unless it ships on an external label.
        - Canceling an order that is already `canceled` or `interrupted` is a no-op and returns `200`.
        - Orders already on their way or returned (`returning`, `returned`, `return_arrived`,
          `reentered`, or `shipped` and dispatched) are refused with `422`. Those messages are
          returned in Spanish, exactly as shown in the examples.
        - Soft cancel: if Cubbo support has enabled "soft cancel on shipped orders" for your store, a
          cancellation request for an order past the point of cancellation is answered with `200`
          and `{"status": "accepted", "order_id": ...}` instead of `422`. The order is NOT canceled
          and keeps its status; the attempt is recorded in the order history so your team can act on
          it (for example, intercept the shipment or process a return).
        - Requires an API user with the "orders update" permission and access to the store;
          otherwise `401`.
        - Caution: some failures are answered with HTTP `200` and an `error` body (see the `200`
          examples). Always check for an `error` key in the response, not only the status code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCancelRequest"
            example:
              store_id: 1234
              order_number: ORD-0001
      responses:
        "200":
          description: |
            The order was canceled (empty object), the cancellation was accepted as a soft cancel, or
            the request failed in a way that is reported with an `error` body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrderCancelResult"
                  - $ref: "#/components/schemas/OrderCancelAccepted"
                  - $ref: "#/components/schemas/Error"
              examples:
                canceled:
                  summary: Order canceled (or already canceled)
                  value: {}
                softCancelAccepted:
                  summary: Store has soft cancel enabled and the order is past cancellation
                  value:
                    status: accepted
                    order_id: 123456
                notCancellable:
                  summary: Status does not allow cancellation (reported with HTTP 200)
                  value:
                    error: Error, order_id '123456' cannot be cancelled
                missingParam:
                  summary: Missing parameter (reported with HTTP 200)
                  value:
                    error: Error, Parameter order_number is required
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The order was not found in the store or its business rules forbid the cancellation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                orderNotFound:
                  value:
                    error: Order with order_number ORD-0001 not found for store id 1234
                alreadyShipped:
                  description: The order was already shipped, dispatched or returned (message in Spanish).
                  value:
                    error: "Error al cancelar la orden: 123456, La orden ya fue enviada"
                externalLabel:
                  description: A shipment on an external carrier label cannot be canceled (message in Spanish).
                  value:
                    error: "Error al cancelar la orden: 123456, No se puede cancelar un envío con guía externa"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders/create-and-ship:
    post:
      tags:
        - Orders
      operationId: createAndShipOrder
      summary: Create a pick-and-ship order and buy its labels
      description: |
        Creates a pick-and-ship order and generates its carrier shipping labels in the same call,
        returning the labels instead of the order. Use it when your own warehouse packs the parcel
        and only needs Cubbo's carrier contract: you declare the physical packages (weight and
        dimensions) and Cubbo buys one label per package. Unlike `POST /orders`, the order is
        validated synchronously, the shipping method must be resolvable now, and the order is left
        packed with its labels ready to download.

        - Choose the carrier with exactly one of `shipping_method_id` (a Cubbo shipping method) or
          `integration_shipping_method` (the name of a shipping configuration of your integration).
          Sending both, or neither, is refused.
        - `products` is optional; lines are not picked from Cubbo stock, they only describe the
          content. Each SKU must exist in the store.
        - Every package is matched to the closest Cubbo package size by the larger of its real
          weight and its volumetric weight; if none fits, the request fails with
          `NO_COMPATIBLE_PACKAGE`.
        - Not available for stores where Cubbo issues fiscal invoices (for example Brazil): those
          answer `INVOICING_NOT_IMPLEMENTED`.
        - The order is always a consumer (D2C), paid, non cash-on-delivery order with zero prices.
        - Duplicate protection works like `POST /orders`: 422 `ORDER_ALREADY_EXISTS` for an existing
          `order_number`, 409 `DUPLICATE_REQUEST_IN_FLIGHT` while another request for the same
          `order_number` is in progress.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateAndShipRequest"
            example:
              store_id: 1234
              order_number: PS-0001
              shipping_method_id: 12
              shipping:
                first_name: Jaime
                last_name: Carrera
                phone: "5555555555"
                email: buyer@example.com
                address1: Av. Reforma 123
                country: MX
                city: Ciudad de México
                province: CDMX
                zip_code: "06600"
              products:
                - sku: SKU-RED-M
                  quantity: 1
              packages:
                - weight_kg: 1.2
                  length_cm: 30
                  width_cm: 20
                  height_cm: 10
      responses:
        "200":
          description: Order created and packed; one shipping label per requested package.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreateAndShipLabel"
              example:
                - id: 778899
                  order_id: 987655
                  billing_file: null
                  shipping_number: "1234567890"
                  label_file:
                    path: /rails/active_storage/blobs/redirect/abc123/label.pdf
                    url: https://api.cubbo.com/rails/active_storage/blobs/redirect/abc123/label.pdf
                    filename: label.pdf
                    byte_size: 48213
                    content_type: application/pdf
                  label_type: shipping
                  tracking_url: https://carrier.example.com/track/1234567890
                  cubbo_tracking_url: https://tracking.cubbo.com/t/abc123
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/DuplicateRequestInFlight"
        "422":
          description: >-
            Validation or business error. Most failures use the `error`/`code`/`context` shape. When the
            assembled order fails Cubbo's order validation the body is instead a list of field-level errors
            (`errors`), each with the offending `field` and a `code`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrderCreateError"
                  - $ref: "#/components/schemas/OrderFieldValidationError"
              examples:
                missingParam:
                  value:
                    error: Parameter packages is required
                    code: null
                    context: null
                nameTooShort:
                  value:
                    error: Parameter first_name cannot have length less than 3
                    code: null
                    context: null
                packageWeightTooSmall:
                  value:
                    error: Parameter weight_kg cannot be less than 0.01
                    code: null
                    context: null
                missingShippingMethod:
                  value:
                    error: provide either shipping_method_id or integration_shipping_method
                    code: MISSING_SHIPPING_METHOD
                    context: null
                bothShippingMethods:
                  value:
                    error: provide either shipping_method_id or integration_shipping_method, not both
                    code: INVALID_SHIPPING_METHOD
                    context: null
                missingZipCode:
                  value:
                    error: zip_code is required for this warehouse's country
                    code: MISSING_ZIP_CODE
                    context: null
                channelIntegrationNotFound:
                  value:
                    error: Channel integration for openapi not found, contact support.
                    code: ""
                    context: null
                orderAlreadyExists:
                  value:
                    error: order with order_number PS-0001 already exists with id 987655
                    code: ORDER_ALREADY_EXISTS
                    context:
                      order_id: 987655
                productNotFound:
                  value:
                    error: Product SKU-UNKNOWN was not found in this store
                    code: PRODUCT_NOT_FOUND
                    context: null
                invoicingNotImplemented:
                  summary: The store's country requires Cubbo-issued invoices
                  value:
                    error: Order  requires an invoice to ship
                    code: INVOICING_NOT_IMPLEMENTED
                    context: null
                storeOrShippingMethodNotFound:
                  summary: The store_id or shipping_method_id does not exist
                  value:
                    error: Couldn't find ShippingMethod with 'id'=999999
                    code: null
                    context: null
                integrationShippingMethodNotFound:
                  value:
                    error: No shipping configuration found with name 'Express' for this integration
                    code: MISSING_INTEGRATION_SHIPPING_METHOD
                    context: null
                undeterminableShippingMethod:
                  value:
                    error: Unable to determine shipping method for order
                    code: UNDETERMINABLE_SHIPPING_METHOD
                    context: null
                noCompatiblePackage:
                  value:
                    error: No compatible package found for order id 987655. Contact support.
                    code: NO_COMPATIBLE_PACKAGE
                    context: null
                shippingCostUnavailable:
                  summary: The shipping method has no tariff for the package weight
                  value:
                    error: Shipping cost not configured for the order's weight in the assigned shipping method
                    code: SHIPPING_COST_UNAVAILABLE
                    context: null
                storeBusinessModelUnset:
                  value:
                    error: Store 1234 has neither b2b nor d2c enabled
                    code: store_business_model_unset
                    context:
                      store_id: 1234
                      b2b: false
                      d2c: false
                orderValidationFailed:
                  summary: Field-level validation errors (for example an international method on a domestic address)
                  value:
                    errors:
                      - field: shipping_method
                        code: NATIONAL_SHIPPING_METHOD_EXPECTED
                        additional_info: {}
                      - field: shipping_phone
                        code: MISSING_SHIPPING_FIELD
                        additional_info: {}
                unrecognizedCity:
                  summary: Chile, a shipping.city that cannot be identified (the order is not created)
                  value:
                    errors:
                      - field: shipping_city
                        code: UNRECOGNIZED_CITY_OR_STATE
                        additional_info: {}
        "500":
          description: Unexpected error (including carrier failures while buying the label).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: unexpected error
  /orders/delete:
    post:
      tags:
        - Orders
      operationId: deleteOrder
      summary: Delete an order
      description: |
        Permanently deletes one order, identified by its `order_number` within your store. The order is
        first canceled (releasing its reserved stock) and then removed, so it no longer appears in
        listings or lookups. Prefer `POST /orders/cancel` unless you really need the order gone, for
        example to re-create it under the same `order_number`.
        - Refused when the order is in `processing`, `picking`, `packing`, `shipped`, `returning`,
          `returned`, `return_arrived`, `reentered` or `interrupted`. Note that this refusal is
          reported with HTTP `200` and an `error` body.
        - Requires an API user with the "orders update" permission, access to the store and an order
          that is editable for your store. A permission failure or an unknown `order_number` is also
          reported with HTTP `200` and an `error` body.
        - Always check for an `error` key in the response, not only the status code.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderDeleteRequest"
            example:
              store_id: 1234
              order_number: ORD-0001
      responses:
        "200":
          description: >-
            The order was deleted (empty object), or the request failed in a way that is reported with an
            `error` body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrderCancelResult"
                  - $ref: "#/components/schemas/Error"
              examples:
                deleted:
                  summary: Order deleted
                  value: {}
                statusNotDeletable:
                  summary: Status does not allow deletion (reported with HTTP 200)
                  value:
                    error: Error, This order was already shipped or it's been processed, it can't be deleted.
                missingParam:
                  summary: Missing parameter (reported with HTTP 200)
                  value:
                    error: Error, Parameter order_number is required
                notAuthorized:
                  summary: API user cannot edit this order (reported with HTTP 200)
                  value:
                    error: Error, not allowed to delete? this Order
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: The cancellation step refused the order (message in Spanish).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                alreadyShipped:
                  value:
                    error: "Error al cancelar la orden: 123456, La orden ya fue enviada"
                externalLabel:
                  value:
                    error: "Error al cancelar la orden: 123456, No se puede cancelar un envío con guía externa"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /orders/with-fields:
    get:
      tags:
        - Orders
      operationId: listOrdersWithFields
      summary: List orders with selected fields
      description: |
        A lighter version of `GET /orders`: returns only the order fields you ask for in `fields`, without
        order lines, invoices or event history. Use it for high-volume polling (for example status or
        tracking sync) where you do not need the full payload.

        - `fields` is a list of `Order` field names. Values that are not in the allowed list are ignored; if
          none of the requested fields is valid, or `fields` is omitted, every allowed field is returned.
        - Allowed fields: `id`, `store_id`, `order_number`, `status`, `channel_created_at`, `order_date`,
          `shipping_date`, `pending_at`, `shipping_email`, `shipping_status`, `is_paid`, `channel_order_id`,
          `channel_name`, `is_cod`, `cod_amount`, `has_carrier_insurance`, `requires_document_return`,
          `requires_pickup_on_delivery`, `currency`, `total_price`, `shipping`, `billing`,
          `estimated_time_arrival`, `delivered_at`, `updated_at`, `is_click_and_collect`,
          `click_and_collect_metadata`, `channel_shipping_line_code`, `warehouse_timezone`, `shipping_method`,
          `is_multi_package`, `delivery_tracking`, `is_first_time_buyer`, `is_subscription_renewal`.
        - `shipping_method` is the only association available; when requested it is returned with every
          `OrderShippingMethod` field.
        - Filters: `status` (exact values, no `processing` expansion), `order_type`, `shipping_email`
          (partial match) and `normalized_shipping_phone_suffix` (the last digits of the buyer's phone,
          at least 3 digits after removing non-digits).
        - Sorting is restricted to `sort_by` in `id`, `order_date`, `channel_created_at`, `shipping_date`,
          `updated_at` and `sort` in `asc`, `desc`.
      security:
        - bearerAuth: []
      parameters:
        - name: store_id
          in: query
          required: true
          schema:
            type: integer
          description: ID of the store whose orders you want to list.
          example: 1234
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - id
                - store_id
                - order_number
                - status
                - channel_created_at
                - order_date
                - shipping_date
                - pending_at
                - shipping_email
                - shipping_status
                - is_paid
                - channel_order_id
                - channel_name
                - is_cod
                - cod_amount
                - has_carrier_insurance
                - requires_document_return
                - requires_pickup_on_delivery
                - currency
                - total_price
                - shipping
                - billing
                - estimated_time_arrival
                - delivered_at
                - updated_at
                - is_click_and_collect
                - click_and_collect_metadata
                - channel_shipping_line_code
                - warehouse_timezone
                - shipping_method
                - is_multi_package
                - delivery_tracking
                - is_first_time_buyer
                - is_subscription_renewal
          description: Fields to include in each order. Unknown values are ignored; omit to receive all allowed fields.
          example:
            - id
            - order_number
            - status
            - shipping_status
            - delivery_tracking
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OrderStatus"
          description: Only return orders in these statuses. Values outside the enum return 422.
          example:
            - shipped
        - name: order_type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/OrderType"
          description: Only return orders of these types. Values outside the enum return 422.
          example:
            - SALE
        - name: shipping_email
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial match on the buyer's shipping email.
          example: buyer@example.com
        - name: normalized_shipping_phone_suffix
          in: query
          required: false
          schema:
            type: string
            minLength: 3
          description: >-
            Match orders whose buyer phone ends with these digits. Non-digits are stripped; at least 3 digits
            must remain.
          example: "0000"
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - id
              - order_date
              - channel_created_at
              - shipping_date
              - updated_at
          description: Field to sort by.
          example: updated_at
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
          description: Sort direction. Defaults to descending when `sort_by` is given.
          example: desc
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number, starting at 1.
          example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Orders per page.
          example: 100
      responses:
        "200":
          description: Orders with only the requested fields, plus pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                  - meta
                properties:
                  orders:
                    type: array
                    description: Orders on this page, each limited to the requested `fields`.
                    items:
                      $ref: "#/components/schemas/Order"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              example:
                orders:
                  - id: 987654
                    order_number: ORD-0001
                    status: shipped
                    shipping_status: shipment_delivered
                    delivery_tracking:
                      - shipping_number: TRK000000001
                        tracking_url: https://carrier.example.com/track/TRK000000001
                        cubbo_tracking_url: https://tracking.example.com/orders/abc123
                        service_id: express
                        shipping_status: shipment_delivered
                        package_index: 1
                        total_packages: 1
                meta:
                  current_page: 1
                  next_page: null
                  prev_page: null
                  total_pages: 1
                  first_page: true
                  last_page: true
                  per_page: 100
                  total_count: 1
        "401":
          description: Missing or invalid token, or the store does not exist / is not accessible with this token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: invalid store
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missingStore:
                  value:
                    error: Parameter store_id is required
                invalidStatus:
                  value:
                    error: Parameter status must be within ["initial", "unpaid", ...]
                invalidSortBy:
                  value:
                    error: >-
                      Parameter sort_by must be within [nil, "id", "order_date", "channel_created_at",
                      "shipping_date", "updated_at"]
                perPageTooHigh:
                  value:
                    error: Parameter per_page cannot be greater than 100
                shortPhoneSuffix:
                  value:
                    error: Parameter normalized_shipping_phone_suffix must contain at least 3 digits
        "500":
          $ref: "#/components/responses/InternalServerError"
  /products:
    post:
      tags:
        - Inventory
      operationId: createProduct
      summary: Create a product
      description: >
        Creates a product in a store, with its SKUs, barcode (UPC/EAN), logistics data (weight and

        dimensions) and fiscal data. Send a single product (`skus` + `upc`) or a product with

        variants (`has_variants: true` + `variants[]`), which creates one product per variant.

        - **Barcode and SKU rules.** Both the barcode (`upc`) and every SKU must be unique within the store,
        and a barcode may not reuse a value already registered as a SKU of another product (or the other way
        round). The request is rejected with 422 when any of them is already taken. SKUs are trimmed of
        surrounding whitespace.

        - **Weight.** `weight` is stored in kilograms. Send `weight_unit: "g"` (or `"gr"`) to send grams; the
        value is converted to kg and the stored unit becomes `kg`. Any other unit is stored as sent, without
        conversion.

        - **Dimensions.** `length`, `width` and `height` must be between 0.01 and 999999.99; `dimension_unit`
        defaults to `cm`.

        - **Dropshipping.** `is_dropshipping: true` marks a product that Cubbo does not stock. It cannot be
        combined with `has_variants`.

        - **Non-scannable (marketing) products.** `is_scannable: false` requires a `product_image` and cannot
        be combined with `has_variants`.

        - **Expiration.** When `has_expiration` is true you must also send `freshness` (minimum shelf-life in
        days required at receiving), or the product fails validation.

        - **Kits (bundles).** This endpoint does not create kits: the created product always has `is_kit:
        false`. Kits are configured from the Cubbo app; their components are returned by `GET /inventory` as
        `kit_childs`.

        - **Fiscal data (Brazil).** `tax_code` is the product's NCM code (Brazilian fiscal classification) or
        the id of an NCM configuration already registered in the store; an NCM that is not configured for the
        store is rejected. `origin`, `extipi` and `fci_key` feed the NF-e (Brazilian electronic invoice).

        - **Variants.** Each variant becomes an independent product named `"<name> <variant name>"`, with its
        own `skus` and `bar_code`. The response is then an array of products in the full product format
        instead of a single product.

        - **Concurrency.** Two simultaneous requests for the same SKUs in the same store are de-duplicated:
        the second receives `202 Accepted` while the first is still processing.

        - **Integration accounts.** For API users linked to certain marketplace integrations the endpoint
        behaves as an upsert by barcode: an existing barcode gets the new SKU added (or its name and weight
        updated when the SKU already exists), `has_expiration` is forced to true with a default `freshness` of
        180 days, `master_box_quantity` registers the units per master box for the SKU, and a SKU that already
        belongs to another product can be migrated to the new product when `migrate_sku` is true or the store
        has automatic SKU migration enabled. Variants are not supported for these accounts, and `weight_unit`
        is required.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
            examples:
              singleProduct:
                summary: Single product with logistics and fiscal data
                value:
                  store_id: 1234
                  name: Widget Pro Black
                  description: <p>A professional-grade widget.</p>
                  skus:
                    - SKU-RED-M
                  upc: "7501234567890"
                  price: 99.99
                  weight: 500
                  weight_unit: g
                  length: 10
                  width: 8
                  height: 5
                  dimension_unit: cm
                  is_fragile: false
                  has_expiration: true
                  freshness: 180
                  tax_code: 3401.11.90
                  origin: NATIONAL
              dropshipping:
                summary: Dropshipping product
                value:
                  store_id: 1234
                  name: Printed Poster
                  skus:
                    - SKU-POSTER-01
                  upc: "7501234567891"
                  is_dropshipping: true
                  weight: 0.2
                  weight_unit: kg
              withVariants:
                summary: Product with size variants
                value:
                  store_id: 1234
                  name: Widget Tee
                  description: Cotton tee
                  has_variants: true
                  weight: 0.3
                  weight_unit: kg
                  options:
                    - name: Size
                      tags:
                        - S
                        - M
                  variants:
                    - name: S
                      skus:
                        - SKU-TEE-S
                      bar_code: "7501234567892"
                      options_name:
                        - name: Size
                          value: S
                    - name: M
                      skus:
                        - SKU-TEE-M
                      bar_code: "7501234567893"
                      options_name:
                        - name: Size
                          value: M
              nonScannableWithImage:
