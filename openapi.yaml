# Generated from controllers in platform (origin/main). Do not hand-edit endpoint pages in MDX.
openapi: 3.1.0
info:
  title: Cubbo Clients API
  version: "1.0"
  summary: Orders, inventory, replenishments, returns, shipping and webhooks for Cubbo fulfillment.
  description: |
    The Cubbo Clients API connects your store, ERP or marketplace with Cubbo's fulfillment network.
    All endpoints except `POST /auth/token` require a bearer token; see the Authentication guide.
    Request and response bodies are JSON. Errors are JSON objects with an `error` key.
  contact:
    name: Cubbo integrations
    email: integraciones@cubbo.com
servers:
  - url: https://api.cubbo.com/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Exchange client credentials for a bearer token.
  - name: Orders
    description: Create, update, hold, cancel and read sales orders.
  - name: Shipping labels
    description: Read the shipping labels generated for an order.
  - name: Inventory
    description: Products and stock per store.
  - name: Lots
    description: Lot-level inventory for products with expiration or batch tracking.
  - name: Reports
    description: Bulk reports for reconciliation.
  - name: Replenishments
    description: Inbound shipments to the warehouse.
  - name: Returns
    description: Returns and exchanges.
  - name: Stores
    description: Store provisioning and settings.
  - name: Shipping methods
    description: Available shipping methods, coverage and quotes.
  - name: Click and collect
    description: Pickup points and in-store pickup orders.
  - name: Sandbox
    description: >-
      Move a test store's receipts and orders through the warehouse and carrier steps to test your
      integration. Test stores only.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token returned by `POST /auth/token`, sent as `Authorization: Bearer <token>`."
  schemas:
    Error:
      type: object
      description: Error body returned by every failed request.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable description of the failure. For `401` responses it is always `Unauthorized`.
          example: Parameter store_id is required
        message:
          type: string
          description: Present on `401` responses only; the reason the request was rejected.
          example: invalid token
        code:
          type:
            - string
            - "null"
          description: Stable machine-readable code, present on some order, return and replenishment errors.
          example: ORDER_ALREADY_EXISTS
        context:
          type:
            - object
            - "null"
          description: Extra data about the failure when available, for example the id of the conflicting order.
          additionalProperties: true
          example:
            order_id: 987654
    PaginationMeta:
      type: object
      description: Paging information returned next to list results.
      properties:
        current_page:
          type: integer
          example: 1
        next_page:
          type:
            - integer
            - "null"
          example: 2
        prev_page:
          type:
            - integer
            - "null"
          example: null
        total_pages:
          type: integer
          example: 7
        first_page:
          type: boolean
          example: true
        last_page:
          type: boolean
          example: false
        per_page:
          type: integer
          example: 50
        total_count:
          type: integer
          example: 312
    InventoryResponse:
      type: object
      description: One page of the store catalog with stock.
      properties:
        products:
          type: array
          description: Products on this page.
          items:
            $ref: "#/components/schemas/Product"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - products
        - meta
    Product:
      type: object
      description: A product as returned by `GET /inventory`, with its aggregate stock and optional unit and lot detail.
      properties:
        id:
          type: integer
          description: Cubbo product id.
          example: 12345
        name:
          type: string
          description: Product display name.
          example: Widget Pro Black
        billing_name:
          type:
            - string
            - "null"
          description: Name printed on invoices, when different from `name`.
          example: Widget Pro - Black Edition
        description:
          type:
            - string
            - "null"
          description: Product description (may contain HTML).
          example: <p>A professional-grade widget.</p>
        has_imei:
          type: boolean
          description: Each unit is identified by an IMEI.
          example: false
        is_fragile:
          type: boolean
          description: Requires fragile handling.
          example: false
        is_kit:
          type: boolean
          description: The product is a kit (bundle) of other products; see `kit_childs`.
          example: false
        bar_code:
          type:
            - string
            - "null"
          description: Barcode (UPC/EAN).
          example: "7501234567890"
        is_dropshipping:
          type: boolean
          description: Fulfilled by dropshipping; Cubbo does not hold stock for it.
          example: false
        has_expiration:
          type:
            - boolean
            - "null"
          description: Stock is tracked by lot with an expiration date.
          example: true
        freshness:
          type:
            - integer
            - "null"
          description: Minimum shelf life in days a lot must have when received, for expirable products.
          example: 180
        is_scannable:
          type: boolean
          description: Units can be scanned at picking. False for marketing inserts that are identified by image.
          example: true
        price:
          type:
            - string
            - "null"
          description: Unit price, as a decimal string.
          example: "99.99"
        weight:
          type:
            - number
            - "null"
          description: Unit weight in `weight_unit` (stored in kilograms when created through the API).
          example: 2.5
        weight_unit:
          type:
            - string
            - "null"
          description: Unit of `weight`, for example `kg`.
          example: kg
        length:
          type:
            - string
            - "null"
          description: Package length in `dimension_unit`, as a decimal string.
          example: "10.0"
        width:
          type:
            - string
            - "null"
          description: Package width in `dimension_unit`, as a decimal string.
          example: "8.0"
        height:
          type:
            - string
            - "null"
          description: Package height in `dimension_unit`, as a decimal string.
          example: "5.0"
        dimension_unit:
          type: string
          description: Unit of the dimensions.
          enum:
            - cm
            - mm
            - in
            - m
          example: cm
        stock:
          oneOf:
            - $ref: "#/components/schemas/ProductStock"
            - type: "null"
          description: >-
            Aggregate stock across all lots and locations. Null for a product that has never had stock
            computed.
        units:
          type: array
          description: Per-unit detail. Present only when there is something to report (see endpoint description).
          items:
            $ref: "#/components/schemas/StockUnitDetail"
        lots:
          type: array
          description: Per-lot detail. Present only on products that have lots.
          items:
            $ref: "#/components/schemas/ProductLotDetail"
        store:
          type: object
          description: Store that owns the product.
          properties:
            id:
              type: integer
              description: Store id.
              example: 1234
            name:
              type: string
              description: Store name.
              example: Example Store
        product_codes:
          type: array
          description: SKUs registered for the product.
          items:
            $ref: "#/components/schemas/ProductCode"
        kit_childs:
          type: array
          description: Components of the kit. Empty unless `is_kit` is true.
          items:
            $ref: "#/components/schemas/ProductKitComponent"
      required:
        - id
        - name
        - is_kit
        - stock
        - store
        - product_codes
        - kit_childs
    ProductCode:
      type: object
      description: A SKU registered for a product.
      properties:
        id:
          type: integer
          description: SKU record id.
          example: 9001
        sku:
          type: string
          description: The SKU.
          example: SKU-RED-M
      required:
        - id
        - sku
    ProductStock:
      type: object
      description: >-
        Aggregate stock counts of a product. All counts are units. Keys with a dash are returned exactly as
        written.
      properties:
        IN_WAREHOUSE:
          type: integer
          description: Units physically in the warehouse, in any status.
          example: 250
        AVAILABLE:
          type: integer
          description: Units you can sell now (active units minus buffer stock, plus sell-ahead units).
          example: 188
        AVAILABLE_NOT_EXTERNALLY_CONFIRMED:
          type: integer
          description: >-
            Available units from replenishments not yet confirmed by your system (relevant when your store
            only sells confirmed stock).
          example: 0
        AVAILABLE_EXTERNALLY_CONFIRMED:
          type: integer
          description: Available units from confirmed replenishments, plus sell-ahead units.
          example: 188
        UNAVAILABLE:
          type: integer
          description: Units present but not sellable (on hold, expired, damaged, in reception).
          example: 22
        RECEPTION-INCOMING-SELL-AHEAD:
          type: integer
          description: Sell-ahead units that arrived and are being received.
          example: 0
        INCOMING-SELL-AHEAD:
          type: integer
          description: Sell-ahead units still inbound.
          example: 0
        RESERVED-RECEPTION-INCOMING-SELL-AHEAD:
          type: integer
          description: Sell-ahead units in reception already reserved by orders.
          example: 0
        RESERVED-INCOMING-SELL-AHEAD:
          type: integer
          description: Inbound sell-ahead units already reserved by orders.
          example: 0
        DAMAGED:
          type: integer
          description: Units marked as damaged.
          example: 2
        RECEPTION:
          type: integer
          description: Units in the reception process, not yet put away.
          example: 0
        OUT_OF_STOCK:
          type: integer
          description: Units requested by orders that could not be reserved for lack of stock.
          example: 0
        RESERVED:
          type: integer
          description: Units reserved, by orders and by inbound returns.
          example: 40
        RESERVED_BY_ORDERS:
          type: integer
          description: Units reserved by open orders.
          example: 40
        RESERVED_BY_RETURNS:
          type: integer
          description: Units reserved by inbound returns.
          example: 0
        ACTIVE:
          type: integer
          description: Active (sellable, unreserved) units on the shelf.
          example: 188
        RESERVED-WITHOUT-SELL-AHEAD:
          type: integer
          description: Units reserved by orders, excluding sell-ahead reservations.
          example: 40
        EXPIRED:
          type: integer
          description: Units in expired lots.
          example: 20
        HOLDED:
          type: integer
          description: Units in lots on hold.
          example: 20
        BUFFER_STOCK:
          type: integer
          description: Safety stock configured for the product, excluded from `AVAILABLE`.
          example: 0
        LOST:
          type: integer
          description: Units marked as lost.
          example: 1
        DAMAGED_BY_SOURCE:
          type: object
          description: >-
            `DAMAGED` split by where the damage was found. Keys are `REPLENISHMENT`, `RETURN`, `STORAGE` or
            `UNKNOWN`; only sources with units appear.
          additionalProperties:
            type: integer
          example:
            STORAGE: 2
        LOST_BY_SOURCE:
          type: object
          description: >-
            `LOST` split by where the loss happened. Keys are `REPLENISHMENT`, `RETURN`, `STORAGE`, `DELIVERY`
            or `UNKNOWN`; only sources with units appear.
          additionalProperties:
            type: integer
          example:
            RETURN: 1
    StockUnitDetail:
      type: object
      description: >-
        One stock unit of a product. Unit-code products carry `unit_code`; other products only list damaged
        and lost units, without a code.
      properties:
        unit_code:
          type: string
          description: The unit's unique code (IMEI or serial). Present only for unit-code products.
          example: "356789100000001"
        status:
          type: string
          description: Unit status.
          enum:
            - ACTIVE
            - RESERVED
            - DAMAGED
            - LOST
          example: DAMAGED
        damaged_source:
          type:
            - string
            - "null"
          description: Where the damage was found. Present only on `DAMAGED` units.
          enum:
            - REPLENISHMENT
            - RETURN
            - STORAGE
            - null
          example: STORAGE
        lost_source:
          type: string
          description: Where the loss happened. Present only when set, on `LOST` units.
          enum:
            - REPLENISHMENT
            - RETURN
            - STORAGE
            - DELIVERY
          example: RETURN
      required:
        - status
    ProductLotDetail:
      type: object
      description: A lot of the product with its unit counts, as embedded in `GET /inventory`.
      properties:
        unique_code:
          type: string
          description: Lot code, unique within the store.
          example: SKU-RED-M-L2026-04
        expiration_date:
          type:
            - string
            - "null"
          format: date
          description: Expiration date (`YYYY-MM-DD`), or null when the lot has none.
          example: "2026-12-31"
        status:
          type: string
          description: Lot status.
          enum:
            - ACTIVE
            - HOLDED
            - DAMAGED
            - EXPIRED
          example: ACTIVE
        quantities:
          type: object
          description: >-
            The lot's units counted by unit status (for example `ACTIVE`, `RESERVED`, `DAMAGED`, `HOLDED`,
            `EXPIRED`, `SHIPPED`). Only statuses with at least one unit appear; empty object for a lot without
            units.
          additionalProperties:
            type: integer
          example:
            ACTIVE: 120
            RESERVED: 30
            DAMAGED: 2
      required:
        - unique_code
        - expiration_date
        - status
        - quantities
    ProductKitComponent:
      type: object
      description: One component line of a kit (bundle).
      properties:
        id:
          type: integer
          description: Kit component line id.
          example: 501
        quantity:
          type: integer
          description: Units of the component in one kit.
          example: 2
        price_per_item:
          type:
            - string
            - "null"
          description: Price assigned to each component unit when the kit is sold, as a decimal string.
          example: "49.50"
        kit_product:
          type:
            - object
            - "null"
          description: The component product. Null when the component product has been removed from the catalog.
          properties:
            id:
              type: integer
              description: Component product id.
              example: 12345
            name:
              type: string
              description: Component product name.
              example: Widget Pro Black
            product_codes:
              type: array
              description: SKUs of the component product.
              items:
                $ref: "#/components/schemas/ProductCode"
      required:
        - id
        - quantity
        - kit_product
    ProductImageInput:
      type: object
      description: >-
        An image sent inline as base64. PNG or JPEG, at most 5 MB decoded; the base64 payload may not exceed
        10485760 bytes.
      properties:
        filename:
          type: string
          description: File name with extension.
          example: widget.png
        base64_data:
          type: string
          description: Base64-encoded image bytes. A `data:image/png;base64,` prefix is accepted and stripped.
          example: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
        content_type:
          type: string
          description: MIME type of the image.
          enum:
            - image/png
            - image/jpeg
          example: image/png
      required:
        - filename
        - base64_data
        - content_type
    ProductVariantInput:
      type: object
      description: One variant of a `has_variants` product. Each variant becomes its own product.
      properties:
        name:
          type: string
          description: Variant name. The created product is named `"<product name> <variant name>"`.
          example: S
        skus:
          type: array
          description: SKUs of the variant. At least one, unique within the store.
          items:
            type: string
          example:
            - SKU-TEE-S
        bar_code:
          type:
            - string
            - "null"
          description: Barcode (UPC/EAN) of the variant, unique within the store.
          example: "7501234567892"
        options_name:
          type: array
          description: Option values that define this variant.
          items:
            type: object
            properties:
              name:
                type: string
                description: Option name.
                example: Size
              value:
                type: string
                description: Option value.
                example: S
            required:
              - name
              - value
      required:
        - name
        - skus
    ProductOptionInput:
      type: object
      description: An option axis of a variant product (for example Size) and its possible values.
      properties:
        name:
          type: string
          description: Option name.
          example: Size
        tags:
          type: array
          description: Possible values.
          items:
            type: string
          example:
            - S
            - M
            - L
      required:
        - name
        - tags
    ProductCreateRequest:
      type: object
      description: >-
        Body of `POST /products`. `skus` and `upc` are required for a single product; `variants` is required
        when `has_variants` is true.
      properties:
        store_id:
          type: integer
          description: Store to create the product in.
          example: 1234
        name:
          type: string
          description: Product name.
          example: Widget Pro Black
        description:
          type: string
          description: Product description; HTML is allowed.
          example: <p>A professional-grade widget.</p>
        skus:
          type: array
          description: >-
            SKUs of the product (single-product requests). Required unless `has_variants` is true. Each must
            be unique within the store.
          items:
            type: string
          example:
            - SKU-RED-M
        upc:
          type: string
          description: >-
            Barcode (UPC/EAN). Required unless `has_variants` is true. Must be unique within the store and
            must not match another product's SKU.
          example: "7501234567890"
        has_variants:
          type: boolean
          description: Create one product per entry in `variants` instead of a single product.
          default: false
          example: false
        options:
          type: array
          description: Option axes of a variant product. Only with `has_variants`.
          items:
            $ref: "#/components/schemas/ProductOptionInput"
        variants:
          type: array
          description: Variants to create. Required and non-empty when `has_variants` is true.
          items:
            $ref: "#/components/schemas/ProductVariantInput"
        is_fragile:
          type: boolean
          description: Requires fragile handling.
          default: false
          example: false
        is_dropshipping:
          type: boolean
          description: Product fulfilled by dropshipping (Cubbo holds no stock). Not allowed with `has_variants`.
          default: false
          example: false
        has_expiration:
          type: boolean
          description: Stock is tracked by lot with expiration dates. Requires `freshness`.
          default: false
          example: true
        freshness:
          type:
            - integer
            - "null"
          description: Minimum shelf life in days a lot must have when received. Required when `has_expiration` is true.
          example: 180
        tax_code:
          type:
            - string
            - "null"
          description: >-
            Brazil only. NCM code of the product (for example `3401.11.90`) or the id of an NCM configuration
            of the store. Must already be configured for the store.
          example: 3401.11.90
        is_packageless:
          type: boolean
          description: Ships without additional packaging.
          default: false
          example: false
        has_imei:
          type: boolean
          description: Each unit is identified by an IMEI.
          default: false
          example: false
        requires_unit_code:
          type: boolean
          description: Each unit is identified by a unique code (serial) that is scanned at receiving and picking.
          default: false
          example: false
        product_image_url:
          type: string
          description: Public URL of the product image to download and attach (PNG or JPEG).
          example: https://cdn.example.com/images/widget.png
        product_image:
          $ref: "#/components/schemas/ProductImageInput"
        is_scannable:
          type: boolean
          description: >-
            Units can be scanned at picking. Set to false for marketing inserts; then `product_image` is
            required and `has_variants` is not allowed.
          default: true
          example: true
        price:
          type: number
          description: Unit price. Up to 8 significant digits. A non-numeric value is stored as 0.
          default: 0
          example: 99.99
        billing_name:
          type:
            - string
            - "null"
          description: Name printed on invoices, when different from `name`.
          example: Widget Pro - Black Edition
        origin:
          type: string
          description: Brazil only. Fiscal origin of the goods for the NF-e.
          enum:
            - NATIONAL
            - FOREIGN_IMPORTED
            - FOREIGN_ACQUIRED_INTERNALLY
            - NATIONAL_40_70_IMPORTED
            - NATIONAL_MANUFACTURED
            - NATIONAL_0_40_IMPORTED
            - FOREIGN_DIRECT_IMPORT
            - FOREIGN_ACQUIRED_INTERNALLY_WITHOUT_NATIONAL_SIMILAR
            - NATIONAL_70_IMPORTED
          default: NATIONAL
          example: NATIONAL
        extipi:
          type:
            - string
            - "null"
          description: Brazil only. IPI exception code (EX TIPI), 2 or 3 digits.
          example: "001"
        fci_key:
          type:
            - string
            - "null"
          description: Brazil only. FCI (import content form) key for the NF-e.
          example: 00000000-0000-0000-0000-000000000000
        weight:
          type: number
          description: Unit weight, in `weight_unit`. Stored in kilograms.
          example: 500
        weight_unit:
          type: string
          description: >-
            Unit of `weight`. `g` or `gr` is converted to kilograms; any other value (for example `kg`) is
            stored as sent. Required for certain marketplace integration accounts.
          example: g
        length:
          type: number
          description: Package length in `dimension_unit`, between 0.01 and 999999.99.
          minimum: 0.01
          maximum: 999999.99
          example: 10
        width:
          type: number
          description: Package width in `dimension_unit`, between 0.01 and 999999.99.
          minimum: 0.01
          maximum: 999999.99
          example: 8
        height:
          type: number
          description: Package height in `dimension_unit`, between 0.01 and 999999.99.
          minimum: 0.01
          maximum: 999999.99
          example: 5
        dimension_unit:
          type: string
          description: Unit of the dimensions.
          enum:
            - cm
            - mm
            - in
            - m
          default: cm
          example: cm
        master_box_quantity:
          type:
            - integer
            - "null"
          description: >-
            Certain marketplace integration accounts only. Units per master box for the SKU; registers or
            updates the master box configuration.
          minimum: 1
          example: 12
        migrate_sku:
          type: boolean
          description: >-
            Certain marketplace integration accounts only. When the SKU already belongs to another product of
            the store, move the SKU (with its lots, stock, open order lines and open replenishments) to the
            new product instead of failing.
          default: false
          example: false
      required:
        - store_id
        - name
    ProductUpdateRequest:
      type: object
      description: Body of `PATCH /products/{id}`. Every field is optional; only the fields sent are changed.
      properties:
        name:
          type: string
          description: New product name. Must not be blank.
          example: Widget Pro Black v2
        description:
          type: string
          description: New description; HTML is allowed.
          example: <p>Updated description.</p>
        bar_code:
          type: string
          description: New barcode (UPC/EAN). Must be unique within the store. Rejected when the product has stock.
          example: "7501234567899"
        price:
          type: number
          description: New unit price. Up to 8 significant digits. A non-numeric value is stored as 0.
          example: 109.99
        skus:
          type: array
          description: Replaces the full SKU list. Rejected when the product has stock. An empty array is ignored.
          items:
            type: string
          example:
            - SKU-RED-M
            - SKU-RED-M-ALT
        product_image:
          $ref: "#/components/schemas/ProductImageInput"
        weight:
          type: number
          description: New unit weight, in `weight_unit`. Stored in kilograms. Must be at least 0.01.
          minimum: 0.01
          example: 750
        weight_unit:
          type: string
          description: Unit of `weight`. `g` or `gr` is converted to kilograms; any other value is stored as sent.
          example: g
        length:
          type: number
          description: Package length in `dimension_unit`, between 0.01 and 999999.99.
          minimum: 0.01
          maximum: 999999.99
          example: 12.5
        width:
          type: number
          description: Package width in `dimension_unit`, between 0.01 and 999999.99.
          minimum: 0.01
          maximum: 999999.99
          example: 7
        height:
          type: number
          description: Package height in `dimension_unit`, between 0.01 and 999999.99.
          minimum: 0.01
          maximum: 999999.99
          example: 3
        dimension_unit:
          type: string
          description: Unit of the dimensions.
          enum:
            - cm
            - mm
            - in
            - m
          example: cm
    ProductCreated:
      type: object
      description: The product returned by `POST /products` for a single (non-variant) request.
      properties:
        id:
          type: integer
          description: Cubbo product id. Use it for `PATCH /products/{id}`.
          example: 12345
        name:
          type: string
          description: Product name.
          example: Widget Pro Black
        billing_name:
          type:
            - string
            - "null"
          description: Name printed on invoices.
          example: null
        description:
          type:
            - string
            - "null"
          description: Product description.
          example: <p>A professional-grade widget.</p>
        has_imei:
          type: boolean
          description: Each unit is identified by an IMEI.
          example: false
        is_fragile:
          type: boolean
          description: Requires fragile handling.
          example: false
        is_kit:
          type: boolean
          description: Always false for products created through the API.
          example: false
        bar_code:
          type:
            - string
            - "null"
          description: Barcode (UPC/EAN).
          example: "7501234567890"
        is_dropshipping:
          type: boolean
          description: Fulfilled by dropshipping.
          example: false
        has_expiration:
          type:
            - boolean
            - "null"
          description: Stock is tracked by lot with expiration dates.
          example: true
        freshness:
          type:
            - integer
            - "null"
          description: Minimum shelf life in days at receiving.
          example: 180
        is_scannable:
          type: boolean
          description: Units can be scanned at picking.
          example: true
        price:
          type:
            - string
            - "null"
          description: Unit price, as a decimal string.
          example: "99.99"
        weight:
          type:
            - number
            - "null"
          description: Unit weight in kilograms (after conversion).
          example: 0.5
        product_codes:
          type: array
          description: SKUs registered for the product.
          items:
            $ref: "#/components/schemas/ProductCode"
      required:
        - id
        - name
        - is_kit
        - product_codes
    ProductDetailed:
      type: object
      description: >-
        Full product representation, as used by the Cubbo app. Returned by `PATCH /products/{id}` and, as an
        array, by `POST /products` with variants.
      properties:
        id:
          type: integer
          description: Cubbo product id.
          example: 12345
        name:
          type: string
          description: Product name.
          example: Widget Pro Black
        billing_name:
          type:
            - string
            - "null"
          description: Name printed on invoices.
          example: null
        description:
          type:
            - string
            - "null"
          description: Product description (may contain HTML).
          example: <p>A professional-grade widget.</p>
        has_imei:
          type: boolean
          description: Each unit is identified by an IMEI.
          example: false
        requires_unit_code:
          type: boolean
          description: Each unit is identified by a unique code (serial).
          example: false
        allow_unit_code_substitution:
          type: boolean
          description: A reserved unit may be swapped for another unit of the same product at picking.
          example: false
        personalized_units:
          type:
            - boolean
            - "null"
          description: Units are personalized per order.
          example: false
        is_fragile:
          type: boolean
          description: Requires fragile handling.
          example: false
        is_kit:
          type: boolean
          description: The product is a kit (bundle).
          example: false
        bar_code:
          type:
            - string
            - "null"
          description: Barcode (UPC/EAN).
          example: "7501234567890"
        is_dropshipping:
          type: boolean
          description: Fulfilled by dropshipping.
          example: false
        has_expiration:
          type:
            - boolean
            - "null"
          description: Stock is tracked by lot with expiration dates.
          example: true
        freshness:
          type:
            - integer
            - "null"
          description: Minimum shelf life in days at receiving.
          example: 180
        stock:
          oneOf:
            - $ref: "#/components/schemas/ProductStock"
            - type: "null"
          description: >-
            Aggregate stock (without the `LOST` and by-source keys). Null for a product that has never had
            stock.
        full_name:
          type: string
          description: Product name including the parent name for variants.
          example: Widget Pro Black
        is_scannable:
          type: boolean
          description: Units can be scanned at picking.
          example: true
        product_image_path:
          type:
            - string
            - "null"
          description: URL of the product image, when one is attached.
          example: null
        price:
          type:
            - string
            - "null"
          description: Unit price, as a decimal string.
          example: "99.99"
        weight:
          type:
            - number
            - "null"
          description: Unit weight in `weight_unit`.
          example: 0.5
        weight_unit:
          type:
            - string
            - "null"
          description: Unit of `weight`.
          example: kg
        origin:
          type:
            - string
            - "null"
          description: Brazil only. Fiscal origin of the goods.
          example: NATIONAL
        buffer_stock:
          type:
            - integer
            - "null"
          description: Safety stock excluded from availability.
          example: null
        is_packageless:
          type: boolean
          description: Ships without additional packaging.
          example: false
        length:
          type:
            - string
            - "null"
          description: Package length, as a decimal string.
          example: "10.0"
        width:
          type:
            - string
            - "null"
          description: Package width, as a decimal string.
          example: "8.0"
        height:
          type:
            - string
            - "null"
          description: Package height, as a decimal string.
          example: "5.0"
        dimension_unit:
          type: string
          description: Unit of the dimensions.
          enum:
            - cm
            - mm
            - in
            - m
          example: cm
        extipi:
          type: string
          description: Brazil only. IPI exception code. Present only when set.
          example: "001"
        fci_key:
          type: string
          description: Brazil only. FCI key. Present only when set.
          example: 00000000-0000-0000-0000-000000000000
        is_discarded:
          type: boolean
          description: The product has been removed from the catalog.
          example: false
        product_codes:
          type: array
          description: SKUs registered for the product, with timestamps.
          items:
            type: object
            properties:
              id:
                type: integer
                description: SKU record id.
                example: 9001
              product_id:
                type: integer
                description: Product id.
                example: 12345
              sku:
                type: string
                description: The SKU.
                example: SKU-RED-M
              created_at:
                type: string
                format: date-time
                description: When the SKU was registered.
                example: "2026-10-12T15:04:05.000Z"
              updated_at:
                type: string
                format: date-time
                description: Last change of the SKU.
                example: "2026-10-12T15:04:05.000Z"
        kit_childs:
          type: array
          description: Components of the kit. Empty unless `is_kit` is true.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Kit component line id.
                example: 501
              quantity:
                type: integer
                description: Units of the component in one kit.
                example: 2
              price_per_item:
                type:
                  - string
                  - "null"
                description: Price per component unit
                as a decimal string.: null
                example: "49.50"
              child_product:
                type:
                  - object
                  - "null"
                description: >-
                  The component product (id, name, codes, stock and flags). Null when it was removed from the
                  catalog.
                additionalProperties: true
        store:
          type: object
          description: Store that owns the product. Carries the store's id and name plus its configuration fields.
          properties:
            id:
              type: integer
              description: Store id.
              example: 1234
            name:
              type: string
              description: Store name.
              example: Example Store
          additionalProperties: true
        ncm_configuration:
          type:
            - object
            - "null"
          description: >-
            Brazil only. The NCM fiscal configuration linked to the product (`id`, `ncm`, `description` and
            the tax rates and CFOP codes used on the NF-e). Null when none is linked.
          additionalProperties: true
      required:
        - id
        - name
        - is_kit
        - product_codes
    AcceptedProcessing:
      type: object
      description: Returned with HTTP 202 when a concurrent request for the same resource is still being processed.
      properties:
        message:
          type: string
          description: Explains which request is still processing.
          example: Accepted, but PRODUCT whit skus SKU-RED-M still processing.
        transaction_id:
          type: string
          description: Id of the request already in progress.
          example: 7f3c2a1e-0000-4000-8000-000000000000
        transaction_key:
          type: string
          description: Concurrency key the two requests collided on.
          example: api_create_products-SKU-RED-M-1234
      required:
        - message
        - transaction_id
        - transaction_key
    LotsResponse:
      type: object
      description: Response of `GET /lots`.
      properties:
        product:
          $ref: "#/components/schemas/LotProduct"
        lots:
          type: array
          description: One page of the product's lots, soonest expiration first.
          items:
            $ref: "#/components/schemas/Lot"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - product
        - lots
        - meta
    LotProduct:
      type: object
      description: The product whose lots are listed.
      properties:
        id:
          type: integer
          description: Cubbo product id.
          example: 12345
        store_id:
          type: integer
          description: Store the product belongs to.
          example: 1234
        name:
          type: string
          description: Product name.
          example: Widget Pro Black
        skus:
          type: array
          description: All SKUs of the product.
          items:
            type: string
          example:
            - SKU-RED-M
        bar_code:
          type:
            - string
            - "null"
          description: Barcode (UPC/EAN).
          example: "7501234567890"
        has_expiration:
          type:
            - boolean
            - "null"
          description: Stock is tracked by lot with expiration dates.
          example: true
      required:
        - id
        - store_id
        - name
        - skus
        - bar_code
        - has_expiration
    Lot:
      type: object
      description: A lot of a product with its stock, as returned by `GET /lots`.
      properties:
        id:
          type: integer
          description: Lot id.
          example: 987
        lot_code:
          type: string
          description: Lot code, unique within the store.
          example: SKU-RED-M-L2026-04
        status:
          type: string
          description: Lot status. Expired lots are moved to `EXPIRED` by an end-of-day process.
          enum:
            - ACTIVE
            - HOLDED
            - DAMAGED
            - EXPIRED
          example: ACTIVE
        expiration_date:
          type:
            - string
            - "null"
          format: date
          description: Expiration date (`YYYY-MM-DD`), or null when the lot has none.
          example: "2026-06-30"
        stock:
          $ref: "#/components/schemas/LotStock"
      required:
        - id
        - lot_code
        - status
        - expiration_date
        - stock
    LotStock:
      type: object
      description: Unit counts of one lot. Buffer stock is not applied at lot level.
      properties:
        IN_WAREHOUSE:
          type: integer
          description: Units physically in the warehouse (active, reserved, damaged, on hold, expired, in reception).
          example: 15
        AVAILABLE:
          type: integer
          description: Units you can sell now (active plus sell-ahead units).
          example: 12
        AVAILABLE_NOT_EXTERNALLY_CONFIRMED:
          type: integer
          description: Available units from replenishments not yet confirmed by your system.
          example: 0
        AVAILABLE_EXTERNALLY_CONFIRMED:
          type: integer
          description: Available units from confirmed replenishments, plus sell-ahead units.
          example: 12
        RECEPTION-INCOMING-SELL-AHEAD:
          type: integer
          description: Sell-ahead units that arrived and are being received.
          example: 0
        DAMAGED:
          type: integer
          description: Damaged units.
          example: 0
        HOLDED:
          type: integer
          description: Units withheld by a lot hold.
          example: 0
        EXPIRED:
          type: integer
          description: Expired units.
          example: 0
        RESERVED:
          type: integer
          description: Units reserved by orders, including sell-ahead reservations.
          example: 3
        ACTIVE:
          type: integer
          description: Active (sellable, unreserved) units.
          example: 12
        SHIPPED:
          type: integer
          description: Units of this lot that already left the warehouse.
          example: 40
        RESERVED-WITHOUT-SELL-AHEAD:
          type: integer
          description: Reserved units excluding sell-ahead reservations.
          example: 3
      required:
        - IN_WAREHOUSE
        - AVAILABLE
        - AVAILABLE_NOT_EXTERNALLY_CONFIRMED
        - AVAILABLE_EXTERNALLY_CONFIRMED
        - RECEPTION-INCOMING-SELL-AHEAD
        - DAMAGED
        - HOLDED
        - EXPIRED
        - RESERVED
        - ACTIVE
        - SHIPPED
        - RESERVED-WITHOUT-SELL-AHEAD
    LotUpsertRequest:
      type: object
      description: Body of `POST /lots/upsert`.
      properties:
        store_id:
          type: integer
          description: Store the lot belongs to.
          example: 1234
        sku:
          type: string
          description: >-
            SKU of the product. Required when creating a lot. When sent, the lot's unique code becomes
            `<sku>-<lot_code>`.
          example: SKU-RED-M
        lot_code:
          type: string
          description: Lot code. Used as the full unique code when `sku` is omitted.
          example: L2026-04
        expiration_date:
          type: string
          format: date
          description: Expiration date (`YYYY-MM-DD`). Optional; when omitted on an existing lot the stored date is kept.
          example: "2026-12-31"
      required:
        - store_id
        - lot_code
    LotUpsertResponse:
      type: object
      description: The lot after the upsert.
      properties:
        id:
          type: integer
          description: Lot id.
          example: 987
        unique_code:
          type: string
          description: The lot's unique code within the store.
          example: SKU-RED-M-L2026-04
        expiration_date:
          type:
            - string
            - "null"
          format: date-time
          description: Expiration date as an ISO 8601 timestamp at UTC midnight, or null.
          example: "2026-12-31T00:00:00Z"
        status:
          type: string
          description: Lot status, in lowercase.
          enum:
            - active
            - holded
            - damaged
            - expired
          example: active
      required:
        - id
        - unique_code
        - expiration_date
        - status
    LotHoldRequest:
      type: object
      description: Body of `POST /lots/hold/store/{store_id}` and `POST /lots/unhold/store/{store_id}`.
      properties:
        material_code:
          type: string
          description: >-
            Product SKU (material code). Combined with `lot_code` as `<material_code>-<lot_code>` to find the
            lot.
          example: SKU-RED-M
        lot_code:
          type: string
          description: Lot code.
          example: L2026-04
      required:
        - material_code
        - lot_code
    LotHoldResponse:
      type: object
      description: Acknowledgement of a hold or release request.
      properties:
        unique_code:
          type: string
          description: The lot's unique code within the store.
          example: SKU-RED-M-L2026-04
        status:
          type: string
          description: Lot status at the moment of the request, in lowercase. The hold or release is applied right after.
          enum:
            - active
            - holded
            - damaged
            - expired
          example: active
      required:
        - unique_code
        - status
    InventoryTransactionsResponse:
      type: object
      description: Response of `GET /reports/inventory-transactions`.
      properties:
        data:
          type: array
          description: Movements in chronological order.
          items:
            $ref: "#/components/schemas/InventoryTransaction"
        meta:
          type: object
          description: Row count and the range actually applied.
          properties:
            row_count:
              type: integer
              description: Number of rows in `data`.
              example: 3
            from:
              type: string
              format: date-time
              description: Resolved start of the range, in the report time zone.
              example: "2026-06-01T00:00:00-03:00"
            to:
              type: string
              format: date-time
              description: Resolved end of the range, in the report time zone.
              example: "2026-06-30T23:59:59-03:00"
          required:
            - row_count
            - from
            - to
      required:
        - data
        - meta
    InventoryTransaction:
      type: object
      description: One inventory movement of a product.
      properties:
        cnpj:
          type:
            - string
            - "null"
          description: The store's CNPJ (Brazilian company tax id).
          example: 00.000.000/0001-00
        store_name:
          type: string
          description: Store name.
          example: Example Store
        transaction_type:
          type: string
          description: Kind of movement.
          enum:
            - inbound
            - sale
            - return
            - damaged
            - lost
            - transfer_in
            - transfer_out
          example: sale
        invoice_access_key:
          type:
            - string
            - "null"
          description: Access key (44 digits) of the NF-e linked to the movement, when there is one.
          example: "00000000000000000000000000000000000000000001"
        invoice_number:
          type:
            - string
            - "null"
          description: Series and number of the linked NF-e, as `S<series> N<number>`.
          example: S1 N1002
        order_number:
          type:
            - string
            - "null"
          description: Order number for sale and return movements; replenishment id for inbound movements.
          example: ORD-0001
        inventory_type:
          type: string
          description: >-
            `physical` for stock in the warehouse; `virtual` for lost stock, which is still owned but cannot
            be picked.
          enum:
            - physical
            - virtual
          example: physical
        inbound_outbound:
          type: string
          description: Direction of the movement (sign of `volume`).
          enum:
            - inbound
            - outbound
          example: outbound
        warehouse_code:
          type:
            - string
            - "null"
          description: Code of the warehouse where the movement happened.
          example: WH-SP-01
        warehouse_name:
          type:
            - string
            - "null"
          description: Name of the warehouse.
          example: Sao Paulo
        sku_cph:
          type:
            - string
            - "null"
          description: First SKU of the product.
          example: SKU-RED-M
        name:
          type:
            - string
            - "null"
          description: Product name.
          example: Widget Pro Black
        material_sku:
          type:
            - string
            - "null"
          description: Second SKU of the product when it has one, otherwise the first.
          example: SKU-RED-M
        volume:
          type: integer
          description: Signed quantity moved (positive inbound, negative outbound).
          example: -2
        quantity:
          type: integer
          description: Absolute quantity moved.
          example: 2
        balance_after:
          type:
            - integer
            - "null"
          description: Product balance in that quality bucket after the movement.
          example: 48
        timestamp:
          type:
            - string
            - "null"
          format: date-time
          description: When the movement happened, in the report time zone (America/Sao_Paulo).
          example: "2026-06-03T16:40:12-03:00"
        quality:
          type: string
          description: Stock quality the movement affected.
          enum:
            - good
            - damaged
            - lost
          example: good
        quality_source:
          type:
            - string
            - "null"
          description: For damaged and lost movements, where the damage or loss originated. Null for good stock.
          enum:
            - REPLENISHMENT
            - RETURN
            - DELIVERY
            - STORAGE
            - null
          example: null
      required:
        - store_name
        - transaction_type
        - inventory_type
        - inbound_outbound
        - volume
        - quantity
        - quality
    ReportError:
      type: object
      description: Error body of the reports endpoint, with a machine-readable code.
      properties:
        error:
          type: string
          description: Human-readable message.
          example: the inventory transactional report is not enabled for this store
        code:
          type:
            - string
            - "null"
          description: Error code. Null for parameter errors.
          enum:
            - STORE_NOT_FOUND
            - REPORT_NOT_ENABLED
            - INVALID_DATE
            - INVALID_DATE_RANGE
            - DATE_RANGE_TOO_WIDE
            - RESULT_TOO_LARGE
            - null
          example: REPORT_NOT_ENABLED
        context:
          type:
            - object
            - "null"
          description: Extra detail for some codes. `RESULT_TOO_LARGE` carries `row_count` and `max_rows`.
          additionalProperties: true
          example: null
      required:
        - error
    OrderCreateRequest:
      type: object
      required:
        - store_id
        - order_number
        - shipping
        - products
      properties:
        store_id:
          type: integer
          description: Id of the store the order belongs to. Your API credentials must have access to it.
          example: 1234
        order_number:
          type: string
          description: Your identifier for the order. Must be unique within the store.
          example: ORD-0001
        shipping_method_id:
          type: integer
          description: >-
            Id of a Cubbo shipping method. Get it from `GET /shipping-methods/quote`: each option in the
            response has a `shipping_method_id`. Required unless `shipping_line_code` is sent. Coverage for
            the destination is checked synchronously: by zip code in Mexico, by `shipping.city` in Chile. In
            Chile a `shipping.city` that cannot be identified does not refuse the order; it is created in
            `error` until it is corrected.
          example: 12
        shipping_line_code:
          type: string
          description: >-
            Exact name of a shipping method you created in the Cubbo app, under **Integrations**, your Open
            API integration, **Shipping Methods** (field **Integration Delivery Method**). It must match
            character by character: the comparison is case-sensitive and does not trim spaces. Cubbo uses the
            shipping configuration assigned to that method to pick the carrier. See [Set up your
            integration](/guides/setup#3-configure-shipping-methods). Required unless `shipping_method_id` is
            sent; ignored when `shipping_method_id` is present. If no active method has that name, Cubbo falls
            back to the integration's default shipping method when one exists. If the method exists but no
            carrier can be resolved (no coverage, unknown weight or tariff), the order is still created and
            lands in an error status for Cubbo to resolve.
          example: Express
        is_paid:
          type: boolean
          description: Whether the order is already paid. Defaults to `true` when omitted.
          default: true
          example: true
        is_click_and_collect:
          type: boolean
          description: Set to `true` to deliver to a carrier pickup point. Requires `click_and_collect_service_code`.
          default: false
          example: false
        click_and_collect_service_code:
          type:
            - string
            - "null"
          description: >-
            Pickup point code returned by `GET /carrier-services/pickup-locations`, in the form `CUBBOCNC` +
            carrier code (`EST`, `CUBBO`, `DHL`, `PUNTOPOST`, `99`) + location id. Ignored (cleared) unless
            `is_click_and_collect` is `true`.
          example: CUBBOCNCEST001
        channel_name:
          type: string
          description: Name of the sales channel the order came from, echoed back as `channel_name` on the order.
          example: my-webstore
        channel_order_id:
          type: string
          description: Identifier of the order in your sales channel, echoed back as `channel_order_id`.
          example: WEB-98765
        is_b2b:
          type: boolean
          description: >-
            Business-model classification. Only read for stores enabled for both B2B and D2C: omit it (or send
            `false`) for a consumer order, send `true` for a B2B order. Stores enabled for a single model
            always get that model regardless of this value.
          example: false
        has_carrier_insurance:
          type: boolean
          description: >-
            Ask the carrier to insure the shipment. Available only for stores with a warehouse in Chile;
            `true` elsewhere is refused with `CARRIER_INSURANCE_NOT_AVAILABLE`.
          default: false
          example: false
        is_cod:
          type: boolean
          description: Cash on delivery; the courier collects payment at the door.
          default: false
          example: false
        cod_amount:
          type: number
          minimum: 0
          description: >-
            Amount the courier must collect when it differs from the order total (partial collection). Omit,
            or send `0`, to collect the order total. A non-zero amount is available only for stores with a
            warehouse in Chile; elsewhere it is refused with `COD_AMOUNT_NOT_AVAILABLE`.
          example: 30000
        requires_document_return:
          type: boolean
          description: >-
            Ask the carrier to bring back a signed document with the delivery. Available only for stores with
            a warehouse in Chile; cannot be combined with `requires_pickup_on_delivery`.
          default: false
          example: false
        requires_pickup_on_delivery:
          type: boolean
          description: >-
            Include a prepaid return label inside the outbound package. Available only for consumer (D2C)
            orders of stores with a warehouse in Chile, and cannot be combined with
            `requires_document_return`.
          default: false
          example: false
        shipping:
          $ref: "#/components/schemas/OrderShippingAddress"
        billing:
          $ref: "#/components/schemas/OrderBillingAddress"
        products:
          type: array
          minItems: 1
          description: Lines of the order. The same SKU may appear more than once.
          items:
            $ref: "#/components/schemas/OrderProductLine"
        shipping_documents:
          type: array
          description: >-
            Optional PDF documents to print and include with the shipment (for example a label or invoice you
            issued). Each document is fetched from a URL or decoded from base64 at creation time.
          items:
            $ref: "#/components/schemas/OrderShippingDocument"
    OrderShippingAddress:
      type: object
      description: Recipient and delivery address.
      required:
        - first_name
        - phone
        - email
        - address1
        - country
        - city
        - province
      properties:
        first_name:
          type: string
          description: Recipient first name.
          example: Jaime
        last_name:
          type: string
          description: Recipient last name.
          example: Carrera
        phone:
          type: string
          description: Recipient phone number, used by the carrier.
          example: "5555555555"
        email:
          type: string
          format: email
          description: Recipient email, used for tracking notifications.
          example: buyer@example.com
        address1:
          type: string
          description: Street and number.
          example: Av. Reforma 123
        address2:
          type: string
          description: Additional address line (apartment, floor, building).
          example: Piso 4
        references:
          type: string
          description: Delivery hints for the courier.
          example: Blue door, ring twice
        number:
          type: string
          description: Street number, when kept separate from `address1`.
          example: "123"
        interior_number:
          type: string
          description: Interior or apartment number.
          example: 4B
        country:
          type: string
          description: Country as an ISO 3166-1 alpha-2 code (a full country name is also recognised).
          example: MX
        city:
          type: string
          description: City.
          example: Ciudad de México
        province:
          type: string
          description: State or province.
          example: CDMX
        zip_code:
          type: string
          description: >-
            Postal code. Required when the warehouse is in Mexico (`MISSING_ZIP_CODE` otherwise); optional for
            Chile and Colombia. Used for carrier coverage.
          example: "06600"
    OrderBillingAddress:
      type: object
      description: Optional billing contact and address.
      required:
        - first_name
        - last_name
        - phone
        - email
        - address1
        - country
        - city
        - province
      properties:
        first_name:
          type: string
          description: Billing first name.
          example: Jaime
        last_name:
          type: string
          description: Billing last name.
          example: Carrera
        phone:
          type: string
          description: Billing phone number.
          example: "5555555555"
        email:
          type: string
          format: email
          description: Billing email.
          example: buyer@example.com
        address1:
          type: string
          description: Street and number.
          example: Av. Reforma 123
        address2:
          type: string
          description: Additional address line.
          example: Piso 4
        address3:
          type: string
          description: Accepted for compatibility; not stored.
          example: ""
        interior_number:
          type: string
          description: Interior or apartment number.
          example: 4B
        country:
          type: string
          description: Country as an ISO 3166-1 alpha-2 code.
          example: MX
        city:
          type: string
          description: City.
          example: Ciudad de México
        province:
          type: string
          description: State or province.
          example: CDMX
        zip_code:
          type: string
          description: Postal code.
          example: "06600"
    OrderProductLine:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: SKU of a product registered in the store.
          example: SKU-RED-M
        quantity:
          type: integer
          description: Units of this SKU. Lines of drop-shipping products are stored with quantity 0.
          example: 2
        unit_code:
          type: string
          description: >-
            Pins the line to the one stock unit carrying this code. Only valid on a line with `quantity` 1 of
            a non-kit product that tracks unit codes; mandatory for products that hold personalized units.
          example: UC-0001
    OrderShippingDocument:
      type: object
      required:
        - document_type
        - data
        - printing_type
      properties:
        document_type:
          type: string
          enum:
            - url
            - base64
          description: How `data` must be read. `file` is not accepted on creation.
          example: url
        data:
          type: string
          description: Public URL of the PDF, or the base64-encoded PDF content.
          example: https://example.com/documents/label.pdf
        printing_type:
          type: string
          enum:
            - label
            - document
            - difal_bill
            - difal_payment_receipt
            - identifier_label
            - oxxo_digital_card
          description: What the document is, which decides when the warehouse prints it.
          example: label
        metadata:
          type: object
          description: Free-form data stored with the document.
          additionalProperties: true
          example:
            tracking_number: TRACK123
    OrderCreateError:
      type: object
      description: Error body of `POST /orders` and `POST /orders/create-and-ship`.
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable message.
          example: order with order_number ORD-0001 already exists with id 987654
        code:
          type:
            - string
            - "null"
          description: >-
            Machine-readable code. `null` for parameter errors, empty string for business errors without a
            dedicated code; shipping-method lookups use the legacy codes `"404"` and `"400"`.
          example: ORDER_ALREADY_EXISTS
        context:
          type:
            - object
            - "null"
          description: Extra data for some codes, for example `{order_id}` on `ORDER_ALREADY_EXISTS`.
          additionalProperties: true
          example:
            order_id: 987654
    DuplicateRequestInFlightError:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable message naming the contended order number.
          example: another request for order ORD-0001 is already being processed, retry in 5 seconds
        code:
          type: string
          enum:
            - DUPLICATE_REQUEST_IN_FLIGHT
          description: Fixed code for this condition.
          example: DUPLICATE_REQUEST_IN_FLIGHT
        transaction_id:
          type:
            - string
            - "null"
          description: Identifier of the request currently holding the lock; useful when contacting support.
          example: c0ffee00-0000-4000-8000-000000000001
        transaction_key:
          type:
            - string
            - "null"
          description: The lock key that was contended.
          example: api_create_orders:1234:ORD-0001
    OrderFieldValidationError:
      type: object
      description: Field-level validation errors of an order.
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - code
            properties:
              field:
                type: string
                description: Order field the error refers to.
                example: shipping_method
              code:
                type: string
                description: >-
                  Validation code, for example `NATIONAL_SHIPPING_METHOD_EXPECTED`, `MISSING_SHIPPING_FIELD`,
                  `SHIPPING_METHOD_HAS_NO_COVERAGE`, `UNRECOGNIZED_CITY_OR_STATE`.
                example: NATIONAL_SHIPPING_METHOD_EXPECTED
              additional_info:
                type: object
                description: Extra details for the code, often empty.
                additionalProperties: true
                example: {}
    OrderCreateAndShipRequest:
      type: object
      required:
        - store_id
        - order_number
        - shipping
        - packages
      properties:
        store_id:
          type: integer
          description: Id of the store the order belongs to.
          example: 1234
        order_number:
          type: string
          description: Your identifier for the order. Must be unique within the store.
          example: PS-0001
        shipping_method_id:
          type: integer
          description: >-
            Id of a Cubbo shipping method. Get it from `GET /shipping-methods/quote`: each option in the
            response has a `shipping_method_id`. Exactly one of `shipping_method_id` or
            `integration_shipping_method` must be sent. Coverage for the destination is validated through the
            order validation (`errors` response).
          example: 12
        integration_shipping_method:
          type: string
          description: >-
            Exact name of a shipping method you created in the Cubbo app, under **Integrations**, your Open
            API integration, **Shipping Methods** (field **Integration Delivery Method**). It must match
            character by character: the comparison is case-sensitive and does not trim spaces. Cubbo uses the
            shipping configuration assigned to that method to pick the carrier. See [Set up your
            integration](/guides/setup#3-configure-shipping-methods). Exactly one of `shipping_method_id` or
            `integration_shipping_method` must be sent. There is no fallback here: an unknown name returns 422
            `MISSING_INTEGRATION_SHIPPING_METHOD`.
          example: Express
        shipping:
          $ref: "#/components/schemas/CreateAndShipShippingAddress"
        products:
          type: array
          description: Optional content description of the parcel; each SKU must exist in the store.
          items:
            $ref: "#/components/schemas/CreateAndShipProductLine"
        packages:
          type: array
          minItems: 1
          description: Physical packages to label; one label is generated per entry.
          items:
            $ref: "#/components/schemas/CreateAndShipPackage"
    CreateAndShipShippingAddress:
      type: object
      description: Recipient and delivery address. Billing data is copied from this block.
      required:
        - first_name
        - address1
        - country
        - city
        - province
      properties:
        first_name:
          type: string
          minLength: 3
          description: Recipient first name (at least 3 characters).
          example: Jaime
        last_name:
          type: string
          description: Recipient last name.
          example: Carrera
        phone:
          type: string
          description: >-
            Recipient phone number. Optional here, but most carriers require it (`MISSING_SHIPPING_FIELD`
            otherwise).
          example: "5555555555"
        email:
          type: string
          format: email
          description: Recipient email.
          example: buyer@example.com
        address1:
          type: string
          minLength: 3
          description: Street and number (at least 3 characters).
          example: Av. Reforma 123
        address2:
          type: string
          description: Additional address line.
          example: Piso 4
        interior_number:
          type: string
          description: Interior or apartment number.
          example: 4B
        country:
          type: string
          minLength: 2
          description: Country as an ISO 3166-1 alpha-2 code.
          example: MX
        city:
          type: string
          minLength: 2
          description: City.
          example: Ciudad de México
        province:
          type: string
          minLength: 2
          description: State or province.
          example: CDMX
        zip_code:
          type: string
          description: Postal code. Required when the warehouse is in Mexico (`MISSING_ZIP_CODE` otherwise).
          example: "06600"
    CreateAndShipProductLine:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: SKU of a product registered in the store.
          example: SKU-RED-M
        quantity:
          type: integer
          description: Units of this SKU in the parcel.
          example: 1
    CreateAndShipPackage:
      type: object
      required:
        - weight_kg
        - length_cm
        - width_cm
        - height_cm
      properties:
        weight_kg:
          type: number
          minimum: 0.01
          description: Real weight of the package in kilograms.
          example: 1.2
        length_cm:
          type: number
          minimum: 1
          description: Length in centimetres.
          example: 30
        width_cm:
          type: number
          minimum: 1
          description: Width in centimetres.
          example: 20
        height_cm:
          type: number
          minimum: 1
          description: Height in centimetres.
          example: 10
    CreateAndShipLabel:
      type: object
      description: A shipping label generated by `POST /orders/create-and-ship`.
      properties:
        id:
          type: integer
          description: Shipping label id; use it with `GET /shipping-labels/{shipping_label_id}`.
          example: 778899
        order_id:
          type: integer
          description: Id of the order that was created.
          example: 987655
        billing_file:
          oneOf:
            - $ref: "#/components/schemas/LabelFile"
            - type: "null"
          description: Carrier billing document when the carrier provides one; otherwise `null`.
        shipping_number:
          type:
            - string
            - "null"
          description: Carrier tracking number.
          example: "1234567890"
        label_file:
          $ref: "#/components/schemas/LabelFile"
        label_type:
          type: string
          description: Kind of label, normally `shipping`.
          example: shipping
        tracking_url:
          type:
            - string
            - "null"
          description: Carrier tracking page.
          example: https://carrier.example.com/track/1234567890
        cubbo_tracking_url:
          type:
            - string
            - "null"
          description: Cubbo tracking page for the order.
          example: https://tracking.cubbo.com/t/abc123
    LabelFile:
      type: object
      description: Downloadable file. An empty object when no file is attached.
      properties:
        path:
          type: string
          description: Path of the file relative to the API host.
          example: /rails/active_storage/blobs/redirect/abc123/label.pdf
        url:
          type: string
          format: uri
          description: Absolute download URL.
          example: https://api.cubbo.com/rails/active_storage/blobs/redirect/abc123/label.pdf
        filename:
          type: string
          description: File name.
          example: label.pdf
        byte_size:
          type: integer
          description: Size in bytes.
          example: 48213
        content_type:
          type: string
          description: MIME type.
          example: application/pdf
    BrazilOrderCreateRequest:
      type: object
      description: >-
        Request body of `POST /brazil/orders`. `shipping`, `billing`, `buyer_shipping_price` and a shipping
        method are required for `SALE`/`DONATION` and ignored for removal types.
      required:
        - store_id
        - order_number
        - products
      properties:
        store_id:
          type: integer
          description: Id of the Brazil store the order belongs to.
          example: 1234
        order_number:
          type: string
          description: Your identifier for the order. Must be unique within the store.
          example: ORD-BR-0001
        order_type:
          type: string
          enum:
            - SALE
            - DONATION
            - REMOVE_STOCK
            - REMOVE_DAMAGED_STOCK
            - REMOVE_EXPIRED_STOCK
            - REMOVE_LOST_STOCK
            - STOCK_TRANSFER_OUT
          default: SALE
          description: >-
            Kind of order. `SALE` and `DONATION` ship to your customer; the `REMOVE_*` types return stock to
            you. `STOCK_TRANSFER_OUT` passes the parameter check but is reserved for Cubbo's stock-transfer
            feature; do not use it.
          example: SALE
        shipping_method_id:
          type: integer
          description: >-
            Id of a Cubbo shipping method. Get it from `GET /shipping-methods/quote`: each option in the
            response has a `shipping_method_id`. For `SALE`/`DONATION` one of `shipping_method_id` or
            `shipping_line_code` is required; ignored for removal types.
          example: 12
        shipping_line_code:
          type: string
          description: >-
            Exact name of a shipping method you created in the Cubbo app, under **Integrations**, your Open
            API integration, **Shipping Methods** (field **Integration Delivery Method**). It must match
            character by character: the comparison is case-sensitive and does not trim spaces. Cubbo uses the
            shipping configuration assigned to that method to pick the carrier. See [Set up your
            integration](/guides/setup#3-configure-shipping-methods). Alternative to `shipping_method_id`.
            Ignored for removal types.
          example: Express
        is_paid:
          type: boolean
          description: Whether the order is already paid. Defaults to `true` when omitted.
          default: true
          example: true
        is_b2b:
          type: boolean
          description: >-
            Business-model classification, read only for stores enabled for both B2B and D2C; omit for a
            consumer order.
          example: false
        buyer_shipping_price:
          type: number
          description: >-
            Shipping cost charged to the buyer, added to the order total and to the NF-e. Required for
            `SALE`/`DONATION` (send `0.0` when free); optional for removal types, where it defaults to `0.0`
            but is still added to the total when sent.
          example: 15.9
        shipping:
          $ref: "#/components/schemas/BrazilOrderShippingAddress"
        billing:
          $ref: "#/components/schemas/BrazilOrderBillingAddress"
        products:
          type: array
          minItems: 1
          description: Lines of the order.
          items:
            $ref: "#/components/schemas/BrazilOrderProductLine"
        shipping_documents:
          type: array
          description: Optional PDF documents to print and include with the shipment.
          items:
            $ref: "#/components/schemas/OrderShippingDocument"
        client_invoice:
          description: >-
            Removal types only. Register an NF-e you issued yourself by its numbers. Requires manual NF-e
            entry to be enabled for your store by Cubbo support; otherwise the request is refused with 422.
            Send either this or `invoice_xml`, not both.
          $ref: "#/components/schemas/BrazilClientInvoice"
        invoice_xml:
          type: string
          description: >-
            Removal types only. Base64-encoded XML of the authorized NF-e you issued yourself. Accepted for
            any Brazil removal order.
          example: PG5mZT48L25mZT4=
    BrazilOrderShippingAddress:
      type: object
      description: Recipient and delivery address (required for `SALE`/`DONATION`).
      required:
        - first_name
        - phone
        - email
        - address1
        - number
        - neighborhood
        - country
        - city
        - province
        - zip_code
      properties:
        first_name:
          type: string
          description: Recipient first name.
          example: Ana
        last_name:
          type: string
          description: Recipient last name.
          example: Silva
        phone:
          type: string
          description: Recipient phone number.
          example: "5511999999999"
        email:
          type: string
          format: email
          description: Recipient email.
          example: buyer@example.com
        address1:
          type: string
          description: Street name (logradouro).
          example: Av. Paulista
        address2:
          type: string
          description: Additional address line (complemento).
          example: Bloco B
        address3:
          type: string
          description: Accepted for compatibility; not stored.
          example: ""
        number:
          type: string
          description: Street number.
          example: "1234"
        interior_number:
          type: string
          description: Apartment or suite.
          example: Apto 45
        neighborhood:
          type: string
          description: Neighborhood (bairro).
          example: Bela Vista
        country:
          type: string
          description: Country as an ISO 3166-1 alpha-2 code.
          example: BR
        city:
          type: string
          description: City.
          example: São Paulo
        province:
          type: string
          description: State (UF), for example `SP`.
          example: SP
        zip_code:
          type: string
          description: CEP (postal code), digits only. Validated against the Correios database asynchronously.
          example: "01310100"
    BrazilOrderBillingAddress:
      type: object
      description: Fiscal data of the buyer, used to issue the NF-e (required for `SALE`/`DONATION`).
      required:
        - first_name
        - last_name
        - phone
        - email
        - address1
        - number
        - neighborhood
        - country
        - city
        - province
        - zip_code
        - tax_id
      properties:
        first_name:
          type: string
          description: Buyer first name.
          example: Ana
        last_name:
          type: string
          description: Buyer last name.
          example: Silva
        phone:
          type: string
          description: Buyer phone number.
          example: "5511999999999"
        email:
          type: string
          format: email
          description: Buyer email.
          example: buyer@example.com
        address1:
          type: string
          description: Street name (logradouro).
          example: Av. Paulista
        address2:
          type: string
          description: Additional address line (complemento).
          example: Bloco B
        address3:
          type: string
          description: Accepted for compatibility; not stored.
          example: ""
        number:
          type: string
          description: Street number.
          example: "1234"
        interior_number:
          type: string
          description: Apartment or suite.
          example: Apto 45
        neighborhood:
          type: string
          description: Neighborhood (bairro).
          example: Bela Vista
        country:
          type: string
          description: Country as an ISO 3166-1 alpha-2 code.
          example: BR
        city:
          type: string
          description: City.
          example: São Paulo
        province:
          type: string
          description: State (UF).
          example: SP
        zip_code:
          type: string
          description: CEP (postal code).
          example: "01310100"
        tax_id:
          type: string
          description: >-
            Buyer tax id: CPF (11 digits) when `tax_regime` is `PHYSICAL`, CNPJ (14 digits) when `LEGAL`.
            Length is validated asynchronously (`BILLING_TAX_ID_WRONG_LENGTH`).
          example: 000.000.000-00
        tax_regime:
          type: string
          enum:
            - PHYSICAL
            - LEGAL
          default: PHYSICAL
          description: Natural person (`PHYSICAL`, CPF) or company (`LEGAL`, CNPJ).
          example: PHYSICAL
        company:
          type: string
          description: Company legal name. Required when `tax_regime` is `LEGAL`.
          example: Example Comércio LTDA
        state_registration:
          type: string
          description: State registration (Inscrição Estadual). Required when `tax_regime` is `LEGAL`.
          example: "000000000"
    BrazilOrderProductLine:
      type: object
      required:
        - sku
        - quantity
      properties:
        sku:
          type: string
          description: SKU of a product registered in the store.
          example: SKU-RED-M
        quantity:
          type: integer
          description: Units of this SKU. Must be at least 1 for removal types.
          example: 2
        price_per_item:
          type: number
          minimum: 0
          description: >-
            Unit price that reaches the NF-e. Required for `SALE`/`DONATION`; optional for removal types,
            where it falls back to the product's registered price. Use a nominal value rather than `0` on a
            donation.
          example: 59.9
        discount_per_item:
          type: number
          minimum: 0
          description: Unit discount. Must not exceed `price_per_item`, and requires `price_per_item` to be sent.
          example: 5
    BrazilClientInvoice:
      type: object
      required:
        - key
        - serie
        - number
      properties:
        key:
          type: string
          pattern: ^[0-9]{44}$
          description: NF-e access key (chave de acesso), 44 digits.
          example: "00000000000000000000000000000000000000000000"
        serie:
          type: string
          description: NF-e series.
          example: "1"
        number:
          type: string
          description: NF-e number.
          example: "987"
    OrderStatus:
      type: string
      description: |
        Fulfillment status of an order. `processing`, `picking` and `packing` all mean the order is being
        prepared in the warehouse. `holded` means the order is on hold. `packed` is unused.
      enum:
        - initial
        - unpaid
        - empty
        - pending
        - error
        - cancelation_window
        - entirely_dropshipping
        - backorder
        - processing
        - picking
        - packing
        - packed
        - shipped
        - canceled
        - holded
        - interrupted
        - returned
        - return_arrived
        - returning
        - reentered
        - awaiting_fulfillment_request
        - awaiting_dropoff
        - arrived_at_warehouse
      example: shipped
    OrderShippingStatus:
      type: string
      description: >-
        Carrier-side status of the shipment, updated from tracking events. `null` until the carrier reports
        the first event.
      enum:
        - shipment_created
        - awaiting_collection
        - shipment_collected
        - shipment_in_transit
        - shipment_out_for_delivery
        - shipment_delivered
        - shipment_partially_delivered
        - shipment_with_incident
        - shipment_to_be_self_collected
        - shipment_canceled
        - shipment_returned
        - shipment_not_defined
      example: shipment_in_transit
    OrderType:
      type: string
      description: |
        Kind of order. `SALE` is a regular sale; `DONATION` ships goods without a sale; `REMOVE_STOCK`,
        `REMOVE_DAMAGED_STOCK`, `REMOVE_EXPIRED_STOCK` and `REMOVE_LOST_STOCK` withdraw stock from the
        warehouse; `STOCK_TRANSFER_OUT` moves stock to another store; `C2C` is a consumer-to-consumer
        shipment created by Cubbo and cannot be created through the API.
      enum:
        - SALE
        - DONATION
        - REMOVE_STOCK
        - REMOVE_DAMAGED_STOCK
        - REMOVE_EXPIRED_STOCK
        - REMOVE_LOST_STOCK
        - STOCK_TRANSFER_OUT
        - C2C
      example: SALE
    OrderAddress:
      type: object
      description: Shipping contact and address of an order.
      properties:
        first_name:
          type:
            - string
            - "null"
          description: Recipient first name.
          example: Ana
        last_name:
          type:
            - string
            - "null"
          description: Recipient last name.
          example: Example
        company:
          type:
            - string
            - "null"
          description: Company name, if any.
          example: null
        phone:
          type:
            - string
            - "null"
          description: Recipient phone number.
          example: "+525500000000"
        address_1:
          type:
            - string
